<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Welcome</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 16px;
}
.splash-box{
    width:100%;
    max-width:380px;
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:28px;
    padding:36px 24px;
    text-align:center;
    box-shadow:0 14px 35px rgba(2,132,199,0.12);
}
.logo-wrap{
    width:110px;
    height:110px;
    border-radius:50%;
    margin:0 auto 18px;
    overflow:hidden;
    border:3px solid #93c5fd;
    box-shadow:0 8px 22px rgba(2,132,199,0.25);
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
}
.logo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
}
h1{font-size:26px;font-weight:900;color:#0c4a6e;margin-bottom:6px;}
p{font-size:13px;color:#64748b;font-weight:600;margin-bottom:26px;}
.btn-start{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:white;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    transition:transform 0.2s ease;
}
.btn-start:active{transform:scale(0.98);}
</style>
</head>
<body>

<div class="splash-box">
    <div class="logo-wrap">
        <img src="logo.png" alt="RDX Logo">
    </div>
    <h1>RDX LUDO</h1>
    <p>Play Ludo King & Win Real Cash</p>
    <button class="btn-start" onclick="checkRedirect()">Get Started ▶</button>
</div>

<script>
function checkRedirect() {
    const isLoggedIn = localStorage.getItem("rdxLoggedIn") === "true";
    if (isLoggedIn) {
        location.href = "dashboard.html";
    } else {
        location.href = "login.html";
    }
}
window.addEventListener("load", () => {
    const isLoggedIn = localStorage.getItem("rdxLoggedIn") === "true";
    if (isLoggedIn) {
        setTimeout(() => { location.href = "dashboard.html"; }, 800);
    }
});
</script>
</body>
</html>
