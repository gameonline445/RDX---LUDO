<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
}

/* HEADER */
.top-header{height:66px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:white;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#dbeafe);border:2.5px solid #93c5fd;display:flex;align-items:center;justify-content:center;color:#0284c7;font-size:12px;font-weight:900;cursor:pointer;}
.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{width:38px;height:38px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:white;cursor:pointer;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);min-width:38px;}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);min-width:38px;}

/* MAIN */
.main{width:100%;max-width:650px;margin:auto;padding:16px 14px 100px;}
.profile-card{border:1.5px solid #7dd3fc;border-radius:20px;padding:16px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);box-shadow:0 8px 22px rgba(2,132,199,0.10);}
.profile-top{display:flex;align-items:center;justify-content:space-between;}
.profile-badge{display:inline-flex;align-items:center;padding:6px 12px;border-radius:16px;border:1px solid #7dd3fc;background:#ffffff;color:#0284c7;font-size:11px;font-weight:850;}
.edit-btn{border:1px solid #bae6fd;background:#ffffff;color:#0c4a6e;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:750;cursor:pointer;}
.profile-details{display:flex;align-items:center;gap:12px;margin-top:14px;}
.avatar{width:60px;height:60px;flex-shrink:0;border-radius:50%;background:linear-gradient(145deg,#0284c7,#0369a1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;}
.profile-info h2{font-size:18px;}
.mobile-number{margin-top:3px;color:#64748b;font-size:12px;}
.kyc-btn{margin-top:6px;border:0;border-radius:16px;padding:6px 12px;background:linear-gradient(90deg,#0284c7,#0369a1);color:#fff;font-size:11px;font-weight:800;cursor:pointer;}

/* REFERRAL APPLIED BOX */
.referral-applied{margin-top:14px;padding:14px;border:1.5px solid #bae6fd;border-radius:18px;background:#ffffff;box-shadow:0 4px 12px rgba(2,132,199,0.04);}
.referral-head{display:flex;align-items:center;gap:10px;}
.referral-icon{width:36px;height:36px;border-radius:10px;background:#e0f2fe;color:#0284c7;display:flex;align-items:center;justify-content:center;font-size:16px;}
.referral-head h3{font-size:14px;}
.referral-head p{margin-top:2px;color:#64748b;font-size:11px;}
.referral-code{margin-top:10px;height:44px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;}
.referral-code strong{font-size:16px;letter-spacing:1.5px;color:#0f172a;font-weight:900;}
.code-check{color:#16a34a;font-weight:900;font-size:16px;}

.section-label{margin-top:18px;margin-bottom:8px;color:#0284c7;font-size:11px;font-weight:850;letter-spacing:1.5px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-card{padding:12px 6px;border:1.5px solid #bae6fd;border-radius:16px;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.stat-icon{width:32px;height:32px;border-radius:10px;background:#e0f2fe;color:#0284c7;display:flex;align-items:center;justify-content:center;font-size:14px;}
.stat-card small{margin-top:6px;color:#64748b;font-size:9px;font-weight:800;}
.stat-card strong{margin-top:2px;font-size:15px;color:#0f172a;}

.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.quick-card{border:1.5px solid #bae6fd;border-radius:16px;padding:12px;background:#ffffff;cursor:pointer;}
.quick-top{display:flex;align-items:center;justify-content:space-between;}
.quick-icon{width:34px;height:34px;border-radius:10px;background:#e0f2fe;color:#0284c7;display:flex;align-items:center;justify-content:center;font-size:15px;}
.quick-card h3{margin-top:8px;font-size:14px;}
.quick-card p{margin-top:2px;color:#64748b;font-size:11px;}

.logout{width:100%;height:48px;margin-top:14px;border-radius:16px;border:1px solid #fecdd3;background:#fff1f2;color:#be123c;font-size:14px;font-weight:800;cursor:pointer;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#ea580c;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,60,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:600;}
.modal-overlay.show{display:flex;}
.edit-modal{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:18px;}
.name-input{width:100%;height:44px;border:1.5px solid #cbd5e1;border-radius:12px;padding:0 12px;font-size:14px;outline:none;margin-top:6px;}
.modal-save{width:100%;height:44px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#0284c7,#0369a1);color:#fff;font-size:14px;font-weight:800;cursor:pointer;}
</style>
</head>

<body>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="location.href='dashboard.html'">☰</button>
        <div class="logo" onclick="location.href='dashboard.html'">RDX</div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="location.href='notification.html'">🔔</button>
        <button class="header-icon wallet-top" onclick="location.href='wallet.html'">💰</button>
        <button class="header-icon redeem-top" onclick="location.href='referral.html'">🎁</button>
    </div>
</header>

<main class="main">
    <section class="profile-card">
        <div class="profile-top"><span class="profile-badge">MY PROFILE</span><button class="edit-btn" onclick="editProfile()">✎ Edit</button></div>
        <div class="profile-details">
            <div class="avatar" id="avatar">R</div>
            <div class="profile-info">
                <h2 id="profileName">RDX User</h2>
                <p class="mobile-number" id="mobileNumber">☎ +91 XXXXX XXXXX</p>
                <button class="kyc-btn" onclick="alert('KYC verification under process.')">Complete KYC</button>
            </div>
        </div>
    </section>

    <!-- REFERRAL APPLIED (JISKA REFERRAL LAGAYA HAI) -->
    <section class="referral-applied">
        <div class="referral-head">
            <div class="referral-icon">🎟</div>
            <div>
                <h3>Referral Applied</h3>
                <p>Locked to your account</p>
            </div>
        </div>
        <div class="referral-code">
            <strong id="referralAppliedCode">LOADING...</strong>
            <span class="code-check">✓</span>
        </div>
    </section>

    <div class="section-label">YOUR STATS</div>
    <section class="stats">
        <div class="stat-card"><div class="stat-icon">▣</div><small>COIN WON</small><strong id="coinWon">₹0</strong></div>
        <div class="stat-card"><div class="stat-icon">🎮</div><small>PLAYED</small><strong id="gamePlayed">0</strong></div>
        <div class="stat-card"><div class="stat-icon">🏆</div><small>REFERRAL</small><strong id="referralCount">0</strong></div>
    </section>

    <div class="section-label">QUICK ACTIONS</div>
    <section class="quick-grid">
        <div class="quick-card" onclick="location.href='history.html'"><div class="quick-top"><div class="quick-icon">🕘</div><span>›</span></div><h3>History</h3><p>Battles & logs</p></div>
        <div class="quick-card" onclick="location.href='support.html'"><div class="quick-top"><div class="quick-icon">🎧</div><span>›</span></div><h3>Support</h3><p>Chat & help</p></div>
    </section>

    <button class="logout" onclick="logout()">⇥ &nbsp; Logout</button>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item active" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<div class="modal-overlay" id="editModal">
    <div class="edit-modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3>Edit Profile</h3>
            <button style="border:0;background:none;font-size:18px;cursor:pointer;" onclick="closeEditModal()">✕</button>
        </div>
        <input type="text" id="realNameInput" class="name-input" placeholder="Enter your full name">
        <button class="modal-save" onclick="saveRealName()">Save Name</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getItem(k){ return localStorage.getItem(k); }
function setItem(k,v){ localStorage.setItem(k,v); }

function getCurrentMobile(){
    let m = getItem("rdxFirebaseUserId") || getItem("rdxVerifiedMobile") || "";
    m = String(m).replace(/\D/g,"");
    return m.length === 10 ? "91" + m : m;
}

function showProfileName(name){
    name = (name && String(name).trim()) || "RDX User";
    document.getElementById("profileName").textContent = name;
    document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
}

async function loadProfile(){
    const m = getCurrentMobile();
    if(m) document.getElementById("mobileNumber").textContent = "☎ +" + m;

    const localApplied = getItem("rdxReferredBy") || "DIRECT";
    document.getElementById("referralAppliedCode").textContent = localApplied;

    if(!firebaseDB || !m) return;
    try{
        const doc = await firebaseDB.collection("customers").doc(m).get();
        if(doc.exists){
            const d = doc.data() || {};
            if(d.name){ 
                showProfileName(d.name); 
                setItem("rdxUsername", d.name); 
            }
            
            // JISKA CODE LAGAYA THA:
            const appliedCode = d.referredBy || getItem("rdxReferredBy") || "DIRECT";
            document.getElementById("referralAppliedCode").textContent = appliedCode;
            setItem("rdxReferredBy", appliedCode);

            // Stats
            if(d.referralCount !== undefined) document.getElementById("referralCount").textContent = d.referralCount;
            if(d.gamesPlayed !== undefined) document.getElementById("gamePlayed").textContent = d.gamesPlayed;
            if(d.coinWon !== undefined) document.getElementById("coinWon").textContent = "₹" + d.coinWon;
        }
    }catch(e){ console.error(e); }
}

function editProfile(){
    document.getElementById("realNameInput").value = getItem("rdxUsername") || "";
    document.getElementById("editModal").classList.add("show");
}
function closeEditModal(){ document.getElementById("editModal").classList.remove("show"); }

async function saveRealName(){
    const n = document.getElementById("realNameInput").value.trim();
    if(n.length < 2) return;
    const m = getCurrentMobile();
    if(m && firebaseDB){
        await firebaseDB.collection("customers").doc(m).set({ name: n }, { merge: true });
    }
    setItem("rdxUsername", n);
    showProfileName(n);
    closeEditModal();
}

function logout(){ localStorage.clear(); window.location.href = "./login.html"; }

window.addEventListener("DOMContentLoaded", () => {
    showProfileName(getItem("rdxUsername"));
    loadProfile();
});
</script>
</body>
</html>
