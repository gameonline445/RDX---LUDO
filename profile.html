<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - My Profile</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:500;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,113,101,0.25);
}
.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{width:100%;height:100%;object-fit:cover;}
.header-right{display:flex;align-items:center;gap:8px;}

/* CONTAINER */
.container{
    width:100%;
    max-width:650px;
    margin:0 auto;
    padding:16px 14px;
    margin-top:66px;
}

/* PROFILE CARD */
.profile-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:24px;
    padding:20px 18px;
    box-shadow:0 6px 20px rgba(2,132,199,0.08);
    position:relative;
}
.badge-top{
    display:inline-block;
    padding:4px 10px;
    border-radius:12px;
    background:#e0f2fe;
    color:#0284c7;
    font-size:11px;
    font-weight:850;
    letter-spacing:0.5px;
}
.edit-btn{
    position:absolute;
    top:18px;
    right:18px;
    border:1px solid #bae6fd;
    background:#f0f9ff;
    color:#0284c7;
    padding:6px 14px;
    border-radius:16px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}
.user-row{display:flex;align-items:center;gap:14px;margin-top:14px;}
.avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(145deg,#0284c7,#0369a1);
    color:white;
    font-size:26px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(2,132,199,0.25);
}
.user-details h2{font-size:20px;font-weight:900;color:#0c4a6e;}
.user-details p{color:#64748b;font-size:13px;font-weight:700;margin-top:2px;}

.kyc-btn{
    margin-top:8px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#fff;
    border:0;
    padding:6px 14px;
    border-radius:14px;
    font-size:11px;
    font-weight:850;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
}
.kyc-pending-badge{
    margin-top:8px;
    background:#fef3c7;
    color:#b45309;
    border:1px solid #fde68a;
    padding:5px 12px;
    border-radius:14px;
    font-size:11px;
    font-weight:850;
    display:inline-flex;
    align-items:center;
    gap:4px;
}
.kyc-verified-badge{
    margin-top:8px;
    background:#dcfce7;
    color:#15803d;
    border:1px solid #86efac;
    padding:5px 12px;
    border-radius:14px;
    font-size:11px;
    font-weight:850;
    display:inline-flex;
    align-items:center;
    gap:4px;
}

/* REFERRAL BOX */
.ref-box{
    margin-top:16px;
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:20px;
    padding:16px;
    box-shadow:0 4px 14px rgba(2,132,199,0.06);
}
.ref-title-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ref-title-row small{color:#64748b;font-size:11px;font-weight:600;}
.ref-pill{
    background:#f8fafc;
    border:1.5px solid #cbd5e1;
    border-radius:14px;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.ref-pill strong{font-size:16px;font-weight:900;color:#0c4a6e;letter-spacing:1px;}
.ref-pill i{color:#16a34a;font-size:18px;}

/* STATS */
.section-label{font-size:11px;font-weight:850;color:#64748b;letter-spacing:1px;margin:18px 0 8px;text-transform:uppercase;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-item{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px 10px;
    text-align:center;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
}
.stat-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#f0f9ff;
    color:#0284c7;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 8px;
    font-size:15px;
}
.stat-item small{display:block;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;}
.stat-item strong{display:block;font-size:16px;font-weight:900;color:#0c4a6e;margin-top:2px;}

/* ACTIONS */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.action-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
}
.action-left{display:flex;align-items:center;gap:10px;}
.action-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#f0f9ff;
    color:#0284c7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}
.action-text h4{font-size:13px;font-weight:850;color:#0f172a;}
.action-text p{font-size:11px;color:#64748b;}

/* LOGOUT */
.logout-btn{
    width:100%;
    height:46px;
    border:1.5px solid #fecdd3;
    border-radius:20px;
    background:#fff1f2;
    color:#be123c;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
</style>
</head>
<body>

<main class="container" id="scrollContainer">
    <div class="profile-card">
        <span class="badge-top">MY PROFILE</span>
        <button class="edit-btn" onclick="editName()"><i class="fa-solid fa-pen"></i> Edit</button>
        <div class="user-row">
            <div class="avatar" id="avatarText">U</div>
            <div class="user-details">
                <h2 id="profileName">Loading...</h2>
                <p><i class="fa-solid fa-phone" style="font-size:11px;"></i> <span id="profileMobile">+91**********</span></p>
                <div id="kycContainer"></div>
            </div>
        </div>
    </div>

    <div class="ref-box">
        <div class="ref-title-row">
            <div style="font-size:16px;">🎟️</div>
            <div>
                <h3 style="font-size:13px; font-weight:850; color:#0c4a6e;">Referral Applied</h3>
                <small>Locked to your account</small>
            </div>
        </div>
        <div class="ref-pill">
            <strong id="referredByCode">DIRECT</strong>
            <i class="fa-solid fa-circle-check"></i>
        </div>
    </div>

    <div class="section-label">YOUR STATS</div>
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
            <small>COIN WON</small>
            <strong id="winnings">₹0</strong>
        </div>
        <div class="stat-item">
            <div class="stat-icon"><i class="fa-solid fa-gamepad"></i></div>
            <small>PLAYED</small>
            <strong id="matchesPlayed">0</strong>
        </div>
        <div class="stat-item">
            <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
            <small>REFERRAL</small>
            <strong id="totalReferrals">0</strong>
        </div>
    </div>

    <div class="section-label">QUICK ACTIONS</div>
    <div class="action-grid">
        <div class="action-card" onclick="window.location.replace('history.html')">
            <div class="action-left">
                <div class="action-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="action-text">
                    <h4>History</h4>
                    <p>Battles & logs</p>
                </div>
            </div>
            <i class="fa-solid fa-angle-right" style="color:#94a3b8; font-size:12px;"></i>
        </div>

        <div class="action-card" onclick="window.location.replace('support.html')">
            <div class="action-left">
                <div class="action-icon"><i class="fa-solid fa-headset"></i></div>
                <div class="action-text">
                    <h4>Support</h4>
                    <p>Chat & help</p>
                </div>
            </div>
            <i class="fa-solid fa-angle-right" style="color:#94a3b8; font-size:12px;"></i>
        </div>
    </div>

    <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
</main>

<script>
function editName() {
    const newName = prompt("Apna Naya Naam Likhein:");
    if (!newName || !newName.trim()) return;
    alert("Naam Update Ho Gaya!");
}
function logout() {
    if (confirm("Kya aap Logout karna chahte hain?")) {
        localStorage.clear();
        window.location.replace("index.html");
    }
}
</script>

</body>
</html>
