<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>RDX LUDO - Profile</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
    background:#f7f9ff;
    color:#101a38;
    min-height:100vh;
}

/* ================= HEADER ================= */

.top-header{
    height:70px;
    background:linear-gradient(110deg,#eef4ff,#ffffff);
    border-bottom:1px solid #cbd8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 18px rgba(36,75,150,.08);
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

/* THREE LINE */

.menu-btn{
    width:46px;
    height:46px;
    border:0;
    border-radius:16px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 15px rgba(255,93,80,.25);
    cursor:pointer;
}

/* LOGO */

.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#e7efff);
    border:3px solid #d3e1ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1762df;
    font-size:12px;
    font-weight:900;
    box-shadow:0 5px 12px rgba(36,93,190,.15);
}

/* HEADER RIGHT */

.header-right{
    display:flex;
    align-items:center;
    gap:6px;
}

.header-icon{
    width:44px;
    height:44px;
    border:0;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:white;
    box-shadow:0 6px 15px rgba(0,0,0,.12);
}

.notification{
    background:linear-gradient(145deg,#746df4,#817eff);
}

.wallet-top{
    background:linear-gradient(145deg,#20c36b,#43d77e);
    min-width:48px;
    padding:0;
}

.redeem-top{
    background:linear-gradient(145deg,#ff8a35,#ffad45);
    min-width:48px;
    padding:0;
}

/* ================= SIDE MENU ================= */

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:250;
    display:none;
}

.menu-overlay.show{
    display:block;
}

.menu-panel{
    position:fixed;
    top:0;
    left:-310px;
    width:300px;
    height:100vh;
    background:white;
    z-index:300;
    padding:25px 18px;
    box-shadow:10px 0 35px rgba(0,0,0,.15);
    transition:.3s ease;
    overflow-y:auto;
}

.menu-panel.open{
    left:0;
}

/* MENU HEADER */

.menu-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:22px;
    margin-bottom:18px;
    border-bottom:1px solid #e3e8f2;
}

.menu-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-logo{
    width:50px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#e7efff);
    border:3px solid #d3e1ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1762df;
    font-size:13px;
    font-weight:900;
}

.menu-brand h2{
    font-size:20px;
}

.menu-brand p{
    color:#71809d;
    font-size:12px;
    margin-top:3px;
}

.close-menu{
    border:0;
    background:#eef2fa;
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:25px;
    color:#66738d;
    cursor:pointer;
}

/* MENU ITEMS */

.menu-item{
    width:100%;
    border:1px solid #e0e5ef;
    background:#fafbfe;
    padding:15px 16px;
    border-radius:17px;
    margin-bottom:12px;
    text-align:left;
    font-size:17px;
    color:#182440;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    min-height:58px;
}

.menu-item:hover{
    background:#f0f5ff;
}

.menu-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e8efff;
    font-size:20px;
}

.menu-item span:last-child{
    flex:1;
}

/* ================= MAIN ================= */

.main{
    max-width:650px;
    margin:auto;
    padding:25px 18px 105px;
}

.page-title{
    margin-top:20px;
    font-size:27px;
}

/* PROFILE */

.profile{
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    border:1px solid #b9cdfc;
    border-radius:24px;
    padding:25px;
    margin-top:18px;
    text-align:center;
    box-shadow:0 12px 30px rgba(40,88,175,.08);
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    margin:auto;
    background:linear-gradient(145deg,#1762df,#4385ee);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:800;
    box-shadow:0 8px 20px rgba(40,105,232,.25);
}

.profile h2{
    margin-top:14px;
}

.profile p{
    margin-top:5px;
    color:#71809d;
}

/* ROWS */

.row{
    background:white;
    border:1px solid #d5deed;
    border-radius:20px;
    padding:20px;
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.row span{
    color:#52627f;
}

.row b{
    color:#1762df;
}

/* LOGOUT */

.logout{
    width:100%;
    padding:15px;
    border-radius:18px;
    border:1px solid #e1baba;
    background:#fff7f7;
    color:#b22;
    font-weight:800;
    margin-top:20px;
    font-size:16px;
    cursor:pointer;
}

/* ================= BOTTOM NAV ================= */

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:78px;
    background:rgba(255,255,255,.97);
    border-top:1px solid #ccd7eb;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:8px 5px;
    z-index:200;
    backdrop-filter:blur(15px);
}

.bottom a{
    text-align:center;
    text-decoration:none;
    color:#65728d;
    font-size:13px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.bottom b{
    width:40px;
    height:40px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.active{
    color:#2869e8!important;
    font-weight:700;
}

.active b{
    background:#536df5;
    color:white;
    box-shadow:0 7px 17px rgba(83,109,245,.3);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .menu-panel{
        width:290px;
        left:-300px;
    }

    .main{
        padding:22px 12px 105px;
    }

    .page-title{
        font-size:25px;
    }

    .profile{
        padding:22px;
    }

    .row{
        padding:18px;
    }

}

</style>

</head>


<body>


<!-- ================= TOP HEADER ================= -->

<header class="top-header">

    <div class="header-left">

        <!-- THREE LINE -->

        <button
            class="menu-btn"
            onclick="openMenu()">

            ☰

        </button>


        <!-- LOGO -->

        <div class="logo">
            RDX
        </div>

    </div>


    <div class="header-right">

        <!-- NOTIFICATION -->

        <button
            class="header-icon notification"
            onclick="showMessage('No new notifications')">

            🔔

        </button>


        <!-- WALLET -->

        <button
            class="header-icon wallet-top"
            onclick="goWallet()">

            💰

        </button>


        <!-- REDEEM -->

        <button
            class="header-icon redeem-top"
            onclick="goRedeem()">

            🎁

        </button>

    </div>

</header>


<!-- ================= MENU OVERLAY ================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu()">
</div>


<!-- ================= SIDE MENU ================= -->

<div
    class="menu-panel"
    id="menuPanel">


    <div class="menu-title">

        <div class="menu-brand">

            <div class="menu-logo">
                RDX
            </div>

            <div>

                <h2>RDX LUDO</h2>

                <p>Play · Win · Earn</p>

            </div>

        </div>


        <button
            class="close-menu"
            onclick="closeMenu()">

            ×

        </button>

    </div>


    <!-- HOME -->

    <button
        class="menu-item"
        onclick="goHome()">

        <div class="menu-icon">
            🏠
        </div>

        <span>Home</span>

        <span>›</span>

    </button>


    <!-- PROFILE -->

    <button
        class="menu-item"
        onclick="goProfile()">

        <div class="menu-icon">
            👤
        </div>

        <span>My Profile</span>

        <span>›</span>

    </button>


    <!-- WALLET -->

    <button
        class="menu-item"
        onclick="goWallet()">

        <div class="menu-icon">
            💰
        </div>

        <span>My Wallet</span>

        <span>›</span>

    </button>


    <!-- REFER -->

    <button
        class="menu-item"
        onclick="goRedeem()">

        <div class="menu-icon">
            🎁
        </div>

        <span>Refer & Earn</span>

        <span>›</span>

    </button>


    <!-- HISTORY -->

    <button
        class="menu-item"
        onclick="goHistory()">

        <div class="menu-icon">
            🕘
        </div>

        <span>History</span>

        <span>›</span>

    </button>


    <!-- NOTIFICATIONS -->

    <button
        class="menu-item"
        onclick="goNotifications()">

        <div class="menu-icon">
            🔔
        </div>

        <span>Notifications</span>

        <span>›</span>

    </button>


    <!-- SUPPORT -->

    <button
        class="menu-item"
        onclick="goSupport()">

        <div class="menu-icon">
            🎧
        </div>

        <span>Support</span>

        <span>›</span>

    </button>


    <!-- LOGOUT -->

    <button
        class="menu-item"
        onclick="logout()">

        <div class="menu-icon">
            🚪
        </div>

        <span>Logout</span>

        <span>›</span>

    </button>

</div>


<!-- ================= MAIN ================= -->

<main class="main">


    <h2 class="page-title">
        Profile
    </h2>


    <!-- PROFILE -->

    <section class="profile">

        <div class="avatar">
            R
        </div>

        <h2 id="profileName">
            RDX User
        </h2>

        <p>
            RDX LUDO Member
        </p>

    </section>


    <!-- REFERRAL -->

    <div class="row">

        <span>
            Referral Program
        </span>

        <b>
            2%
        </b>

    </div>


    <!-- STATUS -->

    <div class="row">

        <span>
            Account Status
        </span>

        <b>
            Active
        </b>

    </div>


    <!-- LOGOUT -->

    <button
        class="logout"
        onclick="logout()">

        🚪 &nbsp; Sign Out

    </button>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom">


    <a href="dashboard.html">

        <b>⌂</b>

        Home

    </a>


    <a href="wallet.html">

        <b>▣</b>

        Wallet

    </a>


    <a href="support.html">

        <b>◉</b>

        Support

    </a>


    <a
        class="active"
        href="profile.html">

        <b>♙</b>

        Profile

    </a>

</nav>


<script>

/* ================= USERNAME ================= */

const savedUsername =
    localStorage.getItem("rdxUsername");

if(savedUsername){

    document.getElementById("profileName").textContent =
        savedUsername;

}


/* ================= MENU ================= */

function openMenu(){

    document
    .getElementById("menuPanel")
    .classList.add("open");

    document
    .getElementById("menuOverlay")
    .classList.add("show");

}


function closeMenu(){

    document
    .getElementById("menuPanel")
    .classList.remove("open");

    document
    .getElementById("menuOverlay")
    .classList.remove("show");

}


/* ================= NAVIGATION ================= */

function goHome(){

    closeMenu();

    window.location.href =
        "./dashboard.html";

}


function goProfile(){

    closeMenu();

    window.location.href =
        "./profile.html";

}


function goWallet(){

    closeMenu();

    window.location.href =
        "./wallet.html";

}


function goSupport(){

    closeMenu();

    window.location.href =
        "./support.html";

}


function goRedeem(){

    closeMenu();

    window.location.href =
        "./profile.html#referral";

}


function goHistory(){

    closeMenu();

    window.location.href =
        "./history.html";

}


function goNotifications(){

    closeMenu();

    window.location.href =
        "./notifications.html";

}


/* ================= LOGOUT ================= */

function logout(){

    localStorage.clear();

    window.location.href =
        "./login.html";

}


/* ================= MESSAGE ================= */

function showMessage(message){

    alert(message);

}

</script>


</body>

</html>
