<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDX LUDO - Add Cash</title>

<!-- FontAwesome for clean icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
// Authentication Security Check: Agar user logged-in nahi hai toh seedha login page par bhejein
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("login.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,113,101,0.25);
}
.menu-btn:active{transform:scale(0.95);}

/* BRAND 3D LOGO */
.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    height:38px;
    padding:0 10px;
    border:0;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
    font-weight:800;
    color:white;
    cursor:pointer;
}
.icon-only{width:38px;padding:0;border-radius:50%;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);}

/* CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

/* DEPOSIT CARD */
.deposit-card{
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:22px 18px;
    box-shadow:0 8px 24px rgba(2,132,199,0.08);
}
.deposit-card h2{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
}
.deposit-card p{
    color:#64748b;
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    margin-bottom:16px;
}

/* AMOUNT INPUT */
.input-box-wrap{
    position:relative;
    margin-bottom:14px;
}
.currency-symbol{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    font-weight:900;
    color:#0c4a6e;
}
.amount-input{
    width:100%;
    height:56px;
    border:2px solid #bae6fd;
    border-radius:16px;
    background:#f8fafc;
    font-size:24px;
    font-weight:900;
    color:#0c4a6e;
    padding:0 16px 0 42px;
    outline:none;
}
.amount-input:focus{
    border-color:#0284c7;
    background:#ffffff;
}

/* QUICK AMOUNT BUTTONS */
.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}
.quick-btn{
    height:44px;
    border:1.5px solid #bae6fd;
    border-radius:14px;
    background:#f0f9ff;
    color:#0284c7;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    transition:all 0.15s ease;
}
.quick-btn:active, .quick-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    transform:scale(0.96);
}

/* PROCEED BUTTON */
.btn-proceed{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    transition:transform 0.2s ease;
}
.btn-proceed:active{
    transform:scale(0.98);
}

.limit-text{
    text-align:center;
    font-size:11px;
    color:#64748b;
    font-weight:700;
    margin-top:10px;
}

/* SIDE DRAWER */
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);z-index:2000;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-100%;width:75%;max-width:360px;height:100dvh;background:#ffffff;z-index:2100;padding:20px 16px 100px;overflow-y:auto;transition:left .3s ease;box-shadow:10px 0 35px rgba(0,0,0,.16);}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e2e8f0;}
.menu-brand{display:flex;align-items:center;gap:10px;}
.menu-logo{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #7dd3fc;display:flex;align-items:center;justify-content:center;background:#ffffff;cursor:pointer;}
.menu-logo img{width:100%;height:100%;object-fit:cover;}
.menu-user h2{font-size:17px;font-weight:850;}
.menu-user p{margin-top:2px;color:#64748b;font-size:12px;}
.close-menu{border:0;background:#f1f5f9;width:38px;height:38px;border-radius:50%;font-size:22px;color:#64748b;cursor:pointer;}
.menu-list{margin-top:16px;}
.menu-item{width:100%;min-height:52px;border:0;background:transparent;padding:6px 0;border-radius:14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;text-align:left;color:#334155;cursor:pointer;}
.menu-item-icon{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-item-text{flex:1;font-size:15px;font-weight:750;}
.menu-arrow{color:#94a3b8;font-size:20px;}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:transform 0.2s ease;
}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#10b981;}
</style>
</head>

<body>

<!-- SIDE DRAWER -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <div class="menu-logo" onclick="goHome()">
                <img src="logo.png" alt="RDX Logo">
            </div>
            <div class="menu-user">
                <h2 id="menuUsername">RDX LUDO</h2>
                <p>Play · Win · Earn</p>
            </div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>
    <div class="menu-list">
        <button class="menu-item" onclick="goHome()"><div class="menu-item-icon menu-home"><i class="fa-solid fa-house"></i></div><div class="menu-item-text">Home</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goProfile()"><div class="menu-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><div class="menu-item-text">My Profile</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goWallet()"><div class="menu-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><div class="menu-item-text">My Wallet</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goRedeem()"><div class="menu-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><div class="menu-item-text">Refer & Earn</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goHistory()"><div class="menu-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><div class="menu-item-text">History</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goNotifications()"><div class="menu-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><div class="menu-item-text">Notifications</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goSupport()"><div class="menu-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><div class="menu-item-text">Support</div><div class="menu-arrow">›</div></button>
    </div>
</div>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="window.location.replace('dashboard.html')">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification icon-only" onclick="window.location.replace('notification.html')"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="window.location.replace('wallet.html')">💰 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="window.location.replace('referral.html')">🎁 <span id="topReferral">0</span></button>
    </div>
</header>

<main class="container">

    <div class="deposit-card">
        <h2>Add Cash to Wallet</h2>
        <p>Deposit coins to participate in live battles.</p>

        <div class="input-box-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="depositAmountInput" class="amount-input" value="100" min="100" max="10000" inputmode="numeric">
        </div>

        <div class="quick-grid">
            <button class="quick-btn active" onclick="setAmount(100)">+ ₹100</button>
            <button class="quick-btn" onclick="setAmount(200)">+ ₹200</button>
            <button class="quick-btn" onclick="setAmount(500)">+ ₹500</button>
            <button class="quick-btn" onclick="setAmount(1000)">+ ₹1,000</button>
            <button class="quick-btn" onclick="setAmount(2000)">+ ₹2,000</button>
            <button class="quick-btn" onclick="setAmount(5000)">+ ₹5,000</button>
        </div>

        <button class="btn-proceed" id="btnProceed" onclick="proceedToPayment()">
            Proceed to Pay ₹100
        </button>

        <p class="limit-text">Min: ₹100 | Max: ₹10,000</p>
    </div>

</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item active" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

const amountInput = document.getElementById("depositAmountInput");
const btnProceed = document.getElementById("btnProceed");

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }

function updateProceedButton() {
    const val = Number(amountInput.value) || 0;
    btnProceed.textContent = `Proceed to Pay ₹${val}`;
}

function setAmount(amt) {
    amountInput.value = amt;
    document.querySelectorAll(".quick-btn").forEach(b => {
        if(b.textContent.includes(amt.toLocaleString('en-IN'))) {
            b.classList.add("active");
        } else {
            b.classList.remove("active");
        }
    });
    updateProceedButton();
}

amountInput.addEventListener("input", () => {
    document.querySelectorAll(".quick-btn").forEach(b => b.classList.remove("active"));
    updateProceedButton();
});

function proceedToPayment() {
    const amt = Number(amountInput.value);

    if (isNaN(amt) || amt < 100) {
        alert("⚠️ Kam se kam (Minimum) deposit ₹100 hona chahiye.");
        amountInput.focus();
        return;
    }
    if (amt > 10000) {
        alert("⚠️ Adhik se adhik (Maximum) deposit ₹10,000 hi ho sakta hai.");
        amountInput.focus();
        return;
    }

    localStorage.setItem("rdxDepositAmount", amt);
    window.location.replace(`./complete-payment.html?amount=${amt}`);
}

async function loadUserData() {
    if (!userId) { window.location.replace("login.html"); return; }
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if (snap.exists) {
            const d = snap.data();
            document.getElementById("topBalance").textContent = Number(d.balance || 0);
            document.getElementById("topReferral").textContent = Number(d.referralBalance || d.redeemBalance || 0);
        }
    } catch(err) { console.error(err); }
}

window.addEventListener("load", loadUserData);

function goHome(){ closeMenu(); window.location.replace("dashboard.html"); }
function goProfile(){ closeMenu(); window.location.replace("profile.html"); }
function goWallet(){ closeMenu(); window.location.replace("wallet.html"); }
function goRedeem(){ closeMenu(); window.location.replace("referral.html"); }
function goHistory(){ closeMenu(); window.location.replace("history.html"); }
function goNotifications(){ closeMenu(); window.location.replace("notification.html"); }
function goSupport(){ closeMenu(); window.location.replace("support.html"); }
</script>

</body>
</html>
