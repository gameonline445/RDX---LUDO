<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDX LUDO - Add Money</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8faff;color:#101a38}
button{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.top{height:72px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(110deg,#edf4ff,#fff);border-bottom:1px solid #ccd8ed}
.menu{width:46px;height:46px;border:0;border-radius:16px;background:linear-gradient(145deg,#ff846e,#ff715e);color:#fff;font-size:28px;line-height:1;box-shadow:0 7px 16px #ff8d7a55}
.logo{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#fff;border:4px solid #dce6fb;color:#2362d9;font-size:13px;font-weight:900}
.spacer{flex:1}.topicon{width:45px;height:45px;border-radius:16px;display:grid;place-items:center;font-size:22px;margin-left:2px}
.bell{background:#7368ef;color:#fff}.cash{background:#35bf71;color:#fff}.gift{background:#ff933c;color:#fff}
main{flex:1;min-height:0;padding:22px 20px 12px;overflow:hidden}
.wrap{max-width:700px;margin:0 auto}
.kicker{font-size:14px;font-weight:900;letter-spacing:2px;color:#3566c8;margin-bottom:7px}
h1{font-size:42px;line-height:1.05;letter-spacing:-1.5px;margin-bottom:8px}
.sub{font-size:17px;color:#7b879f;margin-bottom:28px}
.box{border:1.5px solid #b8ccef;border-radius:28px;padding:22px 18px;background:linear-gradient(135deg,#eef3ff,#fff);box-shadow:0 12px 30px #3d72d51a}
.label{font-size:17px;font-weight:900;color:#68758f;letter-spacing:1px;margin-bottom:13px}
.amount{height:70px;border:2px solid #bfd0ee;border-radius:22px;background:#fff;display:flex;align-items:center;padding:0 20px;font-size:34px;font-weight:900}
.rupee{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#4a79e5;color:#fff;font-size:25px;margin-right:18px;box-shadow:0 7px 14px #4778df33}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:16px;font-weight:700}
.min{color:#c34c45}.rate{color:#5e81c9}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 18px;margin-top:22px}
.quick button{height:68px;border:2px solid #c5d2e9;border-radius:19px;background:#fff;color:#151d34;font-size:21px;font-weight:850;cursor:pointer}
.quick button.active{background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;border-color:#2864e6;box-shadow:0 9px 18px #326fe533}
.secure{text-align:center;color:#7b879f;font-size:17px;margin:25px 0 20px}
.pay{width:100%;height:68px;border:0;border-radius:36px;background:linear-gradient(100deg,#2763e8,#3e7cf0);color:#fff;font-size:23px;font-weight:900;box-shadow:0 12px 28px #326fe54a;cursor:pointer}
.bottom{height:80px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d5deed}
.nav{border:0;background:#fff;color:#6d7890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px}.nav b{font-size:23px}.nav.active{color:#18213a;font-weight:900}
@media(max-width:430px){h1{font-size:40px}.sub{font-size:16px;margin-bottom:24px}.quick{gap:12px}.quick button{height:62px;font-size:18px}.secure{margin:20px 0 17px}.pay{height:64px;font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="menu" onclick="history.back()">☰</button>
<div class="logo">RDX</div><div class="spacer"></div>
<div class="topicon bell">🔔</div><div class="topicon cash">💵</div><div class="topicon gift">🎁</div>
</header>
<main><div class="wrap">
<div class="kicker">WALLET</div>
<h1>Add Money</h1>
<div class="sub">Choose amount and deposit securely</div>
<section class="box">
<div class="label">ENTER AMOUNT</div>
<div class="amount"><div class="rupee">₹</div><span id="amount">100</span></div>
<div class="meta"><span class="min">Min: ₹100</span><span class="rate">1 Coin = ₹1</span></div>
<div class="quick">
<button class="active" onclick="pick(100,this)">₹100</button>
<button onclick="pick(250,this)">₹250</button>
<button onclick="pick(500,this)">₹500</button>
<button onclick="pick(1000,this)">₹1000</button>
<button onclick="pick(2000,this)">₹2000</button>
<button onclick="pick(5000,this)">₹5000</button>
</div>
<div class="secure">Secure &amp; Instant Deposit</div>
<button class="pay" onclick="proceed()">Proceed to Pay</button>
</section>
</div></main>
<nav class="bottom">
<button class="nav" onclick="location.href='dashboard.html'"><b>🏠</b>Home</button>
<button class="nav active"><b>💰</b>Wallet</button>
<button class="nav" onclick="location.href='support.html'"><b>🎧</b>Support</button>
<button class="nav" onclick="location.href='profile.html'"><b>👤</b>Profile</button>
</nav>
</div>
<script>
let selected=100;
function pick(v,el){selected=v;document.getElementById('amount').textContent=v;document.querySelectorAll('.quick button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function proceed(){localStorage.setItem('rdxSelectedDepositAmount',selected);location.href='complete-payment.html?amount='+encodeURIComponent(selected)}
</script>
</body>
</html>
