<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Add Cash</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

let firebaseDB = null;
try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firebaseDB = firebase.firestore();
} catch (error) {
    console.error("Firebase initialization error:", error);
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 0% 0%,#dfeaff 0%,transparent 35%),
               radial-gradient(circle at 100% 15%,#e9ddff 0%,transparent 35%),
               linear-gradient(180deg,#f3f7ff 0%,#ffffff 55%,#f2f6ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* HEADER */
.top-header{
    height:70px;
    background:linear-gradient(110deg,#eef4ff,#ffffff);
    border-bottom:1px solid #cbd8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 18px rgba(36,75,150,.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:46px;
    height:46px;
    border:0;
    border-radius:16px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 15px rgba(255,93,80,.25);
    cursor:pointer;
}
.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#e7efff);
    border:3px solid #d3e1ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1762df;
    font-size:12px;
    font-weight:900;
    box-shadow:0 5px 12px rgba(36,93,190,.15);
    cursor:pointer;
}
.header-right{display:flex;align-items:center;gap:6px;}
.header-icon{
    width:44px;
    height:44px;
    border:0;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:white;
    box-shadow:0 6px 15px rgba(0,0,0,.12);
    cursor:pointer;
}
.notification{background:linear-gradient(145deg,#746df4,#817eff);}
.wallet-top{background:linear-gradient(145deg,#20c36b,#43d77e);min-width:48px;font-weight:800;font-size:14px;padding:0 8px;}
.redeem-top{background:linear-gradient(145deg,#ff8a35,#ffad45);min-width:48px;}

/* CONTAINER */
.container{
    width:100%;
    max-width:560px;
    margin:auto;
    padding:20px 16px;
}

.deposit-card{
    border:1.5px solid #bdd0f0;
    border-radius:24px;
    padding:22px;
    background:radial-gradient(circle at 100% 0%,#dce8ff,transparent 40%),linear-gradient(135deg,#eef4ff,#ffffff);
    box-shadow:0 10px 25px rgba(66,117,211,0.1);
    margin-bottom:18px;
}

.deposit-card h1{
    font-size:24px;
    font-weight:900;
    margin-bottom:6px;
}

.deposit-card p{
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

.input-label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#64748b;
    letter-spacing:0.5px;
    margin-bottom:8px;
}

.amount-input{
    width:100%;
    height:56px;
    border:1.5px solid #cbd5e1;
    border-radius:16px;
    background:#ffffff;
    padding:0 18px;
    font-size:22px;
    font-weight:900;
    color:#101a38;
    outline:none;
    margin-bottom:16px;
}

.amount-input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

/* PRESET BUTTONS */
.preset-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:20px;
}

.btn-preset{
    height:46px;
    border:1.5px solid #cbd5e1;
    border-radius:14px;
    background:#ffffff;
    color:#1e293b;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    transition:all 0.2s ease;
}

.btn-preset:active, .btn-preset.active{
    border-color:#2563eb;
    background:#eff6ff;
    color:#2563eb;
}

.btn-next{
    width:100%;
    height:52px;
    border:0;
    border-radius:26px;
    background:linear-gradient(100deg,#2162e9,#3979f1);
    color:#ffffff;
    font-weight:900;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(33,98,233,0.28);
}

.btn-next:active{
    transform:scale(0.98);
}

/* SIDE MENU */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:250;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-310px;width:300px;height:100vh;background:white;z-index:300;padding:25px 18px;box-shadow:10px 0 35px rgba(0,0,0,.15);transition:.3s ease;overflow-y:auto;}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;margin-bottom:18px;border-bottom:1px solid #e3e8f2;}
.menu-brand{display:flex;align-items:center;gap:12px;}
.menu-logo{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#e7efff);border:3px solid #d3e1ff;display:flex;align-items:center;justify-content:center;color:#1762df;font-size:13px;font-weight:900;cursor:pointer;}
.menu-brand h2{font-size:20px;}
.menu-brand p{color:#71809d;font-size:12px;margin-top:3px;}
.close-menu{border:0;background:#eef2fa;width:42px;height:42px;border-radius:50%;font-size:25px;color:#66738d;cursor:pointer;}
.menu-item{width:100%;border:1px solid #e0e5ef;background:#fafbfe;padding:15px 16px;border-radius:17px;margin-bottom:12px;text-align:left;font-size:17px;color:#182440;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:58px;}
.menu-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#e8efff;font-size:20px;}
.menu-item span:nth-child(2){flex:1;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:78px;background:rgba(255,255,255,.97);border-top:1px solid #d6deee;display:flex;justify-content:space-around;align-items:center;z-index:200;}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#66738d;font-size:13px;cursor:pointer;}
.nav-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.nav-item.active{color:#202d49;font-weight:700;}
.nav-item.active .nav-icon{background:#536df5;color:white;}
</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <!-- Logo Click to Home -->
        <div class="logo" onclick="goHome()">RDX</div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="goNotifications()">🔔</button>
        <button class="header-icon wallet-top" onclick="goWallet()">💰 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="goRedeem()">🎁</button>
    </div>
</header>

<!-- SIDE MENU -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <!-- Side Menu Logo Click to Home -->
            <div class="menu-logo" onclick="goHome()">RDX</div>
            <div>
                <h2>RDX LUDO</h2>
                <p>Play · Win · Earn</p>
            </div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>

    <button class="menu-item" onclick="goHome()"><div class="menu-icon">🏠</div><span>Home</span><span>›</span></button>
    <button class="menu-item" onclick="goProfile()"><div class="menu-icon">👤</div><span>My Profile</span><span>›</span></button>
    <button class="menu-item" onclick="goWallet()"><div class="menu-icon">💰</div><span>My Wallet</span><span>›</span></button>
    <button class="menu-item" onclick="goRedeem()"><div class="menu-icon">🎁</div><span>Refer & Earn</span><span>›</span></button>
    <button class="menu-item" onclick="goHistory()"><div class="menu-icon">🕘</div><span>History</span><span>›</span></button>
    <button class="menu-item" onclick="goNotifications()"><div class="menu-icon">🔔</div><span>Notifications</span><span>›</span></button>
    <button class="menu-item" onclick="goSupport()"><div class="menu-icon">🎧</div><span>Support</span><span>›</span></button>
    <button class="menu-item" onclick="logout()"><div class="menu-icon">🚪</div><span>Logout</span><span>›</span></button>
</div>

<!-- MAIN -->
<main class="container">
    <section class="deposit-card">
        <h1>Add Cash to Wallet</h1>
        <p>Deposit coins to participate in live battles.</p>

        <label class="input-label">ENTER AMOUNT (₹)</label>
        <input type="number" id="depositAmount" class="amount-input" placeholder="₹100" min="50" value="100">

        <label class="input-label">QUICK SELECT</label>
        <div class="preset-grid">
            <button class="btn-preset active" onclick="setAmount(100)">+ ₹100</button>
            <button class="btn-preset" onclick="setAmount(200)">+ ₹200</button>
            <button class="btn-preset" onclick="setAmount(500)">+ ₹500</button>
            <button class="btn-preset" onclick="setAmount(1000)">+ ₹1,000</button>
            <button class="btn-preset" onclick="setAmount(2000)">+ ₹2,000</button>
            <button class="btn-preset" onclick="setAmount(5000)">+ ₹5,000</button>
        </div>

        <button class="btn-next" onclick="proceedToPayment()">
            Proceed to Pay ₹<span id="displayAmountBtn">100</span>
        </button>
    </section>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="goHome()"><div class="nav-icon">🏠</div><span>Home</span></button>
    <button class="nav-item active" onclick="goWallet()"><div class="nav-icon">💰</div><span>Wallet</span></button>
    <button class="nav-item" onclick="goSupport()"><div class="nav-icon">🎧</div><span>Support</span></button>
    <button class="nav-item" onclick="goProfile()"><div class="nav-icon">👤</div><span>Profile</span></button>
</nav>

<script>
function setAmount(val) {
    document.getElementById("depositAmount").value = val;
    document.getElementById("displayAmountBtn").textContent = val;
    document.querySelectorAll(".btn-preset").forEach(b => {
        b.classList.toggle("active", b.textContent.includes(val.toLocaleString('en-IN')));
    });
}

document.getElementById("depositAmount").addEventListener("input", function(e) {
    document.getElementById("displayAmountBtn").textContent = e.target.value || 0;
});

function proceedToPayment() {
    const val = Number(document.getElementById("depositAmount").value);
    if (!val || val < 50) {
        alert("Minimum deposit amount ₹50 hai.");
        return;
    }
    localStorage.setItem("rdxDepositAmount", val);
    window.location.href = `complete-payment.html?amount=${val}`;
}

async function loadBalance() {
    if (!firebaseDB) return;
    let mobile = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    const clean = String(mobile).replace(/\D/g, "");
    if (!clean) return;
    let docId = clean.length === 10 ? "91" + clean : clean;

    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if (snap.exists) {
            document.getElementById("topBalance").textContent = Number(snap.data().balance || 0);
        }
    } catch(e) { console.error(e); }
}

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }
function goHome(){ closeMenu(); window.location.href = "./dashboard.html"; }
function goProfile(){ closeMenu(); window.location.href = "./profile.html"; }
function goWallet(){ closeMenu(); window.location.href = "./wallet.html"; }
function goSupport(){ closeMenu(); window.location.href = "./support.html"; }
function goRedeem(){ closeMenu(); window.location.href = "./referral.html"; }
function goHistory(){ closeMenu(); window.location.href = "./history.html"; }
function goNotifications(){ closeMenu(); window.location.href = "./notification.html"; }
function logout(){ localStorage.clear(); window.location.href = "./login.html"; }

window.addEventListener("load", loadBalance);
</script>
</body>
</html>
