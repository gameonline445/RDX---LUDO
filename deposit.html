if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}

const firebaseConfig = {

    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",

    messagingSenderId: "928340814840",

try {

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER - Matches Image 13 */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f87171;
    color:white;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(248,113,113,0.3);
}
.menu-btn:active{transform:scale(0.95);}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    color:white;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:transform 0.15s ease;
}
.header-icon:active{transform:scale(0.95);}

.notification{background:#6366f1;}
.wallet-top{background:#22c55e;}
.redeem-top{background:#f97316;}

/* CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

/* DEPOSIT CARD */
.deposit-card{
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:22px 18px;
    box-shadow:0 8px 24px rgba(2,132,199,0.08);
}
.deposit-card h2{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
}
.deposit-card p{
    color:#64748b;
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    margin-bottom:16px;
}

/* AMOUNT INPUT */
.input-box-wrap{
    position:relative;
    margin-bottom:14px;
}
.currency-symbol{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    font-weight:900;
    color:#0c4a6e;
}
.amount-input{
    width:100%;
    height:56px;
    border:2px solid #bae6fd;
    border-radius:16px;
    background:#f8fafc;
    font-size:24px;
    font-weight:900;
    color:#0c4a6e;
    padding:0 16px 0 42px;
    outline:none;
}
.amount-input:focus{
    border-color:#0284c7;
    background:#ffffff;
}

/* QUICK AMOUNT BUTTONS */
.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}
.quick-btn{
    height:44px;
    border:1.5px solid #bae6fd;
    border-radius:14px;
    background:#f0f9ff;
    color:#0284c7;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    transition:all 0.15s ease;
}
.quick-btn:active, .quick-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    transform:scale(0.96);
}

/* PROCEED BUTTON */
.btn-proceed{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    transition:transform 0.2s ease;
}
.btn-proceed:active{
    transform:scale(0.98);
}

.limit-text{
    text-align:center;
    font-size:11px;
    color:#64748b;
    font-weight:700;
    margin-top:10px;
}

/* SIDE DRAWER */
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);z-index:2000;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-100%;width:75%;max-width:360px;height:100dvh;background:#ffffff;z-index:2100;padding:20px 16px 100px;overflow-y:auto;transition:left .3s ease;box-shadow:10px 0 35px rgba(0,0,0,.16);}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e2e8f0;}
.menu-brand{display:flex;align-items:center;gap:10px;}
.menu-logo{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #7dd3fc;display:flex;align-items:center;justify-content:center;background:#ffffff;cursor:pointer;}
.menu-logo img{width:100%;height:100%;object-fit:cover;}
.menu-user h2{font-size:17px;font-weight:850;}
.menu-user p{margin-top:2px;color:#64748b;font-size:12px;}
.close-menu{border:0;background:#f1f5f9;width:38px;height:38px;border-radius:50%;font-size:22px;color:#64748b;cursor:pointer;}
.menu-list{margin-top:16px;}
.menu-item{width:100%;min-height:52px;border:0;background:transparent;padding:6px 0;border-radius:14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;text-align:left;color:#334155;cursor:pointer;}
.menu-item-icon{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-item-text{flex:1;font-size:15px;font-weight:750;}
.menu-arrow{color:#94a3b8;font-size:20px;}

/* BOTTOM NAV - Matches Image 14 */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#1e293b;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    transition:transform 0.2s ease;
}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#38bdf8;}
.icon-profile{background:#f97316;}
</style>
</head>

<body>

<!-- SIDE DRAWER -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <div class="menu-logo" onclick="goHome()">
                <img src="logo.png" alt="RDX Logo">
            </div>
            <div class="menu-user">
                <h2 id="menuUsername">RDX LUDO</h2>
                <p>Play · Win · Earn</p>
            </div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>
    <div class="menu-list">
        <button class="menu-item" onclick="goHome()"><div class="menu-item-icon menu-home"><i class="fa-solid fa-house"></i></div><div class="menu-item-text">Home</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goProfile()"><div class="menu-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><div class="menu-item-text">My Profile</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goWallet()"><div class="menu-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><div class="menu-item-text">My Wallet</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goRedeem()"><div class="menu-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><div class="menu-item-text">Refer & Earn</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goHistory()"><div class="menu-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><div class="menu-item-text">History</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goNotifications()"><div class="menu-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><div class="menu-item-text">Notifications</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goSupport()"><div class="menu-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><div class="menu-item-text">Support</div><div class="menu-arrow">›</div></button>
    </div>
</div>

<!-- TOP HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="goHome()">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="goNotifications()"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="goWallet()"><i class="fa-solid fa-wallet"></i></button>
        <button class="header-icon redeem-top" onclick="goRedeem()"><i class="fa-solid fa-gift"></i></button>
    </div>
</header>

<main class="container">

    <div class="deposit-card">
        <h2>Add Cash to Wallet</h2>
        <p>Deposit coins to participate in live battles.</p>

        <div class="input-box-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="depositAmountInput" class="amount-input" value="100" min="100" max="10000" inputmode="numeric">
        </div>

        <div class="quick-grid">
            <button class="quick-btn active" onclick="setAmount(100)">+ ₹100</button>
            <button class="quick-btn" onclick="setAmount(200)">+ ₹200</button>
            <button class="quick-btn" onclick="setAmount(500)">+ ₹500</button>
            <button class="quick-btn" onclick="setAmount(1000)">+ ₹1,000</button>
            <button class="quick-btn" onclick="setAmount(2000)">+ ₹2,000</button>
            <button class="quick-btn" onclick="setAmount(5000)">+ ₹5,000</button>
        </div>

        <button class="btn-proceed" id="btnProceed" onclick="proceedToPayment()">
            Proceed to Pay ₹100
        </button>

        <p class="limit-text">Min: ₹100 | Max: ₹10,000</p>
    </div>

</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="goHome()"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="goWallet()"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="goSupport()"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="goProfile()"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
history.pushState({ page: 1 }, "", "");
window.addEventListener("popstate", function (event) {
    window.location.href = "dashboard.html";
});

let unsubscribeWalletListener = null;

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }

const amountInput = document.getElementById("depositAmountInput");
const btnProceed = document.getElementById("btnProceed");

function updateProceedButton() {
    const val = Number(amountInput.value) || 0;
    btnProceed.textContent = `Proceed to Pay ₹${val}`;
}

function setAmount(amt) {
    amountInput.value = amt;
    document.querySelectorAll(".quick-btn").forEach(b => {
        if(b.textContent.includes(amt.toLocaleString('en-IN'))) {
            b.classList.add("active");
        } else {
            b.classList.remove("active");
        }
    });
    updateProceedButton();
}

amountInput.addEventListener("input", () => {
    document.querySelectorAll(".quick-btn").forEach(b => b.classList.remove("active"));
    updateProceedButton();
});

function proceedToPayment() {
    const amt = Number(amountInput.value);

    if (isNaN(amt) || amt < 100) {
        alert("⚠️ Minimum deposit ₹100 hona chahiye.");
        amountInput.focus();
        return;
    }
    if (amt > 10000) {
        alert("⚠️ Maximum deposit ₹10,000 hi ho sakta hai.");
        amountInput.focus();
        return;
    }

    localStorage.setItem("rdxDepositAmount", amt);
    window.location.href = `./complete-payment.html?amount=${amt}`;
}

async function loadUserData() {
    try {
        if(!firebaseDB) return;

        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if (!mobile) { window.location.replace("index.html"); return; }

        const cleanMobile = String(mobile).replace(/\D/g, "");
        let firebaseDocId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

        let userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        let snapshot = await userRef.get();
        
        if(!snapshot.exists) {
            firebaseDocId = cleanMobile;
            userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        }

        if(unsubscribeWalletListener) unsubscribeWalletListener();

        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || ("User " + String(doc.id).slice(-4));
                if(document.getElementById("menuUsername")) {
                    document.getElementById("menuUsername").textContent = fullName.split(" ")[0];
                }
            }
        }, (err) => { console.error("Real-time Wallet Sync Error:", err); });

    } catch(err) { console.error("Load User Data Error:", err); }
}

window.addEventListener("load", loadUserData);

function goHome(){ closeMenu(); window.location.href = "dashboard.html"; }
function goProfile(){ closeMenu(); window.location.href = "profile.html"; }
function goWallet(){ closeMenu(); window.location.href = "wallet.html"; }
function goRedeem(){ closeMenu(); window.location.href = "referral.html"; }
function goHistory(){ closeMenu(); window.location.href = "history.html"; }
function goNotifications(){ closeMenu(); window.location.href = "notification.html"; }
function goSupport(){ closeMenu(); window.location.href = "support.html"; }
</script>

</body>
</html>
