<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>RDX Ludo - Deposit</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9ff;
    color:#101a3d;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{
    height:82px;
    min-height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    background:
    linear-gradient(
        110deg,
        #f0f4ff,
        #ffffff,
        #eef4ff
    );

    border-bottom:1px solid #d5def1;
}


.menu-btn{
    width:54px;
    height:54px;

    border:0;
    border-radius:19px;

    background:#ff786b;

    color:white;

    font-size:29px;

    box-shadow:
    0 7px 18px
    rgba(255,100,90,.25);
}


.logo{
    width:56px;
    height:56px;

    border-radius:50%;

    background:white;

    border:5px solid #e0e9ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#2d65d6;

    font-size:18px;
    font-weight:900;

    box-shadow:
    0 4px 15px
    rgba(50,90,180,.10);
}


.header-right{
    display:flex;
    gap:8px;
}


.header-icon{
    width:50px;
    height:50px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    box-shadow:
    0 6px 15px
    rgba(50,80,160,.15);
}


.bell{
    background:#7065ee;
}

.money{
    background:#38c875;
}

.gift{
    background:#ff9a45;
}


/* =========================
   MAIN
========================= */

.main{
    flex:1;

    min-height:0;

    padding:
    14px 20px 8px;

    overflow:hidden;
}


.section-title{
    color:#3568d2;

    font-size:13px;

    font-weight:800;

    letter-spacing:2px;

    margin-bottom:4px;
}


h1{
    font-size:29px;

    line-height:1.05;

    margin-bottom:4px;
}


.subtitle{
    color:#75819a;

    font-size:15px;

    margin-bottom:12px;
}


/* =========================
   TABS
========================= */

.tabs{
    width:100%;

    display:flex;

    gap:8px;

    margin-bottom:10px;
}


.tab{
    flex:1;

    height:45px;

    border-radius:14px;

    border:1px solid #d0d9ec;

    background:#f1f3f8;

    color:#68738a;

    font-size:14px;

    font-weight:700;
}


.tab.active{
    color:white;

    background:
    linear-gradient(
        100deg,
        #2969ed,
        #4d80ee
    );

    border-color:#3470ed;
}


/* =========================
   PAYMENT CARD
========================= */

.payment-card{

    width:100%;

    border-radius:20px;

    border:1px solid #cbd7ef;

    background:
    linear-gradient(
        145deg,
        #f6f9ff,
        #ffffff
    );

    padding:11px;

    box-shadow:
    0 7px 20px
    rgba(50,80,160,.07);
}


.amount-text{
    text-align:center;

    color:#7b8498;

    font-size:12px;

    margin-bottom:6px;
}


/* QR */

.qr-container{

    width:165px;
    height:165px;

    margin:0 auto 7px;

    padding:7px;

    border-radius:14px;

    background:white;

    box-shadow:
    0 5px 15px
    rgba(50,70,120,.10);
}


.qr-container img{

    width:100%;
    height:100%;

    object-fit:contain;

    border-radius:8px;
}


/* UPI */

.upi-id{

    text-align:center;

    font-size:14px;

    font-weight:800;

    margin:
    5px 0 7px;

    word-break:break-all;
}


.copy-btn{

    display:block;

    margin:auto;

    border:0;

    padding:
    9px 22px;

    border-radius:24px;

    background:#3470ed;

    color:white;

    font-size:13px;

    font-weight:700;

    box-shadow:
    0 5px 14px
    rgba(50,110,240,.25);
}


/* =========================
   FORM
========================= */

.form-card{

    margin-top:9px;

    padding:11px;

    border-radius:18px;

    border:1px solid #cbd7ef;

    background:white;
}


.label{

    display:block;

    font-size:11px;

    font-weight:800;

    color:#6d7890;

    margin-bottom:5px;
}


.input{

    width:100%;

    height:44px;

    border-radius:12px;

    border:1px solid #d2daeb;

    background:#f8f9fc;

    padding:
    0 13px;

    font-size:15px;

    outline:none;

    color:#14203f;

    margin-bottom:9px;
}


.input:focus{

    border-color:#3974ed;

    background:white;
}


.deposit-btn{

    width:100%;

    height:46px;

    border:0;

    border-radius:25px;

    background:
    linear-gradient(
        100deg,
        #2968ed,
        #4e82ef
    );

    color:white;

    font-size:16px;

    font-weight:800;

    box-shadow:
    0 7px 18px
    rgba(45,105,235,.27);
}


/* =========================
   STATUS
========================= */

.status{

    display:none;

    margin-top:8px;

    padding:8px;

    border-radius:10px;

    text-align:center;

    background:#fff7df;

    color:#a36b00;

    font-size:12px;

    font-weight:700;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    height:72px;

    min-height:72px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:white;

    border-top:
    1px solid #dce2ef;
}


.nav-item{

    width:25%;

    text-align:center;

    color:#68738b;

    font-size:12px;
}


.nav-icon{

    width:38px;
    height:38px;

    margin:
    0 auto 2px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;
}


.nav-item.active{

    color:#182243;

    font-weight:800;
}


.nav-item.active
.nav-icon{

    background:#596ee8;

    color:white;

    box-shadow:
    0 5px 14px
    rgba(70,90,220,.25);
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-height:720px){

    .header{
        height:70px;
        min-height:70px;
    }

    .menu-btn,
    .logo{
        width:46px;
        height:46px;
    }

    .header-icon{
        width:42px;
        height:42px;
        border-radius:14px;
        font-size:19px;
    }

    .main{
        padding:
        9px 16px 5px;
    }

    h1{
        font-size:25px;
    }

    .subtitle{
        margin-bottom:7px;
    }

    .tabs{
        margin-bottom:7px;
    }

    .tab{
        height:40px;
    }

    .qr-container{
        width:135px;
        height:135px;
    }

    .payment-card{
        padding:8px;
    }

    .form-card{
        margin-top:7px;
        padding:8px;
    }

    .input{
        height:40px;
        margin-bottom:7px;
    }

    .deposit-btn{
        height:43px;
    }

    .bottom-nav{
        height:62px;
        min-height:62px;
    }

    .nav-icon{
        width:32px;
        height:32px;
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="menu-btn"
        onclick="menuClick()">
        ☰
    </button>


    <div class="logo">
        RDX
    </div>


    <div class="header-right">

        <div class="header-icon bell">
            🔔
        </div>

        <div class="header-icon money">
            💰
        </div>

        <div class="header-icon gift">
            🎁
        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="section-title">
        DEPOSIT
    </div>


    <h1>
        Complete Payment
    </h1>


    <div class="subtitle">
        Welcome RDX LUDO
    </div>



    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            id="upiTab">

            UPI Details

        </button>


        <button
            class="tab"
            id="accountTab">

            Account Transfer

        </button>

    </div>



    <!-- =========================
         PAYMENT CARD
    ========================= -->

    <section class="payment-card">


        <div class="amount-text">

            Selected Amount:
            ₹<span id="amountDisplay">100</span>

        </div>



        <!-- QR CODE -->

        <div class="qr-container">

            <img
                id="qrImage"
                src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=RDX-LUDO-DEMO"
                alt="Payment QR">

        </div>



        <!-- UPI ID -->

        <div
            class="upi-id"
            id="upiId">

            demo-rdxludo@upi

        </div>



        <button
            class="copy-btn"
            onclick="copyUPI()">

            Copy UPI ID

        </button>


    </section>



    <!-- =========================
         DEPOSIT FORM
    ========================= -->

    <section class="form-card">


        <label class="label">

            ENTER AMOUNT

        </label>


        <input
            class="input"
            id="amount"
            type="number"
            value="100"
            readonly
        >



        <label class="label">

            ENTER UTR NUMBER

        </label>


        <input
            class="input"
            id="utr"
            type="text"
            inputmode="numeric"
            placeholder="Enter UTR Number"
            maxlength="30"
        >



        <button
            class="deposit-btn"
            onclick="submitDeposit()">

            Deposit

        </button>



        <div
            class="status"
            id="status">

        </div>


    </section>


</main>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


    <div
        class="nav-item"
        onclick="goHome()">

        <div class="nav-icon">
            🏠
        </div>

        Home

    </div>



    <div
        class="nav-item active">

        <div class="nav-icon">
            💰
        </div>

        Wallet

    </div>



    <div
        class="nav-item"
        onclick="goSupport()">

        <div class="nav-icon">
            🎧
        </div>

        Support

    </div>



    <div
        class="nav-item"
        onclick="goProfile()">

        <div class="nav-icon">
            👤
        </div>

        Profile

    </div>


</nav>


</div>



<script>

/* ==========================================
   DEMO UPI CONFIGURATION
========================================== */

const UPI_ID =
"demo-rdxludo@upi";


/* ==========================================
   GET AMOUNT
========================================== */

function loadAmount(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    let amount =
        params.get("amount");


    if(!amount){

        amount =
            localStorage.getItem(
                "selectedAmount"
            );

    }


    if(!amount){

        amount = "100";

    }


    amount =
        Number(amount);


    if(
        !amount ||
        amount < 1
    ){

        amount = 100;

    }


    document
        .getElementById("amount")
        .value = amount;


    document
        .getElementById("amountDisplay")
        .textContent = amount;


    /*
      Demo QR.
      Real payment QR/backend intentionally
      is not implemented here.
    */

}


/* ==========================================
   COPY UPI
========================================== */

function copyUPI(){

    navigator
    .clipboard
    .writeText(UPI_ID)

    .then(function(){

        const button =
            document.querySelector(
                ".copy-btn"
            );


        const oldText =
            button.innerText;


        button.innerText =
            "Copied ✓";


        setTimeout(
            function(){

                button.innerText =
                    oldText;

            },
            1500
        );

    })

    .catch(function(){

        alert(
            "UPI ID: " +
            UPI_ID
        );

    });

}


/* ==========================================
   DEPOSIT / UTR SUBMIT
========================================== */

function submitDeposit(){

    const amount =
        document
        .getElementById("amount")
        .value;


    const utr =
        document
        .getElementById("utr")
        .value
        .trim();


    if(!utr){

        alert(
            "Please enter UTR Number"
        );

        return;

    }


    if(utr.length < 6){

        alert(
            "Please enter a valid UTR Number"
        );

        return;

    }


    /*
      DEMO REQUEST

      Local browser storage me save hota hai.
      Status = Pending.
    */

    const depositRequest = {

        id:
            "DEP-" +
            Date.now(),

        amount:
            Number(amount),

        utr:
            utr,

        status:
            "Pending",

        createdAt:
            new Date()
            .toISOString()

    };


    let deposits =
        JSON.parse(
            localStorage.getItem(
                "demoDeposits"
            ) || "[]"
        );


    deposits.unshift(
        depositRequest
    );


    localStorage.setItem(
        "demoDeposits",
        JSON.stringify(
            deposits
        )
    );


    document
        .getElementById("utr")
        .value = "";


    const status =
        document
        .getElementById("status");


    status.style.display =
        "block";


    status.innerHTML =
        "✓ Deposit submitted<br>" +
        "Status: Pending";


}


/* ==========================================
   ACCOUNT TRANSFER
========================================== */

document
.getElementById("accountTab")
.addEventListener(
    "click",
    function(){

        alert(
            "Account Transfer demo section"
        );

    }
);


/* ==========================================
   MENU
========================================== */

function menuClick(){

    alert(
        "RDX Ludo Menu"
    );

}


/* ==========================================
   NAVIGATION
========================================== */

function goHome(){

    window.location.href =
        "index.html";

}


function goSupport(){

    window.location.href =
        "support.html";

}


function goProfile(){

    window.location.href =
        "profile.html";

}


/* ==========================================
   START
========================================== */

loadAmount();

</script>

</body>
</html>
