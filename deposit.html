<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Add Cash</title>

<!-- FontAwesome for clean icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,113,101,0.25);
}
.menu-btn:active{transform:scale(0.95);}

/* BRAND 3D LOGO */
.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    height:38px;
    padding:0 10px;
    border:0;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
    font-weight:800;
    color:white;
    cursor:pointer;
}
.icon-only{width:38px;padding:0;border-radius:50%;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);}

/* CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

/* DEPOSIT CARD */
.deposit-card{
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:22px 18px;
    box-shadow:0 8px 24px rgba(2,132,199,0.08);
}
.deposit-card h2{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
}
.deposit-card p{
    color:#64748b;
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    margin-bottom:16px;
}

/* AMOUNT INPUT */
.input-box-wrap{
    position:relative;
    margin-bottom:14px;
}
.currency-symbol{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    font-weight:900;
    color:#0c4a6e;
}
.amount-input{
    width:100%;
    height:56px;
    border:2px solid #bae6fd;
    border-radius:16px;
    background:#f8fafc;
    font-size:24px;
    font-weight:900;
    color:#0c4a6e;
    padding:0 16px 0 42px;
    outline:none;
}
.amount-input:focus{
    border-color:#0284c7;
    background:#ffffff;
}

/* QUICK AMOUNT BUTTONS */
.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}
.quick-btn{
    height:44px;
    border:1.5px solid #bae6fd;
    border-radius:14px;
    background:#f0f9ff;
    color:#0284c7;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    transition:all 0.15s ease;
}
.quick-btn:active, .quick-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    transform:scale(0.96);
}

/* PROCEED BUTTON */
.btn-proceed{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    transition:transform 0.2s ease;
}
.btn-proceed:active{
    transform:scale(0.98);
}

.limit-text{
    text-align:center;
    font-size:11px;
    color:#64748b;
    font-weight:700;
    margin-top:10px;
}

/* SIDE DRAWER */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}
.drawer-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(145deg,#0284c7,#0369a1);
    color:white;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
}
.drawer-close{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid #bae6fd;
    background:#ffffff;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
    transition:background 0.2s ease;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item i{font-size:16px;width:22px;text-align:center;color:#0284c7;}
.drawer-footer{padding:14px;border-top:1px solid #e2e8f0;}
.drawer-logout{
    width:100%;
    padding:12px;
    border:1px solid #fecdd3;
    border-radius:14px;
    background:#fff1f2;
    color:#be123c;
    font-weight:800;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:transform 0.2s ease;
}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#10b981;}
</style>
</head>

<body>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
<div class="drawer" id="sideDrawer">
    <div class="drawer-header">
        <div class="drawer-user">
            <div class="drawer-avatar" id="drawerAvatar">U</div>
            <div>
                <h4 style="font-size:14px; font-weight:900; color:#0c4a6e;" id="drawerName">User</h4>
                <small style="color:#64748b; font-weight:700;" id="drawerMobile">+91**********</small>
            </div>
        </div>
        <button class="drawer-close" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-links">
        <button class="drawer-item" onclick="location.href='dashboard.html'"><i class="fa-solid fa-house"></i> Home</button>
        <button class="drawer-item" onclick="location.href='profile.html'"><i class="fa-solid fa-user"></i> My Profile</button>
        <button class="drawer-item" onclick="location.href='wallet.html'"><i class="fa-solid fa-wallet"></i> My Wallet</button>
        <button class="drawer-item" onclick="location.href='deposit.html'"><i class="fa-solid fa-money-bill-wave"></i> Add Cash</button>
        <button class="drawer-item" onclick="location.href='withdraw.html'"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw Cash</button>
        <button class="drawer-item" onclick="location.href='history.html'"><i class="fa-solid fa-clock-rotate-left"></i> History & Logs</button>
        <button class="drawer-item" onclick="location.href='referral.html'"><i class="fa-solid fa-gift"></i> Refer & Earn 2%</button>
        <button class="drawer-item" onclick="location.href='support.html'"><i class="fa-solid fa-headset"></i> 24/7 Support</button>
    </div>

    <div class="drawer-footer">
        <button class="drawer-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
</div>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="location.href='dashboard.html'">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification icon-only" onclick="location.href='notification.html'"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="location.href='wallet.html'">💰 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="location.href='referral.html'">🎁 <span id="topReferral">0</span></button>
    </div>
</header>

<main class="container">

    <div class="deposit-card">
        <h2>Add Cash to Wallet</h2>
        <p>Deposit coins to participate in live battles.</p>

        <div class="input-box-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="depositAmountInput" class="amount-input" value="100" min="100" max="10000" inputmode="numeric">
        </div>

        <div class="quick-grid">
            <button class="quick-btn active" onclick="setAmount(100)">+ ₹100</button>
            <button class="quick-btn" onclick="setAmount(200)">+ ₹200</button>
            <button class="quick-btn" onclick="setAmount(500)">+ ₹500</button>
            <button class="quick-btn" onclick="setAmount(1000)">+ ₹1,000</button>
            <button class="quick-btn" onclick="setAmount(2000)">+ ₹2,000</button>
            <button class="quick-btn" onclick="setAmount(5000)">+ ₹5,000</button>
        </div>

        <button class="btn-proceed" id="btnProceed" onclick="proceedToPayment()">
            Proceed to Pay ₹100
        </button>

        <p class="limit-text">Min: ₹100 | Max: ₹10,000</p>
    </div>

</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item active" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

const amountInput = document.getElementById("depositAmountInput");
const btnProceed = document.getElementById("btnProceed");

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

function updateProceedButton() {
    const val = Number(amountInput.value) || 0;
    btnProceed.textContent = `Proceed to Pay ₹${val}`;
}

function setAmount(amt) {
    amountInput.value = amt;
    document.querySelectorAll(".quick-btn").forEach(b => {
        if(b.textContent.includes(amt.toLocaleString('en-IN'))) {
            b.classList.add("active");
        } else {
            b.classList.remove("active");
        }
    });
    updateProceedButton();
}

amountInput.addEventListener("input", () => {
    document.querySelectorAll(".quick-btn").forEach(b => b.classList.remove("active"));
    updateProceedButton();
});

function proceedToPayment() {
    const amt = Number(amountInput.value);

    // MIN ₹100 & MAX ₹10,000 STRICT VALIDATION
    if (isNaN(amt) || amt < 100) {
        alert("⚠️ Kam se kam (Minimum) deposit ₹100 hona chahiye.");
        amountInput.focus();
        return;
    }
    if (amt > 10000) {
        alert("⚠️ Adhik se adhik (Maximum) deposit ₹10,000 hi ho sakta hai.");
        amountInput.focus();
        return;
    }

    localStorage.setItem("rdxDepositAmount", amt);
    window.location.href = `./complete-payment.html?amount=${amt}`;
}

async function loadUserData() {
    if (!userId) { location.href = "login.html"; return; }
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if (snap.exists) {
            const d = snap.data();
            const displayName = d.name || ("User " + userId.slice(-4));
            document.getElementById("drawerName").textContent = displayName;
            document.getElementById("drawerAvatar").textContent = displayName.charAt(0).toUpperCase();
            document.getElementById("drawerMobile").textContent = "+" + userId;
            document.getElementById("topBalance").textContent = Number(d.balance || 0);
            document.getElementById("topReferral").textContent = Number(d.referralBalance || d.redeemBalance || 0);
        }
    } catch(err) { console.error(err); }
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    localStorage.removeItem("rdxLoggedIn");
    localStorage.removeItem("rdxFirebaseUserId");
    localStorage.removeItem("rdxVerifiedMobile");
    localStorage.removeItem("rdxAccessToken");
    location.href = "login.html";
}

window.addEventListener("load", loadUserData);
</script>

</body>
</html>
