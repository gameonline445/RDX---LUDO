<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>RDX LUDO - Add Cash</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
let firebaseDB = null;
try {
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firebaseDB = firebase.firestore();
} catch(error){ console.error(error); }
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

/* 🔒 पूरी स्क्रीन और बॉडी को मोबाइल पर भी पूरी तरह लॉक करने के लिए */
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color: #101a38;
    -webkit-touch-callout: none;
}
button{font:inherit;}

/* TOP HEADER STYLES */
.top-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 66px;
    background: linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom: 1.5px solid #bae6fd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 100;
    box-shadow: 0 4px 18px rgba(2,132,199,0.08);
}

/* CONTAINER (Fixed between header and bottom nav) */
.container{
    position: absolute;
    top: 66px;
    bottom: 74px;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 16px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* DEPOSIT CARD */
.deposit-card{
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:22px 18px;
    box-shadow:0 8px 24px rgba(2,132,199,0.08);
}
.deposit-card h2{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
}
.deposit-card p{
    color:#64748b;
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    margin-bottom:16px;
}

/* AMOUNT INPUT */
.input-box-wrap{
    position:relative;
    margin-bottom:14px;
}
.currency-symbol{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    font-weight:900;
    color:#0c4a6e;
}
.amount-input{
    width:100%;
    height:56px;
    border:2px solid #bae6fd;
    border-radius:16px;
    background:#f8fafc;
    font-size:24px;
    font-weight:900;
    color:#0c4a6e;
    padding:0 16px 0 42px;
    outline:none;
}
.amount-input:focus{
    border-color:#0284c7;
    background:#ffffff;
}

/* QUICK AMOUNT BUTTONS */
.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}
.quick-btn{
    height:44px;
    border:1.5px solid #bae6fd;
    border-radius:14px;
    background:#f0f9ff;
    color:#0284c7;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    transition:all 0.15s ease;
}
.quick-btn:active, .quick-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    transform:scale(0.96);
}

/* PROCEED BUTTON */
.btn-proceed{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    transition:transform 0.2s ease;
}
.btn-proceed:active{
    transform:scale(0.98);
}

.limit-text{
    text-align:center;
    font-size:11px;
    color:#64748b;
    font-weight:700;
    margin-top:10px;
}

/* BOTTOM NAV CONTAINER */
.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
}
.nav-item.active {color:#0f172a;font-weight:850;}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#0284c7;}
.icon-profile{background:#ea580c;}

/* DRAWER STYLING */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:999;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;width:280px;height:100%;background:#ffffff;z-index:1000;box-shadow:4px 0 25px rgba(2,132,199,0.15);transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;}
.drawer.active{transform:translateX(0);}
</style>
</head>

<body>

<!-- COMPONENTS CONTAINERS -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main class="container" id="scrollContainer">

    <div class="deposit-card">
        <h2>Add Cash to Wallet</h2>
        <p>Deposit coins to participate in live battles.</p>

        <div class="input-box-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="depositAmountInput" class="amount-input" value="100" min="100" max="10000" inputmode="numeric">
        </div>

        <div class="quick-grid">
            <button class="quick-btn active" onclick="setAmount(100)">+ ₹100</button>
            <button class="quick-btn" onclick="setAmount(200)">+ ₹200</button>
            <button class="quick-btn" onclick="setAmount(500)">+ ₹500</button>
            <button class="quick-btn" onclick="setAmount(1000)">+ ₹1,000</button>
            <button class="quick-btn" onclick="setAmount(2000)">+ ₹2,000</button>
            <button class="quick-btn" onclick="setAmount(5000)">+ ₹5,000</button>
        </div>

        <button class="btn-proceed" id="btnProceed" onclick="proceedToPayment()">
            Proceed to Pay ₹100
        </button>

        <p class="limit-text">Min: ₹100 | Max: ₹10,000</p>
    </div>

</main>

<!-- Bottom Nav Container -->
<div id="nav-container" data-active="wallet"></div>

<!-- EXTERNAL COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
/* 🛡️ मोबाइल ब्राउज़र के पूरे पेज वाले बाउंस/स्क्रॉल को रोकने के लिए ग्लोबल प्रिवेंटर */
document.addEventListener('touchmove', function(event) {
    if (!event.target.closest('main.container') && !event.target.closest('.drawer')) {
        event.preventDefault();
    }
}, { passive: false });

/* 🔄 पुल-टू-रिफ्रेश लॉजिक (बिना किसी टेक्स्ट/आइकॉन लाइन के शुद्ध रिफ्रेश) */
let startY = 0;
const scrollContainer = document.getElementById('scrollContainer');

scrollContainer.addEventListener('touchstart', function(e) {
    if (scrollContainer.scrollTop === 0) {
        startY = e.touches[0].clientY;
    }
});

scrollContainer.addEventListener('touchmove', function(e) {
    if (scrollContainer.scrollTop === 0 && startY > 0) {
        let currentY = e.touches[0].clientY;
        if (currentY - startY > 100) {
            startY = 0;
            window.location.reload();
        }
    }
});

scrollContainer.addEventListener('touchend', function(e) {
    startY = 0;
});

history.pushState({ page: 1 }, "", "");
window.addEventListener("popstate", function (event) {
    const panel = document.getElementById("sideDrawer");
    if (panel && panel.classList.contains("active")) {
        toggleDrawer();
        history.pushState({ page: 1 }, "", "");
    } else {
        window.location.href = "dashboard.html";
    }
});

let unsubscribeWalletListener = null;

const amountInput = document.getElementById("depositAmountInput");
const btnProceed = document.getElementById("btnProceed");

function updateProceedButton() {
    const val = Number(amountInput.value) || 0;
    btnProceed.textContent = `Proceed to Pay ₹${val}`;
}

function setAmount(amt) {
    amountInput.value = amt;
    document.querySelectorAll(".quick-btn").forEach(b => {
        if(b.textContent.includes(amt.toLocaleString('en-IN'))) {
            b.classList.add("active");
        } else {
            b.classList.remove("active");
        }
    });
    updateProceedButton();
}

amountInput.addEventListener("input", () => {
    document.querySelectorAll(".quick-btn").forEach(b => b.classList.remove("active"));
    updateProceedButton();
});

function proceedToPayment() {
    const amt = Number(amountInput.value);

    if (isNaN(amt) || amt < 100) {
        alert("⚠️ Minimum deposit ₹100 hona chahiye.");
        amountInput.focus();
        return;
    }
    if (amt > 10000) {
        alert("⚠️ Maximum deposit ₹10,000 hi ho sakta hai.");
        amountInput.focus();
        return;
    }

    localStorage.setItem("rdxDepositAmount", amt);
    window.location.href = `./complete-payment.html?amount=${amt}`;
}

async function loadUserData() {
    try {
        if(!firebaseDB) return;

        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if (!mobile) { window.location.replace("index.html"); return; }

        const cleanMobile = String(mobile).replace(/\D/g, "");
        let firebaseDocId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

        let userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        let snapshot = await userRef.get();
        
        if(!snapshot.exists) {
            firebaseDocId = cleanMobile;
            userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        }

        if(unsubscribeWalletListener) unsubscribeWalletListener();

        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || ("User " + String(doc.id).slice(-4));
                
                const nameEls = document.querySelectorAll("#drawerName");
                const mobileEls = document.querySelectorAll("#drawerMobile");
                
                nameEls.forEach(el => el.textContent = fullName);
                mobileEls.forEach(el => el.textContent = "+" + cleanMobile);
            }
        }, (err) => { console.error("Real-time Wallet Sync Error:", err); });

    } catch(err) { console.error("Load User Data Error:", err); }
}

window.addEventListener("load", loadUserData);
</script>

</body>
</html>
