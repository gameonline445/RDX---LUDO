<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>RDX LUDO - Deposit</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    background:
    linear-gradient(
        180deg,
        #f2f6ff 0%,
        #ffffff 55%,
        #f5f7ff 100%
    );

    color:#111a38;
}

button,
input{
    font:inherit;
}


/* =========================
   PAGE
========================= */

.page{

    width:100%;
    height:100vh;

    height:100dvh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.top-header{

    height:76px;

    flex:0 0 76px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:
    linear-gradient(
        110deg,
        #edf4ff,
        #ffffff
    );

    border-bottom:1px solid #cbd8f0;

    box-shadow:
    0 5px 18px rgba(36,75,150,.10);

    z-index:10;
}


.header-left{

    display:flex;

    align-items:center;

    gap:10px;
}


.menu-btn{

    width:48px;
    height:48px;

    border:0;

    border-radius:16px;

    background:
    linear-gradient(
        145deg,
        #ff7165,
        #ff8a70
    );

    color:white;

    font-size:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
    0 7px 18px rgba(255,93,80,.25);
}


.logo{

    width:48px;
    height:48px;

    border-radius:50%;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #e7efff
    );

    border:3px solid #d3e1ff;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#1762df;

    font-size:13px;

    font-weight:900;

    box-shadow:
    0 5px 12px rgba(36,93,190,.15);
}


.header-right{

    display:flex;

    align-items:center;

    gap:8px;
}


.header-icon{

    width:47px;
    height:47px;

    border:0;

    border-radius:17px;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    box-shadow:
    0 6px 15px rgba(0,0,0,.12);
}


.notification{

    background:
    linear-gradient(
        145deg,
        #746df4,
        #817eff
    );
}


.wallet-top{

    background:
    linear-gradient(
        145deg,
        #20c36b,
        #43d77e
    );

    font-weight:800;
}


.redeem-top{

    background:
    linear-gradient(
        145deg,
        #ff8a35,
        #ffad45
    );

    font-weight:800;
}


/* =========================
   MAIN
========================= */

.main{

    flex:1;

    min-height:0;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    overflow:hidden;

    padding:
    18px
    18px
    12px;
}


.deposit-page{

    width:100%;

    max-width:850px;

    height:100%;

    overflow:hidden;
}


/* =========================
   TITLE
========================= */

.page-label{

    color:#3168dc;

    font-size:14px;

    font-weight:800;

    letter-spacing:1.5px;

    margin-bottom:4px;
}


.page-title{

    font-size:36px;

    line-height:1.1;

    font-weight:850;

    letter-spacing:-1px;

    margin-bottom:4px;
}


.page-subtitle{

    color:#71809b;

    font-size:18px;

    margin-bottom:18px;
}


/* =========================
   AMOUNT CARD
========================= */

.amount-card{

    border:1.5px solid #b8ccef;

    border-radius:25px;

    padding:17px;

    background:
    radial-gradient(
        circle at 0% 0%,
        #e8f0ff,
        transparent 45%
    ),

    linear-gradient(
        135deg,
        #f4f7ff,
        #ffffff
    );

    box-shadow:
    0 10px 28px rgba(48,89,170,.08);
}


.amount-label{

    display:block;

    color:#69758d;

    font-size:15px;

    font-weight:800;

    letter-spacing:.6px;

    margin-bottom:10px;
}


.amount-input-box{

    height:64px;

    border:1.5px solid #b8c9e8;

    border-radius:22px;

    background:#ffffff;

    display:flex;

    align-items:center;

    padding:0 14px;

    gap:13px;
}


.rupee-icon{

    width:46px;
    height:46px;

    flex:0 0 46px;

    border-radius:50%;

    background:
    linear-gradient(
        145deg,
        #3674e8,
        #527ef1
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    font-weight:800;

    box-shadow:
    0 6px 14px rgba(45,105,232,.25);
}


#amount{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    color:#111a38;

    font-size:28px;

    font-weight:800;
}


.amount-info{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:10px;
}


.minimum{

    color:#d4423c;

    font-size:15px;

    font-weight:700;
}


.coin-rate{

    color:#5280d8;

    font-size:15px;

    font-weight:600;
}


/* =========================
   QUICK AMOUNTS
========================= */

.quick-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    margin-top:14px;
}


.quick-btn{

    height:58px;

    border-radius:18px;

    border:1.5px solid #bdcce7;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f7f9ff
    );

    color:#151d35;

    font-size:18px;

    font-weight:800;

    cursor:pointer;
}


.quick-btn.active{

    border-color:#2e6ce8;

    color:white;

    background:
    linear-gradient(
        100deg,
        #2765e8,
        #4b7ff0
    );

    box-shadow:
    0 8px 20px rgba(42,101,231,.25);
}


/* =========================
   PAY
========================= */

.secure-text{

    text-align:center;

    color:#71809a;

    font-size:16px;

    margin:
    16px 0 12px;
}


.pay-btn{

    width:100%;

    height:68px;

    border:0;

    border-radius:35px;

    color:white;

    font-size:21px;

    font-weight:850;

    background:
    linear-gradient(
        100deg,
        #2967e9,
        #4d7ff0
    );

    box-shadow:
    0 12px 28px rgba(42,101,231,.30);

    cursor:pointer;
}


.pay-btn:active{

    transform:scale(.98);
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    height:78px;

    flex:0 0 78px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:
    rgba(255,255,255,.97);

    border-top:1px solid #d5deef;

    box-shadow:
    0 -5px 20px rgba(30,65,130,.08);

    z-index:10;
}


.nav-item{

    width:25%;

    height:100%;

    border:0;

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    color:#68758f;

    font-size:13px;

    cursor:pointer;
}


.nav-icon{

    width:44px;
    height:44px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;
}


.nav-item.active{

    color:#202d49;

    font-weight:800;
}


.nav-item.active .nav-icon{

    background:#536df5;

    color:white;

    box-shadow:
    0 7px 17px rgba(83,109,245,.30);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top-header{

        height:70px;

        flex-basis:70px;

        padding:0 12px;
    }


    .menu-btn{

        width:46px;
        height:46px;

        font-size:25px;
    }


    .logo{

        width:45px;
        height:45px;

        font-size:12px;
    }


    .header-right{

        gap:6px;
    }


    .header-icon{

        width:44px;
        height:44px;

        border-radius:16px;
    }


    .wallet-top,
    .redeem-top{

        width:44px;

        min-width:44px;

        font-size:0;
    }


    .wallet-top::before{

        content:"💰";

        font-size:20px;
    }


    .redeem-top::before{

        content:"🎁";

        font-size:20px;
    }


    .main{

        padding:
        15px
        12px
        8px;
    }


    .page-label{

        font-size:13px;

        margin-bottom:3px;
    }


    .page-title{

        font-size:32px;
    }


    .page-subtitle{

        font-size:16px;

        margin-bottom:15px;
    }


    .amount-card{

        padding:15px;

        border-radius:23px;
    }


    .amount-input-box{

        height:60px;

        border-radius:20px;
    }


    .rupee-icon{

        width:43px;
        height:43px;

        flex-basis:43px;
    }


    #amount{

        font-size:25px;
    }


    .quick-grid{

        gap:10px;

        margin-top:12px;
    }


    .quick-btn{

        height:54px;

        border-radius:17px;

        font-size:17px;
    }


    .secure-text{

        margin:
        13px 0 10px;

        font-size:15px;
    }


    .pay-btn{

        height:62px;

        font-size:19px;

        border-radius:32px;
    }


    .bottom-nav{

        height:76px;

        flex-basis:76px;
    }

}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-height:700px){

    .main{

        padding-top:10px;
    }


    .page-title{

        font-size:29px;
    }


    .page-subtitle{

        margin-bottom:10px;
    }


    .amount-card{

        padding:12px;
    }


    .quick-btn{

        height:48px;
    }


    .secure-text{

        margin:9px 0 7px;
    }


    .pay-btn{

        height:55px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <div class="header-left">

        <button
            class="menu-btn"
            onclick="goHome()">

            ☰

        </button>


        <div class="logo">

            RDX

        </div>

    </div>


    <div class="header-right">

        <button
            class="header-icon notification">

            🔔

        </button>


        <button
            class="header-icon wallet-top"
            onclick="goWallet()">

            💰

        </button>


        <button
            class="header-icon redeem-top">

            🎁

        </button>

    </div>

</header>


<!-- =========================
     MAIN DEPOSIT
========================= -->

<main class="main">

<section class="deposit-page">


    <div class="page-label">
        WALLET
    </div>


    <h1 class="page-title">
        Add Money
    </h1>


    <p class="page-subtitle">
        Choose amount and deposit securely
    </p>


    <!-- AMOUNT -->

    <div class="amount-card">


        <label
            class="amount-label"
            for="amount">

            ENTER AMOUNT

        </label>


        <div class="amount-input-box">


            <div class="rupee-icon">
                ₹
            </div>


            <input
                id="amount"
                type="number"
                inputmode="decimal"
                value="100"
                min="100"
                placeholder="100"
                oninput="updateAmount()">

        </div>


        <div class="amount-info">

            <span class="minimum">
                Min: ₹100
            </span>


            <span class="coin-rate">
                1 Coin = ₹1
            </span>

        </div>


    </div>


    <!-- QUICK AMOUNTS -->

    <div class="quick-grid">


        <button
            class="quick-btn active"
            onclick="selectAmount(100,this)">

            ₹100

        </button>


        <button
            class="quick-btn"
            onclick="selectAmount(250,this)">

            ₹250

        </button>


        <button
            class="quick-btn"
            onclick="selectAmount(500,this)">

            ₹500

        </button>


        <button
            class="quick-btn"
            onclick="selectAmount(1000,this)">

            ₹1000

        </button>


        <button
            class="quick-btn"
            onclick="selectAmount(2000,this)">

            ₹2000

        </button>


        <button
            class="quick-btn"
            onclick="selectAmount(5000,this)">

            ₹5000

        </button>


    </div>


    <div class="secure-text">
        Secure & Instant Deposit
    </div>


    <button
        class="pay-btn"
        onclick="proceedPay()">

        Proceed to Pay

    </button>


</section>

</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        onclick="goHome()">

        <div class="nav-icon">
            🏠
        </div>

        <span>
            Home
        </span>

    </button>


    <button
        class="nav-item active"
        onclick="goWallet()">

        <div class="nav-icon">
            💰
        </div>

        <span>
            Wallet
        </span>

    </button>


    <button
        class="nav-item"
        onclick="goSupport()">

        <div class="nav-icon">
            🎧
        </div>

        <span>
            Support
        </span>

    </button>


    <button
        class="nav-item"
        onclick="goProfile()">

        <div class="nav-icon">
            👤
        </div>

        <span>
            Profile
        </span>

    </button>

</nav>


</div>


<script>

/* =========================
   AMOUNT
========================= */

function selectAmount(amount,button){

    document.getElementById("amount").value = amount;


    document
    .querySelectorAll(".quick-btn")
    .forEach(function(btn){

        btn.classList.remove("active");

    });


    button.classList.add("active");

}


function updateAmount(){

    const amount =
        Number(
            document.getElementById("amount").value
        );


    document
    .querySelectorAll(".quick-btn")
    .forEach(function(btn){

        btn.classList.remove("active");

    });


    document
    .querySelectorAll(".quick-btn")
    .forEach(function(btn){

        const value =
            Number(
                btn.textContent
                .replace("₹","")
                .trim()
            );

        if(value === amount){

            btn.classList.add("active");

        }

    });

}


/* =========================
   PROCEED
========================= */

function proceedPay(){

    const amount =
        Number(
            document.getElementById("amount").value
        );


    if(!amount || amount < 100){

        alert("Minimum deposit amount ₹100 hai.");

        return;

    }


    /*
       PAYMENT SYSTEM BAAD ME ADD KIYA JAYEGA.

       Abhi sirf amount select ho raha hai.
    */

    alert(
        "Selected Amount: ₹" +
        amount +
        "\n\nPayment system baad me connect kiya jayega."
    );

}


/* =========================
   NAVIGATION
========================= */

function goHome(){

    window.location.href =
        "./dashboard.html";

}


function goWallet(){

    window.location.href =
        "./wallet.html";

}


function goSupport(){

    window.location.href =
        "./support.html";

}


function goProfile(){

    window.location.href =
        "./profile.html";

}

</script>


</body>
</html>
