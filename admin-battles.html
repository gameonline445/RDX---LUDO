<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battles Management</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.15) 0%, transparent 35%),
                  radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.12) 0%, transparent 32%),
                  linear-gradient(180deg, #f0f7ff 0%, #ffffff 50%, #eaf4ff 100%);
      color: #101a38;
      padding: 24px 20px;
      min-height: 100vh;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 850;
      color: #0c4a6e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: #f59e0b;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 14px;
      margin-top: 4px;
      font-weight: 600;
    }

    .table-card {
      background: #ffffff;
      border: 1.5px solid #bae6fd;
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 650px;
    }

    th {
      background: #e0f2fe;
      color: #0c4a6e;
      font-size: 13px;
      font-weight: 800;
      padding: 14px 18px;
      border-bottom: 1px solid #bae6fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 18px;
      font-size: 14px;
      border-bottom: 1px solid #f0f9ff;
      color: #334155;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .badge-created {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .badge-running {
      background: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
    }

    .badge-completed {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .badge-cancelled {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
    }

    .room-code {
      font-family: monospace;
      font-weight: 800;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1 class="page-title"><i class="fa-solid fa-gamepad"></i> Battles Management</h1>
    <p class="page-subtitle">Running Ludo battles list and room codes manage karein.</p>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Battle ID</th>
          <th>Players</th>
          <th>Amount</th>
          <th>Room Code</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="battlesTableBody">
        <tr>
          <td colspan="5" class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Firebase se Live Battles load ho rahe hain...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Aapke Firebase Config Keys
    const firebaseConfig = {
      apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
      authDomain: "rdx-ludo.firebaseapp.com",
      projectId: "rdx-ludo",
      storageBucket: "rdx-ludo.firebasestorage.app",
      messagingSenderId: "928340814840",
      appId: "1:928340814840:web:6eca42a8b76138b268440d",
      databaseURL: "https://rdx-ludo-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Firebase Realtime Database Listener for 'battles'
    const battlesRef = db.ref('battles');

    battlesRef.on('value', (snapshot) => {
      const tableBody = document.getElementById('battlesTableBody');
      tableBody.innerHTML = '';

      if (snapshot.exists()) {
        const battlesData = snapshot.val();
        let hasBattles = false;

        Object.keys(battlesData).forEach((key) => {
          hasBattles = true;
          const battle = battlesData[key];

          const battleId = key.substring(0, 8).toUpperCase();
          const p1 = battle.creatorName || battle.p1 || 'Player 1';
          const p2 = battle.joinerName || battle.p2 || 'Waiting...';
          const amount = battle.entryFee ? `₹${battle.entryFee}` : (battle.amount ? `₹${battle.amount}` : '₹0');
          const roomCode = battle.roomCode || 'N/A';
          const status = battle.status || 'Created';

          let badgeClass = 'badge-created';
          if (status.toLowerCase().includes('running') || status.toLowerCase().includes('playing')) {
            badgeClass = 'badge-running';
          } else if (status.toLowerCase().includes('complete') || status.toLowerCase().includes('won')) {
            badgeClass = 'badge-completed';
          } else if (status.toLowerCase().includes('cancel')) {
            badgeClass = 'badge-cancelled';
          }

          const rowHTML = `
            <tr>
              <td><strong>#${battleId}</strong></td>
              <td>${p1} vs ${p2}</td>
              <td><span style="color:#16a34a; font-weight:800;">${amount}</span></td>
              <td><span class="room-code">${roomCode}</span></td>
              <td><span class="badge ${badgeClass}">${status}</span></td>
            </tr>
          `;
          tableBody.innerHTML += rowHTML;
        });

        if (!hasBattles) {
          tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Filhaal koi active battle nahi hai.</td></tr>';
        }
      } else {
        tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Database me koi battle record nahi mil raha hai.</td></tr>';
      }
    }, (error) => {
      console.error("Battles Read Error:", error);
      document.getElementById('battlesTableBody').innerHTML = `<tr><td colspan="5" class="no-data" style="color:red;">Firebase Read Error: ${error.message}</td></tr>`;
    });
  </script>

</body>
</html>
