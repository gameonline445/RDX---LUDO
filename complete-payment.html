<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDX LUDO - Complete Payment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8faff;color:#101a38}
button,input{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.top{height:72px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(110deg,#edf4ff,#fff);border-bottom:1px solid #ccd8ed}
.menu{width:45px;height:45px;border:0;border-radius:15px;background:linear-gradient(145deg,#ff846e,#ff715e);color:#fff;font-size:27px}
.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:4px solid #dce6fb;color:#2362d9;font-size:12px;font-weight:900}
.spacer{flex:1}.topicon{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:20px}.bell{background:#7368ef;color:#fff}.cash{background:#35bf71;color:#fff}.gift{background:#ff933c;color:#fff}
main{flex:1;min-height:0;padding:10px 12px 6px;overflow:hidden;display:flex;align-items:flex-start}
.wrap{width:100%;max-width:560px;margin:auto}
.kicker{font-size:13px;font-weight:900;letter-spacing:2px;color:#3566c8;margin-bottom:4px}
h1{font-size:28px;line-height:1.02;margin-bottom:3px}.welcome{font-size:13px;color:#7a879f;margin-bottom:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.tab{height:43px;border:1px solid #cbd7e9;border-radius:15px;background:#eef1f6;color:#748097;font-weight:800}.tab.active{background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;border-color:#2864e6}
 .paybox{border:1.5px solid #bdd0f0;border-radius:20px;padding:9px 11px 11px;background:linear-gradient(135deg,#f0f5ff,#fff);box-shadow:0 10px 25px #4275d31a}
 .range{text-align:center;color:#818ba0;font-size:12px;margin-bottom:6px}.qr{display:flex;justify-content:center}
.qr img{width:155px;height:155px;border-radius:16px;object-fit:cover;background:#fff;padding:5px;border:1px solid #d7dff0}
 .upi{text-align:center;font-size:16px;font-weight:850;margin:6px 0;word-break:break-all}
.copy{display:block;margin:auto;border:0;border-radius:23px;padding:8px 22px;background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;font-weight:850;box-shadow:0 7px 16px #326fe533}
 .form{margin-top:7px;border:1.5px solid #c3d2ec;border-radius:18px;padding:9px;background:linear-gradient(135deg,#f4f7ff,#fff)}
label{display:block;font-size:12px;font-weight:800;color:#6b7891;margin-bottom:7px;letter-spacing:.5px}
input{width:100%;height:46px;border:1px solid #d2dceb;border-radius:15px;background:#f8f9fc;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px}
input:focus{border-color:#4a7cf0;background:#fff}
.form input{margin-bottom:7px}
.amount-readonly{color:#68758c}
 .deposit{width:100%;height:48px;border:0;border-radius:29px;background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;font-weight:900;font-size:18px}
.status{display:none;margin-top:9px;padding:10px;border-radius:12px;text-align:center;font-weight:800;font-size:13px}
.status.show{display:block;background:#fff4d9;color:#9a6a00;border:1px solid #efd795}
 .bottom{height:64px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d5deed}
.nav{border:0;background:#fff;color:#6d7890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}.nav b{font-size:21px}.nav.active{color:#18213a;font-weight:900}
.toast{position:fixed;top:82px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#182440;color:#fff;padding:10px 15px;border-radius:12px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.qr img{width:145px;height:145px}h1{font-size:26px}.tab{height:41px}.form{padding:8px}.deposit{height:46px}}
@media(max-height:720px){.top{height:58px}.bottom{height:58px}main{padding-top:6px}.kicker{font-size:11px}.welcome{margin-bottom:5px}.tabs{margin-bottom:5px}.paybox{padding:6px 9px 8px}.qr img{width:125px;height:125px}.upi{font-size:14px;margin:4px 0}.copy{padding:6px 18px}.form{margin-top:5px;padding:7px}input{height:40px}.deposit{height:42px}}
@media(min-height:721px) and (max-height:850px){.qr img{width:145px;height:145px}.paybox{padding:8px 10px 10px}.form{padding:8px}input{height:44px}.deposit{height:46px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="menu" onclick="location.href='deposit.html'">☰</button>
<div class="logo">RDX</div><div class="spacer"></div>
<div class="topicon bell">🔔</div><div class="topicon cash">💵</div><div class="topicon gift">🎁</div>
</header>
<main><div class="wrap">
<div class="kicker">DEPOSIT</div>
<h1>Complete Payment</h1>
<div class="welcome">Welcome RDX LUDO</div>
<div class="tabs"><button class="tab active">UPI Details</button><button class="tab" onclick="alert('Account Transfer option can be connected later.')">Account Transfer</button></div>
<section class="paybox">
<div class="range">Selected Amount · ₹<span id="selectedAmount">100</span></div>
<div class="qr"><img src="qr-code.png" alt="UPI QR Code"></div>
<div class="upi" id="upiText">yourupi@upi</div>
<button class="copy" onclick="copyUPI()">Copy UPI ID</button>
</section>
<section class="form">
<label>ENTER AMOUNT</label>
<input id="amount" class="amount-readonly" type="text" readonly value="100">
<label>ENTER UTR NUMBER</label>
<input id="utr" type="text" inputmode="numeric" maxlength="30" placeholder="Enter UTR Number">
<button class="deposit" onclick="submitDeposit()">Deposit</button>
<div class="status" id="status">Deposit submitted · Pending</div>
</section>
</div></main>
<nav class="bottom">
<button class="nav" onclick="location.href='dashboard.html'"><b>🏠</b>Home</button>
<button class="nav active"><b>💰</b>Wallet</button>
<button class="nav" onclick="location.href='support.html'"><b>🎧</b>Support</button>
<button class="nav" onclick="location.href='profile.html'"><b>👤</b>Profile</button>
</nav>
</div>
<div class="toast" id="toast"></div>
<script>
const UPI_ID="yourupi@upi";
const params=new URLSearchParams(location.search);
const saved=localStorage.getItem('rdxSelectedDepositAmount')||'100';
const amount=params.get('amount')||saved;
document.getElementById('selectedAmount').textContent=amount;
document.getElementById('amount').value=amount;
document.getElementById('upiText').textContent=UPI_ID;
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function copyUPI(){navigator.clipboard?.writeText(UPI_ID).then(()=>toast('UPI ID copied')).catch(()=>toast('UPI ID: '+UPI_ID))}
function submitDeposit(){
 const utr=document.getElementById('utr').value.trim();
 if(utr.length<6){toast('Please enter a valid UTR number');return}
 const data={amount:Number(amount),utr,status:'Pending',createdAt:new Date().toISOString()};
 localStorage.setItem('rdxLastDeposit',JSON.stringify(data));
 document.getElementById('status').classList.add('show');
 toast('Deposit submitted');
}
</script>
</body>
</html>
