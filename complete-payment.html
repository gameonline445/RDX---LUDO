<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDX LUDO - Complete Payment</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8faff;color:#101a38;}
.top{height:72px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(110deg,#edf4ff,#fff);border-bottom:1px solid #ccd8ed;}
.menu{width:45px;height:45px;border:0;border-radius:15px;background:linear-gradient(145deg,#ff846e,#ff715e);color:#fff;font-size:27px;cursor:pointer;}
.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:4px solid #dce6fb;color:#2362d9;font-size:12px;font-weight:900;cursor:pointer;}
.spacer{flex:1;}
.topicon{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:20px;cursor:pointer;}
.bell{background:#7368ef;color:#fff;} .cash{background:#35bf71;color:#fff;} .gift{background:#ff933c;color:#fff;}
main{padding:12px;}
.wrap{width:100%;max-width:560px;margin:auto;}
.paybox{border:1.5px solid #bdd0f0;border-radius:20px;padding:10px 11px 12px;background:linear-gradient(135deg,#f0f5ff,#fff);}
.qr img{width:155px;height:155px;border-radius:16px;object-fit:contain;background:#fff;padding:5px;border:1px solid #d7dff0;display:block;margin:auto;}
.upi{text-align:center;font-size:16px;font-weight:850;margin:7px 0;}
.copy{display:block;margin:auto;border:0;border-radius:23px;padding:8px 22px;background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;font-weight:850;cursor:pointer;}
.form{margin-top:8px;border:1.5px solid #c3d2ec;border-radius:18px;padding:10px;background:linear-gradient(135deg,#f4f7ff,#fff);}
input{width:100%;height:46px;border:1px solid #d2dceb;border-radius:15px;background:#f8f9fc;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px;}
.deposit{width:100%;height:48px;border:0;border-radius:29px;background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;font-weight:900;font-size:18px;cursor:pointer;}
.bottom{height:64px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d5deed;position:fixed;bottom:0;left:0;right:0;}
.nav{border:0;background:#fff;color:#6d7890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer;}
</style>
</head>

<body>
<div class="app">
<header class="top">
<button class="menu" onclick="location.href='deposit.html'">☰</button>
<!-- Logo Click to Home -->
<div class="logo" onclick="location.href='dashboard.html'">RDX</div>
<div class="spacer"></div>
<div class="topicon bell" onclick="location.href='notification.html'">🔔</div>
<div class="topicon cash" onclick="location.href='wallet.html'">💵</div>
<div class="topicon gift" onclick="location.href='referral.html'">🎁</div>
</header>

<main>
<div class="wrap">
<h1 style="margin-bottom:10px;">Complete Payment</h1>
<section class="paybox">
<div class="qr"><img id="qrImage" src="" alt="UPI QR Code"></div>
<div class="upi" id="upiText">Loading UPI...</div>
<button class="copy" onclick="copyUPI()">Copy UPI ID</button>
</section>

<section class="form">
<label style="font-size:12px;font-weight:800;color:#6b7891;">ENTER AMOUNT</label>
<input id="amount" type="number" readonly value="100">
<label style="font-size:12px;font-weight:800;color:#6b7891;">ENTER UTR NUMBER</label>
<input id="utr" type="text" placeholder="Enter UTR Number">
<button class="deposit" id="depositButton" onclick="submitDeposit()">Deposit</button>
</section>
</div>
</main>

<nav class="bottom">
<button class="nav" onclick="location.href='dashboard.html'"><b>🏠</b>Home</button>
<button class="nav" onclick="location.href='wallet.html'"><b>💰</b>Wallet</button>
<button class="nav" onclick="location.href='support.html'"><b>🎧</b>Support</button>
<button class="nav" onclick="location.href='profile.html'"><b>👤</b>Profile</button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const userId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");

async function loadSettings() {
    const snap = await getDoc(doc(db, "paymentSettings", "config"));
    if (snap.exists()) {
        const d = snap.data();
        document.getElementById("upiText").textContent = d.upiId || "";
        if (d.qrCodeUrl) document.getElementById("qrImage").src = d.qrCodeUrl;
    }
}

window.copyUPI = () => {
    navigator.clipboard.writeText(document.getElementById("upiText").textContent);
    alert("UPI Copied!");
};

window.submitDeposit = async () => {
    const utr = document.getElementById("utr").value.trim();
    if(utr.length < 6) return alert("Valid UTR number bharein");
    await addDoc(collection(db, "deposits"), {
        uid: userId,
        userId: userId,
        amount: Number(document.getElementById("amount").value),
        utr: utr,
        status: "pending",
        createdAt: serverTimestamp()
    });
    alert("Deposit Request Submit Ho Gayi!");
    location.href = "history.html";
};

loadSettings();
</script>
</body>
</html>
