<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDX LUDO - Complete Payment</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f8faff;
    color:#101a38;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
}

.top{
    height:72px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:linear-gradient(110deg,#edf4ff,#fff);
    border-bottom:1px solid #ccd8ed;
}

.menu{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:linear-gradient(145deg,#ff846e,#ff715e);
    color:#fff;
    font-size:27px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff;
    border:4px solid #dce6fb;
    color:#2362d9;
    font-size:12px;
    font-weight:900;
}

.spacer{
    flex:1;
}

.topicon{
    width:43px;
    height:43px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:20px;
}

.bell{background:#7368ef;color:#fff}
.cash{background:#35bf71;color:#fff}
.gift{background:#ff933c;color:#fff}

main{
    flex:1;
    padding:12px;
}

.wrap{
    width:100%;
    max-width:560px;
    margin:auto;
}

.kicker{
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    color:#3566c8;
    margin-bottom:4px;
}

h1{
    font-size:28px;
    line-height:1.05;
    margin-bottom:3px;
}

.welcome{
    font-size:13px;
    color:#7a879f;
    margin-bottom:10px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:8px;
}

.tab{
    height:43px;
    border:1px solid #cbd7e9;
    border-radius:15px;
    background:#eef1f6;
    color:#748097;
    font-weight:800;
}

.tab.active{
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    border-color:#2864e6;
}

.paybox{
    border:1.5px solid #bdd0f0;
    border-radius:20px;
    padding:10px 11px 12px;
    background:linear-gradient(135deg,#f0f5ff,#fff);
    box-shadow:0 10px 25px #4275d31a;
}

.range{
    text-align:center;
    color:#818ba0;
    font-size:12px;
    margin-bottom:7px;
}

.qr{
    display:flex;
    justify-content:center;
}

.qr img{
    width:155px;
    height:155px;
    border-radius:16px;
    object-fit:contain;
    background:#fff;
    padding:5px;
    border:1px solid #d7dff0;
}

.upi{
    text-align:center;
    font-size:16px;
    font-weight:850;
    margin:7px 0;
    word-break:break-all;
}

.copy{
    display:block;
    margin:auto;
    border:0;
    border-radius:23px;
    padding:8px 22px;
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    font-weight:850;
}

.bank{
    margin-top:10px;
    background:#fff;
    border:1px solid #d9e2f1;
    border-radius:15px;
    padding:10px;
}

.bank-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:5px 0;
    font-size:13px;
}

.bank-row span:first-child{
    color:#75819a;
}

.bank-row span:last-child{
    font-weight:800;
    text-align:right;
    word-break:break-all;
}

.form{
    margin-top:8px;
    border:1.5px solid #c3d2ec;
    border-radius:18px;
    padding:10px;
    background:linear-gradient(135deg,#f4f7ff,#fff);
}

label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#6b7891;
    margin-bottom:7px;
    letter-spacing:.5px;
}

input{
    width:100%;
    height:46px;
    border:1px solid #d2dceb;
    border-radius:15px;
    background:#f8f9fc;
    padding:0 14px;
    font-size:16px;
    outline:none;
    margin-bottom:10px;
}

input:focus{
    border-color:#4a7cf0;
    background:#fff;
}

.deposit{
    width:100%;
    height:48px;
    border:0;
    border-radius:29px;
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    font-weight:900;
    font-size:18px;
}

.deposit:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:9px;
    padding:11px;
    border-radius:12px;
    text-align:center;
    font-weight:800;
    font-size:13px;
}

.status.show{
    display:block;
}

.status.success{
    background:#dcf8e9;
    color:#13834d;
    border:1px solid #b8e9cf;
}

.status.error{
    background:#ffe3e7;
    color:#c72e43;
    border:1px solid #f4bbc5;
}

.loading{
    text-align:center;
    padding:20px;
    color:#66728c;
}

.bottom{
    height:64px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#fff;
    border-top:1px solid #d5deed;
}

.nav{
    border:0;
    background:#fff;
    color:#6d7890;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:12px;
}

.nav b{
    font-size:21px;
}

.nav.active{
    color:#18213a;
    font-weight:900;
}

.toast{
    position:fixed;
    top:82px;
    left:50%;
    transform:translate(-50%,-10px);
    opacity:0;
    background:#182440;
    color:#fff;
    padding:10px 15px;
    border-radius:12px;
    font-size:13px;
    transition:.2s;
    pointer-events:none;
    z-index:100;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:380px){
    .qr img{
        width:140px;
        height:140px;
    }

    h1{
        font-size:26px;
    }

    .tab{
        height:41px;
    }
}

@media(max-height:720px){
    .top{
        height:58px;
    }

    .bottom{
        height:58px;
    }

    .qr img{
        width:120px;
        height:120px;
    }

    .paybox{
        padding:7px 9px 9px;
    }

    .bank{
        margin-top:6px;
        padding:7px;
    }

    .form{
        margin-top:6px;
        padding:7px;
    }

    input{
        height:40px;
    }

    .deposit{
        height:42px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<button class="menu" onclick="location.href='deposit.html'">
☰
</button>

<div class="logo">
RDX
</div>

<div class="spacer"></div>

<div class="topicon bell">🔔</div>
<div class="topicon cash">💵</div>
<div class="topicon gift">🎁</div>

</header>


<main>

<div class="wrap">

<div class="kicker">
DEPOSIT
</div>

<h1>
Complete Payment
</h1>

<div class="welcome">
Welcome RDX LUDO
</div>


<div class="tabs">

<button class="tab active">
UPI Details
</button>

<button
class="tab"
onclick="showBankInfo()"
>
Account Transfer
</button>

</div>


<section class="paybox">

<div class="range">
Selected Amount · ₹
<span id="selectedAmount">100</span>
</div>


<div class="qr">

<img
id="qrImage"
src=""
alt="UPI QR Code"
>

</div>


<div
class="upi"
id="upiText"
>
Loading UPI...
</div>


<button
class="copy"
onclick="copyUPI()"
>
Copy UPI ID
</button>


<div class="bank">

<div class="bank-row">
<span>Account Holder</span>
<span id="accountHolder">—</span>
</div>

<div class="bank-row">
<span>Account Number</span>
<span id="accountNumber">—</span>
</div>

<div class="bank-row">
<span>IFSC</span>
<span id="ifsc">—</span>
</div>

<div class="bank-row">
<span>Coin Rate</span>
<span id="coinRate">—</span>
</div>

<div class="bank-row">
<span>Minimum Deposit</span>
<span>₹<span id="minimumDeposit">—</span></span>
</div>

</div>

</section>


<section class="form">

<label>
ENTER AMOUNT
</label>

<input
id="amount"
class="amount-readonly"
type="number"
min="1"
readonly
value="100"
>


<label>
ENTER UTR NUMBER
</label>

<input
id="utr"
type="text"
inputmode="numeric"
maxlength="30"
placeholder="Enter UTR Number"
autocomplete="off"
>


<button
class="deposit"
id="depositButton"
onclick="submitDeposit()"
>
Deposit
</button>


<div
class="status"
id="status"
>
</div>

</section>

</div>

</main>


<nav class="bottom">

<button
class="nav"
onclick="location.href='dashboard.html'"
>
<b>🏠</b>
Home
</button>

<button class="nav active">
<b>💰</b>
Wallet
</button>

<button
class="nav"
onclick="location.href='support.html'"
>
<b>🎧</b>
Support
</button>

<button
class="nav"
onclick="location.href='profile.html'"
>
<b>👤</b>
Profile
</button>

</nav>

</div>


<div
class="toast"
id="toast"
>
</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

    authDomain:
    "rdx-ludo.firebaseapp.com",

    projectId:
    "rdx-ludo",

    storageBucket:
    "rdx-ludo.firebasestorage.app",

    messagingSenderId:
    "928340814840",

    appId:
    "1:928340814840:web:6eca42a8b76138b268440d"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   PAYMENT SETTINGS PATH
===================================================== */

const paymentSettingsRef =
doc(
    db,
    "paymentSettings",
    "config"
);


/* =====================================================
   URL / LOCAL AMOUNT
===================================================== */

const params =
new URLSearchParams(
    location.search
);

const savedAmount =
localStorage.getItem(
    "rdxSelectedDepositAmount"
) || "100";

const selectedAmount =
Number(
    params.get("amount") ||
    savedAmount
) || 100;


/* =====================================================
   CURRENT PAYMENT SETTINGS
===================================================== */

let paymentSettings = {

    upiId:"",
    accountHolderName:"",
    accountNumber:"",
    ifsc:"",
    qrCodeUrl:"",
    coinRate:1,
    minimumDeposit:100

};


/* =====================================================
   HELPERS
===================================================== */

function $(id){

    return document.getElementById(id);

}


function toast(message){

    const box =
    $("toast");

    box.textContent =
    message;

    box.classList.add(
        "show"
    );

    setTimeout(
        () =>
        box.classList.remove(
            "show"
        ),
        1800
    );

}


function showStatus(
    message,
    type
){

    const box =
    $("status");

    box.textContent =
    message;

    box.className =
    "status show " +
    type;

}


function safeText(value){

    return String(
        value ?? ""
    );

}


/* =====================================================
   LOAD PAYMENT SETTINGS
===================================================== */

async function loadPaymentSettings(){

    try{

        showStatus(
            "Loading payment details...",
            "success"
        );


        const snapshot =
        await getDoc(
            paymentSettingsRef
        );


        if(
            !snapshot.exists()
        ){

            showStatus(
                "Payment settings अभी उपलब्ध नहीं हैं.",
                "error"
            );

            $("depositButton").disabled =
            true;

            return;

        }


        const data =
        snapshot.data();


        paymentSettings = {

            upiId:
            safeText(
                data.upiId
            ),

            accountHolderName:
            safeText(
                data.accountHolderName
            ),

            accountNumber:
            safeText(
                data.accountNumber
            ),

            ifsc:
            safeText(
                data.ifsc
            ),

            qrCodeUrl:
            safeText(
                data.qrCodeUrl
            ),

            coinRate:
            Number(
                data.coinRate ?? 1
            ),

            minimumDeposit:
            Number(
                data.minimumDeposit ?? 100
            )

        };


        renderPaymentSettings();


        const currentAmount =
        Number(
            $("amount").value
        ) || selectedAmount;


        if(
            currentAmount <
            paymentSettings.minimumDeposit
        ){

            $("amount").value =
            paymentSettings.minimumDeposit;

            $("selectedAmount").textContent =
            paymentSettings.minimumDeposit;

        }


        $("depositButton").disabled =
        false;


        /*
          Hide loading message after
          successful Firebase read.
        */

        $("status").className =
        "status";


    }catch(error){

        console.error(
            "Payment settings error:",
            error
        );


        showStatus(
            "Firebase से payment details load नहीं हो सकीं.",
            "error"
        );


        $("depositButton").disabled =
        true;

    }

}


/* =====================================================
   RENDER PAYMENT SETTINGS
===================================================== */

function renderPaymentSettings(){

    $("upiText").textContent =
    paymentSettings.upiId ||
    "UPI उपलब्ध नहीं";


    $("accountHolder").textContent =
    paymentSettings.accountHolderName ||
    "—";


    $("accountNumber").textContent =
    paymentSettings.accountNumber ||
    "—";


    $("ifsc").textContent =
    paymentSettings.ifsc ||
    "—";


    $("coinRate").textContent =
    paymentSettings.coinRate ||
    "—";


    $("minimumDeposit").textContent =
    paymentSettings.minimumDeposit ||
    "—";


    const qr =
    $("qrImage");


    if(
        paymentSettings.qrCodeUrl
    ){

        qr.src =
        paymentSettings.qrCodeUrl;

    }else{

        qr.removeAttribute(
            "src"
        );

        qr.alt =
        "QR Code unavailable";

    }

}


/* =====================================================
   COPY UPI
===================================================== */

window.copyUPI =
async function(){

    const upi =
    paymentSettings.upiId;


    if(!upi){

        toast(
            "UPI ID उपलब्ध नहीं है"
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            upi
        );

        toast(
            "UPI ID copied"
        );

    }catch{

        toast(
            "UPI ID: " + upi
        );

    }

};


/* =====================================================
   ACCOUNT TRANSFER
===================================================== */

window.showBankInfo =
function(){

    if(
        !paymentSettings.accountNumber
    ){

        toast(
            "Bank details उपलब्ध नहीं हैं"
        );

        return;

    }


    alert(
        "Account Holder: " +
        paymentSettings.accountHolderName +
        "\n\n" +

        "Account Number: " +
        paymentSettings.accountNumber +
        "\n\n" +

        "IFSC: " +
        paymentSettings.ifsc
    );

};


/* =====================================================
   SUBMIT DEPOSIT
===================================================== */

window.submitDeposit =
async function(){

    const button =
    $("depositButton");


    const amount =
    Number(
        $("amount").value
    );


    const utr =
    $("utr").value.trim();


    /* ---------------------------------------------
       BASIC VALIDATION
    --------------------------------------------- */

    if(
        !paymentSettings.upiId
    ){

        toast(
            "Payment settings उपलब्ध नहीं हैं"
        );

        return;

    }


    if(
        !amount ||
        amount <= 0
    ){

        toast(
            "Valid amount enter करें"
        );

        return;

    }


    if(
        amount <
        paymentSettings.minimumDeposit
    ){

        toast(
            "Minimum deposit ₹" +
            paymentSettings.minimumDeposit +
            " है"
        );

        return;

    }


    if(
        utr.length < 6
    ){

        toast(
            "Valid UTR number enter करें"
        );

        $("utr").focus();

        return;

    }


    /* ---------------------------------------------
       PREVENT DOUBLE CLICK
    --------------------------------------------- */

    button.disabled =
    true;

    button.textContent =
    "Submitting...";


    try{

        /*
          User ID:
          अभी existing localStorage values से
          available identifier लेने की कोशिश.
        */

        const userId =
        localStorage.getItem(
            "rdxUserId"
        ) ||

        localStorage.getItem(
            "userId"
        ) ||

        localStorage.getItem(
            "rdx_userId"
        ) ||

        "";


        const userName =
        localStorage.getItem(
            "rdxUserName"
        ) ||

        localStorage.getItem(
            "userName"
        ) ||

        "";


        /*
          Deposit request Firestore में बनेगी.

          Collection:
          deposits

          Document:
          automatically generated ID
        */

        const depositData = {

            userId:
            userId,

            userName:
            userName,

            amount:
            amount,

            utr:
            utr,

            upiId:
            paymentSettings.upiId,

            accountHolderName:
            paymentSettings.accountHolderName,

            accountNumber:
            paymentSettings.accountNumber,

            ifsc:
            paymentSettings.ifsc,

            coinRate:
            paymentSettings.coinRate,

            status:
            "pending",

            comment:
            "",

            createdAt:
            serverTimestamp()

        };


        const depositRef =
        await addDoc(
            collection(
                db,
                "deposits"
            ),
            depositData
        );


        /*
          Local backup/reference
        */

        localStorage.setItem(
            "rdxLastDeposit",
            JSON.stringify({

                requestId:
                depositRef.id,

                amount:
                amount,

                utr:
                utr,

                status:
                "pending",

                createdAt:
                new Date().toISOString()

            })
        );


        showStatus(
            "Deposit submitted successfully. Admin approval pending.",
            "success"
        );


        toast(
            "Deposit request submitted"
        );


        $("utr").value =
        "";


        button.textContent =
        "Submitted";


    }catch(error){

        console.error(
            "Deposit creation error:",
            error
        );


        showStatus(
            "Deposit submit नहीं हुआ: " +
            error.message,
            "error"
        );


        toast(
            "Deposit submit failed"
        );


        button.disabled =
        false;

        button.textContent =
        "Deposit";

    }

};


/* =====================================================
   INITIAL AMOUNT
===================================================== */

$("amount").value =
selectedAmount;

$("selectedAmount").textContent =
selectedAmount;


/* =====================================================
   LOAD FIREBASE DATA
===================================================== */

$("depositButton").disabled =
true;

loadPaymentSettings();

</script>

</body>
</html>
