<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Complete Payment</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// Authentication Security Check: Agar user logged-in nahi hai toh seedha index.html par bhejein
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}

/* TOP HEADER */
.top{
    height:66px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.menu{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* BRAND 3D LOGO */
.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.spacer{flex:1;}
.topicon{
    width:36px;
    height:36px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:15px;
    cursor:pointer;
    color:#fff;
}
.bell{background:linear-gradient(145deg,#6366f1,#818cf8);}
.cash{background:linear-gradient(145deg,#16a34a,#22c55e);}
.gift{background:linear-gradient(145deg,#ea580c,#f97316);}

/* MAIN */
main{padding:14px;}
.wrap{width:100%;max-width:560px;margin:auto;}
.page-title{font-size:18px;font-weight:850;color:#0c4a6e;margin-bottom:12px;}

.paybox{
    border:1.5px solid #7dd3fc;
    border-radius:20px;
    padding:16px 14px;
    background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);
    box-shadow:0 6px 20px rgba(2,132,199,0.08);
}
.qr img{
    width:150px;
    height:150px;
    border-radius:14px;
    object-fit:contain;
    background:#fff;
    padding:6px;
    border:1.5px solid #bae6fd;
    display:block;
    margin:auto;
}
.upi{text-align:center;font-size:15px;font-weight:850;color:#0c4a6e;margin:10px 0 8px;}
.copy{
    display:block;
    margin:auto;
    border:0;
    border-radius:20px;
    padding:8px 20px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#fff;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(2,132,199,0.25);
}

.form{
    margin-top:12px;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:16px 14px;
    background:#ffffff;
    box-shadow:0 4px 14px rgba(2,132,199,0.05);
}
label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:#64748b;
    margin-bottom:4px;
}
input{
    width:100%;
    height:44px;
    border:1.5px solid #cbd5e1;
    border-radius:12px;
    background:#f8fafc;
    padding:0 12px;
    font-size:14px;
    font-weight:700;
    outline:none;
    margin-bottom:12px;
}
input:focus{
    border-color:#0284c7;
    background:#ffffff;
}
.deposit{
    width:100%;
    height:46px;
    border:0;
    border-radius:23px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#fff;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(2,132,199,0.3);
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:transform 0.2s ease;
}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#10b981;}
</style>
</head>

<body>
<div class="app">
<header class="top">
    <button class="menu" onclick="window.location.replace('deposit.html')">☰</button>
    <div class="logo" onclick="window.location.replace('dashboard.html')">
        <img src="logo.png" alt="RDX Logo">
    </div>
    <div class="spacer"></div>
    <div class="topicon bell" onclick="window.location.replace('notification.html')">🔔</div>
    <div class="topicon cash" onclick="window.location.replace('wallet.html')">💵</div>
    <div class="topicon gift" onclick="window.location.replace('referral.html')">🎁</div>
</header>

<main>
<div class="wrap">
    <h1 class="page-title">Complete Payment</h1>
    <section class="paybox">
        <div class="qr"><img id="qrImage" src="" alt="UPI QR Code"></div>
        <div class="upi" id="upiText">Loading UPI...</div>
        <button class="copy" onclick="copyUPI()">Copy UPI ID</button>
    </section>

    <section class="form">
        <label>AMOUNT (₹)</label>
        <input id="amount" type="number" readonly value="100">
        <label>ENTER 12-DIGIT UTR NUMBER</label>
        <input id="utr" type="text" placeholder="e.g. 423589124578" maxlength="22">
        <button class="deposit" id="depositButton" onclick="submitDeposit()">Deposit</button>
    </section>
</div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item active" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const userId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");

const urlParams = new URLSearchParams(window.location.search);
const amt = urlParams.get('amount') || localStorage.getItem("rdxDepositAmount") || 100;
document.getElementById("amount").value = amt;

async function loadSettings() {
    try {
        const snap = await getDoc(doc(db, "paymentSettings", "config"));
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById("upiText").textContent = d.upiId || "rdxpayment@upi";
            if (d.qrCodeUrl) document.getElementById("qrImage").src = d.qrCodeUrl;
        }
    } catch(e){ console.error(e); }
}

window.copyUPI = () => {
    navigator.clipboard.writeText(document.getElementById("upiText").textContent);
    alert("UPI ID Copied!");
};

window.submitDeposit = async () => {
    const utr = document.getElementById("utr").value.trim();
    if(utr.length < 6) return alert("Kripya valid UTR number bharein");
    
    const btn = document.getElementById("depositButton");
    btn.disabled = true;
    btn.textContent = "Checking UTR...";

    try {
        const q = query(collection(db, "deposits"), where("utr", "==", utr));
        const duplicateSnap = await getDocs(q);

        if (!duplicateSnap.empty) {
            btn.disabled = false;
            btn.textContent = "Deposit";
            alert("⚠️ Yeh UTR number pehle se submit kiya ja chuka hai! Kripya naya/sahi UTR daalein.");
            return;
        }

        btn.textContent = "Submitting...";
        await addDoc(collection(db, "deposits"), {
            uid: userId,
            userId: userId,
            amount: Number(document.getElementById("amount").value),
            utr: utr,
            status: "pending",
            createdAt: serverTimestamp()
        });

        alert("✅ Deposit Request Submit Ho Gayi!");
        window.location.replace("history.html");
    } catch(err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.textContent = "Deposit";
    }
};

loadSettings();
</script>
</body>
</html>
