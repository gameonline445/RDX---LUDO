<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Complete Payment</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-top:70px;
    padding-bottom:95px;
}
button{font:inherit;}

/* MAIN CONTENT */
main{padding:14px;}
.wrap{width:100%;max-width:560px;margin:auto;}
.page-title{font-size:18px;font-weight:850;color:#0c4a6e;margin-bottom:12px;}

.paybox{
    border:1.5px solid #7dd3fc;
    border-radius:20px;
    padding:16px 14px;
    background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);
    box-shadow:0 6px 20px rgba(2,132,199,0.08);
}
.qr img{
    width:150px;
    height:150px;
    border-radius:14px;
    object-fit:contain;
    background:#fff;
    padding:6px;
    border:1.5px solid #bae6fd;
    display:block;
    margin:auto;
}
.upi{text-align:center;font-size:15px;font-weight:850;color:#0c4a6e;margin:10px 0 8px;}
.copy{
    display:block;
    margin:auto;
    border:0;
    border-radius:20px;
    padding:8px 20px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#fff;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(2,132,199,0.25);
}

.form{
    margin-top:12px;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:16px 14px;
    background:#ffffff;
    box-shadow:0 4px 14px rgba(2,132,199,0.05);
}
label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:#64748b;
    margin-bottom:4px;
}
input{
    width:100%;
    height:44px;
    border:1.5px solid #cbd5e1;
    border-radius:12px;
    background:#f8fafc;
    padding:0 12px;
    font-size:14px;
    font-weight:700;
    outline:none;
    margin-bottom:12px;
}
input:focus{
    border-color:#0284c7;
    background:#ffffff;
}

.file-upload-wrapper {
    margin-bottom: 14px;
}
.file-upload-box {
    border: 2px dashed #38bdf8;
    background: #f0f9ff;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
}
.file-upload-box:active { background: #e0f2fe; }
.file-upload-box i { font-size: 22px; color: #0284c7; margin-bottom: 4px; }
.file-upload-box p { font-size: 12px; font-weight: 750; color: #0c4a6e; }
.preview-img {
    max-width: 100%;
    max-height: 150px;
    border-radius: 8px;
    margin-top: 8px;
    display: none;
    border: 1px solid #cbd5e1;
}

.deposit{
    width:100%;
    height:46px;
    border:0;
    border-radius:23px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#fff;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(2,132,199,0.3);
}
</style>
</head>

<body>

<!-- COMPONENTS.JS CONTAINERS -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main>
<div class="wrap">
    <h1 class="page-title">Complete Payment</h1>
    <section class="paybox">
        <div class="qr"><img id="qrImage" src="" alt="UPI QR Code"></div>
        <div class="upi" id="upiText">Loading UPI...</div>
        <button class="copy" onclick="copyUPI()">Copy UPI ID</button>
    </section>

    <section class="form">
        <label>AMOUNT (₹)</label>
        <input id="amount" type="number" readonly value="100">
        
        <label>ENTER 12-DIGIT UTR NUMBER</label>
        <input id="utr" type="text" placeholder="e.g. 423589124578" maxlength="22">

        <label>UPLOAD PAYMENT SCREENSHOT</label>
        <div class="file-upload-wrapper">
            <div class="file-upload-box" onclick="document.getElementById('ssFile').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p id="uploadStatusText">Tap to Select Payment Screenshot</p>
            </div>
            <input type="file" id="ssFile" accept="image/*" style="display:none;" onchange="handleFilePreview(event)">
            <img id="ssPreview" class="preview-img" alt="Screenshot Preview">
        </div>

        <button class="deposit" id="depositButton" onclick="submitDeposit()">Deposit</button>
    </section>
</div>
</main>

<!-- BOTTOM NAV CONTAINER -->
<div id="nav-container"></div>

<!-- EXTERNAL COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
history.pushState({ page: 1 }, "", "");
window.addEventListener("popstate", function (event) {
    window.location.href = "deposit.html";
});

function toggleMenu() {
    const drawer = document.getElementById("sideDrawer");
    const overlay = document.getElementById("drawerOverlay");
    if(drawer) drawer.classList.toggle("active");
    if(overlay) overlay.classList.toggle("active");
}

function handleFilePreview(e) {
    const file = e.target.files[0];
    if (file) {
        document.getElementById("uploadStatusText").textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const preview = document.getElementById("ssPreview");
            preview.src = evt.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || 
                localStorage.getItem("rdxVerifiedMobile") || 
                localStorage.getItem("rdxUserMobile") || 
                localStorage.getItem("rdxMobile") ||
                localStorage.getItem("userMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

let cachedUserName = "";
let cachedUserMobile = "";
let unsubscribeWallet = null;

const urlParams = new URLSearchParams(window.location.search);
const amt = urlParams.get('amount') || localStorage.getItem("rdxDepositAmount") || 100;
document.getElementById("amount").value = amt;

async function loadSettings() {
    try {
        const snap = await getDoc(doc(db, "paymentSettings", "config"));
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById("upiText").textContent = d.upiId || "rdxpayment@upi";
            if (d.qrCodeUrl) document.getElementById("qrImage").src = d.qrCodeUrl;
        }

        if (userId) {
            let docId = userId.length === 10 ? "91" + userId : userId;
            let userDocRef = doc(db, "customers", docId);
            let userSnap = await getDoc(userDocRef);

            if (!userSnap.exists()) {
                docId = userId;
                userDocRef = doc(db, "customers", docId);
            }

            if(unsubscribeWallet) unsubscribeWallet();

            unsubscribeWallet = onSnapshot(userDocRef, (snapDoc) => {
                if (snapDoc.exists()) {
                    const uData = snapDoc.data();
                    cachedUserName = uData.name || uData.fullName || uData.username || localStorage.getItem("rdxUsername") || ("User " + userId.slice(-4));
                    cachedUserMobile = "+" + userId;
                    
                    const nameEls = document.querySelectorAll("#drawerName");
                    const mobileEls = document.querySelectorAll("#drawerMobile");
                    
                    nameEls.forEach(el => el.textContent = cachedUserName);
                    mobileEls.forEach(el => el.textContent = cachedUserMobile);
                }
            }, (err) => console.error("Realtime Balance Sync Error:", err));
        }
    } catch(e){ console.error("Setting load error:", e); }
}

window.copyUPI = () => {
    navigator.clipboard.writeText(document.getElementById("upiText").textContent);
    alert("UPI ID Copied!");
};

function processImageToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;
                const MAX_WIDTH = 800;
                
                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", 0.6));
            };
            img.onerror = (err) => reject(err);
            img.src = event.target.result;
        };
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
    });
}

window.submitDeposit = async () => {
    const utr = document.getElementById("utr").value.trim();
    const fileInput = document.getElementById("ssFile");
    const file = fileInput.files[0];

    if(utr.length < 6) return alert("Kripya valid UTR number bharein");
    if(!file) return alert("Kripya payment ka Screenshot (SS) upload karein");
    
    const btn = document.getElementById("depositButton");
    btn.disabled = true;
    btn.textContent = "Checking UTR...";

    try {
        const q = query(collection(db, "deposits"), where("utr", "==", utr));
        const duplicateSnap = await getDocs(q);

        if (!duplicateSnap.empty) {
            btn.disabled = false;
            btn.textContent = "Deposit";
            alert("⚠️ Yeh UTR number pehle se submit kiya ja chuka hai!");
            return;
        }

        btn.textContent = "Processing Screenshot...";
        const screenshotData = await processImageToBase64(file);

        btn.textContent = "Submitting...";
        await addDoc(collection(db, "deposits"), {
            uid: userId || "N/A",
            userId: userId || "N/A",
            userName: cachedUserName || "User " + (userId ? userId.slice(-4) : "Guest"),
            userMobile: cachedUserMobile || (userId ? "+" + userId : "N/A"),
            amount: Number(document.getElementById("amount").value),
            utr: utr,
            screenshotUrl: screenshotData,
            status: "pending",
            createdAt: serverTimestamp()
        });

        alert("✅ Deposit Request successfully submit ho gayi!");
        window.location.replace("history.html");

    } catch(err) {
        console.error("Submit Error:", err);
        alert("Error: " + (err.message || "Something went wrong"));
        btn.disabled = false;
        btn.textContent = "Deposit";
    }
};

loadSettings();
</script>
</body>
</html>
