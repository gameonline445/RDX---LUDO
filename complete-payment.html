<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RDX LUDO - Complete Payment</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f8faff;
    color:#101a38;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    height:100dvh;
    display:flex;
    flex-direction:column;
}

.top{
    height:72px;
    flex:none;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:linear-gradient(110deg,#edf4ff,#fff);
    border-bottom:1px solid #ccd8ed;
}

.menu{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:linear-gradient(145deg,#ff846e,#ff715e);
    color:#fff;
    font-size:27px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff;
    border:4px solid #dce6fb;
    color:#2362d9;
    font-size:12px;
    font-weight:900;
}

.spacer{
    flex:1;
}

.topicon{
    width:43px;
    height:43px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:20px;
}

.bell{
    background:#7368ef;
    color:#fff;
}

.cash{
    background:#35bf71;
    color:#fff;
}

.gift{
    background:#ff933c;
    color:#fff;
}

main{
    flex:1;
    min-height:0;
    padding:10px 12px 6px;
    overflow:auto;
    display:flex;
    align-items:flex-start;
}

.wrap{
    width:100%;
    max-width:560px;
    margin:auto;
}

.kicker{
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    color:#3566c8;
    margin-bottom:4px;
}

h1{
    font-size:28px;
    line-height:1.02;
    margin-bottom:3px;
}

.welcome{
    font-size:13px;
    color:#7a879f;
    margin-bottom:8px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:7px;
}

.tab{
    height:43px;
    border:1px solid #cbd7e9;
    border-radius:15px;
    background:#eef1f6;
    color:#748097;
    font-weight:800;
}

.tab.active{
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    border-color:#2864e6;
}

.paybox{
    border:1.5px solid #bdd0f0;
    border-radius:20px;
    padding:9px 11px 11px;
    background:linear-gradient(135deg,#f0f5ff,#fff);
    box-shadow:0 10px 25px #4275d31a;
}

.range{
    text-align:center;
    color:#818ba0;
    font-size:12px;
    margin-bottom:6px;
}

.qr{
    display:flex;
    justify-content:center;
}

.qr img{
    width:155px;
    height:155px;
    border-radius:16px;
    object-fit:contain;
    background:#fff;
    padding:5px;
    border:1px solid #d7dff0;
}

.upi{
    text-align:center;
    font-size:16px;
    font-weight:850;
    margin:6px 0;
    word-break:break-all;
}

.copy{
    display:block;
    margin:auto;
    border:0;
    border-radius:23px;
    padding:8px 22px;
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    font-weight:850;
    box-shadow:0 7px 16px #326fe533;
}

.account-box{
    margin-top:8px;
    border:1px solid #d1ddef;
    border-radius:16px;
    padding:10px;
    background:#fff;
}

.account-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid #edf0f6;
    font-size:13px;
}

.account-row:last-child{
    border-bottom:0;
}

.account-label{
    color:#748097;
    font-weight:700;
}

.account-value{
    text-align:right;
    font-weight:850;
    word-break:break-all;
}

.coin-info{
    margin-top:8px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.info-box{
    background:#eef5ff;
    border:1px solid #d0def7;
    border-radius:13px;
    padding:8px;
    text-align:center;
}

.info-box small{
    display:block;
    color:#748097;
    font-size:11px;
}

.info-box strong{
    display:block;
    color:#2864e6;
    margin-top:3px;
    font-size:14px;
}

.form{
    margin-top:7px;
    border:1.5px solid #c3d2ec;
    border-radius:18px;
    padding:9px;
    background:linear-gradient(135deg,#f4f7ff,#fff);
}

label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#6b7891;
    margin-bottom:7px;
    letter-spacing:.5px;
}

input{
    width:100%;
    height:46px;
    border:1px solid #d2dceb;
    border-radius:15px;
    background:#f8f9fc;
    padding:0 14px;
    font-size:16px;
    outline:none;
    margin-bottom:10px;
}

input:focus{
    border-color:#4a7cf0;
    background:#fff;
}

.form input{
    margin-bottom:7px;
}

.amount-readonly{
    color:#68758c;
}

.deposit{
    width:100%;
    height:48px;
    border:0;
    border-radius:29px;
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#fff;
    font-weight:900;
    font-size:18px;
}

.deposit:disabled{
    opacity:.6;
}

.status{
    display:none;
    margin-top:9px;
    padding:10px;
    border-radius:12px;
    text-align:center;
    font-weight:800;
    font-size:13px;
}

.status.show{
    display:block;
    background:#fff4d9;
    color:#9a6a00;
    border:1px solid #efd795;
}

.firebase-status{
    margin-bottom:8px;
    padding:8px 10px;
    border-radius:11px;
    font-size:11px;
    text-align:center;
    font-weight:700;
}

.firebase-loading{
    background:#eef5ff;
    color:#3566c8;
}

.firebase-ok{
    background:#dcf8e9;
    color:#13834d;
}

.firebase-error{
    background:#ffe3e7;
    color:#c72e43;
}

.bottom{
    height:64px;
    flex:none;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#fff;
    border-top:1px solid #d5deed;
}

.nav{
    border:0;
    background:#fff;
    color:#6d7890;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:12px;
}

.nav b{
    font-size:21px;
}

.nav.active{
    color:#18213a;
    font-weight:900;
}

.toast{
    position:fixed;
    top:82px;
    left:50%;
    transform:translate(-50%,-10px);
    opacity:0;
    background:#182440;
    color:#fff;
    padding:10px 15px;
    border-radius:12px;
    font-size:13px;
    transition:.2s;
    pointer-events:none;
    z-index:100;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:380px){

    .qr img{
        width:145px;
        height:145px;
    }

    h1{
        font-size:26px;
    }

    .tab{
        height:41px;
    }

    .form{
        padding:8px;
    }

    .deposit{
        height:46px;
    }
}

@media(max-height:720px){

    .top{
        height:58px;
    }

    .bottom{
        height:58px;
    }

    main{
        padding-top:6px;
    }

    .kicker{
        font-size:11px;
    }

    .welcome{
        margin-bottom:5px;
    }

    .tabs{
        margin-bottom:5px;
    }

    .paybox{
        padding:6px 9px 8px;
    }

    .qr img{
        width:125px;
        height:125px;
    }

    .upi{
        font-size:14px;
        margin:4px 0;
    }

    .copy{
        padding:6px 18px;
    }

    .form{
        margin-top:5px;
        padding:7px;
    }

    input{
        height:40px;
    }

    .deposit{
        height:42px;
    }
}

@media(min-height:721px) and (max-height:850px){

    .qr img{
        width:145px;
        height:145px;
    }

    .paybox{
        padding:8px 10px 10px;
    }

    .form{
        padding:8px;
    }

    input{
        height:44px;
    }

    .deposit{
        height:46px;
    }
}
</style>
</head>

<body>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   YOUR FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

    authDomain:
    "rdx-ludo.firebaseapp.com",

    projectId:
    "rdx-ludo",

    storageBucket:
    "rdx-ludo.firebasestorage.app",

    messagingSenderId:
    "928340814840",

    appId:
    "1:928340814840:web:6eca42a8b76138b268440d"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =====================================================
   FIRESTORE PATH

   paymentSettings
        └── config
===================================================== */

const paymentSettingsRef =
doc(
    db,
    "paymentSettings",
    "config"
);


/* =====================================================
   CURRENT PAYMENT SETTINGS
===================================================== */

let paymentSettings = {

    upiId:"",
    accountHolderName:"",
    accountNumber:"",
    ifsc:"",
    qrCodeUrl:"",
    coinRate:1,
    minimumDeposit:100

};


/* =====================================================
   URL / LOCAL AMOUNT
===================================================== */

const params =
new URLSearchParams(
    location.search
);

const savedAmount =
localStorage.getItem(
    "rdxSelectedDepositAmount"
) || "100";

let amount =
params.get("amount") ||
savedAmount ||
"100";


amount =
Number(amount) || 100;


/* =====================================================
   SET AMOUNT
===================================================== */

document.getElementById(
    "selectedAmount"
).textContent =
amount;

document.getElementById(
    "amount"
).value =
amount;


/* =====================================================
   TOAST
===================================================== */

function toast(message){

    const box =
    document.getElementById(
        "toast"
    );

    box.textContent =
    message;

    box.classList.add(
        "show"
    );

    setTimeout(
        () =>
        box.classList.remove(
            "show"
        ),
        1800
    );

}


/* =====================================================
   FIREBASE STATUS
===================================================== */

function firebaseStatus(
    message,
    type
){

    const box =
    document.getElementById(
        "firebaseStatus"
    );

    box.textContent =
    message;

    box.className =
    "firebase-status " +
    (
        type === "error"
        ? "firebase-error"
        :
        type === "ok"
        ? "firebase-ok"
        :
        "firebase-loading"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   LOAD PAYMENT SETTINGS FROM FIREBASE
===================================================== */

async function loadPaymentSettings(){

    try{

        firebaseStatus(
            "Firebase से latest payment details load हो रही हैं...",
            "loading"
        );


        const snapshot =
        await getDoc(
            paymentSettingsRef
        );


        if(
            !snapshot.exists()
        ){

            firebaseStatus(
                "paymentSettings/config Firebase में नहीं मिला.",
                "error"
            );

            document.getElementById(
                "upiText"
            ).textContent =
            "UPI details unavailable";

            return;

        }


        const data =
        snapshot.data();


        paymentSettings = {

            upiId:
            String(
                data.upiId || ""
            ),

            accountHolderName:
            String(
                data.accountHolderName || ""
            ),

            accountNumber:
            String(
                data.accountNumber || ""
            ),

            ifsc:
            String(
                data.ifsc || ""
            ),

            qrCodeUrl:
            String(
                data.qrCodeUrl || ""
            ),

            coinRate:
            Number(
                data.coinRate ?? 1
            ),

            minimumDeposit:
            Number(
                data.minimumDeposit ?? 100
            )

        };


        /* UPI */

        document.getElementById(
            "upiText"
        ).textContent =
        paymentSettings.upiId ||
        "UPI not configured";


        /* Account Holder */

        document.getElementById(
            "accountHolder"
        ).textContent =
        paymentSettings.accountHolderName ||
        "—";


        /* Account Number */

        document.getElementById(
            "accountNumber"
        ).textContent =
        paymentSettings.accountNumber ||
        "—";


        /* IFSC */

        document.getElementById(
            "ifsc"
        ).textContent =
        paymentSettings.ifsc ||
        "—";


        /* Coin Rate */

        document.getElementById(
            "coinRate"
        ).textContent =
        paymentSettings.coinRate;


        /* Minimum Deposit */

        document.getElementById(
            "minimumDeposit"
        ).textContent =
        paymentSettings.minimumDeposit;


        /* QR CODE */

        const qr =
        document.getElementById(
            "qrImage"
        );


        if(
            paymentSettings.qrCodeUrl
        ){

            qr.src =
            paymentSettings.qrCodeUrl;

        }else{

            qr.removeAttribute(
                "src"
            );

            qr.alt =
            "QR Code not configured";

        }


        /* Minimum deposit check */

        if(
            amount <
            paymentSettings.minimumDeposit
        ){

            firebaseStatus(
                "Minimum deposit ₹" +
                paymentSettings.minimumDeposit +
                " है.",
                "loading"
            );

        }else{

            firebaseStatus(
                "✅ Latest payment details loaded.",
                "ok"
            );

        }


    }catch(error){

        console.error(
            "Firebase error:",
            error
        );


        firebaseStatus(
            "❌ Firebase error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   COPY UPI
===================================================== */

window.copyUPI =
function(){

    const upi =
    paymentSettings.upiId;


    if(!upi){

        toast(
            "UPI ID उपलब्ध नहीं है"
        );

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
        .writeText(upi)
        .then(
            () =>
            toast(
                "UPI ID copied"
            )
        )
        .catch(
            () =>
            toast(
                "UPI ID: " + upi
            )
        );

    }else{

        toast(
            "UPI ID: " + upi
        );

    }

};


/* =====================================================
   ACCOUNT TRANSFER
===================================================== */

window.showAccountTransfer =
function(){

    if(
        !paymentSettings.accountNumber
    ){

        toast(
            "Bank details अभी उपलब्ध नहीं हैं"
        );

        return;

    }


    alert(
        "Account Holder: " +
        paymentSettings.accountHolderName +

        "\n\nAccount Number: " +
        paymentSettings.accountNumber +

        "\n\nIFSC: " +
        paymentSettings.ifsc
    );

};


/* =====================================================
   SUBMIT DEPOSIT
===================================================== */

window.submitDeposit =
function(){

    const utr =
    document.getElementById(
        "utr"
    ).value.trim();


    if(
        amount <
        paymentSettings.minimumDeposit
    ){

        toast(
            "Minimum deposit ₹" +
            paymentSettings.minimumDeposit +
            " है"
        );

        return;

    }


    if(
        utr.length < 6
    ){

        toast(
            "Please enter a valid UTR number"
        );

        return;

    }


    const data = {

        amount:
        Number(amount),

        utr:
        utr,

        status:
        "Pending",

        createdAt:
        new Date().toISOString(),

        upiId:
        paymentSettings.upiId

    };


    /*
      यह अभी उसी पुराने frontend flow की तरह
      localStorage में request रखता है।
      Admin approval के लिए deposit को Firestore
      में डालने वाला backend/user-auth flow
      अलग से जोड़ना होगा।
    */

    localStorage.setItem(
        "rdxLastDeposit",
        JSON.stringify(data)
    );


    document.getElementById(
        "status"
    ).classList.add(
        "show"
    );


    toast(
        "Deposit submitted"
    );

};


/* =====================================================
   START
===================================================== */

loadPaymentSettings();

</script>

</body>
