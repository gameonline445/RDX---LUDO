<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RDX LUDO - Complete Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f8faff;
  color:#101a38;
}

button,input{
  font:inherit;
}

.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

.top{
  height:72px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:linear-gradient(110deg,#edf4ff,#fff);
  border-bottom:1px solid #ccd8ed;
}

.menu{
  width:45px;
  height:45px;
  border:0;
  border-radius:15px;
  background:linear-gradient(145deg,#ff846e,#ff715e);
  color:#fff;
  font-size:27px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#fff;
  border:4px solid #dce6fb;
  color:#2362d9;
  font-size:12px;
  font-weight:900;
}

.spacer{
  flex:1;
}

.topicon{
  width:43px;
  height:43px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:20px;
}

.bell{
  background:#7368ef;
  color:#fff;
}

.cash{
  background:#35bf71;
  color:#fff;
}

.gift{
  background:#ff933c;
  color:#fff;
}

main{
  flex:1;
  padding:12px;
  overflow:auto;
}

.wrap{
  width:100%;
  max-width:560px;
  margin:auto;
}

.kicker{
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
  color:#3566c8;
  margin-bottom:4px;
}

h1{
  font-size:28px;
  line-height:1.05;
  margin-bottom:4px;
}

.welcome{
  font-size:13px;
  color:#7a879f;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:8px;
}

.tab{
  height:43px;
  border:1px solid #cbd7e9;
  border-radius:15px;
  background:#eef1f6;
  color:#748097;
  font-weight:800;
}

.tab.active{
  background:linear-gradient(100deg,#2864e6,#3e7bf0);
  color:#fff;
  border-color:#2864e6;
}

.paybox{
  border:1.5px solid #bdd0f0;
  border-radius:20px;
  padding:12px;
  background:linear-gradient(135deg,#f0f5ff,#fff);
  box-shadow:0 10px 25px #4275d31a;
}

.range{
  text-align:center;
  color:#818ba0;
  font-size:13px;
  margin-bottom:8px;
}

.qr{
  display:flex;
  justify-content:center;
}

.qr img{
  width:170px;
  height:170px;
  border-radius:16px;
  object-fit:contain;
  background:#fff;
  padding:5px;
  border:1px solid #d7dff0;
}

.upi{
  text-align:center;
  font-size:17px;
  font-weight:850;
  margin:8px 0;
  word-break:break-all;
}

.copy{
  display:block;
  margin:auto;
  border:0;
  border-radius:23px;
  padding:9px 22px;
  background:linear-gradient(100deg,#2864e6,#3e7bf0);
  color:#fff;
  font-weight:850;
  box-shadow:0 7px 16px #326fe533;
}

.details{
  margin-top:8px;
  border:1.5px solid #c3d2ec;
  border-radius:18px;
  padding:11px;
  background:linear-gradient(135deg,#f4f7ff,#fff);
}

.detail{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 3px;
  border-bottom:1px solid #e1e7f2;
  font-size:14px;
}

.detail:last-child{
  border-bottom:0;
}

.detail span:first-child{
  color:#6b7891;
  font-weight:700;
}

.detail span:last-child{
  text-align:right;
  font-weight:800;
  word-break:break-all;
}

.testbox{
  margin-top:8px;
  border:1.5px solid #c3d2ec;
  border-radius:18px;
  padding:11px;
  background:#fff;
}

.testbox label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#6b7891;
  margin-bottom:7px;
}

input{
  width:100%;
  height:46px;
  border:1px solid #d2dceb;
  border-radius:15px;
  background:#f8f9fc;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#4a7cf0;
  background:#fff;
}

.testbutton{
  width:100%;
  height:46px;
  margin-top:8px;
  border:0;
  border-radius:25px;
  background:#e9eef8;
  color:#40516f;
  font-weight:800;
}

.status{
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-weight:800;
  font-size:13px;
  background:#eef5ff;
  color:#3566c8;
  border:1px solid #cbdaf4;
}

.bottom{
  height:64px;
  flex:none;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border-top:1px solid #d5deed;
}

.nav{
  border:0;
  background:#fff;
  color:#6d7890;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:12px;
}

.nav b{
  font-size:21px;
}

.nav.active{
  color:#18213a;
  font-weight:900;
}

.toast{
  position:fixed;
  top:82px;
  left:50%;
  transform:translate(-50%,-10px);
  opacity:0;
  background:#182440;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  font-size:13px;
  transition:.2s;
  pointer-events:none;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.loading{
  text-align:center;
  padding:12px;
  color:#66748e;
  font-size:13px;
}

.error{
  display:none;
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  background:#fff0f0;
  color:#b42318;
  border:1px solid #f2c5c5;
  font-size:13px;
  text-align:center;
  font-weight:700;
}

@media(max-width:380px){
  .qr img{
    width:145px;
    height:145px;
  }

  h1{
    font-size:26px;
  }

  .tab{
    height:41px;
  }
}

@media(max-height:720px){
  .top{
    height:58px;
  }

  .bottom{
    height:58px;
  }

  .qr img{
    width:125px;
    height:125px;
  }

  .paybox{
    padding:8px;
  }

  .details,
  .testbox{
    padding:8px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<button class="menu" onclick="location.href='deposit.html'">
☰
</button>

<div class="logo">
RDX
</div>

<div class="spacer"></div>

<div class="topicon bell">🔔</div>
<div class="topicon cash">💵</div>
<div class="topicon gift">🎁</div>

</header>


<main>

<div class="wrap">

<div class="kicker">
DEPOSIT
</div>

<h1>
Complete Payment
</h1>

<div class="welcome">
Welcome RDX LUDO
</div>


<div class="tabs">

<button class="tab active">
UPI Details
</button>

<button class="tab" onclick="showAccount()">
Account Transfer
</button>

</div>


<section class="paybox">

<div class="range">
Selected Amount · ₹<span id="selectedAmount">100</span>
</div>


<div class="loading" id="loading">
Firebase settings load ho rahi hain...
</div>


<div class="qr">
<img
id="qrImage"
src="qr-code.png"
alt="UPI QR Code"
>
</div>


<div class="upi" id="upiText">
Loading...
</div>


<button class="copy" onclick="copyUPI()">
Copy UPI ID
</button>

</section>


<section class="details">

<div class="detail">
<span>Account Holder</span>
<span id="holderName">—</span>
</div>

<div class="detail">
<span>Bank Account</span>
<span id="accountNumber">—</span>
</div>

<div class="detail">
<span>IFSC</span>
<span id="ifsc">—</span>
</div>

<div class="detail">
<span>Coin Rate</span>
<span id="coinRate">—</span>
</div>

<div class="detail">
<span>Minimum Deposit</span>
<span id="minimumDeposit">—</span>
</div>

</section>


<section class="testbox">

<label>
TEST AMOUNT
</label>

<input
id="amount"
type="number"
readonly
value="100"
>

<button
class="testbutton"
onclick="testSettings()"
>
Test Firebase Settings
</button>

<div
class="status"
id="status"
>
Firebase settings test ke liye button dabayein.
</div>

<div
class="error"
id="error"
></div>

</section>

</div>

</main>


<nav class="bottom">

<button
class="nav"
onclick="location.href='dashboard.html'"
>
<b>🏠</b>
Home
</button>

<button class="nav active">
<b>💰</b>
Wallet
</button>

<button
class="nav"
onclick="location.href='support.html'"
>
<b>🎧</b>
Support
</button>

<button
class="nav"
onclick="location.href='profile.html'"
>
<b>👤</b>
Profile
</button>

</nav>

</div>


<div
class="toast"
id="toast"
></div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================================================
   IMPORTANT:
   YAHAN APNE admin.html WALA EXACT firebaseConfig PASTE KARO
   ========================================================= */

const firebaseConfig = {

  apiKey: "PASTE_YOUR_API_KEY",

  authDomain: "PASTE_YOUR_AUTH_DOMAIN",

  projectId: "PASTE_YOUR_PROJECT_ID",

  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

  appId: "PASTE_YOUR_APP_ID"

};


/* Firebase start */

let db = null;

try {

  firebase.initializeApp(firebaseConfig);

  db = firebase.firestore();

} catch(error) {

  console.error(error);

  showError(
    "Firebase initialize nahi hua. Firebase Config check karein."
  );

}


/* URL / selected amount */

const params =
new URLSearchParams(location.search);

const savedAmount =
localStorage.getItem(
  "rdxSelectedDepositAmount"
) || "100";

const selectedAmount =
params.get("amount") || savedAmount;


document.getElementById(
  "selectedAmount"
).textContent = selectedAmount;


document.getElementById(
  "amount"
).value = selectedAmount;


/* Current UPI */

let currentUPI = "";


/* Toast */

function toast(text){

  const x =
  document.getElementById("toast");

  x.textContent = text;

  x.classList.add("show");

  setTimeout(
    () => x.classList.remove("show"),
    1800
  );

}


/* Error */

function showError(text){

  const box =
  document.getElementById("error");

  box.textContent = text;

  box.style.display = "block";

}


/* Hide error */

function hideError(){

  document.getElementById(
    "error"
  ).style.display = "none";

}


/* =========================================================
   FIREBASE PAYMENT SETTINGS
   Reads:
   paymentSettings/config
   ========================================================= */

async function loadPaymentSettings(){

  if(!db){

    showError(
      "Firebase database available nahi hai."
    );

    return;
  }


  hideError();


  try{

    const snapshot =
    await db
    .collection("paymentSettings")
    .doc("config")
    .get();


    if(!snapshot.exists){

      showError(
        "Firebase me paymentSettings/config document nahi mila."
      );

      document.getElementById(
        "loading"
      ).textContent =
      "Payment settings nahi mili.";

      return;
    }


    const data =
    snapshot.data();


    console.log(
      "Firebase Payment Settings:",
      data
    );


    /* UPI */

    currentUPI =
    data.upiId ||
    data.upi ||
    data.upiID ||
    "UPI ID not set";


    document.getElementById(
      "upiText"
    ).textContent = currentUPI;


    /* Account Holder */

    document.getElementById(
      "holderName"
    ).textContent =
    data.accountHolderName ||
    data.holderName ||
    "—";


    /* Account Number */

    document.getElementById(
      "accountNumber"
    ).textContent =
    data.accountNumber ||
    "—";


    /* IFSC */

    document.getElementById(
      "ifsc"
    ).textContent =
    data.ifsc ||
    "—";


    /* Coin Rate */

    document.getElementById(
      "coinRate"
    ).textContent =
    data.coinRate !== undefined
      ? data.coinRate
      : "—";


    /* Minimum Deposit */

    document.getElementById(
      "minimumDeposit"
    ).textContent =
    data.minimumDeposit !== undefined
      ? "₹" + data.minimumDeposit
      : "—";


    /* QR Code */

    const qrURL =
    data.qrCodeUrl ||
    data.qrURL ||
    data.qrCode ||
    "";


    if(qrURL){

      document.getElementById(
        "qrImage"
      ).src = qrURL;

    }


    document.getElementById(
      "loading"
    ).style.display = "none";


    document.getElementById(
      "status"
    ).textContent =
    "Firebase se latest payment settings load ho gayi.";


  }catch(error){

    console.error(
      "Firebase error:",
      error
    );


    document.getElementById(
      "loading"
    ).textContent =
    "Firebase data load nahi ho paya.";


    showError(
      "Firebase error: " +
      error.message
    );

  }

}


/* Copy UPI */

function copyUPI(){

  if(!currentUPI){

    toast("UPI ID available nahi hai");

    return;
  }


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
    .writeText(currentUPI)
    .then(
      () => toast("UPI ID copied")
    )
    .catch(
      () => toast(currentUPI)
    );

  }else{

    toast(currentUPI);

  }

}


/* Account Transfer */

function showAccount(){

  const holder =
  document.getElementById(
    "holderName"
  ).textContent;

  const account =
  document.getElementById(
    "accountNumber"
  ).textContent;

  const ifsc =
  document.getElementById(
    "ifsc"
  ).textContent;


  alert(
    "Account Holder: " +
    holder +
    "\n\nAccount Number: " +
    account +
    "\n\nIFSC: " +
    ifsc
  );

}


/* Firebase settings test */

async function testSettings(){

  const status =
  document.getElementById(
    "status"
  );


  if(!db){

    status.textContent =
    "Firebase initialize nahi hua.";

    return;
  }


  try{

    const snap =
    await db
    .collection("paymentSettings")
    .doc("config")
    .get();


    if(snap.exists){

      status.textContent =
      "✅ Firebase connection OK — paymentSettings/config mil gaya.";

      toast(
        "Firebase Settings OK"
      );

    }else{

      status.textContent =
      "❌ paymentSettings/config document nahi mila.";

    }


  }catch(error){

    status.textContent =
    "❌ Firebase permission/error: " +
    error.message;

  }

}


/* Page load */

loadPaymentSettings();

</script>

</body>
</html>
