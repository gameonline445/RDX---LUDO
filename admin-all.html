<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDX LUDO - Admin Security & Device Tracker</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#f1f5f9;color:#0f172a;padding:20px;}

.admin-card{
    max-width:800px;
    margin:auto;
    background:#ffffff;
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
    border:1px solid #e2e8f0;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    padding-bottom:12px;
    border-bottom:2px solid #f1f5f9;
}
.header h2{font-size:20px;color:#0284c7;display:flex;align-items:center;gap:10px;}

.status-badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:6px;
}
.status-online{background:#dcfce7;color:#15803d;}
.status-offline{background:#fee2e2;color:#b91c1c;}

.info-table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
.info-table th, .info-table td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #e2e8f0;
    font-size:14px;
}
.info-table th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase;}

.btn-logout{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:8px;
}
.btn-logout:hover{background:#dc2626;}
</style>
</head>

<body>

<div class="admin-card">
    <div class="header">
        <h2><i class="fa-solid fa-user-shield"></i> Admin Security Tracker</h2>
        <span id="adminStatusBadge" class="status-badge status-offline">● Offline</span>
    </div>

    <p style="color:#64748b; font-size:13px;">Active Admin Device & Real-time IP Details:</p>

    <table class="info-table">
        <tr>
            <th>Admin Email 📧</th>
            <td id="adminEmail">Loading...</td>
        </tr>
        <tr>
            <th>Real IP Address 📍</th>
            <td id="adminIp">Detecting...</td>
        </tr>
        <tr>
            <th>Device & Browser 📱</th>
            <td id="adminDevice">Detecting...</td>
        </tr>
        <tr>
            <th>Last Active Time ⏰</th>
            <td id="adminLastActive">-</td>
        </tr>
    </table>

    <button class="btn-logout" onclick="adminLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Admin Logout
    </button>
</div>

<script>
// 1. FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// 2. FETCH REAL IP ADDRESS
async function getRealIp() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip || "Unknown IP";
    } catch (e) {
        console.error("IP Fetch Error:", e);
        return "Unable to detect IP";
    }
}

// 3. TRACK & UPDATE ADMIN SESSION IN FIRESTORE
async function trackAdminSession(user, isOnlineStatus) {
    if (!user) return;

    const realIp = await getRealIp();
    const userAgent = navigator.userAgent;
    const sessionDocRef = db.collection("admin_sessions").doc(user.uid);

    const sessionData = {
        admin_email: user.email || "Admin",
        ip_address: realIp,
        device_info: userAgent,
        is_online: isOnlineStatus,
        last_active: firebase.firestore.FieldValue.serverTimestamp()
    };

    // UI Updates
    document.getElementById("adminEmail").textContent = user.email || "Admin";
    document.getElementById("adminIp").textContent = realIp;
    document.getElementById("adminDevice").textContent = userAgent;

    const badge = document.getElementById("adminStatusBadge");
    if (isOnlineStatus) {
        badge.className = "status-badge status-online";
        badge.textContent = "● Online";
    } else {
        badge.className = "status-badge status-offline";
        badge.textContent = "● Offline";
    }

    // Save/Update in Firestore
    await sessionDocRef.set(sessionData, { merge: true });
}

// 4. AUTH STATE & REAL-TIME HEARTBEAT
auth.onAuthStateChanged((user) => {
    if (user) {
        trackAdminSession(user, true);

        // Realtime Listener for Last Active Time UI
        db.collection("admin_sessions").doc(user.uid).onSnapshot((doc) => {
            if (doc.exists && doc.data().last_active) {
                const date = doc.data().last_active.toDate();
                document.getElementById("adminLastActive").textContent = date.toLocaleString();
            }
        });

        // 5-second Heartbeat
        setInterval(() => {
            if (!document.hidden && auth.currentUser) {
                trackAdminSession(auth.currentUser, true);
            }
        }, 5000);

    } else {
        // Redirect to Login if not logged in
        alert("Please login as admin first!");
        window.location.href = "index.html";
    }
});

// 5. VISIBILITY & OFFLINE DETECTOR
document.addEventListener("visibilitychange", () => {
    if (auth.currentUser) {
        trackAdminSession(auth.currentUser, !document.hidden);
    }
});

// 6. ADMIN LOGOUT FUNCTION
async function adminLogout() {
    if (confirm("Kya aap Admin Panel se Logout karna chahte hain?")) {
        if (auth.currentUser) {
            await trackAdminSession(auth.currentUser, false);
        }
        await auth.signOut();
        window.location.href = "index.html";
    }
}
</script>

</body>
</html>
