<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDX LUDO ADMIN</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase Core & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: #f0f7ff; 
      color: #101a38; 
      overflow: hidden; 
      display: none; 
    }

    /* Top Bar Header */
    .top-header {
      height: 66px;
      background: linear-gradient(110deg, #e0f2fe 0%, #f0f9ff 45%, #ffffff 100%);
      border-bottom: 1.5px solid #bae6fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      position: fixed;
      top: 0; 
      left: 0; 
      right: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.08);
    }
    
    .brand-section { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid #bae6fd;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
      object-fit: cover;
    }
    
    .brand-name { 
      font-size: 18px; 
      font-weight: 850; 
      color: #0c4a6e; 
    }
    
    .logout-btn {
      background: linear-gradient(145deg, #ff7165, #ff8a70);
      color: #ffffff; 
      border: none;
      padding: 8px 18px; 
      border-radius: 20px; 
      font-weight: 700;
      font-size: 13px; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(255, 113, 101, 0.3);
      transition: transform 0.2s;
    }
    
    .logout-btn:active { 
      transform: scale(0.95); 
    }

    /* App Layout */
    .app-container { 
      display: flex; 
      margin-top: 66px; 
      height: calc(100vh - 66px); 
    }

    /* Left Sidebar */
    .sidebar {
      width: 260px; 
      background: #ffffff; 
      padding: 15px 10px;
      border-right: 1.5px solid #bae6fd; 
      overflow-y: auto; 
      flex-shrink: 0;
    }
    
    .menu-list { 
      list-style: none; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }
    
    .menu-item a {
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 10px 14px;
      color: #334155; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 750;
      border-radius: 14px; 
      transition: all 0.2s;
    }
    
    .menu-item a .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* Side menu icons gradient theme */
    .bg-dash { background: linear-gradient(145deg, #6366f1, #8b5cf6); }
    .bg-live { background: linear-gradient(145deg, #ef4444, #dc2626); }
    .bg-battles { background: linear-gradient(145deg, #f59e0b, #d97706); }
    .bg-kyc { background: linear-gradient(145deg, #8b5cf6, #6d28d9); }
    .bg-deposit { background: linear-gradient(145deg, #10b981, #059669); }
    .bg-withdraw { background: linear-gradient(145deg, #ea580c, #c2410c); }
    .bg-history { background: linear-gradient(145deg, #3b82f6, #1d4ed8); }
    .bg-refer { background: linear-gradient(145deg, #ec4899, #be185d); }
    .bg-users { background: linear-gradient(145deg, #06b6d4, #0284c7); }
    .bg-notify { background: linear-gradient(145deg, #6366f1, #4f46e5); }
    .bg-settings { background: linear-gradient(145deg, #64748b, #475569); }

    .menu-item a.active, 
    .menu-item a:hover { 
      background-color: #e0f2fe; 
      color: #0284c7; 
    }

    /* Main Frame Area */
    .main-content { 
      flex: 1; 
      background: #f0f7ff; 
    }
    
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <div class="brand-section">
      <img src="logo.png" alt="RDX Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/42/bae6fd/0284c7?text=RDX'">
      <span class="brand-name">RDX LUDO ADMIN</span>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul class="menu-list">
        <li class="menu-item"><a href="admin-dashboard.html" target="adminFrame" class="active" onclick="setActive(this)"><div class="icon-box bg-dash"><i class="fa-solid fa-house"></i></div> Dashboard</a></li>
        <li class="menu-item"><a href="admin-live-users.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-live"><i class="fa-solid fa-tower-broadcast"></i></div> Live Users Monitor</a></li>
        <li class="menu-item"><a href="admin-battles.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-battles"><i class="fa-solid fa-gamepad"></i></div> Battles Management</a></li>
        <li class="menu-item"><a href="admin-kyc.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-kyc"><i class="fa-solid fa-address-card"></i></div> KYC Requests</a></li>
        <li class="menu-item"><a href="admin-deposits.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-deposit"><i class="fa-solid fa-wallet"></i></div> Deposits</a></li>
        <li class="menu-item"><a href="admin-withdrawals.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-withdraw"><i class="fa-solid fa-money-bill-transfer"></i></div> Withdrawals</a></li>
        <li class="menu-item"><a href="admin-user-history.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-history"><i class="fa-solid fa-receipt"></i></div> User History</a></li>
        <li class="menu-item"><a href="admin-referrals.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-refer"><i class="fa-solid fa-gift"></i></div> Referral Analytics</a></li>
        <li class="menu-item"><a href="admin-customers.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-users"><i class="fa-solid fa-users"></i></div> Customers</a></li>
        <li class="menu-item"><a href="admin-notifications.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-notify"><i class="fa-solid fa-bell"></i></div> Notifications</a></li>
        <li class="menu-item"><a href="admin-payment-settings.html" target="adminFrame" onclick="setActive(this)"><div class="icon-box bg-settings"><i class="fa-solid fa-gear"></i></div> Payment Settings</a></li>
      </ul>
    </aside>

    <!-- Content Area Loading Sub-pages -->
    <main class="main-content">
      <iframe name="adminFrame" src="admin-dashboard.html"></iframe>
    </main>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
      authDomain: "rdx-ludo.firebaseapp.com",
      projectId: "rdx-ludo",
      storageBucket: "rdx-ludo.firebasestorage.app",
      messagingSenderId: "928340814840",
      appId: "1:928340814840:web:6eca42a8b76138b268440d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.replace("admin-login.html");
      } else {
        document.body.style.display = "block";
      }
    });

    function handleLogout() {
      if (confirm("Kya aap logout karna chahte hain?")) {
        auth.signOut().then(() => {
          window.location.replace("admin-login.html");
        });
      }
    }

    function setActive(el) {
      document.querySelectorAll('.menu-item a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
