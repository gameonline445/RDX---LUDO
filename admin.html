<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDX LUDO Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 5% 5%, rgba(18, 24, 38, 0.05), transparent 25%),
                  radial-gradient(circle at 95% 15%, rgba(13, 110, 253, 0.05), transparent 25%),
                  linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
      color: #101a38;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .title {
      font-size: 24px;
      color: #0f172a;
      font-weight: 700;
    }
    .alert-success {
      background-color: #d1fae5;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus {
      border-color: #3b82f6;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    th {
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      background-color: #f8fafc;
    }
    .btn-action {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 4px;
      display: inline-block;
    }
    .btn-approve {
      background-color: #dcfce7;
      color: #15803d;
    }
    .btn-reject {
      background-color: #ffe4e6;
      color: #be123c;
    }
    .btn-ss {
      background-color: #e0f2fe;
      color: #0369a1;
    }
    .status-pending {
      background-color: #fef3c7;
      color: #b45309;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      position: relative;
    }
    .modal-content img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 10px;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header">
      <h2 class="title">Deposit Requests</h2>
    </div>

    <div class="alert-success" id="dashStatus">
      ✓ Deposits loaded.
    </div>

    <input type="text" class="search-box" placeholder="Search by Date, UID, Mobile, UTR, Request ID...">

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Request ID</th>
            <th>Customer UID</th>
            <th>Amount</th>
            <th>UTR</th>
            <th>Status</th>
            <th>Date & Time</th>
            <th>Screenshot</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="depositTable">
          <!-- JS Dynamic Content -->
        </tbody>
      </table>
    </div>
  </div>
  <!-- Screenshot Popup Modal -->
  <div class="modal-overlay" id="ssModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 style="margin-bottom:10px;">Payment Screenshot</h3>
      <img id="modalImage" src="" alt="Payment Screenshot">
    </div>
  </div>

  <script>
    // Sample Data with Screenshot URL
    const depositRequests = [
      {
        id: "NvZ2F7inlPwCjCOL8IBr",
        uid: "917878852370",
        amount: 100,
        utr: "333444333",
        status: "PENDING",
        datetime: "07 Sep 2026 at 08:45 PM",
        screenshotUrl: "https://via.placeholder.com/300x500?text=Payment+SS+1"
      },
      {
        id: "6hF0ghxy2VhQCG5tndrH",
        uid: "917878852370",
        amount: 100,
        utr: "444333444",
        status: "PENDING",
        datetime: "07 Sep 2026 at 08:44 PM",
        screenshotUrl: "https://via.placeholder.com/300x500?text=Payment+SS+2"
      }
    ];

    function renderTable() {
      const tbody = document.getElementById('depositTable');
      if(!tbody) return;
      tbody.innerHTML = '';

      depositRequests.forEach(req => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${req.id}</td>
          <td><strong>${req.uid}</strong></td>
          <td>₹${req.amount}</td>
          <td>${req.utr}</td>
          <td><span class="status-pending">${req.status}</span></td>
          <td>${req.datetime}</td>
          <td>
            <button class="btn-action btn-ss" onclick="viewScreenshot('${req.screenshotUrl}')">View SS</button>
          </td>
          <td>
            <button class="btn-action btn-approve" onclick="approveDeposit('${req.id}', ${req.amount})">Approve</button>
            <button class="btn-action btn-reject" onclick="rejectDeposit('${req.id}')">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    function viewScreenshot(url) {
      if (!url) {
        alert("Screenshot URL available nahi hai!");
        return;
      }
      document.getElementById('modalImage').src = url;
      document.getElementById('ssModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('ssModal').style.display = 'none';
    }

    function approveDeposit(id, amount) {
      if (confirm(`₹${amount} approve karke customer wallet me add karein?`)) {
        alert("Deposit Approved Successfully!");
      }
    }

    function rejectDeposit(id) {
      if (confirm("Kya aap es deposit request ko reject karna chahte hain?")) {
        alert("Deposit Rejected!");
      }
    }

    // Table render initialization
    renderTable();
  </script>
</body>
</html>
