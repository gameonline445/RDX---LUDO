<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDX LUDO ADMIN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; background: #000; color: #333; }
    .sidebar { width: 250px; height: 100vh; background: #fff; padding: 20px; position: fixed; }
    .sidebar h2 { color: #1a2b4c; font-size: 18px; margin-bottom: 25px; }
    .sidebar ul { list-style: none; }
    .sidebar ul li a { display: block; padding: 10px; color: #555; text-decoration: none; border-radius: 6px; margin-bottom: 5px; }
    .sidebar ul li a.active { background: #e8f0fe; color: #1a73e8; font-weight: bold; }
    .main-content { margin-left: 250px; flex: 1; padding: 20px; background: #0d1b2a; min-height: 100vh; }
    iframe { width: 100%; height: calc(100vh - 40px); border: none; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>RDX LUDO ADMIN</h2>
    <ul>
      <li><a href="admin-dashboard.html" target="adminFrame" class="active" onclick="setActive(this)">Dashboard</a></li>
      <li><a href="admin-live-users.html" target="adminFrame" onclick="setActive(this)">Live Users Monitor</a></li>
      <li><a href="admin-kyc.html" target="adminFrame" onclick="setActive(this)">KYC Requests</a></li>
      <li><a href="admin-deposits.html" target="adminFrame" onclick="setActive(this)">Deposits</a></li>
      <li><a href="admin-withdrawals.html" target="adminFrame" onclick="setActive(this)">Withdrawals</a></li>
    </ul>
  </div>

  <div class="main-content">
    <iframe name="adminFrame" src="admin-dashboard.html"></iframe>
  </div>

  <script>
    function setActive(element) {
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
