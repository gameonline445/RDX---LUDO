<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #0d1b2a; color: #fff; padding: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; color: #333; margin-top: 15px; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f4f6f9; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

  <h2>Live Users Monitor</h2>

  <table>
    <thead>
      <tr>
        <th>User ID</th>
        <th>Name</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="userTable">
      <tr><td colspan="3">Loading active users...</td></tr>
    </tbody>
  </table>

  <script>
    // Include same Firebase Config here
    const db = firebase.database();

    db.ref('active_users').on('value', (snapshot) => {
      const tableBody = document.getElementById('userTable');
      tableBody.innerHTML = '';
      snapshot.forEach(child => {
        const user = child.val();
        tableBody.innerHTML += `<tr>
          <td>${child.key}</td>
          <td>${user.name || 'N/A'}</td>
          <td style="color: green; font-weight: bold;">${user.status || 'Online'}</td>
        </tr>`;
      });
    });
  </script>
</body>
</html>
