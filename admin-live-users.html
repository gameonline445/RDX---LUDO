<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Users Monitor</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.15) 0%, transparent 35%),
                  radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.12) 0%, transparent 32%),
                  linear-gradient(180deg, #f0f7ff 0%, #ffffff 50%, #eaf4ff 100%);
      color: #101a38;
      padding: 24px 20px;
      min-height: 100vh;
    }

    .page-title {
      font-size: 24px;
      font-weight: 850;
      color: #0c4a6e;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title i {
      color: #ef4444;
    }

    .table-card {
      background: #ffffff;
      border: 1.5px solid #bae6fd;
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #e0f2fe;
      color: #0c4a6e;
      font-size: 13px;
      font-weight: 800;
      padding: 14px 18px;
      border-bottom: 1px solid #bae6fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 18px;
      font-size: 14px;
      border-bottom: 1px solid #f0f9ff;
      color: #334155;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .badge-online {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .badge-playing {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .badge-offline {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1 class="page-title"><i class="fa-solid fa-tower-broadcast"></i> Live Users Monitor</h1>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>User ID / Phone</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="3" class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Firebase se Live Data connect ho raha hai...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Aapke Firebase Config Keys
    const firebaseConfig = {
      apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
      authDomain: "rdx-ludo.firebaseapp.com",
      projectId: "rdx-ludo",
      storageBucket: "rdx-ludo.firebasestorage.app",
      messagingSenderId: "928340814840",
      appId: "1:928340814840:web:6eca42a8b76138b268440d",
      databaseURL: "https://rdx-ludo-default-rtdb.firebaseio.com" // Live Realtime DB Path
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Firebase Database se Realtime Data Fetch karna
    const usersRef = db.ref('users'); // Firebase me 'users' path se fetch karega

    usersRef.on('value', (snapshot) => {
      const tableBody = document.getElementById('usersTableBody');
      tableBody.innerHTML = '';

      if (snapshot.exists()) {
        const usersData = snapshot.val();
        let hasUsers = false;

        Object.keys(usersData).forEach((key) => {
          hasUsers = true;
          const user = usersData[key];

          const userId = user.phone || user.uid || key;
          const userName = user.name || user.displayName || 'Unnamed User';
          const userStatus = user.status || (user.isOnline ? 'Online' : 'Offline');

          let badgeClass = 'badge-offline';
          if (userStatus.toLowerCase().includes('match') || userStatus.toLowerCase().includes('playing')) {
            badgeClass = 'badge-playing';
          } else if (userStatus.toLowerCase().includes('online')) {
            badgeClass = 'badge-online';
          }

          const rowHTML = `
            <tr>
              <td>${userId}</td>
              <td>${userName}</td>
              <td><span class="badge ${badgeClass}">${userStatus}</span></td>
            </tr>
          `;
          tableBody.innerHTML += rowHTML;
        });

        if (!hasUsers) {
          tableBody.innerHTML = '<tr><td colspan="3" class="no-data">Koi live user mil nahi raha.</td></tr>';
        }
      } else {
        tableBody.innerHTML = '<tr><td colspan="3" class="no-data">Database me filhaal koi user register nahi hai.</td></tr>';
      }
    }, (error) => {
      console.error("Data Fetch Error:", error);
      document.getElementById('usersTableBody').innerHTML = `<tr><td colspan="3" class="no-data" style="color:red;">Firebase Read Error: ${error.message}</td></tr>`;
    });
  </script>

</body>
</html>
