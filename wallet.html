<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);

button{font:inherit;}

/* HEADER */
.top-header{position:fixed;top:0;left:0;right:0;width:100%;height:66px;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:#ffffff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(255,96,80,.22);cursor:pointer;}
.logo{width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1.5px solid #bae6fd;background:#ffffff;box-shadow:0 4px 12px rgba(2,132,199,0.15);cursor:pointer;}
.logo img{width:100%;height:100%;object-fit:cover;}
.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{height:38px;border:0;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:white;box-shadow:0 4px 12px rgba(0,0,0,.10);padding:0 12px;gap:5px;}
.notification{width:38px;padding:0;border-radius:50%;background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);font-size:13px;font-weight:800;}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);font-size:13px;font-weight:800;}

/* CONTAINER */
.container{position:fixed;top:66px;left:0;right:0;bottom:74px;width:100%;max-width:650px;margin:0 auto;padding:14px 14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.wallet-card{width:100%;border:1.5px solid #7dd3fc;border-radius:22px;padding:18px 20px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);box-shadow:0 8px 22px rgba(2,132,199,0.10);}
.wallet-top-row{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wallet-title{display:inline-flex;align-items:center;gap:6px;color:#0284c7;border:1px solid #7dd3fc;background:#ffffff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:850;}
.history-btn{border:1px solid #bae6fd;background:#ffffff;color:#0c4a6e;padding:6px 14px;border-radius:20px;font-weight:750;font-size:12px;cursor:pointer;}
.balance-label{color:#64748b;font-size:14px;margin-bottom:2px;}
.balance{color:#0c4a6e;font-size:42px;line-height:1;font-weight:900;letter-spacing:-1.5px;}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.action-btn{height:48px;border-radius:24px;font-size:15px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.add-btn{color:#ffffff;border:0;background:linear-gradient(100deg,#0284c7,#0369a1);box-shadow:0 6px 16px rgba(2,132,199,.3);}
.withdraw-btn{color:#0c4a6e;border:1.5px solid #7dd3fc;background:#ffffff;}

.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.balance-box{border:1.5px solid #bae6fd;border-radius:18px;background:#ffffff;padding:14px;box-shadow:0 4px 12px rgba(2,132,199,0.05);}
.balance-icon{width:36px;height:36px;border-radius:12px;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0284c7;}
.balance-box h3{margin-top:8px;font-size:13px;color:#64748b;font-weight:800;}
.balance-value{margin-top:3px;font-size:20px;font-weight:900;color:#0f172a;}
.balance-note{display:block;margin-top:3px;color:#94a3b8;font-size:11px;}

.info-box{border:1px solid #bae6fd;border-radius:16px;background:rgba(255,255,255,.9);padding:12px 14px;display:flex;align-items:center;gap:10px;color:#64748b;font-size:12px;line-height:1.4;}
.info-icon{width:24px;height:24px;flex:0 0 24px;border:1.5px solid #0284c7;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0284c7;font-size:12px;font-weight:800;}

/* SIDE MENU */
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);z-index:2000;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-100%;width:75%;max-width:360px;height:100dvh;background:#ffffff;z-index:2100;padding:20px 16px 100px;overflow-y:auto;transition:left .3s ease;box-shadow:10px 0 35px rgba(0,0,0,.16);}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e2e8f0;}
.menu-brand{display:flex;align-items:center;gap:10px;}
.menu-logo{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #7dd3fc;display:flex;align-items:center;justify-content:center;background:#ffffff;cursor:pointer;}
.menu-logo img{width:100%;height:100%;object-fit:cover;}
.menu-user h2{font-size:17px;font-weight:850;}
.menu-user p{margin-top:2px;color:#64748b;font-size:12px;}
.close-menu{border:0;background:#f1f5f9;width:38px;height:38px;border-radius:50%;font-size:22px;color:#64748b;cursor:pointer;}
.menu-list{margin-top:16px;}
.menu-item{width:100%;min-height:52px;border:0;background:transparent;padding:6px 0;border-radius:14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;text-align:left;color:#334155;cursor:pointer;}
.menu-item-icon{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-item-text{flex:1;font-size:15px;font-weight:750;}
.menu-arrow{color:#94a3b8;font-size:20px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}

.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#10b981;}
</style>
</head>

<body>

<header class="top-header">

</nav>

<script>
async function loadFirebaseCustomer(){
    try{
        if(!firebaseDB) return;
        
        // Sabhi possible local storage keys se user identifier dhoondhein
        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if(!mobile) {
            // Agar storage mein nahi hai, toh URL parameters ya default check karein
            console.log("User mobile not found in localStorage.");
            return;
        }

        const cleanMobile = String(mobile).replace(/\D/g,"");
        let firebaseDocId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

        const userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        const snapshot = await userRef.get();
        
        if(!snapshot.exists) {
            // Agar bina prefix ke ho toh try karein
            const altRef = firebaseDB.collection("customers").doc(cleanMobile);
            const altSnap = await altRef.get();
            if(!altSnap.exists) return;
            processCustomerData(altSnap.data(), cleanMobile);
            return;
        }

        processCustomerData(snapshot.data(), firebaseDocId);
    } catch(error){ console.error("Wallet Load Error:", error); }
}

function processCustomerData(data, docId) {
    const balance = Number(data.balance || 0);
    // Winnings / Winning Balance fetch karein
    const winnings = Number(data.winnings || data.winningBalance || 0);
    // Deposit Balance fetch karein (agar field na ho toh balance - winnings)
    const deposit = Number(data.depositBalance || data.deposit || Math.max(0, balance - winnings));

    document.getElementById("mainBalance").textContent = balance;
    document.getElementById("topBalance").textContent = balance;
    document.getElementById("depositBalance").textContent = deposit;
    document.getElementById("winningBalance").textContent = winnings;

    let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || ("User " + String(docId).slice(-4));
    document.getElementById("menuUsername").textContent = fullName.split(" ")[0];
}

window.addEventListener("load", loadFirebaseCustomer);

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }
function goHome(){ closeMenu(); window.location.href = "./dashboard.html"; }
function goWallet(){ closeMenu(); window.location.href = "./wallet.html"; }
function goDeposit(){ closeMenu(); window.location.href = "./deposit.html"; }
function goWithdraw(){ closeMenu(); window.location.href = "./withdraw.html"; }
function goProfile(){ closeMenu(); window.location.href = "./profile.html"; }
function goSupport(){ closeMenu(); window.location.href = "./support.html"; }
function goRedeem(){ closeMenu(); window.location.href = "./referral.html"; }
function goHistory(){ closeMenu(); window.location.href = "./history.html"; }
function goNotifications(){ closeMenu(); window.location.href = "./notification.html"; }
</script>
