/* =====================================================
   LOAD FIREBASE CUSTOMER
===================================================== */

async function loadFirebaseCustomer(){

    try{

        if(!firebaseDB){

            showMessage(
                "Firebase connect नहीं है"
            );

            return;

        }


        let mobile =
            localStorage.getItem(
                "rdxFirebaseUserId"
            );


        if(!mobile){

            mobile =
                localStorage.getItem(
                    "rdxVerifiedMobile"
                );

        }


        if(!mobile){

            showMessage(
                "User login information नहीं मिली"
            );

            return;

        }


        const cleanMobile =

            String(mobile)
            .replace(/\D/g,"");


        if(
            !/^91[6-9]\d{9}$/.test(
                cleanMobile
            )
        ){

            console.error(
                "Invalid mobile:",
                cleanMobile
            );

            return;

        }


        const userRef =

            firebaseDB
            .collection("customers")
            .doc(cleanMobile);


        const snapshot =

            await userRef.get();


        if(!snapshot.exists){

            console.log(
                "Customer document not found"
            );

            return;

        }


        const data =
            snapshot.data();


        /* TOTAL BALANCE */

        const balance =

            Number(
                data.balance || 0
            );


        document.getElementById(
            "mainBalance"
        ).textContent =
            balance;


        document.getElementById(
            "topBalance"
        ).textContent =
            balance;


        /* DEPOSIT */

        const deposit =

            Number(
                data.depositBalance ||
                data.deposit ||
                0
            );


        document.getElementById(
            "depositBalance"
        ).textContent =
            deposit;


        /* WINNINGS */

        const winnings =

            Number(
                data.winnings ||
                data.winningBalance ||
                0
            );


        document.getElementById(
            "winningBalance"
        ).textContent =
            winnings;


        /* USERNAME */

        const username =

            localStorage.getItem(
                "rdxUsername"
            ) ||

            "User" +
            cleanMobile.slice(-4);


        document.getElementById(
            "menuUsername"
        ).textContent =
            username;


        console.log(
            "Wallet data loaded:",
            data
        );

    }

    catch(error){

        console.error(
            "Wallet Firebase error:",
            error
        );

        showMessage(
            "Wallet data load नहीं हो पाया"
        );

    }

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        loadFirebaseCustomer();

    }
);
