<!-- COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
let unsubscribeWalletListener = null;

// SAFE NAVIGATION FUNCTION
function navigateTo(page) {
    if (typeof toggleMenu === "function") {
        const drawer = document.getElementById("sideDrawer");
        if (drawer && drawer.classList.contains("active")) {
            toggleMenu();
        }
    }
    if(window.location.pathname.endsWith(page)) return;
    window.location.assign(page);
}

// REALTIME LISTENER FOR DYNAMIC BALANCE UPDATE
async function loadFirebaseCustomer(){
    try {
        if(!firebaseDB) return;

        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if(!mobile) {
            window.location.replace("index.html");
            return;
        }

        const cleanMobile = String(mobile).replace(/\D/g,"");
        const mobile10Digits = cleanMobile.slice(-10);
        const docIdWith91 = "+91" + mobile10Digits;
        const docIdWithPlain91 = "91" + mobile10Digits;

        // Document Reference Check Priority
        let userRef = firebaseDB.collection("customers").doc(docIdWithPlain91);
        let snapshot = await userRef.get();

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc(docIdWith91);
            snapshot = await userRef.get();
        }
        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc(mobile10Digits);
            snapshot = await userRef.get();
        }
        if(!snapshot.exists) {
            userRef = firebaseDB.collection("users").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(unsubscribeWalletListener) unsubscribeWalletListener();

        // PURE REALTIME SNAPSHOT UPDATE
        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc && doc.exists) {
                const data = doc.data();
                
                const deposit = Number(data.depositBalance || data.deposit || data.wallet || 0);
                const winnings = Number(data.winnings || data.winningBalance || 0);
                
                // Live UI DOM updates
                const mainBal = document.getElementById("mainBalance");
                const depBal = document.getElementById("depositBalance");
                const winBal = document.getElementById("winningBalance");
                
                if (mainBal) mainBal.textContent = deposit + winnings;
                if (depBal) depBal.textContent = deposit;
                if (winBal) winBal.textContent = winnings;

                let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || "User";
                
                const drawerNameElem = document.getElementById("drawerName");
                const drawerMobileElem = document.getElementById("drawerMobile");
                
                if(drawerNameElem) drawerNameElem.textContent = fullName;
                if(drawerMobileElem) drawerMobileElem.textContent = "+" + mobile10Digits;
            }
        }, (err) => {
            console.error("Snapshot error:", err);
        });

    } catch(error) { 
        console.error("Wallet Error:", error); 
    }
}

window.addEventListener("load", loadFirebaseCustomer);
</script>
