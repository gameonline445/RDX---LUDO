<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RDX LUDO - Wallet</title>

<!-- FontAwesome & Firebase SDKs -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

let firebaseDB = null;
try {
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firebaseDB = firebase.firestore();
} catch(error){ console.error("Firebase Init Error:", error); }
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #101a38;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    -webkit-touch-callout: none;
}

button{font:inherit;}
button:active, .action-btn:active, .menu-item:active, .nav-item:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
}

.container{
    position: absolute;
    top: 66px;
    bottom: 74px;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 14px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.wallet-card{width:100%;border:1.5px solid #7dd3fc;border-radius:22px;padding:18px 20px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);box-shadow:0 8px 22px rgba(2,132,199,0.10);}
.wallet-top-row{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wallet-title{display:inline-flex;align-items:center;gap:6px;color:#0284c7;border:1px solid #7dd3fc;background:#ffffff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:850;}
.history-btn{border:1px solid #bae6fd;background:#ffffff;color:#0c4a6e;padding:6px 14px;border-radius:20px;font-weight:750;font-size:12px;cursor:pointer;}
.balance-label{color:#64748b;font-size:14px;margin-bottom:2px;}
.balance{color:#0c4a6e;font-size:42px;line-height:1;font-weight:900;letter-spacing:-1.5px;}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.action-btn{height:48px;border-radius:24px;font-size:15px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.add-btn{color:#ffffff;border:0;background:linear-gradient(100deg,#0284c7,#0369a1);box-shadow:0 6px 16px rgba(2,132,199,.3);}
.withdraw-btn{color:#0c4a6e;border:1.5px solid #7dd3fc;background:#ffffff;}

.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.balance-box{border:1.5px solid #bae6fd;border-radius:18px;background:#ffffff;padding:14px;box-shadow:0 4px 12px rgba(2,132,199,0.05);}
.balance-icon{width:36px;height:36px;border-radius:12px;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0284c7;}
.balance-box h3{margin-top:8px;font-size:13px;color:#64748b;font-weight:800;}
.balance-value{margin-top:3px;font-size:20px;font-weight:900;color:#0f172a;}
.balance-note{display:block;margin-top:3px;color:#94a3b8;font-size:11px;}

.claim-box {
    margin-top: 10px;
    background: #e0f2fe;
    border: 1px solid #7dd3fc;
    padding: 12px;
    border-radius: 14px;
    text-align: center;
}
.claim-btn {
    background: #16a34a;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(22,163,74,0.3);
}
</style>
</head>

<body>

<main class="container" id="scrollContainer">
    <section class="wallet-card">
        <div class="wallet-top-row">
            <div class="wallet-title"><i class="fa-solid fa-wallet"></i> MY WALLET</div>
            <button class="history-btn" onclick="navigateTo('history.html')"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
        </div>
        <div class="balance-label">Total Balance</div>
        <div class="balance">₹<span id="mainBalance">0</span></div>
        <div class="wallet-actions">
            <button class="action-btn add-btn" onclick="navigateTo('deposit.html')">＋ Add Cash</button>
            <button class="action-btn withdraw-btn" onclick="navigateTo('withdraw.html')"><i class="fa-solid fa-arrow-up-from-bracket"></i> Withdraw</button>
        </div>
    </section>

    <!-- Check & Claim Approved Deposits Button -->
    <div class="claim-box">
        <p style="font-size: 13px; color: #0369a1; margin-bottom: 8px; font-weight: 700;">Admin approved payment not showing?</p>
        <button class="claim-btn" onclick="checkAndClaimDeposits()"><i class="fa-solid fa-rotate-right"></i> Check & Update Balance</button>
    </div>

    <section class="balance-grid">
        <div class="balance-box">
            <div class="balance-icon"><i class="fa-solid fa-wallet"></i></div>
            <h3>DEPOSIT</h3>
            <div class="balance-value">₹<span id="depositBalance">0</span></div>
            <span class="balance-note">For battles only</span>
        </div>
        <div class="balance-box">
            <div class="balance-icon"><i class="fa-solid fa-trophy"></i></div>
            <h3>WINNINGS</h3>
            <div class="balance-value">₹<span id="winningBalance">0</span></div>
            <span class="balance-note">Can withdraw</span>
        </div>
    </section>
</main>

<script>
let unsubscribeWalletListener = null;

function navigateTo(page) {
    if(window.location.pathname.endsWith(page)) return;
    window.location.assign(page);
}

function getValidatedMobile() {
    let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                 localStorage.getItem("rdxVerifiedMobile") || 
                 localStorage.getItem("rdxUserMobile") || 
                 localStorage.getItem("rdxMobile") ||
                 localStorage.getItem("userMobile");
    if(!mobile) return null;
    const cleanMobile = String(mobile).replace(/\D/g,"");
    return cleanMobile.slice(-10);
}

async function loadFirebaseCustomer(){
    try {
        if(!firebaseDB) return;
        const mobile10Digits = getValidatedMobile();

        if(!mobile10Digits) {
            window.location.replace("index.html");
            return;
        }

        const docIdWithPlain91 = "91" + mobile10Digits;
        let userRef = firebaseDB.collection("customers").doc(docIdWithPlain91);
        let snapshot = await userRef.get();

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc("+91" + mobile10Digits);
            snapshot = await userRef.get();
        }
        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(unsubscribeWalletListener) unsubscribeWalletListener();

        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc && doc.exists) {
                const data = doc.data();
                const totalWallet = Number(data.balance || data.depositBalance || 0);
                const deposit = Number(data.depositBalance || data.balance || 0);
                const winnings = Number(data.winningBalance || data.winnings || 0);
                
                document.getElementById("mainBalance").textContent = totalWallet;
                document.getElementById("depositBalance").textContent = deposit;
                document.getElementById("winningBalance").textContent = winnings;
            }
        });
    } catch(error) { 
        console.error("Wallet Error:", error); 
    }
}

// FIX: Check approved deposits and update wallet automatically
async function checkAndClaimDeposits() {
    try {
        const mobile10Digits = getValidatedMobile();
        if(!mobile10Digits) return;

        alert("Checking approved payments...");

        // Deposits collection mein check karein jahan user ka mobile match ho aur status approved ho
        const depositsRef = firebaseDB.collection("deposits");
        const query = depositsRef.where("userId", "==", mobile10Digits);
        const snapshot = await query.get();

        let addedAmount = 0;
        const batch = firebaseDB.batch();

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            // Check karein ki status approved hai ya nahi, aur kya yeh wallet mein update ho chuka hai ya nahi
            if ((data.status === "approved" || data.status === "Success" || data.status === "success") && !data.isWalletUpdated) {
                addedAmount += Number(data.amount || 0);
                
                // Mark this deposit as updated so it won't be added twice
                batch.update(docSnap.ref, { isWalletUpdated: true });
            }
        });

        if (addedAmount > 0) {
            const userRef = firebaseDB.collection("customers").doc("91" + mobile10Digits);
            
            // Customer balance me amount plus karein
            batch.update(userRef, {
                balance: firebase.firestore.FieldValue.increment(addedAmount),
                depositBalance: firebase.firestore.FieldValue.increment(addedAmount)
            });

            await batch.commit();
            alert(`Success! ₹${addedAmount} added to your wallet.`);
        } else {
            alert("No new approved deposits found to claim.");
        }
    } catch (e) {
        console.error("Claim error:", e);
        alert("Error updating balance. Please try again.");
    }
}

window.addEventListener("load", loadFirebaseCustomer);
</script>
</body>
</html>
