<script>
// HISTORY / POPSTATE MANAGEMENT
(function() {
    window.history.pushState({ page: "wallet" }, "", window.location.href);
    window.addEventListener("popstate", function() {
        const panel = document.getElementById("menuPanel");
        if (panel && panel.classList.contains("open")) {
            closeMenu();
            window.history.pushState({ page: "wallet" }, "", window.location.href);
        } else {
            window.location.href = "dashboard.html";
        }
    });
})();

// TOUCH & PULL TO REFRESH SYSTEM
let startY = 0;
let currentY = 0;
let isPulling = false;
let isRefreshing = false;

const scrollContainer = document.getElementById("scrollContainer");
const pullIndicator = document.getElementById("pullIndicator");
const pullIcon = document.getElementById("pullIcon");
const pullText = document.getElementById("pullText");

scrollContainer.addEventListener("touchstart", (e) => {
    if (scrollContainer.scrollTop === 0 && !isRefreshing) {
        startY = e.touches[0].pageY;
        isPulling = true;
    }
}, { passive: true });

scrollContainer.addEventListener("touchmove", (e) => {
    if (!isPulling || isRefreshing) return;
    currentY = e.touches[0].pageY;
    let distance = currentY - startY;

    if (distance > 0 && scrollContainer.scrollTop === 0) {
        if (distance > 60) {
            pullIndicator.classList.add("visible");
            pullText.textContent = "Release to refresh";
            pullIcon.style.transform = "rotate(180deg)";
        } else {
            pullIndicator.classList.add("visible");
            pullText.textContent = "Pull down to refresh";
            pullIcon.style.transform = "rotate(0deg)";
        }
    }
}, { passive: true });

scrollContainer.addEventListener("touchend", async () => {
    if (!isPulling || isRefreshing) return;
    let distance = currentY - startY;
    isPulling = false;

    if (distance > 60 && scrollContainer.scrollTop === 0) {
        executeRefresh();
    } else {
        resetPullIndicator();
    }
});

async function executeRefresh() {
    isRefreshing = true;
    pullIndicator.classList.add("visible", "refreshing");
    pullText.textContent = "Refreshing...";
    
    // Refresh Firebase Customer Data
    await loadFirebaseCustomer();
    
    setTimeout(() => {
        resetPullIndicator();
        isRefreshing = false;
    }, 600);
}

function resetPullIndicator() {
    pullIndicator.classList.remove("visible", "refreshing");
    pullIcon.style.transform = "rotate(0deg)";
    pullText.textContent = "Pull down to refresh";
}

let unsubscribeWalletListener = null;
let unsubscribeDepositsListener = null;

async function loadFirebaseCustomer(){
    try {
        if(!firebaseDB) return;

        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if(!mobile) {
            window.location.replace("index.html");
            return;
        }

        const cleanMobile = String(mobile).replace(/\D/g,"");
        const mobile10Digits = cleanMobile.slice(-10);
        const docIdWith91 = "91" + mobile10Digits;

        // Fetch User Document Reference
        let userRef = firebaseDB.collection("customers").doc(docIdWith91);
        let snapshot = await userRef.get();

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("users").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("users").doc(docIdWith91);
            snapshot = await userRef.get();
        }

        if(!snapshot.exists) {
            const querySnap = await firebaseDB.collection("customers")
                .where("mobile", "in", [mobile10Digits, "+" + mobile10Digits, "+91" + mobile10Digits, docIdWith91])
                .limit(1)
                .get();
                
            if(!querySnap.empty) {
                userRef = querySnap.docs[0].ref;
            } else {
                const queryUsers = await firebaseDB.collection("users")
                    .where("mobile", "in", [mobile10Digits, "+" + mobile10Digits, "+91" + mobile10Digits, docIdWith91])
                    .limit(1)
                    .get();
                if(!queryUsers.empty) userRef = queryUsers.docs[0].ref;
            }
        }

        // Unsubscribe old listener if exists
        if(unsubscribeWalletListener) unsubscribeWalletListener();

        // 1. REAL-TIME USER BALANCE LISTENER
        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc && doc.exists) {
                const data = doc.data();
                
                const deposit = Number(data.depositBalance || data.deposit || data.wallet || 0);
                const winnings = Number(data.winnings || data.winningBalance || 0);
                let total = deposit + winnings;

                document.getElementById("mainBalance").textContent = total;
                document.getElementById("depositBalance").textContent = deposit;
                document.getElementById("winningBalance").textContent = winnings;

                let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || "User";
                if(document.getElementById("menuUsername")) {
                    document.getElementById("menuUsername").textContent = fullName.split(" ")[0];
                }
            }
        }, (error) => {
            console.error("Wallet Sync Error:", error);
        });

        // 2. STRICT AUTO-SYNC DEPOSITS TO USER WALLET
        if(unsubscribeDepositsListener) unsubscribeDepositsListener();

        unsubscribeDepositsListener = firebaseDB.collection("deposits")
            .where("uid", "in", [mobile10Digits, docIdWith91, cleanMobile])
            .onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" || change.type === "modified") {
                        const depData = change.doc.data();
                        const status = (depData.status || "").toLowerCase();

                        // ONLY add if status is approved/success and NOT autoSynced yet
                        if ((status === "approved" || status === "success") && !depData.autoSynced) {
                            const depAmount = Number(depData.amount || 0);
                            if (depAmount > 0) {
                                userRef.set({
                                    depositBalance: firebase.firestore.FieldValue.increment(depAmount)
                                }, { merge: true }).then(() => {
                                    change.doc.ref.update({ autoSynced: true });
                                }).catch(e => console.error("AutoSync Error:", e));
                            }
                        }
                    }
                });
            }, (err) => {
                console.warn("Deposits Sync Error:", err);
            });

    } catch(error) { 
        console.error("Wallet Error:", error); 
    }
}
