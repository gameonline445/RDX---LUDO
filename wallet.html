<script>
let unsubscribeWalletListener = null;
let previousDataHash = "";

// SAFE NAVIGATION FUNCTION (Chrome me page crash nahi hone dega)
function navigateTo(page) {
    closeMenu();
    if(window.location.pathname.endsWith(page)) return;
    window.location.assign(page);
}

// FIREBASE REALTIME LISTENER WITH SAFE CHROME RELOAD
async function loadFirebaseCustomer(){
    try {
        if(!firebaseDB) return;

        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile") || 
                     localStorage.getItem("rdxMobile") ||
                     localStorage.getItem("userMobile");

        if(!mobile) {
            window.location.replace("index.html");
            return;
        }

        const cleanMobile = String(mobile).replace(/\D/g,"");
        const mobile10Digits = cleanMobile.slice(-10);
        const docIdWith91 = "91" + mobile10Digits;

        let userRef = firebaseDB.collection("customers").doc(docIdWith91);
        let snapshot = await userRef.get();

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("customers").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(!snapshot.exists) {
            userRef = firebaseDB.collection("users").doc(mobile10Digits);
            snapshot = await userRef.get();
        }

        if(unsubscribeWalletListener) unsubscribeWalletListener();

        // REALTIME LISTENER
        unsubscribeWalletListener = userRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const currentDataHash = JSON.stringify(data);

                if (previousDataHash === "") {
                    // First time load
                    previousDataHash = currentDataHash;
                    
                    const deposit = Number(data.depositBalance || data.deposit || data.wallet || 0);
                    const winnings = Number(data.winnings || data.winningBalance || 0);
                    
                    document.getElementById("mainBalance").textContent = deposit + winnings;
                    document.getElementById("depositBalance").textContent = deposit;
                    document.getElementById("winningBalance").textContent = winnings;

                    let fullName = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || "User";
                    if(document.getElementById("menuUsername")) {
                        document.getElementById("menuUsername").textContent = fullName.split(" ")[0];
                    }
                } else if (previousDataHash !== currentDataHash) {
                    // DATA CHANGED -> SAFE RELOAD WITH TIMEOUT TO PREVENT BLANK SCREEN IN CHROME
                    setTimeout(() => {
                        window.location.href = window.location.href;
                    }, 300);
                }
            }
        });

    } catch(error) { 
        console.error("Wallet Error:", error); 
    }
}

window.addEventListener("load", loadFirebaseCustomer);

// SIDE DRAWER CONTROLS
function openMenu(){ 
    document.getElementById("menuPanel").classList.add("open"); 
    document.getElementById("menuOverlay").classList.add("show");
}
function closeMenu(){ 
    document.getElementById("menuPanel").classList.remove("open"); 
    document.getElementById("menuOverlay").classList.remove("show");
}
</script>
