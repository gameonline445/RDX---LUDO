<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Notifications</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
    // Authentication Security Check
    if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
        window.location.replace("index.html");
    }

    // Mobile Back Button Trap
    (function() {
        window.history.pushState({ page: "notification" }, "", window.location.href);
        window.addEventListener("popstate", function() {
            const panel = document.getElementById("sideDrawer");
            if (panel && panel.classList.contains("active")) {
                toggleMenu();
                window.history.pushState({ page: "notification" }, "", window.location.href);
            } else {
                window.location.href = "dashboard.html";
            }
        });
    })();
    </script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
        body{
            background:
                radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
                radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
            color:#101a38;
            min-height:100vh;
            padding-bottom:95px;
        }
        button{font:inherit;}

        /* MAIN CONTAINER */
        .container{width:100%;max-width:650px;margin:auto;padding:0 14px;}
        .page-heading{padding:18px 4px 12px;display:flex;justify-content:space-between;align-items:center;}
        .page-heading h2{font-size:20px;font-weight:900;color:#0c4a6e;}

        .notif-card{
            background:#ffffff;
            border-radius:20px;
            padding:16px;
            margin-bottom:12px;
            border:1.5px solid #bae6fd;
            display:flex;
            flex-direction:column;
            gap:6px;
            box-shadow:0 4px 14px rgba(2,132,199,0.06);
        }
        .notif-header{display:flex;justify-content:space-between;align-items:center;}
        .notif-title{color:#0284c7;font-size:15px;font-weight:800;}
        .notif-time{font-size:11px;color:#94a3b8;font-weight:600;}
        .notif-body{font-size:13px;color:#475569;line-height:1.4;font-weight:600;}

        /* BOTTOM NAV BAR (EXACT 4 ITEMS LIKE DASHBOARD) */
        .bottom-nav{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:76px;
            background:rgba(255,255,255,0.96);
            backdrop-filter:blur(12px);
            border-top:1.5px solid #e2e8f0;
            display:flex;
            justify-content:space-around;
            align-items:center;
            z-index:200;
            box-shadow:0 -5px 25px rgba(2,132,199,0.06);
        }
        .nav-item{
            width:25%;
            height:100%;
            border:0;
            background:transparent;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:5px;
            color:#64748b;
            font-size:12px;
            font-weight:700;
            cursor:pointer;
        }
        .nav-icon-box{
            width:44px;
            height:44px;
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:19px;
            color:#ffffff;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }
        .icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
        .icon-wallet{background:linear-gradient(145deg,#10b981,#059669);}
        .icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
        .icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
        .nav-item.active{color:#101a38;font-weight:900;}
    </style>
</head>
<body>

<!-- COMPONENTS.JS LOAD CONTAINERS -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main class="container">
    <div class="page-heading">
        <h2>Notifications</h2>
    </div>

    <section id="notif-list">
        <div style="text-align:center;padding:40px;color:#64748b;font-weight:700;">Notifications load ho rahe hain...</div>
    </section>
</main>

<!-- BOTTOM NAV BAR (4 ITEMS) -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')">
        <div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div>
        <span>Home</span>
    </button>
    <button class="nav-item" onclick="window.location.replace('wallet.html')">
        <div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div>
        <span>Wallet</span>
    </button>
    <button class="nav-item" onclick="window.location.replace('support.html')">
        <div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div>
        <span>Support</span>
    </button>
    <button class="nav-item" onclick="window.location.replace('profile.html')">
        <div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div>
        <span>Profile</span>
    </button>
</nav>

<!-- EXTERNAL COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
function toggleMenu() {
    const drawer = document.getElementById("sideDrawer");
    const overlay = document.getElementById("drawerOverlay");
    if(drawer) drawer.classList.toggle("active");
    if(overlay) overlay.classList.toggle("active");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let userSnapshotUnsubscribe = null;

// Fetch Live User Profile
function listenUserData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const userRef = doc(db, "customers", docId);
        userSnapshotUnsubscribe = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                const userName = d.name || ("User " + userId.slice(-4));
                
                const nameEls = document.querySelectorAll("#drawerName");
                const mobileEls = document.querySelectorAll("#drawerMobile");
                
                nameEls.forEach(el => el.textContent = userName);
                mobileEls.forEach(el => el.textContent = "+" + userId);
            }
        });
    } catch(err) {
        console.error("Error loading user profile:", err);
    }
}

// Realtime Listener for Notifications
function listenNotifs() {
    const notifRef = collection(db, "notifications");
    onSnapshot(notifRef, (snap) => {
        let list = [];
        snap.forEach(d => {
            const data = d.data();
            const targetStr = String(data.target || "").toLowerCase();
            const notifUid = String(data.uid || "").replace(/\D/g, "");

            if(targetStr === 'all' || targetStr === '' || notifUid === "" || notifUid.includes(userId) || userId.includes(notifUid)) {
                list.push(data);
            }
        });

        list.sort((a, b) => {
            const tA = a.timestamp || a.createdAt || 0;
            const tB = b.timestamp || b.createdAt || 0;
            return tB - tA;
        });

        const container = document.getElementById("notif-list");
        if(!container) return;

        if(!list.length) { 
            container.innerHTML = "<div style='text-align:center;padding:40px;color:#64748b;font-weight:700;'>Koi notification nahi hai.</div>"; 
            return; 
        }

        container.innerHTML = list.map(n => {
            let timeStr = "";
            if (n.createdAt) {
                const dateVal = n.createdAt.toDate ? n.createdAt.toDate() : new Date(n.createdAt);
                timeStr = dateVal.toLocaleDateString("en-IN", { day:'numeric', month:'short' });
            } else if (n.timestamp) {
                const dateVal = new Date(n.timestamp);
                timeStr = dateVal.toLocaleDateString("en-IN", { day:'numeric', month:'short' });
            }
            return `
                <div class="notif-card">
                    <div class="notif-header">
                        <span class="notif-title">${n.title || 'Notification'}</span>
                        ${timeStr ? `<span class="notif-time">${timeStr}</span>` : ''}
                    </div>
                    <div class="notif-body">${n.message || ''}</div>
                </div>
            `;
        }).join("");
    }, (e) => {
        console.error("Error loading notifications:", e);
        const container = document.getElementById("notif-list");
        if(container) {
            container.innerHTML = "<div style='text-align:center;padding:40px;color:#ef4444;font-weight:700;'>Notifications load karne mein error aayi.</div>";
        }
    });
}

window.logout = async () => {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        try {
            await setDoc(doc(db, "customers", docId), { isOnline: false }, { merge: true });
        } catch(e) { console.error(e); }
    }
    if (userSnapshotUnsubscribe) userSnapshotUnsubscribe();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
};

listenUserData();
listenNotifs();
</script>

</body>
</html>
