<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Notifications</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
    // Authentication Security Check
    if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
        window.location.replace("index.html");
    }

    // Mobile Back Button Trap
    (function() {
        window.history.pushState({ page: "notification" }, "", window.location.href);
        window.addEventListener("popstate", function() {
            const panel = document.getElementById("sideDrawer");
            if (panel && panel.classList.contains("active")) {
                toggleMenu();
                window.history.pushState({ page: "notification" }, "", window.location.href);
            } else {
                window.location.href = "dashboard.html";
            }
        });
    })();
    </script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
        body{background:linear-gradient(180deg,#f8faff 0%,#eef4ff 50%,#f1f5f9 100%);color:#101a38;min-height:100vh;padding-bottom:95px;}
        button{font:inherit;}

        /* UNIFIED TOP HEADER */
        .top-header{
            height:66px;
            background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
            border-bottom:1.5px solid #bae6fd;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 14px;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 4px 18px rgba(2,132,199,0.08);
        }
        .header-left{display:flex;align-items:center;gap:10px;}
        .menu-btn{
            width:42px;
            height:42px;
            border:0;
            border-radius:14px;
            background:linear-gradient(145deg,#ff7165,#ff8a70);
            color:white;
            font-size:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(255,113,101,0.25);
        }
        .menu-btn:active{transform:scale(0.95);}

        .logo{
            width:46px;
            height:46px;
            border-radius:50%;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            border:1.5px solid #bae6fd;
            background:#ffffff;
            box-shadow:0 4px 12px rgba(2,132,199,0.15);
        }
        .logo img{width:100%;height:100%;object-fit:cover;}

        .header-right{display:flex;align-items:center;gap:8px;}
        .header-icon{
            height:38px;
            border:0;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:15px;
            color:white;
            cursor:pointer;
            padding:0 12px;
            gap:6px;
            font-weight:800;
        }
        .notification{
            width:38px;
            padding:0;
            border-radius:50%;
            background:linear-gradient(145deg,#6366f1,#818cf8);
        }
        .wallet-top{
            background:linear-gradient(145deg,#16a34a,#22c55e);
            box-shadow:0 3px 10px rgba(22,163,74,0.2);
        }
        .redeem-top{
            width:38px;
            padding:0;
            border-radius:50%;
            background:linear-gradient(145deg,#ea580c,#f97316);
        }

        /* SIDE DRAWER */
        .drawer-overlay{
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.45);
            backdrop-filter:blur(4px);
            z-index:999;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.25s ease;
        }
        .drawer-overlay.active{opacity:1;pointer-events:auto;}
        .drawer{
            position:fixed;
            top:0;
            left:0;
            width:280px;
            height:100%;
            background:#ffffff;
            z-index:1000;
            box-shadow:4px 0 25px rgba(2,132,199,0.15);
            transform:translateX(-100%);
            transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
            display:flex;
            flex-direction:column;
        }
        .drawer.active{transform:translateX(0);}
        .drawer-header{
            padding:20px 16px;
            background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
            border-bottom:1.5px solid #bae6fd;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .drawer-user{display:flex;align-items:center;gap:10px;}
        .drawer-avatar{
            width:46px;
            height:46px;
            border-radius:50%;
            overflow:hidden;
            background:#ffffff;
            border:1.5px solid #bae6fd;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .drawer-avatar img{width:100%;height:100%;object-fit:cover;}
        .drawer-close{
            width:34px;
            height:34px;
            border-radius:50%;
            border:1.5px solid #bae6fd;
            background:#ffffff;
            color:#0c4a6e;
            font-size:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        .drawer-links{flex:1;overflow-y:auto;padding:12px;}
        .drawer-item{
            width:100%;
            padding:10px 14px;
            border:0;
            border-radius:14px;
            background:transparent;
            display:flex;
            align-items:center;
            gap:12px;
            font-size:14px;
            font-weight:750;
            color:#334155;
            cursor:pointer;
            margin-bottom:6px;
        }
        .drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
        .drawer-item-icon{
            width:36px;
            height:36px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:16px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }
        .menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
        .menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
        .menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
        .menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
        .menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
        .menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
        .menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
        .menu-logout{background:linear-gradient(145deg,#ef4444,#dc2626);margin-top:10px;}

        /* MAIN CONTAINER */
        .container{width:100%;max-width:650px;margin:auto;padding:0 14px;}
        .page-heading{padding:18px 4px 12px;display:flex;justify-content:space-between;align-items:center;}
        .page-heading h2{font-size:20px;font-weight:900;color:#0c4a6e;}

        .notif-card{
            background:#ffffff;
            border-radius:20px;
            padding:16px;
            margin-bottom:12px;
            border:1.5px solid #bae6fd;
            display:flex;
            flex-direction:column;
            gap:6px;
            box-shadow:0 4px 14px rgba(2,132,199,0.06);
            transition:transform 0.15s ease;
        }
        .notif-card:active{transform:scale(0.99);}
        .notif-header{display:flex;justify-content:space-between;align-items:center;}
        .notif-title{color:#0284c7;font-size:15px;font-weight:800;}
        .notif-time{font-size:11px;color:#94a3b8;font-weight:600;}
        .notif-body{font-size:13px;color:#475569;line-height:1.4;font-weight:600;}

        /* BOTTOM NAV */
        .bottom-nav{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:74px;
            background:rgba(255,255,255,0.96);
            backdrop-filter:blur(12px);
            border-top:1.5px solid #e2e8f0;
            display:flex;
            justify-content:space-around;
            align-items:center;
            z-index:200;
            box-shadow:0 -5px 25px rgba(2,132,199,0.06);
        }
        .nav-item{
            width:25%;
            height:100%;
            border:0;
            background:transparent;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:4px;
            color:#64748b;
            font-size:11px;
            font-weight:700;
            cursor:pointer;
            position:relative;
        }
        .nav-icon-box{
            width:42px;
            height:42px;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            color:#ffffff;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }
        .nav-item:active .nav-icon-box{transform:scale(0.92);}
        .icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
        .icon-wallet{background:linear-gradient(145deg,#10b981,#059669);}
        .icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
        .icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
        .nav-item.active{color:#101a38;font-weight:800;}
        .nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#0284c7;}
    </style>
</head>
<body>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
<div class="drawer" id="sideDrawer">
    <div class="drawer-header">
        <div class="drawer-user">
            <div class="drawer-avatar">
                <img src="logo.png" alt="RDX Logo" onerror="this.style.display='none'">
            </div>
            <div>
                <h4 style="font-size:14px; font-weight:900; color:#0c4a6e;" id="drawerName">User</h4>
                <small style="color:#64748b; font-weight:700;" id="drawerMobile">+91**********</small>
            </div>
        </div>
        <button class="drawer-close" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-links">
        <button class="drawer-item" onclick="window.location.replace('dashboard.html')"><div class="drawer-item-icon menu-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="drawer-item" onclick="window.location.replace('profile.html')"><div class="drawer-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><span>My Profile</span></button>
        <button class="drawer-item" onclick="window.location.replace('wallet.html')"><div class="drawer-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><span>My Wallet</span></button>
        <button class="drawer-item" onclick="window.location.replace('referral.html')"><div class="drawer-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><span>Refer & Earn</span></button>
        <button class="drawer-item" onclick="window.location.replace('history.html')"><div class="drawer-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><span>History</span></button>
        <button class="drawer-item" onclick="window.location.replace('notification.html')"><div class="drawer-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><span>Notifications</span></button>
        <button class="drawer-item" onclick="window.location.replace('support.html')"><div class="drawer-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="drawer-item" onclick="logout()"><div class="drawer-item-icon menu-logout"><i class="fa-solid fa-right-from-bracket"></i></div><span>Logout</span></button>
    </div>
</div>

<!-- TOP HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="window.location.replace('dashboard.html')">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="window.location.replace('notification.html')"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="window.location.replace('wallet.html')"><i class="fa-solid fa-sack-dollar"></i> <span id="topBalance">₹0</span></button>
        <button class="header-icon redeem-top" onclick="window.location.replace('referral.html')"><i class="fa-solid fa-gift"></i></button>
    </div>
</header>

<main class="container">
    <div class="page-heading">
        <h2>Notifications</h2>
    </div>

    <section id="notif-list">
        <div style="text-align:center;padding:40px;color:#64748b;font-weight:700;">Notifications load ho rahe hain...</div>
    </section>
</main>

<!-- BOTTOM NAV BAR -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, query, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let userSnapshotUnsubscribe = null;

// Fetch Live User Profile & Wallet Balance
function listenUserData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const userRef = doc(db, "customers", docId);
        userSnapshotUnsubscribe = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                const userName = d.name || ("User " + userId.slice(-4));
                const depBal = Number(d.depositBalance || 0);
                const winBal = Number(d.winningBalance || d.winnings || 0);
                const realTotalBalance = depBal + winBal;

                document.getElementById("topBalance").textContent = "₹" + realTotalBalance;
                document.getElementById("drawerName").textContent = userName;
                document.getElementById("drawerMobile").textContent = "+" + userId;
            }
        });
    } catch(err) {
        console.error("Error loading user profile:", err);
    }
}

// Realtime Listener for Notifications
function listenNotifs() {
    const notifRef = collection(db, "notifications");
    onSnapshot(notifRef, (snap) => {
        let list = [];
        snap.forEach(d => {
            const data = d.data();
            const targetStr = String(data.target || "").toLowerCase();
            const notifUid = String(data.uid || "").replace(/\D/g, "");

            if(targetStr === 'all' || targetStr === '' || notifUid === "" || notifUid.includes(userId) || userId.includes(notifUid)) {
                list.push(data);
            }
        });

        // Sort latest notifications first based on timestamp/createdAt if available
        list.sort((a, b) => {
            const tA = a.timestamp || a.createdAt || 0;
            const tB = b.timestamp || b.createdAt || 0;
            return tB - tA;
        });

        const container = document.getElementById("notif-list");
        if(!list.length) { 
            container.innerHTML = "<div style='text-align:center;padding:40px;color:#64748b;font-weight:700;'>Koi notification nahi hai.</div>"; 
            return; 
        }

        container.innerHTML = list.map(n => {
            let timeStr = "";
            if (n.createdAt) {
                const dateVal = n.createdAt.toDate ? n.createdAt.toDate() : new Date(n.createdAt);
                timeStr = dateVal.toLocaleDateString("en-IN", { day:'numeric', month:'short' });
            }
            return `
                <div class="notif-card">
                    <div class="notif-header">
                        <span class="notif-title">${n.title || 'Notification'}</span>
                        ${timeStr ? `<span class="notif-time">${timeStr}</span>` : ''}
                    </div>
                    <div class="notif-body">${n.message || ''}</div>
                </div>
            `;
        }).join("");
    }, (e) => {
        console.error("Error loading notifications:", e);
        document.getElementById("notif-list").innerHTML = "<div style='text-align:center;padding:40px;color:#ef4444;font-weight:700;'>Notifications load karne mein error aayi.</div>";
    });
}

window.logout = async () => {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        try {
            await setDoc(doc(db, "customers", docId), { isOnline: false }, { merge: true });
        } catch(e) { console.error(e); }
    }
    if (userSnapshotUnsubscribe) userSnapshotUnsubscribe();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
};

listenUserData();
listenNotifs();
</script>

</body>
</html>
