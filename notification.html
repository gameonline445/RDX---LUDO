<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Notifications</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8faff 0%, #eef4ff 50%, #f1f5f9 100%);
            color: #101a38;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        /* Top Header */
        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ccd8ed;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #cbd7e9;
            color: #2864e6;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .brand-badge {
            background: #ffffff;
            border: 1px solid #dce6fb;
            color: #2362d9;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(35, 98, 217, 0.08);
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .topicon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: #ffffff;
        }

        .icon-bell { background: #7368ef; }
        .icon-cash { background: #35bf71; }
        .icon-gift { background: #ff933c; }

        /* Page Heading */
        .page-heading {
            padding: 16px 18px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-heading h1 {
            font-size: 22px;
            font-weight: 800;
            color: #101a38;
        }

        .page-heading p {
            font-size: 13px;
            color: #7a879f;
            margin-top: 2px;
        }

        /* Filter Switcher Tabs */
        .tab-container {
            display: flex;
            padding: 10px 18px 14px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border-radius: 14px;
            border: 1px solid #cbd7e9;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            background: #eef1f6;
            color: #748097;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(100deg, #2864e6, #3e7bf0);
            color: #ffffff;
            border-color: #2864e6;
            box-shadow: 0 4px 14px rgba(40, 100, 230, 0.3);
        }

        /* Content List */
        .content-section {
            padding: 0 18px;
        }

        /* Notification Card */
        .notif-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1.5px solid #bdd0f0;
            box-shadow: 0 6px 18px rgba(66, 117, 211, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .notif-card.personal {
            background: linear-gradient(135deg, #ffffff 0%, #f0f6ff 100%);
            border-color: #93c5fd;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .title-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-bullet {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .icon-bullet.broadcast {
            background: #ede9fe;
            color: #7c3aed;
        }

        .icon-bullet.personal {
            background: #dbeafe;
            color: #2563eb;
        }

        .notif-title {
            font-size: 15px;
            font-weight: 800;
            color: #101a38;
        }

        .badge-type {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-type.broadcast {
            background: #e0e7ff;
            color: #4338ca;
        }

        .badge-type.personal {
            background: #dcfce7;
            color: #15803d;
        }

        .notif-body {
            font-size: 13px;
            color: #475569;
            line-height: 1.45;
            padding-left: 40px;
        }

        .notif-date {
            font-size: 11px;
            color: #9aa6bc;
            font-weight: 600;
            padding-left: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-box {
            text-align: center;
            padding: 50px 20px;
            color: #7a879f;
            font-size: 14px;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom {
            height: 64px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #ffffff;
            border-top: 1px solid #d5deed;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .nav {
            border: 0;
            background: #ffffff;
            color: #6d7890;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav b { font-size: 21px; }
        .nav.active { color: #18213a; font-weight: 900; }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="top-bar">
        <div class="header-left">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="brand-badge">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell">🔔</div>
            <div class="topicon icon-cash">💵</div>
            <div class="topicon icon-gift">🎁</div>
        </div>
    </header>

    <!-- Page Title -->
    <div class="page-heading">
        <div>
            <h1>Notifications</h1>
            <p>Alerts, updates and direct messages</p>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="tab-container">
        <button class="tab-btn active" id="btnAll" onclick="filterNotifs('all')">
            <i class="fa-solid fa-layer-group" style="margin-right: 4px;"></i> All
        </button>
        <button class="tab-btn" id="btnPersonal" onclick="filterNotifs('personal')">
            <i class="fa-solid fa-user-lock" style="margin-right: 4px;"></i> Personal
        </button>
        <button class="tab-btn" id="btnBroadcast" onclick="filterNotifs('broadcast')">
            <i class="fa-solid fa-bullhorn" style="margin-right: 4px;"></i> Alerts
        </button>
    </div>

    <!-- Notifications Container -->
    <section class="content-section">
        <div id="notif-list" class="status-box">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #2864e6; margin-bottom: 10px;"></i><br>
            Notifications load ho rahe hain...
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom">
        <a class="nav" href="dashboard.html">
            <b>🏠</b>
            Home
        </a>
        <a class="nav" href="wallet.html">
            <b>💰</b>
            Wallet
        </a>
        <a class="nav" href="support.html">
            <b>🎧</b>
            Support
        </a>
        <a class="nav" href="profile.html">
            <b>👤</b>
            Profile
        </a>
    </nav>

    <!-- Firebase v12 Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get Logged In User
        function getLoggedInUserId() {
            const raw = localStorage.getItem("rdxFirebaseUserId") || 
                        localStorage.getItem("rdxVerifiedMobile") || 
                        localStorage.getItem("rdxUserId") || 
                        localStorage.getItem("userId") || 
                        localStorage.getItem("rdx_userId") || "";
            return String(raw).replace(/\D/g, "");
        }

        const currentUserId = getLoggedInUserId();
        let allNotifications = [];
        let currentFilter = 'all';

        // Load Notifications
        async function loadNotifications() {
            const container = document.getElementById("notif-list");

            try {
                const snap = await getDocs(collection(db, "notifications"));
                allNotifications = [];

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const target = String(data.target || "all").toLowerCase();
                    const notifUid = String(data.uid || "").replace(/\D/g, "");

                    // Check if notification is for ALL or for this specific user
                    if (target === "all" || notifUid === currentUserId || (currentUserId && notifUid.includes(currentUserId))) {
                        allNotifications.push({ id: docSnap.id, ...data });
                    }
                });

                if (allNotifications.length === 0) {
                    container.innerHTML = `
                        <div class="status-box">
                            <i class="fa-solid fa-bell-slash fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                            Abhi koi notification ya message nahi hai.
                        </div>`;
                    return;
                }

                // Latest timestamp first
                allNotifications.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
                    return timeB - timeA;
                });

                renderNotifications();

            } catch (error) {
                console.error("Notification load error:", error);
                container.innerHTML = `
                    <div class="status-box" style="color: #c72e43;">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>
                        Notifications load karne me dikkat aayi: ${error.message}
                    </div>`;
            }
        }

        // Render Cards
        function renderNotifications() {
            const container = document.getElementById("notif-list");

            let filtered = allNotifications;
            if (currentFilter === 'personal') {
                filtered = allNotifications.filter(item => String(item.target).toLowerCase() === 'personal');
            } else if (currentFilter === 'broadcast') {
                filtered = allNotifications.filter(item => String(item.target).toLowerCase() === 'all');
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="status-box">
                        <i class="fa-solid fa-inbox fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                        Is category mein koi message nahi hai.
                    </div>`;
                return;
            }

            let html = "";
            filtered.forEach(data => {
                const isPersonal = String(data.target).toLowerCase() === 'personal';
                const title = data.title || "Notification";
                const message = data.message || "";
                
                let dateString = "Recently";
                if (data.createdAt && typeof data.createdAt.toDate === "function") {
                    dateString = data.createdAt.toDate().toLocaleString('en-IN', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    });
                }

                html += `
                    <div class="notif-card ${isPersonal ? 'personal' : ''}">
                        <div class="card-header">
                            <div class="title-box">
                                <div class="icon-bullet ${isPersonal ? 'personal' : 'broadcast'}">
                                    <i class="fa-solid ${isPersonal ? 'fa-user' : 'fa-bullhorn'}"></i>
                                </div>
                                <span class="notif-title">${title}</span>
                            </div>
                            <span class="badge-type ${isPersonal ? 'personal' : 'broadcast'}">
                                ${isPersonal ? 'Personal' : 'Broadcast'}
                            </span>
                        </div>
                        <p class="notif-body">${message}</p>
                        <div class="notif-date">
                            <i class="fa-regular fa-clock"></i> ${dateString}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Tab Filter Switcher
        window.filterNotifs = function(filterType) {
            currentFilter = filterType;

            document.getElementById("btnAll").classList.remove("active");
            document.getElementById("btnPersonal").classList.remove("active");
            document.getElementById("btnBroadcast").classList.remove("active");

            if (filterType === 'all') document.getElementById("btnAll").classList.add("active");
            if (filterType === 'personal') document.getElementById("btnPersonal").classList.add("active");
            if (filterType === 'broadcast') document.getElementById("btnBroadcast").classList.add("active");

            renderNotifications();
        };

        // Initialize
        loadNotifications();
    </script>
</body>
</html>
