<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RDX LUDO - Notifications</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script>
    // Authentication Security Check
    if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
        window.location.replace("index.html");
    }

    // Mobile Back Button Trap
    (function() {
        window.history.pushState({ page: "notification" }, "", window.location.href);
        window.addEventListener("popstate", function() {
            const panel = document.getElementById("sideDrawer");
            if (panel && panel.classList.contains("active")) {
                toggleMenu();
                window.history.pushState({ page: "notification" }, "", window.location.href);
            } else {
                window.location.href = "dashboard.html";
            }
        });
    })();
    </script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}

        /* 🔒 पूरी स्क्रीन और बॉडी को मोबाइल पर पूरी तरह लॉक करने के लिए */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background:
                radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
                radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
            color:#101a38;
            -webkit-touch-callout: none;
        }
        button{font:inherit;}

/* TOP HEADER STYLES */
.top-header{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 66px;
    background: linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom: 1.5px solid #bae6fd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 100;
    box-shadow: 0 4px 18px rgba(2,132,199,0.08);
}

        /* MAIN CONTAINER (हेडर और बॉटम नेविगेशन के बीच फिक्स और स्क्रॉलएबल) */
        .container{
            position: absolute;
            top: 66px;
            bottom: 74px;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 16px 14px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page-heading{padding:6px 4px 12px;display:flex;justify-content:space-between;align-items:center;}
        .page-heading h2{font-size:20px;font-weight:900;color:#0c4a6e;}

        .notif-card{
            background:#ffffff;
            border-radius:20px;
            padding:16px;
            margin-bottom:12px;
            border:1.5px solid #bae6fd;
            display:flex;
            flex-direction:column;
            gap:6px;
            box-shadow:0 4px 14px rgba(2,132,199,0.06);
        }
        .notif-header{display:flex;justify-content:space-between;align-items:center;}
        .notif-title{color:#0284c7;font-size:15px;font-weight:800;}
        .notif-time{font-size:11px;color:#94a3b8;font-weight:600;}
        .notif-body{font-size:13px;color:#475569;line-height:1.4;font-weight:600;}

        /* SIDE DRAWER STYLING */
        .drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:999;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
        .drawer-overlay.active{opacity:1;pointer-events:auto;}
        .drawer{position:fixed;top:0;left:0;width:280px;height:100%;background:#ffffff;z-index:1000;box-shadow:4px 0 25px rgba(2,132,199,0.15);transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;}
        .drawer.active{transform:translateX(0);}

        /* BOTTOM NAV CONTAINER STYLES */
        .bottom-nav{
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            height:74px;
            background:#ffffff;
            border-top:1px solid #e2e8f0;
            display:flex;
            justify-content:space-around;
            align-items:center;
            z-index:200;
        }
        .nav-item{
            width:25%;
            height:100%;
            border:0;
            background:transparent;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:4px;
            color:#64748b;
            font-size:12px;
            font-weight:700;
            cursor:pointer;
        }
        .nav-icon-box{
            width:42px;
            height:42px;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            color:#ffffff;
        }
        .nav-item.active {color:#0f172a;font-weight:850;}
        .icon-home{background:#6366f1;}
        .icon-wallet{background:#22c55e;}
        .icon-support{background:#0284c7;}
        .icon-profile{background:#ea580c;}
    </style>
</head>
<body>

<!-- COMPONENTS.JS CONTAINERS -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main class="container" id="scrollContainer">
    <div class="page-heading">
        <h2>Notifications</h2>
    </div>

    <section id="notif-list">
        <div style="text-align:center;padding:40px;color:#64748b;font-weight:700;">Notifications load ho rahe hain...</div>
    </section>
</main>

<!-- BOTTOM NAV CONTAINER -->
<div id="nav-container" data-active="notification"></div>

<!-- EXTERNAL COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
/* 🛡️ मोबाइल बाउंस रोकने के लिए टच प्रिवेंटर */
document.addEventListener('touchmove', function(event) {
    if (!event.target.closest('.container') && !event.target.closest('.drawer')) {
        event.preventDefault();
    }
}, { passive: false });

/* 🔄 शुद्ध पुल-टू-रिफ्रेश लॉजिक */
let startY = 0;
const scrollContainer = document.getElementById('scrollContainer');

scrollContainer.addEventListener('touchstart', function(e) {
    if (scrollContainer.scrollTop === 0) {
        startY = e.touches[0].clientY;
    }
});

scrollContainer.addEventListener('touchmove', function(e) {
    if (scrollContainer.scrollTop === 0 && startY > 0) {
        let currentY = e.touches[0].clientY;
        if (currentY - startY > 100) {
            startY = 0;
            window.location.reload();
        }
    }
});

scrollContainer.addEventListener('touchend', function(e) {
    startY = 0;
});

function toggleMenu() {
    const drawer = document.getElementById("sideDrawer");
    const overlay = document.getElementById("drawerOverlay");
    if(drawer) drawer.classList.toggle("active");
    if(overlay) overlay.classList.toggle("active");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let userSnapshotUnsubscribe = null;

// Fetch Live User Profile
function listenUserData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const userRef = doc(db, "customers", docId);
        userSnapshotUnsubscribe = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                const userName = d.name || ("User " + userId.slice(-4));
                
                const nameEls = document.querySelectorAll("#drawerName");
                const mobileEls = document.querySelectorAll("#drawerMobile");
                
                nameEls.forEach(el => el.textContent = userName);
                mobileEls.forEach(el => el.textContent = "+" + userId);
            }
        });
    } catch(err) {
        console.error("Error loading user profile:", err);
    }
}

// Realtime Listener for Notifications
function listenNotifs() {
    const notifRef = collection(db, "notifications");
    onSnapshot(notifRef, (snap) => {
        let list = [];
        snap.forEach(d => {
            const data = d.data();
            const targetStr = String(data.target || "").toLowerCase();
            const notifUid = String(data.uid || "").replace(/\D/g, "");

            if(targetStr === 'all' || targetStr === '' || notifUid === "" || notifUid.includes(userId) || userId.includes(notifUid)) {
                list.push(data);
            }
        });

        list.sort((a, b) => {
            const tA = a.timestamp || a.createdAt || 0;
            const tB = b.timestamp || b.createdAt || 0;
            return tB - tA;
        });

        const container = document.getElementById("notif-list");
        if(!container) return;

        if(!list.length) { 
            container.innerHTML = "<div style='text-align:center;padding:40px;color:#64748b;font-weight:700;'>Koi notification nahi hai.</div>"; 
            return; 
        }

        container.innerHTML = list.map(n => {
            let timeStr = "";
            if (n.createdAt) {
                const dateVal = n.createdAt.toDate ? n.createdAt.toDate() : new Date(n.createdAt);
                timeStr = dateVal.toLocaleDateString("en-IN", { day:'numeric', month:'short' });
            } else if (n.timestamp) {
                const dateVal = new Date(n.timestamp);
                timeStr = dateVal.toLocaleDateString("en-IN", { day:'numeric', month:'short' });
            }
            return `
                <div class="notif-card">
                    <div class="notif-header">
                        <span class="notif-title">${n.title || 'Notification'}</span>
                        ${timeStr ? `<span class="notif-time">${timeStr}</span>` : ''}
                    </div>
                    <div class="notif-body">${n.message || ''}</div>
                </div>
            `;
        }).join("");
    }, (e) => {
        console.error("Error loading notifications:", e);
        const container = document.getElementById("notif-list");
        if(container) {
            container.innerHTML = "<div style='text-align:center;padding:40px;color:#ef4444;font-weight:700;'>Notifications load karne mein error aayi.</div>";
        }
    });
}

window.logout = async () => {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        try {
            await setDoc(doc(db, "customers", docId), { isOnline: false }, { merge: true });
        } catch(e) { console.error(e); }
    }
    if (userSnapshotUnsubscribe) userSnapshotUnsubscribe();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
};

listenUserData();
listenNotifs();
</script>

</body>
</html>
