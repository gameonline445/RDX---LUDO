/* =====================================================
   SAFE HTML
===================================================== */

function safe(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message show " +

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

  message.className =

}


/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(
  value
){

  if(!value){

    return "";

  }

  let number =
    String(value)
      .trim()
      .replace(
        /\D/g,
        ""
      );


  /*
     अगर number 91XXXXXXXXXX है
     तो सिर्फ XXXXXXXXXX रखें
  */

  if(
    number.startsWith("91") &&
    number.length === 12
  ){

    number =
      number.substring(2);

  }


  return number;

}


/* =====================================================
   PHONE VARIANTS
===================================================== */

function getPhoneVariants(
  value
){

  const variants =
    new Set();


  if(!value){

    return variants;

  }


  const raw =
    String(value)
      .trim();


  if(raw){

    variants.add(
      raw
    );

  }


  const normalized =
    normalizePhone(
      raw
    );


  if(normalized){

    variants.add(
      normalized
    );

    variants.add(
      "91" +
      normalized
    );

    variants.add(
      "+91" +
      normalized
    );

  }


  return variants;

}


/* =====================================================
   GET AUTH IDENTIFIERS
===================================================== */

function getAuthIdentifiers(
  user
){

  const ids =
    new Set();


  if(!user){

    return ids;

  }


  /* Firebase Auth UID */

  if(user.uid){

    ids.add(
      String(
        user.uid
      ).trim()
    );

  }


  /* Firebase phone */

  if(user.phoneNumber){

    const variants =
      getPhoneVariants(
        user.phoneNumber
      );


    variants.forEach(
      value => {

        ids.add(
          value
        );

      }
    );

  }


  return ids;

}


/* =====================================================
   GET DEPOSIT IDENTIFIERS
===================================================== */

function getDepositIdentifiers(
  deposit
){

  const ids =
    new Set();


  const fields = [

    deposit.userId,

    deposit.uid,

    deposit.customerId,

    deposit.userUID,

    deposit.mobile,

    deposit.phone,

    deposit.phoneNumber

  ];


  fields.forEach(
    value => {

      if(!value){

        return;

      }


      const raw =
        String(
          value
        ).trim();


      if(raw){

        ids.add(
          raw
        );

      }


      const variants =
        getPhoneVariants(
          raw
        );


      variants.forEach(
        value2 => {

          ids.add(
            value2
          );

        }
      );

    }
  );


  return ids;

}


/* =====================================================
   CHECK USER MATCH
===================================================== */

function belongsToCurrentUser(
  deposit,
  user
){

  if(!user){

    return false;

  }


  const authIds =
    getAuthIdentifiers(
      user
    );


  const depositIds =
    getDepositIdentifiers(
      deposit
    );


  /*
     पहले exact UID match
  */

  if(
    user.uid &&
    depositIds.has(
      String(
        user.uid
      ).trim()
    )
  ){

    return true;

  }


  /*
     फिर phone/mobile match
  */

  for(
    const authId
    of authIds
  ){

    if(
      depositIds.has(
        authId
      )
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   GET UTR
===================================================== */

function getUTR(
  deposit
){

  return String(

    deposit.utr ??

    deposit.utrNumber ??

    deposit.utrNo ??

    deposit.transactionId ??

    deposit.transactionNumber ??

    ""

  ).trim();

}


/* =====================================================
   GET ACCOUNT
===================================================== */

function getAccount(
  deposit
){

  return String(

    deposit.accountHolderName ??

    deposit.accountName ??

    deposit.accountHolder ??

    deposit.upiName ??

    deposit.upiId ??

    deposit.account ??

    ""

  ).trim();

}


/* =====================================================
   GET STATUS
===================================================== */

function getStatus(
  deposit
){

  return String(

    deposit.status ??
    "pending"

  )
  .trim()
  .toLowerCase();

}


/* =====================================================
   GET DATE VALUE
===================================================== */

function getDateValue(
  value
){

  if(!value){

    return null;

  }


  /*
     Firebase Timestamp
  */

  if(
    typeof value.toDate ===
    "function"
  ){

    const date =
      value.toDate();


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date;

    }

  }


  /*
     Firestore timestamp
     seconds / nanoseconds
  */

  if(
    typeof value ===
    "object"
    &&
    typeof value.seconds ===
    "number"
  ){

    const date =
      new Date(
        value.seconds *
        1000
      );


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date;

    }

  }


  /*
     JS Date
  */

  if(
    value instanceof Date
  ){

    return value;

  }


  /*
     Number
  */

  if(
    typeof value ===
    "number"
  ){

    const date =
      new Date(
        value
      );


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date;

    }

  }


  /*
     String
  */

  if(
    typeof value ===
    "string"
  ){

    const date =
      new Date(
        value
      );


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date;

    }

  }


  return null;

}


/* =====================================================
   GET HISTORY DATE
===================================================== */

function getHistoryDate(
  deposit
){

  const status =
    getStatus(
      deposit
    );


  /*
     APPROVED
  */

  if(
    status ===
    "approved"
  ){

    return (

      getDateValue(
        deposit.approvedAt
      )

      ||

      getDateValue(
        deposit.updatedAt
      )

      ||

      getDateValue(
        deposit.createdAt
      )

    );

  }


  /*
     REJECTED
  */

  if(
    status ===
    "rejected"
  ){

    return (

      getDateValue(
        deposit.rejectedAt
      )

      ||

      getDateValue(
        deposit.updatedAt
      )

      ||

      getDateValue(
        deposit.createdAt
      )

    );

  }


  /*
     PENDING
  */

  return (

    getDateValue(
      deposit.createdAt
    )

    ||

    getDateValue(
      deposit.updatedAt
    )

  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  date
){

  if(!date){

    return "—";

  }


  return date.toLocaleDateString(
    "en-GB",
    {
      day:
        "2-digit",

      month:
        "short",

      year:
        "numeric"
    }
  );

}


/* =====================================================
   FORMAT DATE TIME
===================================================== */

function formatDateTime(
  date
){

  if(!date){

    return "—";

  }


  return (

    date.toLocaleDateString(
      "en-GB",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    )

    +

    " "

    +

    date.toLocaleTimeString(
      "en-IN",
      {
        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          true
      }
    )

  );

}


/* =====================================================
   DATE KEY
===================================================== */

function dateKey(
  date
){

  if(!date){

    return "";

  }


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() +
      1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    )
    .padStart(
      2,
      "0"
    );


  return (

    year +
    "-" +
    month +
    "-" +
    day

  );

}


/* =====================================================
   GET REASON
===================================================== */

function getReason(
  deposit
){

  return String(

    deposit.rejectReason ??

    deposit.rejectionReason ??

    deposit.reason ??

    deposit.comment ??

    ""

  ).trim();

}


/* =====================================================
   GET AMOUNT
===================================================== */

function getAmount(
  deposit
){

  const value =

    deposit.amount ??

    deposit.depositAmount ??

    0;


  const number =
    Number(
      value
    );


  return isNaN(
    number
  )
    ? 0
    : number;

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(
  list
){

  if(
    !list.length
  ){

    historyContainer.innerHTML = `

      <div class="empty">

        कोई Deposit History नहीं मिली।

      </div>

    `;

    return;

  }


  /*
     SORT NEWEST FIRST
  */

  const sorted =
    [...list].sort(
      (
        a,
        b
      ) => {

        const dateA =
          getHistoryDate(
            a
          );

        const dateB =
          getHistoryDate(
            b
          );


        return (

          (
            dateB?.getTime()
            ||
            0
          )

          -

          (
            dateA?.getTime()
            ||
            0
          )

        );

      }
    );


  /*
     GROUP BY DATE
  */

  const groups =
    {};


  sorted.forEach(
    deposit => {

      const date =
        getHistoryDate(
          deposit
        );


      const key =
        dateKey(
          date
        );


      if(
        !groups[key]
      ){

        groups[key] =
          [];

      }


      groups[key].push(
        deposit
      );

    }
  );


  /*
     DATE GROUPS
  */

  const dates =
    Object.keys(
      groups
    )
    .sort()
    .reverse();


  let html =
    "";


  /*
     BUILD
  */

  dates.forEach(
    key => {

      const group =
        groups[key];


      const firstDate =
        getHistoryDate(
          group[0]
        );


      html += `

        <div class="date-section">

          <div class="date-heading">

            📅 ${safe(
              formatDate(
                firstDate
              )
            )}

          </div>

          <div class="table-wrapper">

            <table>

              <thead>

                <tr>

                  <th>
                    UTR No.
                  </th>

                  <th>
                    Amount
                  </th>

                  <th>
                    Status
                  </th>

                  <th>
                    Account
                  </th>

                  <th>
                    Date & Time
                  </th>

                  <th>
                    Reason
                  </th>

                </tr>

              </thead>

              <tbody>

      `;


      group.forEach(
        deposit => {

          const status =
            getStatus(
              deposit
            );


          const amount =
            getAmount(
              deposit
            );


          const utr =
            getUTR(
              deposit
            );


          const account =
            getAccount(
              deposit
            );


          const finalDate =
            getHistoryDate(
              deposit
            );


          const reason =
            getReason(
              deposit
            );


          let statusHTML =
            "";


          /*
             APPROVED
          */

          if(
            status ===
            "approved"
          ){

            statusHTML = `

              <span
                class="status approved"
              >
                🟢 APPROVED
              </span>

            `;

          }


          /*
             REJECTED
          */

          else if(
            status ===
            "rejected"
          ){

            statusHTML = `

              <span
                class="status rejected"
              >
                🔴 REJECT
              </span>

            `;

          }


          /*
             PENDING
          */

          else{

            statusHTML = `

              <span
                class="status pending"
              >
                🟡 PENDING
              </span>

            `;

          }


          let reasonHTML =
            "—";


          if(
            status ===
            "rejected"
            &&
            reason
          ){

            reasonHTML =
              safe(
                reason
              );

          }


          html += `

            <tr>

              <td class="utr">

                ${safe(
                  utr ||
                  "—"
                )}

              </td>


              <td class="amount">

                ₹${amount.toLocaleString(
                  "en-IN"
                )}

              </td>


              <td>

                ${statusHTML}

              </td>


              <td class="account">

                ${safe(
                  account ||
                  "—"
                )}

              </td>


              <td>

                ${safe(
                  formatDateTime(
                    finalDate
                  )
                )}

              </td>


              <td class="reason">

                ${reasonHTML}

              </td>

            </tr>

          `;

        }
      );


      html += `

              </tbody>

            </table>

          </div>

        </div>

      `;

    }
  );


  historyContainer.innerHTML =
    html;

}


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadHistory(){

  if(
    !currentUser
  ){

    historyContainer.innerHTML = `

      <div class="empty">

        कृपया पहले लॉगिन करें।

      </div>

    `;

    return;

  }


  historyContainer.innerHTML = `

    <div class="loading">

      ⏳ History Loading...

    </div>

  `;


  hideMessage();


  try{


    /*
       =================================================
       CURRENT USER INFORMATION
       =================================================
    */

    const authUID =
      String(
        currentUser.uid ||
        ""
      ).trim();


    const authPhone =
      String(
        currentUser.phoneNumber ||
        ""
      ).trim();


    console.log(
      "================================="
    );

    console.log(
      "RDX LUDO HISTORY"
    );

    console.log(
      "Firebase Auth UID:",
      authUID
    );

    console.log(
      "Firebase Auth Phone:",
      authPhone
    );

    console.log(
      "================================="
    );


    /*
       =================================================
       PHONE VARIANTS
       =================================================
    */

    const phoneVariants =
      getPhoneVariants(
        authPhone
      );


    console.log(
      "Phone Variants:",
      [
        ...phoneVariants
      ]
    );


    /*
       =================================================
       FIRESTORE
       =================================================
    */

    const depositsRef =
      collection(
        db,
        DEPOSITS_COLLECTION
      );


    /*
       =================================================
       QUERIES
       =================================================

       तुम्हारे database में:
       
       userId = 917878852370
       uid    = 917878852370
       mobile = +917878852370

       इसलिए अलग-अलग possible fields
       query किए जाएंगे।
    */


    const queryPromises =
      [];


    /*
       USER ID
    */

    if(
      authUID
    ){

      queryPromises.push({

        name:
          "userId / Auth UID",

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "userId",
                "==",
                authUID
              )
            )
          )

      });

    }


    /*
       UID
    */

    if(
      authUID
    ){

      queryPromises.push({

        name:
          "uid / Auth UID",

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "uid",
                "==",
                authUID
              )
            )
          )

      });

    }


    /*
       PHONE VARIANTS
    */

    for(
      const phone
      of phoneVariants
    ){

      queryPromises.push({

        name:
          "userId / " +
          phone,

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "userId",
                "==",
                phone
              )
            )
          )

      });


      queryPromises.push({

        name:
          "uid / " +
          phone,

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "uid",
                "==",
                phone
              )
            )
          )

      });


      queryPromises.push({

        name:
          "mobile / " +
          phone,

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "mobile",
                "==",
                phone
              )
            )
          )

      });


      queryPromises.push({

        name:
          "phone / " +
          phone,

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "phone",
                "==",
                phone
              )
            )
          )

      });


      queryPromises.push({

        name:
          "phoneNumber / " +
          phone,

        promise:
          getDocs(
            query(
              depositsRef,
              where(
                "phoneNumber",
                "==",
                phone
              )
            )
          )

      });

    }


    /*
       =================================================
       RUN ALL QUERIES
       =================================================
    */

    const results =
      await Promise.allSettled(
        queryPromises.map(
          item =>
            item.promise
        )
      );


    /*
       =================================================
       COLLECT RESULTS
       =================================================
    */

    const historyMap =
      new Map();


    results.forEach(
      (
        result,
        index
      ) => {

        const queryInfo =
          queryPromises[index];


        if(
          result.status ===
          "fulfilled"
        ){

          const snap =
            result.value;


          console.log(
            "Query OK:",
            queryInfo.name,
            "Count:",
            snap.size
          );


          snap.forEach(
            docSnap => {

              historyMap.set(
                docSnap.id,
                {
                  id:
                    docSnap.id,

                  ...docSnap.data()
                }
              );

            }
          );

        }

        else{

          console.warn(
            "Query Failed:",
            queryInfo.name,
            result.reason
          );

        }

      }
    );


    /*
       =================================================
       CONVERT TO ARRAY
       =================================================
    */

    allHistory =
      [
        ...historyMap.values()
      ];


    /*
       =================================================
       EXTRA SAFETY MATCH
       =================================================

       अगर कोई query किसी पुराने field से
       record लेकर आई है तो final matching
       भी की जाएगी।
    */

    allHistory =
      allHistory.filter(
        deposit => {

          return belongsToCurrentUser(
            deposit,
            currentUser
          );

        }
      );


    /*
       =================================================
       DEBUG
       =================================================
    */

    console.log(
      "================================="
    );

    console.log(
      "FINAL MATCHING DEPOSITS:",
      allHistory
    );

    console.log(
      "FINAL COUNT:",
      allHistory.length
    );

    console.log(
      "================================="
    );


    /*
       =================================================
       NO HISTORY
       =================================================
    */

    if(
      allHistory.length ===
      0
    ){

      historyContainer.innerHTML = `

        <div class="empty">

          <strong>
            कोई Deposit History नहीं मिली।
          </strong>

          <br><br>

          अगर Admin में Deposit दिखाई दे रही है,
          तो Firebase Auth का phone number और
          Firestore का userId/mobile अलग हो सकता है।

        </div>

      `;

      return;

    }


    /*
       =================================================
       RENDER
       =================================================
    */

    renderHistory(
      allHistory
    );


  }

  catch(error){

    console.error(
      "History Error:",
      error
    );


    historyContainer.innerHTML = `

      <div class="empty">

        <strong>
          History लोड नहीं हो सकी।
        </strong>

        <br><br>

        ${safe(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   SEARCH BY DATE
===================================================== */

function searchByDate(){

  const selectedDate =
    dateSearch.value;


  /*
     EMPTY DATE = RECENT
  */

  if(
    !selectedDate
  ){

    hideMessage();

    renderHistory(
      allHistory
    );

    return;

  }


  /*
     FILTER
  */

  const filtered =
    allHistory.filter(
      deposit => {

        const date =
          getHistoryDate(
            deposit
          );


        return (
          dateKey(
            date
          )
          ===
          selectedDate
        );

      }
    );


  /*
     DISPLAY DATE
  */

  const displayDate =
    selectedDate
      .split("-")
      .reverse()
      .join("-");


  /*
     FOUND
  */

  if(
    filtered.length
  ){

    showMessage(
      displayDate +
      " की History मिली।",
      "ok"
    );

  }


  /*
     NOT FOUND
  */

  else{

    showMessage(
      displayDate +
      " की कोई History नहीं मिली।",
      "error"
    );

  }


  renderHistory(
    filtered
  );

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

searchBtn.addEventListener(
  "click",
  searchByDate
);


/* =====================================================
   DATE CHANGE
===================================================== */

dateSearch.addEventListener(
  "change",
  searchByDate
);


/* =====================================================
   RECENT BUTTON
===================================================== */

clearBtn.addEventListener(

  () => {

    dateSearch.value =
      "";

    hideMessage();

    renderHistory(

    );

  }
);

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",

      window.history.back();

    }
  );


/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    console.log(
      "Auth State:",
      user
    );


    if(
      user
    ){

      currentUser =
        user;


      await loadHistory();

    }

    else{

      currentUser =
        null;


      allHistory =
        [];


      historyContainer.innerHTML = `

        <div class="empty">

          कृपया अपने खाते में लॉगिन करके
          History देखें।

        </div>

      `;

    }

  }
);


</script>
