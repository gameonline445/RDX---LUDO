<script>
// Authentication Security Check
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}

// Mobile Back Button Trap
(function() {
    window.history.pushState({ page: "support" }, "", window.location.href);
    window.addEventListener("popstate", function() {
        const panel = document.getElementById("sideDrawer");
        if (panel && panel.classList.contains("active")) {
            if (typeof toggleDrawer === "function") toggleDrawer();
            else if (typeof toggleMenu === "function") toggleMenu();
            window.history.pushState({ page: "support" }, "", window.location.href);

<style>

.bottom-nav{

.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}

<body>

<!-- DYNAMIC LAYOUT CONTAINERS (LOADED VIA COMPONENTS.JS) -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main class="container" id="scrollContainer">
    <section class="support-card">
        <div class="support-top">
            <span class="support-label">🎧 SUPPORT CENTER</span>
            <span class="online">● ONLINE</span>
        </div>
        <h1>We're here for you</h1>

        <div class="support-features">
            <span class="feature">⚡ 1–2 min reply</span>
            <span class="feature">◷ 24×7 active</span>

    </section>

    <div class="whatsapp-card" onclick="openWhatsApp()">

        <div class="whatsapp-info">
            <h2>WhatsApp Support</h2>
            <p>Instant chat support on WhatsApp</p>
            <div class="whatsapp-number" id="supportNumberText">+91 8306865537</div>
        </div>

    </div>
</main>

<div id="nav-container" data-active="support"></div>

<!-- CENTRAL COMPONENTS SCRIPT -->
<script src="components.js"></script>

<script>
/* 🛡️ मोबाइल ब्राउज़र के पूरे पेज वाले बाउंस/स्क्रॉल को रोकने के लिए ग्लोबल प्रिवेंटर */
document.addEventListener('touchmove', function(event) {
    if (!event.target.closest('main.container') && !event.target.closest('.drawer')) {
        event.preventDefault();
    }
}, { passive: false });

/* 🔄 पुल-टू-रिफ्रेश लॉजिक (बिना किसी टेक्स्ट या लाइन के) */
let startY = 0;
const container = document.getElementById('scrollContainer');

container.addEventListener('touchstart', function(e) {
    if (container.scrollTop === 0) {
        startY = e.touches[0].clientY;
    }
});

container.addEventListener('touchmove', function(e) {
    if (container.scrollTop === 0 && startY > 0) {
        let currentY = e.touches[0].clientY;
        if (currentY - startY > 100) {
            startY = 0;
            window.location.reload();
        }
    }
});

container.addEventListener('touchend', function(e) {
    startY = 0;
});

let currentSupportMobile = "918306865537"; // Fallback default number

function openWhatsApp() {
    const cleanNum = currentSupportMobile.replace(/\D/g, "");
    window.location.href = "https://wa.me/" + cleanNum + "?text=" + encodeURIComponent("Hello Support Team, I need help regarding RDX LUDO.");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let userSnapshotUnsubscribe = null;

// Fetch Live User Profile
function listenUserData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const userRef = doc(db, "customers", docId);
        userSnapshotUnsubscribe = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                const userName = d.name || ("User " + userId.slice(-4));
                
                const dName = document.getElementById("drawerName");
                const dMob = document.getElementById("drawerMobile");
                if (dName) dName.textContent = userName;
                if (dMob) dMob.textContent = "+" + userId;
            }
        });
    } catch(err) {
        console.error("Error loading user profile:", err);
    }
}

// Fetch Admin Configured WhatsApp Support Number from Firebase
async function fetchSupportNumber() {
    try {
        const configRef = doc(db, "settings", "support");
        const snap = await getDoc(configRef);
        if (snap.exists() && snap.data().whatsappNumber) {
            const rawNum = String(snap.data().whatsappNumber).replace(/\D/g, "");
            currentSupportMobile = rawNum;
            const formattedDisplay = rawNum.length === 10 ? "+91 " + rawNum : "+" + rawNum;
            const textElem = document.getElementById("supportNumberText");
            if (textElem) textElem.textContent = formattedDisplay;
        }
    } catch(err) {
        console.log("Using fallback support number.");
    }
}

// Global Logout Handler Overwrite for Firebase
window.logout = async () => {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        try {
            await setDoc(doc(db, "customers", docId), { isOnline: false }, { merge: true });
        } catch(e) { console.error(e); }
    }
    if (userSnapshotUnsubscribe) userSnapshotUnsubscribe();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
};

listenUserData();
fetchSupportNumber();
</script>
