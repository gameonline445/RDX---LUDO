<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Support</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// Authentication Security Check: Agar user logged-in nahi hai toh seedha login page par bhejein
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("login.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
}

/* HEADER */
.top-header{height:66px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:white;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.logo{width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid #bae6fd;background:#ffffff;box-shadow:0 4px 12px rgba(2,132,199,0.15);}
.logo img{width:100%;height:100%;object-fit:cover;}
.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{width:38px;height:38px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:white;cursor:pointer;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);min-width:38px;}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);min-width:38px;}

/* SIDE MENU */
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);z-index:250;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-310px;width:300px;height:100vh;background:white;z-index:300;padding:20px 16px;box-shadow:10px 0 35px rgba(0,0,0,.15);transition:.3s ease;overflow-y:auto;}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #e3e8f2;}
.menu-brand{display:flex;align-items:center;gap:10px;}
.menu-logo{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #7dd3fc;display:flex;align-items:center;justify-content:center;background:#ffffff;cursor:pointer;}
.menu-logo img{width:100%;height:100%;object-fit:cover;}
.menu-brand h2{font-size:17px;}
.menu-brand p{color:#71809d;font-size:11px;margin-top:2px;}
.close-menu{border:0;background:#eef2fa;width:36px;height:36px;border-radius:50%;font-size:20px;color:#66738d;cursor:pointer;}
.menu-item{width:100%;border:0;background:transparent;padding:10px 0;border-radius:14px;margin-bottom:4px;text-align:left;font-size:15px;color:#334155;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:12px;}
.menu-item-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-item span:nth-child(2){flex:1;}

/* MAIN */
.main{width:100%;max-width:650px;margin:auto;padding:18px 14px 100px;}
.support-card{border:1.5px solid #7dd3fc;border-radius:22px;padding:20px 18px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);box-shadow:0 8px 22px rgba(2,132,199,0.10);}
.support-top{display:flex;justify-content:space-between;align-items:center;}
.support-label{color:#0284c7;border:1px solid #7dd3fc;background:#ffffff;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.8px;}
.online{color:#15803d;border:1px solid #86efac;background:#dcfce7;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:800;}
.support-card h1{margin-top:16px;font-size:26px;color:#0c4a6e;}
.support-card p{margin-top:6px;color:#64748b;font-size:14px;line-height:1.4;}
.support-features{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.feature{padding:8px 12px;border:1.5px solid #bae6fd;background:rgba(255,255,255,.8);border-radius:20px;font-weight:700;font-size:12px;color:#0369a1;}

.section-title{margin-top:24px;margin-bottom:12px;color:#0284c7;font-size:12px;font-weight:850;letter-spacing:1.5px;}
.whatsapp-card{width:100%;border:1.5px solid #bae6fd;background:#ffffff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 6px 18px rgba(2,132,199,0.06);}
.whatsapp-icon{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:linear-gradient(145deg,#20c36b,#43d77e);display:flex;align-items:center;justify-content:center;color:white;font-size:26px;}
.whatsapp-info{flex:1;}
.whatsapp-info h2{font-size:17px;}
.whatsapp-info p{margin-top:2px;color:#64748b;font-size:12px;}
.whatsapp-number{margin-top:3px;color:#15803d;font-weight:800;font-size:13px;}
.whatsapp-arrow{width:36px;height:36px;border-radius:50%;background:#f8fafc;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#64748b;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#0284c7;}
</style>
</head>

<body>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <div class="logo" onclick="window.location.replace('dashboard.html')">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="window.location.replace('notification.html')"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="window.location.replace('wallet.html')">💰</button>
        <button class="header-icon redeem-top" onclick="window.location.replace('referral.html')">🎁</button>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <div class="menu-logo" onclick="window.location.replace('dashboard.html')">
                <img src="logo.png" alt="RDX Logo">
            </div>
            <div><h2>RDX LUDO</h2><p>Play · Win · Earn</p></div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>
    <button class="menu-item" onclick="window.location.replace('dashboard.html')"><div class="menu-item-icon menu-home"><i class="fa-solid fa-house"></i></div><span>Home</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('profile.html')"><div class="menu-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><span>My Profile</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('wallet.html')"><div class="menu-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><span>My Wallet</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('referral.html')"><div class="menu-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><span>Refer & Earn</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('history.html')"><div class="menu-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><span>History</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('notification.html')"><div class="menu-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><span>Notifications</span><span>›</span></button>
    <button class="menu-item" onclick="window.location.replace('support.html')"><div class="menu-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><span>Support</span><span>›</span></button>
</div>

<main class="main">
    <section class="support-card">
        <div class="support-top">
            <span class="support-label">🎧 SUPPORT CENTER</span>
            <span class="online">● ONLINE</span>
        </div>
        <h1>We're here for you</h1>
        <p>Get help with battles, wallet, KYC and more — anytime.</p>
        <div class="support-features">
            <span class="feature">⚡ 1–2 min reply</span>
            <span class="feature">◷ 24×7 active</span>
            <span class="feature">🛡 Secure</span>
        </div>
    </section>

    <div class="section-title">CONTACT OPTIONS</div>
    <div class="whatsapp-card" onclick="openWhatsApp()">
        <div class="whatsapp-icon">☎</div>
        <div class="whatsapp-info">
            <h2>WhatsApp</h2>
            <p>Message us on WhatsApp</p>
            <div class="whatsapp-number">+91 8306865537</div>
        </div>
        <div class="whatsapp-arrow">›</div>
    </div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item active" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }
function openWhatsApp(){ window.location.href = "https://wa.me/918306865537"; }
</script>
</body>
</html>
