<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #0d1b2a; color: #fff; padding: 20px; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .card { background: #fff; color: #333; padding: 20px; border-radius: 12px; }
    .card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
    .card .stat { font-size: 24px; font-weight: bold; }
    .text-green { color: #2e7d32; }
    .text-orange { color: #ed6c02; }
    .text-blue { color: #1976d2; }
    .status-box { background: #e8f5e9; color: #2e7d32; padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: bold; }
  </style>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

  <h2 style="margin-bottom: 20px;">Dashboard</h2>

  <div class="cards-grid">
    <div class="card"><h3>ACTIVE LIVE USERS</h3><p class="stat text-green" id="liveUsers">0 Live</p></div>
    <div class="card"><h3>LIVE MATCHES</h3><p class="stat text-orange" id="liveMatches">0</p></div>
    <div class="card"><h3>PENDING KYC</h3><p class="stat text-orange" id="pendingKyc">0</p></div>
    <div class="card"><h3>TOTAL CUSTOMERS</h3><p class="stat text-blue" id="totalCustomers">60</p></div>
    <div class="card"><h3>TOTAL BALANCE</h3><p class="stat text-green" id="totalBalance">₹5350</p></div>
    <div class="card"><h3>TOTAL DEPOSIT PAID</h3><p class="stat" style="color:#9c27b0;" id="totalDeposit">₹7100</p></div>
  </div>

  <div class="status-box" id="firebaseStatus">
    🔄 Connecting to Firebase...
  </div>

  <script>
    // Firebase Configuration Settings
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Sync Live Dashboard Data
    db.ref('.info/connected').on('value', (snapshot) => {
      if (snapshot.val() === true) {
        document.getElementById('firebaseStatus').innerHTML = "✅ Firebase Connected (All Data Loaded)";
      } else {
        document.getElementById('firebaseStatus').innerHTML = "❌ Firebase Disconnected";
      }
    });

    // Realtime Database Listeners
    db.ref('stats').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      document.getElementById('liveUsers').innerText = `${data.liveUsers || 0} Live`;
      document.getElementById('liveMatches').innerText = data.liveMatches || 0;
      document.getElementById('pendingKyc').innerText = data.pendingKyc || 0;
      document.getElementById('totalCustomers').innerText = data.totalCustomers || 60;
      document.getElementById('totalBalance').innerText = `₹${data.totalBalance || 5350}`;
      document.getElementById('totalDeposit').innerText = `₹${data.totalDeposit || 7100}`;
    });
  </script>
</body>
</html>
