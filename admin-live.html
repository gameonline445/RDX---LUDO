<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Users Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 20px;
        }

        /* Top 4 Stats Boxes */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* Active Users Table Section */
        .dashboard-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .dashboard-section h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background-color: #e6f4ea;
            color: #137333;
        }

        /* Controls Panel for Testing */
        .controls {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
        }

        .controls button {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. Top 4 Stats Boxes -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Active Online Users 🟢</h3>
            <div class="number" id="activeCount">0</div>
        </div>
        <div class="stat-card">
            <h3>Offline Users ⚪</h3>
            <div class="number" id="offlineCount">0</div>
        </div>
        <div class="stat-card">
            <h3>LoggedIn Users 🔑</h3>
            <div class="number" id="loggedInCount">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Registered Users 👥</h3>
            <div class="number" id="totalCount">0</div>
        </div>
    </div>

    <!-- 2. Active Users List Table -->
    <div class="dashboard-section">
        <h2>Keval Active Users List ⚡</h2>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Username</th>
                    <th>Current Page</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="activeUsersTable">
                <!-- Active users dynamically insert honge -->
            </tbody>
        </table>
    </div>

    <!-- Simulator Controls for Testing Navigation/State -->
    <div class="controls">
        <h3>User Actions Simulation (Testing)</h3>
        <p>Aap dynamic testing ke liye in buttons par click karke dekhein:</p><br>
        <button onclick="simulatePageChange('Dashboard')">Go to Dashboard</button>
        <button onclick="simulatePageChange('Battle History')">Go to Battle History</button>
        <button onclick="simulatePageChange('Profile')">Go to Profile</button>
        <button onclick="toggleCurrentUserStatus()">Toggle Logout/Inactive</button>
    </div>

    <script>
        // Sample Database of Users
        const usersDatabase = [
            { id: 101, name: "Desh Boya", page: "Battle History", isLoggedIn: true, isActive: true },
            { id: 102, name: "Rahul_King", page: "Profile", isLoggedIn: true, isActive: true },
            { id: 103, name: "Aman_Pro", page: "Home", isLoggedIn: true, isActive: false },
            { id: 104, name: "Vikas_Gamer", page: "Dashboard", isLoggedIn: false, isActive: false }
        ];

        // System Initialization
        function initDashboard() {
            // LocalStorage handling for session persistence
            if (!localStorage.getItem('currentUser')) {
                // Default login state set
                localStorage.setItem('currentUser', JSON.stringify(usersDatabase[0]));
            }

            renderDashboard();
        }

        function renderDashboard() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            // Sync database status with active local user
            let activeOnlineCount = 0;
            let offlineCount = 0;
            let loggedInCount = 0;
            let totalRegistered = usersDatabase.length;

            const tableBody = document.getElementById('activeUsersTable');
            tableBody.innerHTML = '';

            usersDatabase.forEach(user => {
                // Update local storage user state in main data
                if (user.id === currentUser.id) {
                    user.page = currentUser.page;
                    user.isActive = currentUser.isActive;
                    user.isLoggedIn = currentUser.isLoggedIn;
                }

                // Counters Calculation
                if (user.isLoggedIn) loggedInCount++;
                if (user.isActive && user.isLoggedIn) {
                    activeOnlineCount++;
                    
                    // Render ONLY active users in the table
                    const row = `
                        <tr>
                            <td>#${user.id}</td>
                            <td><strong>${user.name}</strong></td>
                            <td>${user.page}</td>
                            <td><span class="status-badge status-active">Active</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                } else {
                    offlineCount++;
                }
            });

            // Update Top 4 Boxes
            document.getElementById('activeCount').innerText = activeOnlineCount;
            document.getElementById('offlineCount').innerText = offlineCount;
            document.getElementById('loggedInCount').innerText = loggedInCount;
            document.getElementById('totalCount').innerText = totalRegistered;
        }

        // Simulate Navigation (Back Le Lene Par Ya Doosre Page Par Jane Par)
        function simulatePageChange(newPage) {
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));
            currentUser.page = newPage;
            currentUser.isActive = true; // Page changes keep user ACTIVE
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            renderDashboard();
        }

        // Simulate Logout/Inactive State
        function toggleCurrentUserStatus() {
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));
            currentUser.isActive = !currentUser.isActive;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            renderDashboard();
        }

        // Run application
        initDashboard();
    </script>
</body>
</html>
