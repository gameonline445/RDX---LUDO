<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX LUDO ADMIN - Strictly Realtime Monitor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card-bg {
            background-color: #1e293b;
            border: 1px solid #334155;
        }
        .pulse-dot {
            height: 12px;
            width: 12px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Top Header Navigation -->
    <header class="flex justify-between items-center pb-6 border-b border-slate-700 mb-6">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded-full text-sm">RDX</span>
            <h1 class="text-xl font-bold tracking-wide">RDX LUDO ADMIN</h1>
        </div>
        <button id="logoutBtn" onclick="handleLogout()" class="bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 px-4 py-1.5 rounded-full text-sm font-semibold transition">
            Logout
        </button>
    </header>

    <!-- Main Title & Sync Info -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-2">
        <div class="flex items-center space-x-3">
            <span class="pulse-dot"></span>
            <h2 class="text-2xl font-bold">Strictly Realtime Monitor</h2>
        </div>
        <div class="text-xs text-slate-400">
            Last sync: <span id="syncTime" class="text-slate-200 font-mono">--:--:-- --</span>
        </div>
    </div>

    <!-- Analytics Cards Row -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        
        <!-- Active Online Users Card -->
        <div class="card-bg p-5 rounded-2xl">
            <p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">ACTIVE ONLINE USERS</p>
            <h3 id="countOnline" class="text-4xl font-extrabold text-emerald-400">0</h3>
        </div>

        <!-- Logged In Users Card -->
        <div class="card-bg p-5 rounded-2xl">
            <p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">LOGGED IN USERS</p>
            <h3 id="countLoggedIn" class="text-4xl font-extrabold text-amber-400">0</h3>
        </div>

        <!-- Offline Users Card -->
        <div class="card-bg p-5 rounded-2xl">
            <p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">OFFLINE USERS</p>
            <h3 id="countOffline" class="text-4xl font-extrabold text-rose-400">0</h3>
        </div>

        <!-- Total Registered Card -->
        <div class="card-bg p-5 rounded-2xl">
            <p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">TOTAL REGISTERED</p>
            <h3 id="countTotal" class="text-4xl font-extrabold text-sky-400">0</h3>
        </div>

    </div>

    <!-- Controls Row (Filter Buttons & Search Box) -->
    <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4 mb-6">
        
        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-2" id="filterTabs">
            <button onclick="setFilter('all')" id="btn-all" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white transition">All Users</button>
            <button onclick="setFilter('online')" id="btn-online" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Online Only</button>
            <button onclick="setFilter('loggedin')" id="btn-loggedin" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Logged In Only</button>
            <button onclick="setFilter('offline')" id="btn-offline" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Offline Only</button>
        </div>

        <!-- Search Input -->
        <div class="w-full lg:w-80">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search Name, Phone, City..." class="w-full card-bg text-sm text-slate-100 placeholder-slate-500 px-4 py-2.5 rounded-xl focus:outline-none focus:border-blue-500 transition">
        </div>

    </div>

    <!-- Live Users Table Section -->
    <div class="card-bg rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-slate-700 bg-slate-800/50 text-slate-400 font-semibold text-xs tracking-wider uppercase">
                        <th class="p-4">USER</th>
                        <th class="p-4">MOBILE NUMBER</th>
                        <th class="p-4">STATUS</th>
                        <th class="p-4">CITY / LOCATION</th>
                        <th class="p-4">TOTAL BALANCE</th>
                        <th class="p-4">LAST ACTIVE</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody" class="divide-y divide-slate-800 text-slate-200">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-slate-400">Loading user activity data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Logic & Realtime Monitoring Script -->
    <script>
        // 1. Firebase Configuration (Aapka Firebase Config yahan Replace Karein)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Global State Array for Users
        let usersData = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // 2. Realtime Listener Setup
        function initRealtimeMonitor() {
            db.collection("customers").onSnapshot((snapshot) => {
                const now = Date.now();
                usersData = [];

                let onlineCount = 0;
                let loggedInCount = 0;
                let offlineCount = 0;
                let totalCount = snapshot.size;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const uid = doc.id;

                    // Extracted Properties with Fallbacks
                    const name = data.name || data.displayName || "User " + uid.substring(0, 4);
                    const mobile = data.mobile || data.phone || data.phoneNumber || uid;
                    const city = data.city || (data.location ? (data.location.city || data.location.state) : null) || "N/A";
                    const state = data.state || (data.location ? data.location.state : null) || "";
                    const fullLocation = state && city !== "N/A" ? `${city}, ${state}` : city;
                    const balance = data.balance !== undefined ? data.balance : (data.wallet !== undefined ? data.wallet : 0);

                    // Presence Status Calculation Logic
                    // heartbeat interval is assumed to be within 2 minutes (120,000 ms)
                    let lastActiveMs = 0;
                    if (data.lastActive) {
                        lastActiveMs = data.lastActive.toMillis ? data.lastActive.toMillis() : new Date(data.lastActive).getTime();
                    } else if (data.lastSeen) {
                        lastActiveMs = data.lastSeen.toMillis ? data.lastSeen.toMillis() : new Date(data.lastSeen).getTime();
                    }

                    const isExplicitLoggedOut = data.isLoggedIn === false || data.status === "offline";
                    const isRecentlyActive = (now - lastActiveMs) <= 120000; // 2 Minutes window

                    let computedStatus = "offline"; // Default

                    if (!isExplicitLoggedOut) {
                        if (isRecentlyActive) {
                            computedStatus = "online";
                            onlineCount++;
                        } else {
                            computedStatus = "loggedin";
                            loggedInCount++;
                        }
                    } else {
                        computedStatus = "offline";
                        offlineCount++;
                    }

                    usersData.push({
                        id: uid,
                        name: name,
                        mobile: mobile,
                        status: computedStatus,
                        location: fullLocation,
                        balance: balance,
                        lastActiveMs: lastActiveMs
                    });
                });

                // Update Overview Counters
                document.getElementById("countOnline").innerText = onlineCount;
                document.getElementById("countLoggedIn").innerText = loggedInCount;
                document.getElementById("countOffline").innerText = offlineCount;
                document.getElementById("countTotal").innerText = totalCount;

                // Update Time Tracker
                document.getElementById("syncTime").innerText = new Date().toLocaleTimeString();

                // Render Table View
                renderTable();
            }, (error) => {
                console.error("Firestore realtime listener failed:", error);
            });
        }

        // 3. Render Table Data
        function renderTable() {
            const tbody = document.getElementById("usersTableBody");
            tbody.innerHTML = "";

            // Filter logic
            let filtered = usersData.filter(user => {
                // Filter Button Match
                if (currentFilter !== 'all' && user.status !== currentFilter) {
                    return false;
                }
                // Search Input Match
                if (searchQuery.trim() !== "") {
                    const q = searchQuery.toLowerCase();
                    const matchName = user.name.toLowerCase().includes(q);
                    const matchMobile = String(user.mobile).toLowerCase().includes(q);
                    const matchLoc = user.location.toLowerCase().includes(q);
                    return matchName || matchMobile || matchLoc;
                }
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">No active users matching criteria.</td></tr>`;
                return;
            }

            // Sort by latest active first
            filtered.sort((a, b) => b.lastActiveMs - a.lastActiveMs);

            filtered.forEach(user => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/30 transition";

                // Format Status Badge
                let statusBadge = "";
                if (user.status === "online") {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Online</span>`;
                } else if (user.status === "loggedin") {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Logged In</span>`;
                } else {
                    statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Offline</span>`;
                }

                // Format Time Display
                let formattedTime = "N/A";
                if (user.lastActiveMs > 0) {
                    formattedTime = new Date(user.lastActiveMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }

                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-100">${user.name}</td>
                    <td class="p-4 font-mono text-slate-300">${user.mobile}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-slate-400">${user.location}</td>
                    <td class="p-4 font-bold text-slate-100">₹${user.balance}</td>
                    <td class="p-4 text-slate-400 font-mono text-xs">${formattedTime}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // Filter Handlers
        function setFilter(filterType) {
            currentFilter = filterType;
            const buttons = ['all', 'online', 'loggedin', 'offline'];
            buttons.forEach(b => {
                const btnElem = document.getElementById(`btn-${b}`);
                if (b === filterType) {
                    btnElem.className = "px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white transition";
                } else {
                    btnElem.className = "px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            renderTable();
        }

        // Search Handler
        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value;
            renderTable();
        }

        // Logout Handler
        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }

        // Initialize Realtime Sync on Load
        window.addEventListener("DOMContentLoaded", () => {
            initRealtimeMonitor();
        });
    </script>
</body>
</html>
