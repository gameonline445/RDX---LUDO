<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX LUDO ADMIN - Live Users Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

        .top-header { background-color: #ebf3fa; height: 60px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #d0e1f9; }
        .brand-logo-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo-img { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #1e3c72, #2a5298); display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 800; font-size: 13px; }
        .brand-title { color: #1a365d; font-size: 18px; font-weight: 800; }
        .logout-link { background-color: #fde8e8; color: #e53e3e; padding: 6px 20px; border-radius: 20px; text-decoration: none; font-weight: 700; font-size: 14px; border: 1px solid #fbb6b6; }

        .admin-layout { display: flex; flex: 1; }
        .sidebar { width: 250px; background-color: #ffffff; padding: 20px 12px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; border-right: 1px solid #e2e8f0; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; text-decoration: none; color: #4a5568; font-weight: 700; font-size: 14px; }
        .nav-item.active { background-color: #ebf8ff; color: #3182ce; border: 1px solid #bee3f8; }

        .main-content { flex: 1; background-color: #000000; padding: 24px; overflow-y: auto; max-width: 900px; }
        .dashboard-title { color: #3182ce; font-size: 30px; font-weight: 800; margin-bottom: 20px; }

        .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        .metric-card { background-color: #1a202c; padding: 18px 20px; border-radius: 16px; border: 1px solid #2d3748; }
        .card-label { font-size: 12px; font-weight: 700; color: #a0aec0; margin-bottom: 6px; }
        .card-value { font-size: 28px; font-weight: 900; }
        .val-green { color: #48bb78; }
        .val-blue { color: #4299e1; }

        .search-box { width: 100%; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 14px 18px; background: #1a202c; border: 1px solid #2d3748; border-radius: 12px; color: #ffffff; font-size: 14px; outline: none; }

        .users-table-container { background-color: #1a202c; border-radius: 16px; border: 1px solid #2d3748; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #2d3748; color: #cbd5e0; padding: 14px; font-weight: 700; }
        td { padding: 14px; border-bottom: 1px solid #2d3748; color: #e2e8f0; }

        .status-badge-on { background: #276749; color: #9ae6b4; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 12px; display: inline-block; }
        .status-badge-off { background: #742a2a; color: #feb2b2; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="brand-logo-container">
            <div class="brand-logo-img">RDX</div>
            <span class="brand-title">RDX LUDO ADMIN</span>
        </div>
        <a href="admin-login.html" class="logout-link">Logout</a>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <a href="admin-dashboard.html" class="nav-item"><i class="fa-solid fa-compass"></i> Dashboard</a>
            <a href="admin-live.html" class="nav-item active"><i class="fa-solid fa-tower-broadcast"></i> Live Users Monitor</a>
            <a href="admin-battles.html" class="nav-item"><i class="fa-solid fa-gamepad"></i> Battles Management</a>
            <a href="admin-kyc.html" class="nav-item"><i class="fa-solid fa-id-card"></i> KYC Requests</a>
            <a href="admin-deposits.html" class="nav-item"><i class="fa-solid fa-wallet"></i> Deposits</a>
            <a href="admin-withdrawals.html" class="nav-item"><i class="fa-solid fa-money-bill-transfer"></i> Withdrawals</a>
            <a href="admin-customers.html" class="nav-item"><i class="fa-solid fa-users"></i> Customers</a>
        </aside>

        <main class="main-content">
            <h1 class="dashboard-title">Live Active Users Monitor</h1>

            <div class="cards-grid">
                <div class="metric-card">
                    <div class="card-label">Currently Active Site Users</div>
                    <div class="card-value val-green" id="activeCount">0</div>
                </div>
                <div class="metric-card">
                    <div class="card-label">Total Registered Users</div>
                    <div class="card-value val-blue" id="totalCount">0</div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search active user by Mobile, Name, City, or State..." onkeyup="filterUsers()">
            </div>

            <div class="users-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Mobile</th>
                            <th>City</th>
                            <th>State</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="text-align:center;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allUsers = [];

        function listenLiveUsers() {
            db.collection("customers").onSnapshot(snapshot => {
                let active = 0;
                let total = snapshot.size;
                allUsers = [];

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isOnline = data.isOnline === true;
                    if (isOnline) active++;

                    allUsers.push({
                        name: data.name || data.username || "User",
                        mobile: data.mobile || data.phone || "N/A",
                        city: data.city || "Unknown",
                        state: data.state || "Unknown",
                        isOnline: isOnline
                    });
                });

                document.getElementById("activeCount").innerText = active;
                document.getElementById("totalCount").innerText = total;

                renderTable(allUsers);
            });
        }

        function renderTable(usersList) {
            const tbody = document.getElementById("usersTableBody");
            if (usersList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No users found.</td></tr>`;
                return;
            }

            tbody.innerHTML = usersList.map(u => `
                <tr>
                    <td><b>${u.name}</b></td>
                    <td>${u.mobile}</td>
                    <td>${u.city}</td>
                    <td>${u.state}</td>
                    <td>
                        <span class="${u.isOnline ? 'status-badge-on' : 'status-badge-off'}">
                            ${u.isOnline ? 'Active Live' : 'Offline'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function filterUsers() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.name.toLowerCase().includes(query) ||
                u.mobile.toLowerCase().includes(query) ||
                u.city.toLowerCase().includes(query) ||
                u.state.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        window.addEventListener("DOMContentLoaded", listenLiveUsers);
    </script>
</body>
</html>
