<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDX LUDO - Admin Live User Monitor</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
body{
    background:#0f172a;
    color:#f8fafc;
    min-height:100vh;
    padding:20px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    border-bottom:1px solid #1e293b;
    margin-bottom:20px;
}
.header h1{font-size:22px;color:#38bdf8;display:flex;align-items:center;gap:10px;}
.header .live-indicator{
    width:10px;
    height:10px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 10px #22c55e;
    display:inline-block;
}

/* STATS COUNTER - GRID OF 4 BOXES */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:16px;
    margin-bottom:24px;
}
.stat-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
}
.stat-card small{color:#94a3b8;font-size:11px;font-weight:800;letter-spacing:0.5px;}
.stat-card .val{font-size:28px;font-weight:900;}
.stat-online .val{color:#22c55e;}
.stat-loggedin .val{color:#f59e0b;}
.stat-offline .val{color:#ef4444;}
.stat-total .val{color:#38bdf8;}

/* CONTROLS & TABS */
.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:12px;
    flex-wrap:wrap;
}
.tabs{display:flex;gap:8px;}
.tab-btn{
    background:#1e293b;
    border:1px solid #334155;
    color:#94a3b8;
    padding:8px 16px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}
.tab-btn.active{background:#0284c7;color:white;border-color:#0284c7;}
.search-box input{
    background:#1e293b;
    border:1px solid #334155;
    color:white;
    padding:8px 14px;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

/* TABLE STYLES */
.table-container{
    background:#1e293b;
    border-radius:14px;
    border:1px solid #334155;
    overflow-x:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
    font-size:14px;
}
th{
    background:#0f172a;
    color:#94a3b8;
    font-weight:800;
    padding:14px 16px;
    border-bottom:1px solid #334155;
    white-space:nowrap;
}
td{
    padding:14px 16px;
    border-bottom:1px solid #334155;
    color:#e2e8f0;
    white-space:nowrap;
}
tr:last-child td{border-bottom:none;}
tr:hover{background:#26334d;}

/* BADGES */
.status-badge{
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:6px;
}
.status-online{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3);}
.status-offline{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);}
.dot{width:6px;height:6px;border-radius:50%;}
.status-online .dot{background:#22c55e;}
.status-offline .dot{background:#ef4444;}
</style>
</head>

<body>

<div class="header">
    <h1><span class="live-indicator"></span> Strict Realtime User Monitor</h1>
    <span style="font-size:13px; color:#94a3b8;" id="lastUpdated">Syncing...</span>
</div>

<div class="stats-grid">
    <div class="stat-card stat-online">
        <small>ACTIVE ONLINE USERS</small>
        <div class="val" id="countOnline">0</div>
    </div>
    <div class="stat-card stat-loggedin">
        <small>LOGGED IN USERS</small>
        <div class="val" id="countLoggedIn">0</div>
    </div>
    <div class="stat-card stat-offline">
        <small>OFFLINE USERS</small>
        <div class="val" id="countOffline">0</div>
    </div>
    <div class="stat-card stat-total">
        <small>TOTAL REGISTERED</small>
        <div class="val" id="countTotal">0</div>
    </div>
</div>

<div class="controls">
    <div class="tabs">
        <button class="tab-btn" onclick="switchFilter('all')" id="tabAll">All Users</button>
        <button class="tab-btn active" onclick="switchFilter('online')" id="tabOnline">Online Only</button>
        <button class="tab-btn" onclick="switchFilter('offline')" id="tabOffline">Offline Only</button>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterUsers()" placeholder="Search Name, Phone, City...">
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Mobile Number</th>
                <th>Status</th>
                <th>City</th>
                <th>State</th>
                <th>Total Balance</th>
                <th>Last Active</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr>
                <td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">Loading live user data...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

let allUsersData = [];
let currentFilter = 'online';

function listenToUserPresence() {
    firebaseDB.collection("customers").onSnapshot((snapshot) => {
        allUsersData = [];
        let onlineCount = 0;
        let loggedInCount = 0;
        let offlineCount = 0;
        const now = Date.now();

        snapshot.forEach((doc) => {
            const data = doc.data();
            
            // Mobile Number Fix
            let cleanMobile = String(data.mobile || doc.id).replace(/\D/g, "");
            if (cleanMobile.startsWith("91") && cleanMobile.length > 10) {
                cleanMobile = "+" + cleanMobile;
            } else if (cleanMobile.length === 10) {
                cleanMobile = "+91" + cleanMobile;
            } else {
                cleanMobile = "+" + cleanMobile;
            }

            // Strict Ping Check (15 Seconds Cutoff)
            let lastPingMs = 0;
            if (data.lastPing && data.lastPing.toDate) {
                lastPingMs = data.lastPing.toDate().getTime();
            } else if (data.lastSeenAt && data.lastSeenAt.toDate) {
                lastPingMs = data.lastSeenAt.toDate().getTime();
            }

            const isPingActive = (now - lastPingMs) < 15000;
            const isOnline = data.isOnline === true && isPingActive;
            
            // Logged in check (User who hasn't explicitly logged out)
            const isLoggedIn = data.isLoggedIn === true || data.isOnline === true || (now - lastPingMs) < 86400000;

            if (isOnline) {
                onlineCount++;
            } else {
                offlineCount++;
            }

            if (isLoggedIn) {
                loggedInCount++;
            }

            allUsersData.push({
                id: doc.id,
                name: data.name || ("User " + cleanMobile.slice(-4)),
                mobile: cleanMobile,
                isOnline: isOnline,
                isLoggedIn: isLoggedIn,
                city: data.city || "-",
                state: data.state || "-",
                balance: Number(data.balance || (Number(data.deposit || 0) + Number(data.winnings || 0))),
                lastSeen: lastPingMs ? new Date(lastPingMs) : null
            });
        });

        document.getElementById("countOnline").textContent = onlineCount;
        document.getElementById("countLoggedIn").textContent = loggedInCount;
        document.getElementById("countOffline").textContent = offlineCount;
        document.getElementById("countTotal").textContent = snapshot.size;
        document.getElementById("lastUpdated").textContent = "Last sync: " + new Date().toLocaleTimeString();

        renderTable();
    }, (error) => {
        console.error("Firestore Listen Error:", error);
    });
}

// Auto Refresh every 5 seconds to clear stale connections
setInterval(() => {
    if (allUsersData.length > 0) renderTable();
}, 5000);

function renderTable() {
    const tbody = document.getElementById("userTableBody");
    const searchTerm = document.getElementById("searchInput").value.toLowerCase();
    
    let filtered = allUsersData.filter(user => {
        if (currentFilter === 'online') return user.isOnline;
        if (currentFilter === 'offline') return !user.isOnline;
        return true;
    });

    if (searchTerm) {
        filtered = filtered.filter(u => 
            u.name.toLowerCase().includes(searchTerm) || 
            u.mobile.toLowerCase().includes(searchTerm) ||
            u.city.toLowerCase().includes(searchTerm) ||
            u.state.toLowerCase().includes(searchTerm)
        );
    }

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">No users currently active on the site.</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map(u => `
        <tr>
            <td style="font-weight:700;">${escapeHtml(u.name)}</td>
            <td>${escapeHtml(u.mobile)}</td>
            <td>
                ${u.isOnline 
                    ? `<span class="status-badge status-online"><span class="dot"></span> ONLINE</span>` 
                    : `<span class="status-badge status-offline"><span class="dot"></span> OFFLINE</span>`
                }
            </td>
            <td><strong style="color:#e2e8f0;">${escapeHtml(u.city)}</strong></td>
            <td><span style="color:#94a3b8;">${escapeHtml(u.state)}</span></td>
            <td style="color:#22c55e; font-weight:800;">₹${u.balance}</td>
            <td style="color:#94a3b8; font-size:12px;">${u.lastSeen ? u.lastSeen.toLocaleTimeString() : 'N/A'}</td>
        </tr>
    `).join('');
}

function switchFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (filter === 'all') document.getElementById('tabAll').classList.add('active');
    if (filter === 'online') document.getElementById('tabOnline').classList.add('active');
    if (filter === 'offline') document.getElementById('tabOffline').classList.add('active');
    renderTable();
}

function filterUsers() {
    renderTable();
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}

window.addEventListener("load", listenToUserPresence);
</script>

</body>
</html>
