<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Dashboard</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button, input{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-style:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f87171;
    color:white;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(248,113,113,0.3);
}
.menu-btn:active{transform:scale(0.95);}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{width:100%;height:100%;object-fit:cover;}

/* RIGHT SIDE 3 BUTTONS (EXACT PROFILE DESIGN MATCH) */
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
}
.header-icon{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:white;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:transform 0.15s ease;
}
.header-icon:active{transform:scale(0.92);}

.bell{background:#6366f1;}
.cash{background:#22c55e;}
.gift{background:#f97316;}

/* MAIN CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

/* BANNER */
.banner-card{
    background:linear-gradient(135deg,#0284c7,#0369a1);
    border-radius:20px;
    padding:20px;
    color:white;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(2,132,199,0.25);
    display:flex;
    align-items:center;
    justify-style:space-between;
}
.banner-text h2{font-size:20px;font-weight:900;}
.banner-text p{font-size:12px;opacity:0.9;margin-top:4px;font-weight:600;}
.banner-btn{
    background:#ffffff;
    color:#0284c7;
    border:0;
    padding:10px 16px;
    border-radius:12px;
    font-weight:900;
    font-size:12px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* WALLET CARD SUMMARY */
.wallet-summary{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:20px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-style:space-between;
    margin-bottom:20px;
    box-shadow:0 4px 14px rgba(2,132,199,0.05);
}
.wallet-info label{font-size:11px;font-weight:850;color:#64748b;text-transform:uppercase;}
.wallet-info h3{font-size:22px;font-weight:900;color:#0f172a;margin-top:2px;}
.add-cash-btn{
    background:#22c55e;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:12px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 4px 12px rgba(34,197,94,0.25);
}

/* GAME MODES GRID */
.section-title{font-size:12px;font-weight:900;color:#64748b;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;}
.games-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:20px;
}
.game-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:20px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(2,132,199,0.05);
    transition:transform 0.15s ease;
}
.game-card:active{transform:scale(0.97);}
.game-card-icon{
    width:50px;
    height:50px;
    border-radius:16px;
    background:#e0f2fe;
    color:#0284c7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    margin:0 auto 12px auto;
}
.game-card h3{font-size:15px;font-weight:900;color:#0f172a;}
.game-card p{font-size:11px;font-weight:600;color:#64748b;margin-top:2px;}

/* SIDE DRAWER */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}
.drawer-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1.5px solid #bae6fd;
}
.drawer-avatar img{width:100%;height:100%;object-fit:cover;}
.drawer-close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#ffffff;
    border:1.5px solid #bae6fd;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:16px;
}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-logout{background:linear-gradient(145deg,#ef4444,#dc2626);margin-top:10px;}

/* BOTTOM NAVIGATION (EXACT 4-BUTTON BAR) */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-style:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#1e293b;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#38bdf8;}
.icon-profile{background:#f97316;}
</style>
</head>

<body>

<script>
window.addEventListener("pageshow", function (event) {
    if (event.persisted || (performance && performance.navigation.type === 2)) {
        window.location.reload();
    }
});

if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
<div class="drawer" id="sideDrawer">
    <div class="drawer-header">
        <div class="drawer-user">
            <div class="drawer-avatar">
                <img src="logo.png" alt="RDX Logo" onerror="this.style.display='none'">
            </div>
            <div>
                <h4 style="font-size:14px; font-weight:900; color:#0c4a6e;" id="drawerName">User</h4>
                <small style="color:#64748b; font-weight:700;" id="drawerMobile">+91**********</small>
            </div>
        </div>
        <button class="drawer-close" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-links">
        <button class="drawer-item" onclick="window.location.replace('dashboard.html')"><div class="drawer-item-icon menu-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="drawer-item" onclick="window.location.replace('profile.html')"><div class="drawer-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><span>My Profile</span></button>
        <button class="drawer-item" onclick="window.location.replace('wallet.html')"><div class="drawer-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><span>My Wallet</span></button>
        <button class="drawer-item" onclick="window.location.replace('referral.html')"><div class="drawer-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><span>Refer & Earn</span></button>
        <button class="drawer-item" onclick="window.location.replace('history.html')"><div class="drawer-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><span>History</span></button>
        <button class="drawer-item" onclick="window.location.replace('notification.html')"><div class="drawer-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><span>Notifications</span></button>
        <button class="drawer-item" onclick="window.location.replace('support.html')"><div class="drawer-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="drawer-item" onclick="logout()"><div class="drawer-item-icon menu-logout"><i class="fa-solid fa-right-from-bracket"></i></div><span>Logout</span></button>
    </div>
</div>

<!-- TOP HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="window.location.replace('dashboard.html')">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    
    <!-- 3 HEADER BUTTONS (EXACTLY MATCHES PROFILE HTML) -->
    <div class="header-right">
        <button class="header-icon bell" onclick="window.location.replace('notification.html')"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon cash" onclick="window.location.replace('wallet.html')"><i class="fa-solid fa-wallet"></i></button>
        <button class="header-icon gift" onclick="window.location.replace('referral.html')"><i class="fa-solid fa-gift"></i></button>
    </div>
</header>

<main class="container">
    <div class="banner-card">
        <div class="banner-text">
            <h2>Play & Earn Cash!</h2>
            <p>Join live Ludo battles & win instant rewards.</p>
        </div>
        <button class="banner-btn" onclick="window.location.replace('referral.html')">Refer Now</button>
    </div>

    <div class="wallet-summary">
        <div class="wallet-info">
            <label>Total Balance</label>
            <h3 id="dashBalance">₹0.00</h3>
        </div>
        <button class="add-cash-btn" onclick="window.location.replace('wallet.html')"><i class="fa-solid fa-plus"></i> Add Cash</button>
    </div>

    <div class="section-title">CHOOSE GAME MODE</div>
    <div class="games-grid">
        <div class="game-card" onclick="window.location.replace('classic.html')">
            <div class="game-card-icon"><i class="fa-solid fa-dice"></i></div>
            <h3>Classic Ludo</h3>
            <p>Traditional 4-pawn game</p>
        </div>

        <div class="game-card" onclick="window.location.replace('quick.html')">
            <div class="game-card-icon"><i class="fa-solid fa-bolt"></i></div>
            <h3>Quick Ludo</h3>
            <p>Fast 1-pawn battle</p>
        </div>

        <div class="game-card" onclick="window.location.replace('tournaments.html')">
            <div class="game-card-icon"><i class="fa-solid fa-trophy"></i></div>
            <h3>Tournaments</h3>
            <p>Big prize pools</p>
        </div>

        <div class="game-card" onclick="window.location.replace('private.html')">
            <div class="game-card-icon"><i class="fa-solid fa-users"></i></div>
            <h3>Private Room</h3>
            <p>Play with friends</p>
        </div>
    </div>
</main>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

function loadDashboardData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    firebaseDB.collection("customers").doc(docId).onSnapshot((doc) => {
        if (doc.exists) {
            const d = doc.data();
            const fullName = String(d.name || ("User " + userId.slice(-4))).trim();
            const walletBal = parseFloat(d.wallet || d.balance || 0).toFixed(2);

            document.getElementById("drawerName").textContent = fullName;
            document.getElementById("drawerMobile").textContent = "+" + userId;
            document.getElementById("dashBalance").textContent = "₹" + walletBal;
        }
    });
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        firebaseDB.collection("customers").doc(docId).set({ isOnline: false }, { merge: true });
    }
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
}

window.addEventListener("load", () => {
    loadDashboardData();
});
</script>

</body>
</html>
