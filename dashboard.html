<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      viewport-fit=cover">

<title>RDX LUDO - Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;

    background:#f7f9ff;
    color:#101a38;

    min-height:100vh;
}

button{
    font:inherit;
}


/* ================= HEADER ================= */

.top-header{

    height:76px;

    background:
    linear-gradient(110deg,#eef4ff,#ffffff);

    border-bottom:1px solid #cbd8f0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    position:sticky;
    top:0;

    z-index:100;

    box-shadow:
    0 5px 18px rgba(36,75,150,.08);
}

.header-left{

    display:flex;
    align-items:center;
    gap:12px;
}


/* MENU BUTTON */

.menu-btn{

    width:48px;
    height:48px;

    border:0;
    border-radius:16px;

    background:
    linear-gradient(145deg,#ff7165,#ff8a70);

    color:white;

    font-size:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 6px 15px rgba(255,93,80,.25);

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}


/* LOGO */

.logo{

    width:48px;
    height:48px;

    border-radius:50%;

    background:
    linear-gradient(145deg,#ffffff,#e7efff);

    border:3px solid #d3e1ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#1762df;

    font-size:13px;
    font-weight:900;

    box-shadow:
    0 5px 12px rgba(36,93,190,.15);
}


/* HEADER RIGHT */

.header-right{

    display:flex;
    align-items:center;
    gap:9px;
}

.header-icon{

    width:48px;
    height:48px;

    border:0;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    cursor:pointer;

    color:white;

    box-shadow:
    0 6px 15px rgba(0,0,0,.12);

    -webkit-tap-highlight-color:transparent;
}


/* NOTIFICATION */

.notification{

    background:
    linear-gradient(145deg,#746df4,#817eff);
}


/* WALLET */

.wallet-top{

    background:
    linear-gradient(145deg,#20c36b,#43d77e);

    min-width:72px;

    padding:0 12px;

    font-size:17px;

    font-weight:800;
}


/* REFER */

.redeem-top{

    background:
    linear-gradient(145deg,#ff8a35,#ffad45);

    min-width:72px;

    padding:0 12px;

    font-size:17px;

    font-weight:800;
}


/* ================= MAIN ================= */

.container{

    width:100%;

    max-width:850px;

    margin:auto;

    padding:
    0 18px
    125px;
}


/* ================= WELCOME ================= */

.welcome{

    padding-top:35px;
}

.welcome h1{

    font-size:29px;

    font-weight:850;

    letter-spacing:-.7px;
}

.welcome p{

    margin-top:8px;

    color:#71809d;

    font-size:17px;
}


/* ================= REFERRAL ================= */

.referral{

    margin-top:30px;

    min-height:140px;

    border:1.5px solid #abc2f4;

    border-radius:27px;

    padding:28px 25px;

    background:
    radial-gradient(
        circle at 100% 0%,
        #dce8ff,
        transparent 40%
    ),
    linear-gradient(
        135deg,
        #eef4ff,
        #ffffff
    );

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
    0 15px 35px rgba(40,88,175,.10);

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.referral:active{

    transform:scale(.99);
}

.referral small{

    display:block;

    color:#61708c;

    font-weight:800;

    letter-spacing:1.5px;

    font-size:13px;
}

.referral strong{

    display:block;

    margin-top:8px;

    font-size:38px;

    letter-spacing:-1px;
}

.referral-text{

    color:#52627f;

    font-size:15px;

    margin-top:2px;
}

.referral-arrow{

    width:56px;
    height:56px;

    border-radius:50%;

    background:#2868e8;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:29px;

    box-shadow:
    0 10px 22px rgba(40,104,232,.28);
}


/* ================= SECTION ================= */

.section-head{

    margin-top:38px;

    margin-bottom:16px;
}

.section-head small{

    color:#2564da;

    font-size:14px;

    font-weight:850;

    letter-spacing:2px;
}

.section-head h2{

    margin-top:6px;

    font-size:25px;
}


/* ================= GAME ================= */

.game-card{

    height:290px;

    border-radius:26px;

    overflow:hidden;

    position:relative;

    background:#111;

    box-shadow:
    0 15px 35px rgba(0,0,0,.18);
}

.game-card img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.game-overlay{

    position:absolute;

    inset:0;

    padding:25px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    color:white;

    background:
    linear-gradient(
        0deg,
        rgba(0,0,0,.78),
        rgba(0,0,0,.02) 70%
    );
}

.live{

    width:max-content;

    padding:7px 13px;

    border-radius:20px;

    background:#15944d;

    color:white;

    font-size:12px;

    font-weight:800;
}

.game-overlay h3{

    margin-top:12px;

    font-size:29px;
}

.game-overlay p{

    margin-top:5px;

    font-size:14px;

    color:#e8edf7;
}


/* PLAY BUTTON */

.play-btn{

    margin-top:16px;

    width:max-content;

    padding:12px 22px;

    border:0;

    border-radius:25px;

    background:#2770ee;

    color:white;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(39,112,238,.30);

    -webkit-tap-highlight-color:transparent;
}

.play-btn:active{

    transform:scale(.96);
}


/* ================= COMING SOON ================= */

.soon-card{

    margin-top:16px;

    min-height:120px;

    padding:16px;

    background:#fff;

    border:1px solid #dce2ed;

    border-radius:23px;

    display:flex;

    align-items:center;

    gap:15px;

    box-shadow:
    0 8px 20px rgba(30,60,120,.05);
}

.soon-card img{

    width:82px;
    height:82px;

    object-fit:cover;

    border-radius:17px;
}

.soon-info{

    flex:1;
}

.soon-info h3{

    font-size:19px;
}

.soon-info p{

    margin-top:5px;

    color:#75819a;

    font-size:14px;
}

.soon-badge{

    background:#f3f5f9;

    border:1px solid #dce1e9;

    color:#65718a;

    padding:9px 12px;

    border-radius:20px;

    font-size:11px;

    font-weight:800;
}


/* ================= SIDE MENU ================= */

.menu-panel{

    position:fixed;

    top:0;
    left:-100%;

    width:73%;
    max-width:430px;

    height:100vh;

    background:
    linear-gradient(
        180deg,
        #ffffff 0%,
        #ffffff 75%,
        #f9fbff 100%
    );

    z-index:300;

    padding:22px 22px 110px;

    overflow-y:auto;

    box-shadow:
    10px 0 35px rgba(0,0,0,.16);

    transition:left .3s ease;
}

.menu-panel.open{

    left:0;
}


/* MENU HEADER */

.menu-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:5px 2px 24px;

    margin-bottom:2px;

    border-bottom:1px solid #e1e6f0;
}

.menu-brand{

    display:flex;

    align-items:center;

    gap:13px;
}

.menu-logo{

    width:58px;
    height:58px;

    border-radius:50%;

    background:
    linear-gradient(145deg,#ffffff,#e7efff);

    border:3px solid #d3e1ff;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#1762df;

    font-size:16px;

    font-weight:900;

    box-shadow:
    0 6px 15px rgba(36,93,190,.15);
}

.menu-user h2{

    font-size:22px;

    font-weight:850;

    color:#101a38;
}

.menu-user p{

    margin-top:4px;

    color:#71809d;

    font-size:14px;
}

.close-menu{

    border:0;

    background:#f6f7fb;

    border:1px solid #e0e5ee;

    width:52px;
    height:52px;

    border-radius:50%;

    font-size:30px;

    line-height:1;

    color:#64718a;

    cursor:pointer;
}


/* MENU ITEMS */

.menu-list{

    margin-top:22px;
}

.menu-item{

    width:100%;

    min-height:76px;

    border:1px solid #e1e5ed;

    background:
    linear-gradient(145deg,#ffffff,#fbfcff);

    padding:12px 17px;

    border-radius:22px;

    margin-bottom:12px;

    display:flex;

    align-items:center;

    gap:17px;

    text-align:left;

    color:#17213a;

    cursor:pointer;

    box-shadow:
    0 4px 12px rgba(30,55,100,.04);

    transition:.18s;
}

.menu-item:active{

    transform:scale(.98);
}

.menu-item-icon{

    width:52px;
    height:52px;

    flex:0 0 52px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:24px;

    box-shadow:
    0 7px 16px rgba(30,60,120,.16);
}

.menu-home{
    background:linear-gradient(145deg,#716df5,#817eff);
}

.menu-profile{
    background:linear-gradient(145deg,#ff743e,#ff9c39);
}

.menu-wallet{
    background:linear-gradient(145deg,#18b965,#43d77e);
}

.menu-refer{
    background:linear-gradient(145deg,#ff8a35,#ffb044);
}

.menu-history{
    background:linear-gradient(145deg,#7259df,#9868f3);
}

.menu-notification{
    background:linear-gradient(145deg,#6679f5,#7d8cff);
}

.menu-support{
    background:linear-gradient(145deg,#12b8e0,#27c9ef);
}

.menu-item-text{

    flex:1;

    font-size:18px;

    font-weight:750;
}

.menu-arrow{

    color:#69768e;

    font-size:28px;

    font-weight:300;
}


/* MENU OVERLAY */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(17,29,55,.30);

    backdrop-filter:blur(3px);

    z-index:250;

    display:none;
}

.menu-overlay.show{

    display:block;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{

    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    height:82px;

    background:
    rgba(255,255,255,.97);

    border-top:1px solid #d6deee;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:200;

    box-shadow:
    0 -5px 20px rgba(30,65,130,.08);

    backdrop-filter:blur(15px);
}

.nav-item{

    width:25%;

    height:100%;

    border:0;

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#66738d;

    font-size:13px;

    cursor:pointer;
}

.nav-icon{

    width:44px;
    height:44px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;
}

.nav-item.active{

    color:#202d49;

    font-weight:700;
}

.nav-item.active .nav-icon{

    background:#536df5;

    color:white;

    box-shadow:
    0 7px 17px rgba(83,109,245,.3);
}


/* ================= TOAST ================= */

.toast{

    position:fixed;

    left:50%;
    top:90px;

    transform:
    translateX(-50%)
    translateY(-20px);

    background:#182440;

    color:white;

    padding:13px 18px;

    border-radius:14px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:500;

    font-size:14px;
}

.toast.show{

    opacity:1;

    transform:
    translateX(-50%)
    translateY(0);
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .top-header{

        height:70px;

        padding:0 12px;
    }

    .menu-btn{

        width:46px;
        height:46px;

        font-size:25px;
    }

    .logo{

        width:45px;
        height:45px;

        font-size:12px;
    }

    .header-right{

        gap:6px;
    }

    .header-icon{

        width:44px;
        height:44px;

        border-radius:16px;
    }

    .wallet-top,
    .redeem-top{

        min-width:48px;

        padding:0;

        font-size:0;
    }

    .wallet-top::before{

        content:"💰";

        font-size:20px;
    }

    .redeem-top::before{

        content:"🎁";

        font-size:20px;
    }

    .container{

        padding:
        0 12px
        105px;
    }

    .welcome{

        padding-top:30px;
    }

    .welcome h1{

        font-size:27px;
    }

    .welcome p{

        font-size:15px;
    }

    .referral{

        min-height:130px;

        padding:22px;

        border-radius:23px;
    }

    .referral strong{

        font-size:34px;
    }

    .referral-arrow{

        width:50px;
        height:50px;
    }

    .game-card{

        height:235px;

        border-radius:23px;
    }

    .game-overlay{

        padding:20px;
    }

    .game-overlay h3{

        font-size:25px;
    }

    .soon-card{

        min-height:105px;
    }

    .soon-card img{

        width:70px;
        height:70px;
    }

    .soon-badge{

        padding:7px 9px;

        font-size:10px;
    }

    .bottom-nav{

        height:78px;
    }


    /* MOBILE MENU */

    .menu-panel{

        width:78%;

        max-width:390px;

        padding:
        20px 16px 105px;
    }

    .menu-logo{

        width:54px;
        height:54px;
    }

    .menu-user h2{

        font-size:20px;
    }

    .menu-user p{

        font-size:13px;
    }

    .close-menu{

        width:48px;
        height:48px;

        font-size:27px;
    }

    .menu-item{

        min-height:72px;

        border-radius:20px;

        padding:10px 14px;

        gap:14px;
    }

    .menu-item-icon{

        width:48px;
        height:48px;

        flex-basis:48px;

        border-radius:16px;

        font-size:22px;
    }

    .menu-item-text{

        font-size:17px;
    }

    .menu-arrow{

        font-size:25px;
    }

}

</style>

</head>

<script>


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
    localStorage.getItem("rdxUsername");

/* =====================================================
   MENU
===================================================== */

function openMenu(){

    document
    .getElementById("menuPanel")
    .classList.add("open");


    document
    .getElementById("menuOverlay")
    .classList.add("show");

}


function closeMenu(){

    document
    .getElementById("menuPanel")
    .classList.remove("open");


    document
    .getElementById("menuOverlay")
    .classList.remove("show");

}



/* =====================================================
   HOME
===================================================== */

function goHome(){

    closeMenu();

    window.location.href =

}

/* =====================================================
   TOAST
===================================================== */

function showMessage(message){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add("show");


    setTimeout(function(){

        toast.classList.remove("show");

    },1800);

}
