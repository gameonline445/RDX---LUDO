<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Dashboard</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
  authDomain: "rdx-ludo.firebaseapp.com",
  projectId: "rdx-ludo",
  storageBucket: "rdx-ludo.firebasestorage.app",
  messagingSenderId: "928340814840",
  appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

let firebaseDB = null;
try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firebaseDB = firebase.firestore();
} catch (error) {
    console.error("Firebase error:", error);
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f9ff;color:#101a38;min-height:100vh;}
button{font:inherit;}

/* TOP HEADER */
.top-header{height:66px;background:linear-gradient(110deg,#eef4ff,#ffffff);border-bottom:1px solid #cbd8f0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(36,75,150,.06);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:white;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(255,93,80,.22);cursor:pointer;}

.logo{width:44px;height:44px;border-radius:50%;background:#ffffff;border:2.5px solid #d3e1ff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(36,93,190,.12);cursor:pointer;overflow:hidden;}
.logo img{width:100%;height:100%;object-fit:cover;}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{height:38px;border:0;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:white;box-shadow:0 4px 12px rgba(0,0,0,.10);padding:0 12px;gap:5px;}
.notification{width:38px;padding:0;border-radius:50%;background:linear-gradient(145deg,#746df4,#817eff);}
.wallet-top{background:linear-gradient(145deg,#20c36b,#43d77e);font-size:13px;font-weight:800;}
.redeem-top{background:linear-gradient(145deg,#ff8a35,#ffad45);font-size:13px;font-weight:800;}

/* MAIN CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px 110px;}

.welcome{padding-top:10px;}
.welcome h1{font-size:22px;font-weight:900;letter-spacing:-.4px;color:#0f172a;}
.welcome p{margin-top:3px;color:#64748b;font-size:13px;font-weight:500;}

/* REFERRAL CARD */
.referral{margin-top:16px;border:1.5px solid #cbdcf7;border-radius:20px;padding:16px 18px;background:linear-gradient(135deg,#f0f5ff 0%,#ffffff 100%);display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 20px rgba(40,88,175,.06);cursor:pointer;}
.referral:active{transform:scale(.99);}
.referral small{display:block;color:#64748b;font-weight:800;letter-spacing:1px;font-size:11px;}
.referral strong{display:block;margin-top:2px;font-size:24px;font-weight:900;letter-spacing:-.5px;color:#0f172a;}
.referral-text{color:#64748b;font-size:12px;margin-top:2px;}
.referral-arrow{width:42px;height:42px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 15px rgba(37,99,235,.28);}

.section-head{margin-top:22px;margin-bottom:10px;}
.section-head small{color:#2564da;font-size:11px;font-weight:850;letter-spacing:1.5px;}
.section-head h2{margin-top:2px;font-size:18px;font-weight:900;}

/* GAME CARD */
.game-card{height:185px;border-radius:20px;overflow:hidden;position:relative;background:#111;box-shadow:0 10px 25px rgba(0,0,0,.12);cursor:pointer;}
.game-card:active{transform:scale(0.99);}
.game-card img{width:100%;height:100%;object-fit:cover;}
.game-overlay{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:white;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.75) 100%);}

.live{width:max-content;padding:4px 9px;border-radius:12px;background:rgba(22,163,74,0.85);backdrop-filter:blur(4px);color:white;font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px;}
.game-bottom-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%;}
.game-info-left h3{font-size:18px;font-weight:900;}
.game-info-left p{margin-top:2px;font-size:11px;color:#e2e8f0;}

.play-btn{padding:8px 18px;border:0;border-radius:18px;background:#2563eb;color:white;font-size:13px;font-weight:850;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.4);display:flex;align-items:center;gap:5px;}

/* COMING SOON CARD */
.soon-card{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 15px rgba(30,60,120,.03);}
.soon-card img{width:56px;height:56px;object-fit:cover;border-radius:14px;}
.soon-info{flex:1;}
.soon-info h3{font-size:15px;font-weight:800;}
.soon-info p{margin-top:2px;color:#64748b;font-size:12px;}
.soon-badge{background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;padding:6px 10px;border-radius:14px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px;}

/* SIDE MENU */
.menu-panel{position:fixed;top:0;left:-100%;width:75%;max-width:360px;height:100vh;background:#ffffff;z-index:300;padding:20px 16px 100px;overflow-y:auto;box-shadow:10px 0 35px rgba(0,0,0,.16);transition:left .3s ease;}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e2e8f0;}
.menu-brand{display:flex;align-items:center;gap:10px;}
.menu-logo{width:46px;height:46px;border-radius:50%;border:2px solid #d3e1ff;cursor:pointer;overflow:hidden;}
.menu-logo img{width:100%;height:100%;object-fit:cover;}
.menu-user h2{font-size:17px;font-weight:850;}
.menu-user p{margin-top:2px;color:#64748b;font-size:12px;}
.close-menu{border:0;background:#f1f5f9;width:38px;height:38px;border-radius:50%;font-size:22px;color:#64748b;cursor:pointer;}
.menu-list{margin-top:16px;}
.menu-item{width:100%;min-height:56px;border:1px solid #e2e8f0;background:#fafbfe;padding:8px 12px;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;text-align:left;color:#1e293b;cursor:pointer;}
.menu-item-icon{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:17px;}
.menu-home{background:linear-gradient(145deg,#716df5,#817eff);}
.menu-profile{background:linear-gradient(145deg,#ff743e,#ff9c39);}
.menu-wallet{background:linear-gradient(145deg,#18b965,#43d77e);}
.menu-refer{background:linear-gradient(145deg,#ff8a35,#ffb044);}
.menu-history{background:linear-gradient(145deg,#7259df,#9868f3);}
.menu-notification{background:linear-gradient(145deg,#6679f5,#7d8cff);}
.menu-support{background:linear-gradient(145deg,#12b8e0,#27c9ef);}
.menu-item-text{flex:1;font-size:15px;font-weight:750;}
.menu-arrow{color:#94a3b8;font-size:20px;}
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);z-index:250;display:none;}
.menu-overlay.show{display:block;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:68px;background:rgba(255,255,255,.98);border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#64748b;font-size:11px;cursor:pointer;}
.nav-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.nav-item.active{color:#2563eb;font-weight:800;}
.nav-item.active .nav-icon{background:#eff6ff;color:#2563eb;}
</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <!-- Logo Image with Refresh to Home -->
        <div class="logo" onclick="goHome()">
            <img src="logo.png" alt="RDX Logo" onerror="this.onerror=null; this.parentElement.innerHTML='RDX';">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="goNotifications()">🔔</button>
        <button class="header-icon wallet-top" onclick="goWallet()">🪙 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="goRedeem()">🎁 <span id="topRedeem">0</span></button>
    </div>
</header>

<!-- SIDE MENU -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <div class="menu-logo" onclick="goHome()">
                <img src="logo.png" alt="RDX Logo" onerror="this.onerror=null; this.parentElement.innerHTML='RDX';">
            </div>
            <div class="menu-user">
                <h2 id="menuUsername">RDX LUDO</h2>
                <p>Play · Win · Earn</p>
            </div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>

    <div class="menu-list">
        <button class="menu-item" onclick="goHome()"><div class="menu-item-icon menu-home">🏠</div><div class="menu-item-text">Home</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goProfile()"><div class="menu-item-icon menu-profile">👤</div><div class="menu-item-text">My Profile</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goWallet()"><div class="menu-item-icon menu-wallet">💰</div><div class="menu-item-text">My Wallet</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goRedeem()"><div class="menu-item-icon menu-refer">🎁</div><div class="menu-item-text">Refer & Earn</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goHistory()"><div class="menu-item-icon menu-history">↻</div><div class="menu-item-text">History</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goNotifications()"><div class="menu-item-icon menu-notification">🔔</div><div class="menu-item-text">Notifications</div><div class="menu-arrow">›</div></button>
        <button class="menu-item" onclick="goSupport()"><div class="menu-item-icon menu-support">🎧</div><div class="menu-item-text">Support</div><div class="menu-arrow">›</div></button>
    </div>
</div>

<!-- MAIN CONTENT -->
<main class="container">
    <section class="welcome">
        <h1 id="username">Hey, Shyam</h1>
        <p>Welcome to RDX LUDO</p>
    </section>

    <!-- REFERRAL -->
    <section class="referral" onclick="goRedeem()">
        <div>
            <small>REFER & EARN</small>
            <strong>2% Refer</strong>
            <div class="referral-text">Invite friends and earn rewards</div>
        </div>
        <div class="referral-arrow">↗</div>
    </section>

    <div class="section-head">
        <small>GAMES</small>
        <h2>Play Your Game</h2>
    </div>

    <!-- GAME CARD (Full Card Click to Battle) -->
    <article class="game-card" onclick="goBattles()">
        <img src="ludo-classic.jpg" alt="Ludo Classic" onerror="this.src='https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=600&auto=format&fit=crop';">
        <div class="game-overlay">
            <span class="live">● LIVE</span>
            <div class="game-bottom-row">
                <div class="game-info-left">
                    <h3>Ludo Classic</h3>
                    <p>Ludo game</p>
                </div>
                <!-- Play button placed on the bottom right corner -->
                <button class="play-btn" onclick="event.stopPropagation(); goBattles();">
                    ▶ Play
                </button>
            </div>
        </div>
    </article>

    <!-- SOON CARD -->
    <section class="soon-card">
        <img src="ludo-1-goti.jpg" alt="1 Goti Ludo" onerror="this.src='https://images.unsplash.com/photo-1511512578047-dfb367046420?w=200&auto=format&fit=crop';">
        <div class="soon-info">
            <h3>1 Goti Ludo</h3>
            <p>Coming soon</p>
        </div>
        <span class="soon-badge">🔒 SOON</span>
    </section>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="goHome()"><div class="nav-icon">🏠</div><span>Home</span></button>
    <button class="nav-item" onclick="goWallet()"><div class="nav-icon">💰</div><span>Wallet</span></button>
    <button class="nav-item" onclick="goSupport()"><div class="nav-icon">🎧</div><span>Support</span></button>
    <button class="nav-item" onclick="goProfile()"><div class="nav-icon">👤</div><span>Profile</span></button>
</nav>

<script>
async function loadFirebaseCustomer(){
    try {
        if(!firebaseDB) return;
        let mobile = localStorage.getItem("rdxFirebaseUserId") || 
                     localStorage.getItem("rdxVerifiedMobile") || 
                     localStorage.getItem("rdxUserMobile");
        if(!mobile) return;
        const cleanMobile = String(mobile).replace(/\D/g,"");
        let firebaseDocId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

        const userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        const snapshot = await userRef.get();
        if(!snapshot.exists) return;

        const data = snapshot.data();
        let balance = Number(data.balance || 0);
        document.getElementById("topBalance").textContent = balance;
        let redeem = Number(data.redeemBalance || data.redeem || data.referralBalance || 0);
        document.getElementById("topRedeem").textContent = redeem;

        let username = data.name || data.fullName || data.username || localStorage.getItem("rdxUsername") || ("User " + firebaseDocId.slice(-4));
        username = String(username).trim();
        document.getElementById("username").textContent = "Hey, " + username;
        document.getElementById("menuUsername").textContent = username;

        localStorage.setItem("rdxUsername", username);
        localStorage.setItem("rdxBalance", String(balance));
    } catch(error){
        console.error(error);
    }
}

window.addEventListener("load", loadFirebaseCustomer);

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }

function goHome(){ closeMenu(); window.location.href = "./dashboard.html"; }
function goBattles(){ closeMenu(); window.location.href = "./battles.html"; }
function goWallet(){ closeMenu(); window.location.href = "./wallet.html"; }
function goSupport(){ closeMenu(); window.location.href = "./support.html"; }
function goProfile(){ closeMenu(); window.location.href = "./profile.html"; }
function goRedeem(){ closeMenu(); window.location.href = "./referral.html"; }
function goHistory(){ closeMenu(); window.location.href = "./history.html"; }
function goNotifications(){ closeMenu(); window.location.href = "./notification.html"; }
</script>
</body>
