<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 12px rgba(255,93,80,.22);
    cursor:pointer;
}

.logo{
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#dbeafe);
    border:2.5px solid #93c5fd;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0284c7;
    font-size:12px;
    font-weight:900;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
    cursor:pointer;
}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    height:38px;
    border:0;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
    color:white;
    box-shadow:0 4px 12px rgba(0,0,0,.10);
    padding:0 12px;
    gap:5px;
}
.notification{width:38px;padding:0;border-radius:50%;background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);font-size:13px;font-weight:800;}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);font-size:13px;font-weight:800;}

/* MAIN */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px 115px;}
.welcome{padding-top:10px;}
.welcome h1{font-size:22px;font-weight:900;letter-spacing:-.4px;color:#0369a1;}
.welcome p{margin-top:3px;color:#64748b;font-size:13px;font-weight:500;}

.referral{
    margin-top:16px;
    border:1.5px solid #7dd3fc;
    border-radius:20px;
    padding:16px 18px;
    background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 22px rgba(2,132,199,0.10);
    cursor:pointer;
}
.referral:active{transform:scale(.99);}
.referral small{display:block;color:#0284c7;font-weight:800;letter-spacing:1px;font-size:11px;}
.referral strong{display:block;margin-top:2px;font-size:24px;font-weight:900;letter-spacing:-.5px;color:#0c4a6e;}
.referral-text{color:#64748b;font-size:12px;margin-top:2px;}
.referral-arrow{width:42px;height:42px;border-radius:50%;background:#0284c7;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 16px rgba(2,132,199,0.35);}

.section-head{margin-top:22px;margin-bottom:10px;}
.section-head small{color:#0284c7;font-size:11px;font-weight:850;letter-spacing:1.5px;}
.section-head h2{margin-top:2px;font-size:18px;font-weight:900;color:#0f172a;}

/* GAME CARD */
.game-card{
    height:185px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:#111;
    border:0;
    box-shadow:0 10px 25px rgba(0,0,0,0.18);
    cursor:pointer;
}
.game-card:active{transform:scale(0.99);}
.game-card img{width:100%;height:100%;object-fit:cover;}
.game-overlay{
    position:absolute;
    inset:0;
    padding:14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:white;
    background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.65) 100%);
}

@keyframes slowPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(34, 197, 94, 0.9); transform: scale(1); }
    50% { opacity: 0.35; box-shadow: 0 0 2px rgba(34, 197, 94, 0.2); transform: scale(0.97); }
}

.live{
    width:max-content;
    padding:4px 10px;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-size:10px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:4px;
    animation: slowPulse 1.8s ease-in-out infinite;
}

.game-bottom-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%;}
.game-info-left h3{font-size:18px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,0.6);}
.game-info-left p{margin-top:2px;font-size:11px;color:#e2e8f0;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.play-btn{padding:8px 18px;border:0;border-radius:18px;background:#2563eb;color:white;font-size:13px;font-weight:850;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.4);display:flex;align-items:center;gap:5px;}

.soon-card{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 15px rgba(30,60,120,.03);}
.soon-card img{width:56px;height:56px;object-fit:cover;border-radius:14px;}
.soon-info{flex:1;}
.soon-info h3{font-size:15px;font-weight:800;}
.soon-info p{margin-top:2px;color:#64748b;font-size:12px;}
.soon-badge{background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;padding:6px 10px;border-radius:14px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px;}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#6366f1;}
</style>
</head>

<body>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <div class="logo" onclick="goHome()">RDX</div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="goNotifications()">🔔</button>
        <button class="header-icon wallet-top" onclick="goWallet()">🪙 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="goRedeem()">🎁 <span id="topRedeem">0</span></button>
    </div>
</header>

<main class="container">
    <section class="welcome">
        <h1 id="username">Hey, User</h1>
        <p>Welcome to RDX LUDO</p>
    </section>

    <section class="referral" onclick="goRedeem()">
        <div>
            <small>REFER & EARN</small>
            <strong>2% Refer</strong>
            <div class="referral-text">Invite friends and earn rewards</div>
        </div>
        <div class="referral-arrow">↗</div>
    </section>

    <div class="section-head">
        <small>GAMES</small>
        <h2>Play Your Game</h2>
    </div>

    <!-- GAME CARD (Full Card Clickable) -->
    <article class="game-card" onclick="goBattles()">
        <img src="ludo-classic.jpg" alt="Ludo Classic" onerror="this.src='https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=600&auto=format&fit=crop';">
        <div class="game-overlay">
            <span class="live">● LIVE</span>
            <div class="game-bottom-row">
                <div class="game-info-left">
                    <h3>Ludo Classic</h3>
                    <p>Ludo game</p>
                </div>
                <button class="play-btn" onclick="event.stopPropagation(); goBattles();">
                    ▶ Play
                </button>
            </div>
        </div>
    </article>

    <section class="soon-card">
        <img src="ludo-1-goti.jpg" alt="1 Goti Ludo" onerror="this.src='https://images.unsplash.com/photo-1511512578047-dfb367046420?w=200&auto=format&fit=crop';">
        <div class="soon-info">
            <h3>1 Goti Ludo</h3>
            <p>Coming soon</p>
        </div>
        <span class="soon-badge">🔒 SOON</span>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="goHome()"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="goWallet()"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="goSupport()"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="goProfile()"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
  authDomain: "rdx-ludo.firebaseapp.com",
  projectId: "rdx-ludo",
  storageBucket: "rdx-ludo.firebasestorage.app",
  messagingSenderId: "928340814840",
  appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

async function loadFirebaseCustomer(){
    try {
        let mobile = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
        const cleanMobile = String(mobile).replace(/\D/g,"");
        if(!cleanMobile) return;
        let firebaseDocId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

        const userRef = firebaseDB.collection("customers").doc(firebaseDocId);
        const snapshot = await userRef.get();
        if(!snapshot.exists) return;

        const data = snapshot.data();
        document.getElementById("topBalance").textContent = Number(data.balance || 0);
        document.getElementById("topRedeem").textContent = Number(data.referralBalance || data.redeemBalance || 0);

        let fullName = data.name || localStorage.getItem("rdxUsername") || ("User " + firebaseDocId.slice(-4));
        let firstName = String(fullName).trim().split(" ")[0];

        document.getElementById("username").textContent = "Hey, " + firstName;
    } catch(error){ console.error(error); }
}

window.addEventListener("load", loadFirebaseCustomer);

function goHome(){ window.location.href = "./dashboard.html"; }
function goBattles(){ window.location.href = "./battles.html"; }
function goWallet(){ window.location.href = "./wallet.html"; }
function goSupport(){ window.location.href = "./support.html"; }
function goProfile(){ window.location.href = "./profile.html"; }
function goRedeem(){ window.location.href = "./referral.html"; }
function goNotifications(){ window.location.href = "./notification.html"; }
</script>
</body>
</html>
