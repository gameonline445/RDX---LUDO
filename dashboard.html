<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Dashboard</title>

<!-- FontAwesome for clean icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,113,101,0.25);
}
.menu-btn:active{transform:scale(0.95);}

/* BRAND 3D LOGO */
.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    height:38px;
    padding:0 10px;
    border:0;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
    font-weight:800;
    color:white;
    cursor:pointer;
}
.icon-only{width:38px;padding:0;border-radius:50%;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);}

/* CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

/* WELCOME BANNER */
.welcome-box{margin-bottom:14px;}
.welcome-box h1{font-size:24px;font-weight:900;color:#0c4a6e;}
.welcome-box p{color:#64748b;font-size:13px;font-weight:600;margin-top:2px;}

/* REFER BANNER */
.refer-banner{
    border:1.5px solid #7dd3fc;
    border-radius:22px;
    padding:16px 18px;
    background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.08);
    margin-bottom:20px;
}
.refer-banner small{color:#0284c7;font-weight:850;font-size:11px;letter-spacing:0.8px;}
.refer-banner h3{font-size:22px;font-weight:900;color:#0c4a6e;margin-top:2px;}
.refer-banner p{color:#64748b;font-size:12px;margin-top:2px;}
.refer-arrow{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#0284c7;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    box-shadow:0 4px 12px rgba(2,132,199,0.3);
}

/* GAMES SECTION */
.section-label{font-size:11px;font-weight:850;color:#64748b;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
.section-title{font-size:18px;font-weight:900;color:#0f172a;margin-bottom:12px;}

/* LUDO CARD */
.game-card{
    width:100%;
    height:200px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:#111;
    box-shadow:0 8px 24px rgba(0,0,0,0.16);
    cursor:pointer;
    margin-bottom:12px;
}
.game-card img{width:100%;height:100%;object-fit:cover;}
.game-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.8) 100%);
    padding:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:white;
}
@keyframes slowPulse {
    0%, 100% { opacity:1; transform:scale(1); box-shadow:0 0 10px rgba(34,197,94,0.95); }
    50% { opacity:0.4; transform:scale(0.96); box-shadow:0 0 2px rgba(34,197,94,0.2); }
}
.live-badge{
    align-self:flex-start;
    background:#16a34a;
    color:white;
    padding:4px 10px;
    border-radius:12px;
    font-size:10px;
    font-weight:850;
    animation:slowPulse 1.8s ease-in-out infinite;
}
.game-card-bottom{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
}
.game-card-bottom h2{font-size:22px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,0.6);}
.game-card-bottom p{font-size:12px;color:#cbd5e1;}
.play-btn{
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:white;
    border:0;
    padding:8px 20px;
    border-radius:18px;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(2,132,199,0.35);
}

/* COMING SOON CARD */
.soon-card{
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:18px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 4px 14px rgba(30,60,120,0.03);
}
.soon-card img{width:60px;height:60px;border-radius:14px;object-fit:cover;}
.soon-info{flex:1;}
.soon-info h4{font-size:15px;font-weight:850;color:#0f172a;}
.soon-info p{color:#64748b;font-size:12px;margin-top:2px;}
.soon-tag{background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;padding:5px 10px;border-radius:12px;font-size:10px;font-weight:800;}

/* SIDE DRAWER */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}
.drawer-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(145deg,#0284c7,#0369a1);
    color:white;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1.5px solid #93c5fd;
}
.drawer-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.drawer-close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#ffffff;
    border:1px solid #bae6fd;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
    transition:background 0.2s ease;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-logout{background:linear-gradient(145deg,#ef4444,#dc2626);margin-top:10px;}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#6366f1;}
</style>
</head>

<body>

<script>
// Authentication Security Check: Agar user logged-in nahi hai toh seedha index.html par bhejein
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}

// Mobile Back Button Trap (Sidemenu close karne ke liye)
(function() {
    window.history.pushState({ page: "dashboard" }, "", window.location.href);
    window.addEventListener("popstate", function() {
        const drawer = document.getElementById("sideDrawer");
        if (drawer && drawer.classList.contains("active")) {
            drawer.classList.remove("active");
            document.getElementById("drawerOverlay").classList.remove("active");
            window.history.pushState({ page: "dashboard" }, "", window.location.href);
        } else {
            window.history.pushState({ page: "dashboard" }, "", window.location.href);
        }
    });
})();
</script>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
<div class="drawer" id="sideDrawer">
    <div class="drawer-header">
        <div class="drawer-user">
            <div class="drawer-avatar" id="drawerAvatar">
                <img src="logo.png" alt="RDX Logo" onerror="this.style.display='none'">
            </div>
            <div>
                <h4 style="font-size:14px; font-weight:900; color:#0c4a6e;" id="drawerName">User</h4>
                <small style="color:#64748b; font-weight:700;" id="drawerMobile">+91**********</small>
            </div>
        </div>
        <button class="drawer-close" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-links">
        <button class="drawer-item" onclick="window.location.href='dashboard.html'"><div class="drawer-item-icon menu-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="drawer-item" onclick="window.location.href='profile.html'"><div class="drawer-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><span>My Profile</span></button>
        <button class="drawer-item" onclick="window.location.href='wallet.html'"><div class="drawer-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><span>My Wallet</span></button>
        <button class="drawer-item" onclick="window.location.href='referral.html'"><div class="drawer-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><span>Refer & Earn</span></button>
        <button class="drawer-item" onclick="window.location.href='history.html'"><div class="drawer-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><span>History</span></button>
        <button class="drawer-item" onclick="window.location.href='notification.html'"><div class="drawer-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><span>Notifications</span></button>
        <button class="drawer-item" onclick="window.location.href='support.html'"><div class="drawer-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="drawer-item" onclick="logout()"><div class="drawer-item-icon menu-logout"><i class="fa-solid fa-right-from-bracket"></i></div><span>Logout</span></button>
    </div>
</div>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="window.location.href='dashboard.html'">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon notification icon-only" onclick="window.location.href='notification.html'"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon wallet-top" onclick="window.location.href='wallet.html'">💰 <span id="topBalance">0</span></button>
        <button class="header-icon redeem-top" onclick="window.location.href='referral.html'">🎁 <span id="topReferral">0</span></button>
    </div>
</header>

<main class="container">
    <section class="welcome-box">
        <h1>Hey, <span id="userName">User</span></h1>
        <p>Welcome to RDX LUDO</p>
    </section>

    <section class="refer-banner" onclick="window.location.href='referral.html'">
        <div>
            <small>REFER & EARN</small>
            <h3>2% Refer</h3>
            <p>Invite friends and earn rewards</p>
        </div>
        <div class="refer-arrow">↗</div>
    </section>

    <div class="section-label">GAMES</div>
    <h2 class="section-title">Play Your Game</h2>

    <article class="game-card" onclick="window.location.href='battles.html'">
        <img src="ludo-classic.jpg" alt="Ludo Classic" onerror="this.src='https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=600&auto=format&fit=crop';">
        <div class="game-overlay">
            <span class="live-badge">● LIVE</span>
            <div class="game-card-bottom">
                <div>
                    <h2>Ludo Classic</h2>
                    <p>Ludo game</p>
                </div>
                <button class="play-btn" onclick="event.stopPropagation(); window.location.href='battles.html';">
                    ▶ Play
                </button>
            </div>
        </div>
    </article>

    <section class="soon-card">
        <img src="ludo-1-goti.jpg" alt="1 Goti Ludo" onerror="this.src='https://images.unsplash.com/photo-1511512578047-dfb367046420?w=200&auto=format&fit=crop';">
        <div class="soon-info">
            <h4>1 Goti Ludo</h4>
            <p>Coming soon</p>
        </div>
        <span class="soon-tag">🔒 SOON</span>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="window.location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

async function loadDashboardData() {
    if (!userId) { window.location.replace("index.html"); return; }
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if (snap.exists) {
            const d = snap.data();
            const fullName = String(d.name || ("User " + userId.slice(-4))).trim();
            const firstName = fullName.split(" ")[0] || "User";

            document.getElementById("userName").textContent = firstName;
            document.getElementById("drawerName").textContent = fullName;
            document.getElementById("drawerAvatar").innerHTML = `<img src="logo.png" alt="Logo" onerror="this.style.display='none'">`;
            document.getElementById("drawerMobile").textContent = "+" + userId;

            document.getElementById("topBalance").textContent = Number(d.balance || 0);
            document.getElementById("topReferral").textContent = Number(d.referralBalance || d.redeemBalance || 0);
        }
    } catch(err) { console.error("Dashboard load error:", err); }
}

async function startPresenceHeartbeat() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;
    const userRef = firebaseDB.collection("customers").doc(docId);

    let locationStr = "Unknown Location";
    try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data && data.city) {
            locationStr = `${data.city}, ${data.region || data.country_name || ''}`;
        }
    } catch(e) {
        console.log("Location fetch skipped");
    }

    const setOnline = (onlineStatus) => {
        userRef.set({
            isOnline: onlineStatus,
            lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
            location: locationStr
        }, { merge: true }).catch(err => console.error(err));
    };

    setOnline(true);

    setInterval(() => {
        if (!document.hidden) { setOnline(true); }
    }, 15000);

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) { setOnline(false); }
        else { setOnline(true); }
    });

    window.addEventListener("pagehide", () => { setOnline(false); });
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        firebaseDB.collection("customers").doc(docId).set({ isOnline: false }, { merge: true });
    }
    localStorage.removeItem("rdxLoggedIn");
    localStorage.removeItem("rdxFirebaseUserId");
    localStorage.removeItem("rdxVerifiedMobile");
    localStorage.removeItem("rdxAccessToken");
    
    // Logout hone par seedha index.html par redirect karega
    window.location.replace("index.html");
}

window.addEventListener("load", () => {
    loadDashboardData();
    startPresenceHeartbeat();
});
</script>
