<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{

button{font:inherit;}

/* TOP HEADER */

}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{

    height:42px;
    border:0;
    border-radius:14px;

.logo{

.header-right{display:flex;align-items:center;gap:8px;}

.notification{background:linear-gradient(145deg,#6366f1,#818cf8); padding:0 10px; border-radius:50%; width:38px;}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);}

/* CONTAINER */

/* WELCOME BANNER */

/* REFER BANNER CARD */
.refer-card{

    border-radius:22px;

.refer-info small{font-size:11px;font-weight:850;color:#0284c7;letter-spacing:0.5px;text-transform:uppercase;}
.refer-info h3{font-size:18px;font-weight:900;color:#0c4a6e;margin:2px 0;}
.refer-info p{font-size:12px;color:#64748b;font-weight:600;}
.refer-btn-icon{

    align-items:center;
    justify-content:center;

/* SECTION HEADING */

.games-list{display:flex;flex-direction:column;gap:14px;}

/* GAME CARDS */

</style>

<script>
function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

// Immediately load cached balance from localStorage to prevent zero flicker
const cachedBal = localStorage.getItem("rdxCachedTotalBalance");
if (cachedBal !== null) {
    document.getElementById("headerBalance").textContent = "₹" + cachedBal;
}
const cachedRefBal = localStorage.getItem("rdxCachedReferBalance");
if (cachedRefBal !== null) {
    document.getElementById("headerReferBalance").textContent = "₹" + cachedRefBal;
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();

let userUnsubscribe = null;

function listenUserData() {
    if (!userId) {
        window.location.replace("index.html");
        return;
    }
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const userRef = doc(db, "customers", docId);
        
        userUnsubscribe = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                
                // User Name Update
                const name = d.name || ("User " + userId.slice(-4));
                document.getElementById("homeUserName").textContent = name;
                document.getElementById("drawerName").textContent = name;
                document.getElementById("drawerMobile").textContent = "+" + userId;

                // Dynamic Balance Calculation (Deposit + Winnings)
                const depositAmount = Number(d.deposit) || 0;
                const winningsAmount = Number(d.winnings) || 0;
                const totalBalance = depositAmount + winningsAmount;
                const referWalletBalance = Number(d.referralWallet) || Number(d.referralEarnings) || 0;

                // UI Update
                document.getElementById("headerBalance").textContent = "₹" + totalBalance;
                document.getElementById("headerReferBalance").textContent = "₹" + referWalletBalance;

                // Cache Save for fast reloads
                localStorage.setItem("rdxCachedTotalBalance", totalBalance);
                localStorage.setItem("rdxCachedReferBalance", referWalletBalance);
            }
        }, (err) => {
            console.error("Firestore balance snapshot error:", err);
        });
    } catch(e) {
        console.error("Error setting up listener:", e);
    }
}

window.logout = async () => {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        const docId = userId.length === 10 ? "91" + userId : userId;
        try {
            await setDoc(doc(db, "customers", docId), { isOnline: false }, { merge: true });
        } catch(e) { console.error(e); }
    }
    if (userUnsubscribe) userUnsubscribe();
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
};

listenUserData();
</script>
