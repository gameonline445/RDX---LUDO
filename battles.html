<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Battles</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;background:radial-gradient(circle at 10% 10%,rgba(82,126,255,.16),transparent 30%),radial-gradient(circle at 90% 15%,rgba(255,136,88,.12),transparent 28%),linear-gradient(135deg,#f4f7ff,#ffffff 50%,#f5f8ff);color:#101a38;padding-bottom:100px;}
button,input{font:inherit;}

/* HEADER */
.header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(110deg,#edf3ff,#ffffff);border-bottom:1px solid #c8d7f2;position:sticky;top:0;z-index:1000;box-shadow:0 6px 20px rgba(48,88,170,.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(145deg,#ff755e,#ff9270);color:#fff;font-size:25px;font-weight:900;box-shadow:0 6px 15px rgba(255,104,80,.25);cursor:pointer;}
.logo{width:45px;height:45px;border-radius:50%;background:#fff;border:3px solid #c7d9ff;display:flex;align-items:center;justify-content:center;color:#2467df;font-size:13px;font-weight:950;box-shadow:0 5px 12px rgba(49,92,180,.13);cursor:pointer;}
.header-actions{display:flex;align-items:center;gap:8px;}
.header-icon{width:44px;height:44px;border-radius:15px;border:0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
.notification{background:linear-gradient(145deg,#6b6df4,#536df5);color:white;}
.coin-head{min-width:75px;height:44px;border-radius:22px;border:0;background:linear-gradient(145deg,#49bd69,#64ce82);color:white;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 12px;}

.container{width:100%;max-width:650px;margin:auto;padding:20px 14px 110px;}
.create-card{border:1.5px solid #477de9;border-radius:24px;padding:16px;background:linear-gradient(135deg,#ffffff,#f6f9ff);display:flex;align-items:center;gap:10px;margin-bottom:24px;box-shadow:0 8px 24px rgba(54,101,200,.08);}
.amount-input{flex:1;min-width:0;height:54px;border:1px solid #d7ddea;border-radius:16px;background:#f8f9fc;padding:0 18px;outline:none;font-size:17px;font-weight:700;color:#18233d;}
.set-btn{height:54px;min-width:100px;border:0;border-radius:16px;background:linear-gradient(145deg,#3569dc,#4b7df0);color:white;font-size:18px;font-weight:850;cursor:pointer;}

.section-title{display:flex;align-items:center;gap:8px;margin:20px 0 12px;font-size:20px;font-weight:850;}
.battle{background:#ffffff;border:1.5px solid #c6d5f1;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(43,82,157,.06);}
.battle-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.status-badge{padding:5px 12px;border-radius:12px;font-size:11px;font-weight:800;text-transform:uppercase;}
.status-open{background:#eef4ff;color:#2563eb;border:1px solid #c7d9fe;}
.status-live{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;}

.battle-middle{display:grid;grid-template-columns:1fr 1fr;border:1px solid #dce5f5;border-radius:16px;background:#f8faff;overflow:hidden;margin-bottom:12px;}
.money-box{padding:10px 14px;}
.money-box + .money-box{border-left:1px solid #dce5f5;text-align:right;}
.money-label{display:block;color:#707c92;font-size:11px;font-weight:800;}
.money-value{display:block;margin-top:2px;font-size:20px;font-weight:900;}
.prize-value{color:#2563eb;}
.play-btn{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(100deg,#2868e8,#4d7ff0);color:white;font-size:15px;font-weight:850;cursor:pointer;}

.player-row{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:8px;margin-bottom:12px;}
.player{display:flex;align-items:center;gap:8px;}
.player.right{justify-content:flex-end;text-align:right;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e0e7ff;color:#3730a3;font-weight:800;font-size:14px;}
.player-name{font-size:13px;font-weight:750;}
.vs{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2563eb;color:#fff;font-size:11px;font-weight:900;margin:auto;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);z-index:3000;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.room-modal{background:#ffffff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:24px 20px 30px;max-height:85vh;overflow-y:auto;}
.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:12px;}
.modal-title{font-size:18px;font-weight:900;}
.modal-close{background:#f1f5f9;border:0;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;}
.code-display-box{background:#f0f6ff;border:2px dashed #93c5fd;border-radius:18px;padding:16px;text-align:center;margin:16px 0;}
.code-display-box strong{display:block;font-size:32px;font-weight:900;color:#2563eb;letter-spacing:4px;margin-top:4px;}
.input-room-code{width:100%;height:48px;border:1.5px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:16px;text-align:center;outline:none;margin-top:8px;}
.btn-ludo-app{width:100%;height:50px;border:0;border-radius:16px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:16px;font-weight:850;cursor:pointer;margin-top:10px;}
.result-section{border-top:1px solid #e2e8f0;margin-top:18px;padding-top:16px;}
.result-title{font-size:14px;font-weight:800;color:#475569;margin-bottom:10px;text-align:center;}
.result-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-won{background:#dcfce7;border:1.5px solid #86efac;color:#15803d;height:46px;border-radius:12px;font-weight:850;cursor:pointer;}
.btn-lost{background:#fee2e2;border:1.5px solid #fca5a5;color:#b91c1c;height:46px;border-radius:12px;font-weight:850;cursor:pointer;}
.btn-cancel-match{width:100%;margin-top:12px;height:40px;background:#f8fafc;border:1px solid #cbd5e1;color:#64748b;border-radius:12px;font-size:13px;font-weight:750;cursor:pointer;}
.empty{padding:30px 15px;text-align:center;color:#78849a;background:#fff;border:1px dashed #cbd5e8;border-radius:18px;font-size:14px;}

.toast{position:fixed;left:50%;top:85px;transform:translateX(-50%) translateY(-20px);background:#182440;color:white;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:5000;font-size:14px;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.bottom{position:fixed;left:0;bottom:0;width:100%;height:64px;background:#ffffff;border-top:1px solid #d6deee;display:grid;grid-template-columns:repeat(4,1fr);z-index:2000;}
.bottom a{border:0;background:transparent;color:#68758e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;text-decoration:none;cursor:pointer;}
.bottom a b{font-size:20px;}
.bottom .active{color:#18213a;font-weight:900;}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="header-left">
        <button class="menu-btn" onclick="location.href='dashboard.html'">☰</button>
        <!-- Logo click to Home -->
        <div class="logo" onclick="location.href='dashboard.html'">RDX</div>
    </div>
    <div class="header-actions">
        <button class="header-icon notification" onclick="location.href='notification.html'">🔔</button>
        <div class="coin-head" onclick="location.href='wallet.html'">
            💰 <span id="headerBalance">0</span>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="container">
    <div class="create-card">
        <input id="amountInput" class="amount-input" type="number" min="10" step="10" placeholder="Enter Amount (e.g. 50, 100)" inputmode="numeric">
        <button class="set-btn" id="setBtn" onclick="createBattle()">SET</button>
    </div>

    <div class="section-title"><span>⚔️ Open Battles</span></div>
    <div id="openBattles"><div class="empty">Open battles loading...</div></div>

    <div class="section-title" style="margin-top:24px;"><span>🔥 Running Battles</span></div>
    <div id="runningBattles"><div class="empty">Running battles loading...</div></div>
</main>

<!-- LUDO KING MODAL -->
<div class="modal-overlay" id="roomModal">
    <div class="room-modal">
        <div class="modal-top">
            <span class="modal-title">🎲 Ludo King Battle Room</span>
            <button class="modal-close" onclick="closeRoomModal()">✕</button>
        </div>

        <div class="code-display-box" id="codeBox">
            <small>Ludo King Room Code</small>
            <strong id="displayRoomCode">WAITING...</strong>
        </div>

        <div id="hostCodeSection" style="display:none; margin-bottom:12px;">
            <label style="font-size:12px; font-weight:800; color:#64748b;">ENTER LUDO KING ROOM CODE:</label>
            <input type="text" id="inputLudoCode" class="input-room-code" placeholder="8-Digit Code">
            <button class="play-btn" style="margin-top:8px;" onclick="updateRoomCode()">Save & Share Code</button>
        </div>

        <button class="btn-ludo-app" id="btnOpenLudo" onclick="launchLudoKing()">
            🚀 Copy Code & Open Ludo King
        </button>

        <div class="result-section">
            <div class="result-title">MATCH KHATAM HONE KE BAAD RESULT SELECT KAREIN:</div>
            <div class="result-buttons">
                <button class="btn-won" onclick="submitMatchResult('won')">🏆 I WON</button>
                <button class="btn-lost" onclick="submitMatchResult('lost')">❌ I LOST</button>
            </div>
            <button class="btn-cancel-match" onclick="cancelOrDisputeMatch()">⚠️ Cancel / Report Issue</button>
        </div>
    </div>
</div>

<nav class="bottom">
    <a class="active" href="dashboard.html"><b>🏠</b>Home</a>
    <a href="wallet.html"><b>💰</b>Wallet</a>
    <a href="support.html"><b>🎧</b>Support</a>
    <a href="profile.html"><b>👤</b>Profile</a>
</nav>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
let db = null;
try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
} catch(e) { console.error(e); }

function getUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || localStorage.getItem("rdxUserId") || "";
    return String(raw).replace(/\D/g, "");
}
const currentUserId = getUserId();
let currentBalance = 0;
let activeRoomData = null;
let activeRoomUnsub = null;

if (!currentUserId) location.href = "login.html";

function showMessage(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

async function loadBalance() {
    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        const snap = await db.collection("customers").doc(docId).get();
        if (snap.exists) {
            currentBalance = Number(snap.data().balance || 0);
            document.getElementById("headerBalance").textContent = currentBalance;
        }
    } catch(err) { console.error(err); }
}

function listenBattles() {
    db.collection("rooms").where("status", "in", ["open", "running"]).onSnapshot(snapshot => {
        let rooms = [];
        snapshot.forEach(doc => rooms.push({ id: doc.id, ...doc.data() }));
        rooms.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

        const open = rooms.filter(r => r.status === "open");
        const running = rooms.filter(r => r.status === "running");
        renderOpen(open);
        renderRunning(running);
    });
}

function renderOpen(rooms) {
    const container = document.getElementById("openBattles");
    if (!rooms.length) {
        container.innerHTML = `<div class="empty">Abhi koi Open Battle nahi hai.<br>Upar amount daalkar challenge banayein.</div>`;
        return;
    }
    container.innerHTML = rooms.map(r => {
        const isMine = String(r.hostId).replace(/\D/g,"") === currentUserId;
        return `
            <div class="battle">
                <div class="battle-top">
                    <span class="status-badge status-open">⚔ OPEN</span>
                    <span style="font-size:13px; color:#64748b;">BY: <b>${r.hostName || 'Player'}</b></span>
                </div>
                <div class="battle-middle">
                    <div class="money-box"><span class="money-label">ENTRY FEE</span><span class="money-value">₹${r.entry}</span></div>
                    <div class="money-box"><span class="money-label">WIN PRIZE</span><span class="money-value prize-value">₹${r.prize}</span></div>
                </div>
                ${isMine ? 
                    `<button class="play-btn" style="background:#64748b;" onclick="openRoomModal('${r.id}')">⏳ Waiting for Player... (View)</button>` : 
                    `<button class="play-btn" onclick="joinBattle('${r.id}', ${r.entry})">Play ₹${r.entry}</button>`
                }
            </div>
        `;
    }).join("");
}

function renderRunning(rooms) {
    const container = document.getElementById("runningBattles");
    if (!rooms.length) {
        container.innerHTML = `<div class="empty">Abhi koi Running Battle nahi hai.</div>`;
        return;
    }
    container.innerHTML = rooms.map(r => {
        const isMyMatch = (String(r.hostId).replace(/\D/g,"") === currentUserId) || (String(r.player2Id).replace(/\D/g,"") === currentUserId);
        return `
            <div class="battle">
                <div class="battle-top">
                    <span class="status-badge status-live">● LIVE MATCH</span>
                    <span style="font-size:13px; color:#64748b;">PRIZE: <b style="color:#16a34a;">₹${r.prize}</b></span>
                </div>
                <div class="player-row">
                    <div class="player"><div class="avatar">👤</div><span class="player-name">${r.hostName || 'Host'}</span></div>
                    <div class="vs">VS</div>
                    <div class="player right"><span class="player-name">${r.player2Name || 'Player 2'}</span><div class="avatar">👤</div></div>
                </div>
                ${isMyMatch ? 
                    `<button class="play-btn" style="background:#16a34a;" onclick="openRoomModal('${r.id}')">🎲 Open Ludo King Room</button>` : 
                    `<button class="play-btn" style="background:#94a3b8;" disabled>🔒 Live Match</button>`
                }
            </div>
        `;
    }).join("");
}

async function createBattle() {
    const amount = Number(document.getElementById("amountInput").value);
    if (!amount || amount < 10) return showMessage("Min battle entry ₹10 hai");
    if (amount > currentBalance) return showMessage("Paryapt balance nahi hai");

    const btn = document.getElementById("setBtn");
    btn.disabled = true;

    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        const prize = Math.floor(amount * 1.90);

        await db.runTransaction(async t => {
            const uRef = db.collection("customers").doc(docId);
            const uSnap = await t.get(uRef);
            const bal = Number(uSnap.data()?.balance || 0);
            if (bal < amount) throw new Error("Insufficient balance");

            t.update(uRef, { balance: bal - amount });
            const rRef = db.collection("rooms").doc();
            t.set(rRef, {
                hostId: currentUserId,
                hostName: localStorage.getItem("rdxUsername") || ("User " + currentUserId.slice(-4)),
                entry: amount,
                prize: prize,
                status: "open",
                roomCode: "",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        document.getElementById("amountInput").value = "";
        await loadBalance();
        showMessage("Battle create ho gayi!");
    } catch(err) {
        showMessage(err.message);
    }
    btn.disabled = false;
}

async function joinBattle(roomId, entry) {
    if (entry > currentBalance) return showMessage("Paryapt balance nahi hai");
    if (!confirm(`Kya aap ₹${entry} ki battle join karna chahte hain?`)) return;

    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        await db.runTransaction(async t => {
            const rRef = db.collection("rooms").doc(roomId);
            const uRef = db.collection("customers").doc(docId);
            const rSnap = await t.get(rRef);
            const uSnap = await t.get(uRef);

            if (rSnap.data().status !== "open") throw new Error("Battle already shuru ho chuki hai");
            const bal = Number(uSnap.data()?.balance || 0);
            if (bal < entry) throw new Error("Insufficient balance");

            t.update(uRef, { balance: bal - entry });
            t.update(rRef, {
                player2Id: currentUserId,
                player2Name: localStorage.getItem("rdxUsername") || ("User " + currentUserId.slice(-4)),
                status: "running",
                joinedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await loadBalance();
        openRoomModal(roomId);
    } catch(err) { showMessage(err.message); }
}

function openRoomModal(roomId) {
    const modal = document.getElementById("roomModal");
    modal.classList.add("show");
    if (activeRoomUnsub) activeRoomUnsub();

    activeRoomUnsub = db.collection("rooms").doc(roomId).onSnapshot(doc => {
        if (!doc.exists) { closeRoomModal(); return; }
        activeRoomData = { id: doc.id, ...doc.data() };
        renderModalData();
    });
}

function renderModalData() {
    if (!activeRoomData) return;
    const isHost = String(activeRoomData.hostId).replace(/\D/g,"") === currentUserId;
    const codeDisplay = document.getElementById("displayRoomCode");
    const hostCodeSection = document.getElementById("hostCodeSection");

    if (activeRoomData.roomCode && activeRoomData.roomCode.trim() !== "") {
        codeDisplay.textContent = activeRoomData.roomCode;
        hostCodeSection.style.display = "none";
    } else {
        if (isHost) {
            codeDisplay.textContent = "ENTER CODE BELOW";
            hostCodeSection.style.display = "block";
        } else {
            codeDisplay.textContent = "WAITING FOR HOST...";
            hostCodeSection.style.display = "none";
        }
    }
}

function closeRoomModal() {
    document.getElementById("roomModal").classList.remove("show");
    if (activeRoomUnsub) activeRoomUnsub();
    activeRoomData = null;
}

async function updateRoomCode() {
    const code = document.getElementById("inputLudoCode").value.trim();
    if (!code || code.length < 6) return showMessage("Valid Ludo King room code daalein");
    try {
        await db.collection("rooms").doc(activeRoomData.id).update({ roomCode: code });
        showMessage("Room code update ho gaya!");
    } catch(err) { showMessage(err.message); }
}

function launchLudoKing() {
    if (activeRoomData?.roomCode) {
        navigator.clipboard.writeText(activeRoomData.roomCode);
        showMessage("Room Code Copied: " + activeRoomData.roomCode);
    }
    setTimeout(() => { window.location.href = "ludoking://"; }, 400);
}

async function submitMatchResult(result) {
    if (!activeRoomData) return;
    if (!confirm(`Kya aap confirm karte hain ki aap match '${result.toUpperCase()}' kar chuke hain?`)) return;

    try {
        await db.collection("rooms").doc(activeRoomData.id).update({
            [`result_${currentUserId}`]: result,
            status: result === 'lost' ? 'completed' : 'under_review'
        });
        showMessage("Result submit ho gaya. Admin verify karega.");
        closeRoomModal();
    } catch(err) { showMessage(err.message); }
}

async function cancelOrDisputeMatch() {
    if (!activeRoomData) return;
    if (activeRoomData.status === "open") {
        if (!confirm("Room cancel karke amount refund lein?")) return;
        try {
            let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
            await db.runTransaction(async t => {
                const rRef = db.collection("rooms").doc(activeRoomData.id);
                const uRef = db.collection("customers").doc(docId);
                const uSnap = await t.get(uRef);
                t.update(uRef, { balance: Number(uSnap.data()?.balance || 0) + Number(activeRoomData.entry) });
                t.delete(rRef);
            });
            await loadBalance();
            closeRoomModal();
            showMessage("Room cancel ho gaya.");
        } catch(e) { showMessage(e.message); }
    } else {
        showMessage("Match running hai. Kripya Support par screenshot bhejein.");
    }
}

window.addEventListener("load", async () => {
    await loadBalance();
    listenBattles();
});
</script>
</body>
</html>
