<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(82,126,255,.16),
        transparent 30%
    ),
    radial-gradient(
        circle at 90% 15%,
        rgba(255,136,88,.12),
        transparent 28%
    ),
    linear-gradient(
        135deg,
        #f4f7ff,
        #ffffff 50%,

    color:#101a38;

    padding-bottom:100px;
}

button,
input{

}


/* =====================================================
   HEADER
   ===================================================== */

.header{

    height:82px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    0 18px;

    background:
    linear-gradient(
        110deg,
        #edf3ff,
        #ffffff

    border-bottom:
    1px solid #c8d7f2;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
    0 6px 20px
    rgba(48,88,170,.10);
}


.header-left{

    display:flex;

    align-items:center;

    gap:12px;
}


.menu-btn{

    width:54px;

    height:54px;

    border:0;

    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        #ff755e,
        #ff9270
    );

    color:#fff;

    font-size:29px;

    font-weight:900;

    box-shadow:
    0 8px 20px
    rgba(255,104,80,.25);

    cursor:pointer;
}


.logo{

    width:51px;

    height:51px;

    border-radius:50%;

    background:#fff;

    border:
    3px solid #c7d9ff;

    display:flex;

    align-items:center;

    box-shadow:

}


.header-actions{

    display:flex;

    align-items:center;

    gap:8px;
}


.header-icon{

    width:49px;

    height:49px;

    border-radius:50%;

    border:0;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}


.notification{

    background:

        #6b6df4,

    rgba(83,109,245,.28);
}


.coin-head{

    min-width:82px;

    height:49px;

    border-radius:28px;

    border:0;

    background:
    linear-gradient(
        145deg,
        #49bd69,
        #64ce82

    color:white;

    font-weight:900;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    box-shadow:
    0 7px 18px
    rgba(52,180,95,.25);
}


/* =====================================================
   MAIN
   ===================================================== */

.container{

    width:100%;

    max-width:850px;

    margin:auto;

    padding:
    28px 18px
    120px;
}


/* =====================================================
   BALANCE
   ===================================================== */

.balance-card{

    border:
    2px solid #477de9;

    border-radius:27px;

    padding:17px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #f6f9ff
    );

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:30px;

    box-shadow:
    0 10px 28px
    rgba(54,101,200,.08);
}


.amount-input{

    flex:1;

    min-width:0;

    height:62px;

    border:
    1px solid #d7ddea;

    border-radius:35px;

    background:
    linear-gradient(
        145deg,
        #f1f2f5,
        #f7f8fa
    );

    padding:
    0 28px;

    outline:none;

    font-size:20px;

    color:#18233d;
}


.amount-input::placeholder{

    color:#858b97;
}


.amount-input:focus{

    border-color:#3975ed;

    box-shadow:
    0 0 0 4px
    rgba(57,117,237,.10);
}


.set-btn{

    height:62px;

    min-width:115px;

    border:0;

    border-radius:17px;

    background:
    linear-gradient(
        145deg,
        #3569dc,
        #4b7df0
    );

    color:white;

    font-size:21px;

    font-weight:850;

    cursor:pointer;

    box-shadow:
    0 9px 20px
    rgba(52,105,222,.24);
}


/* =====================================================
   SECTION TITLE
   ===================================================== */

.section-title{

    display:flex;

    align-items:center;

    gap:12px;

    margin:
    12px 0 15px;

    font-size:25px;

    font-weight:850;
}


.section-icon{

    color:#3773e4;

    font-size:29px;
}


/* =====================================================
   BATTLE CARD
   ===================================================== */

.battle{

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #f7f9ff
    );

    border:
    1.5px solid #c6d5f1;

    border-radius:26px;

    padding:14px;

    margin-bottom:15px;

    box-shadow:
    0 12px 28px
    rgba(43,82,157,.09);
}


.battle-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

    padding:0 5px;
}


.status{

    padding:
    7px 14px;

    border-radius:18px;

    background:#e9f2ff;

    border:
    1px solid #9bb8ef;

    color:#3971dd;

    font-size:13px;

    font-weight:850;
}


.status.live{

    background:#e8f8ee;

    border-color:#9bd6b3;

    color:#26975b;
}


.from{

    color:#6c7890;

    font-size:14px;
}


.from strong{

    color:#17213a;

    font-size:16px;
}


/* =====================================================
   ENTRY / PRIZE
   ===================================================== */

.battle-middle{

    display:grid;

    grid-template-columns:1fr 1fr;

    border:
    1px solid #bdcbe4;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #f6f7fa,
        #ffffff
    );

    overflow:hidden;
}


.money-box{

    padding:
    10px 16px;
}


.money-box + .money-box{

    border-left:
    1px solid #bdcbe4;

    text-align:right;
}


.money-label{

    display:block;

    color:#707c92;

    font-size:11px;

    font-weight:800;

    letter-spacing:.5px;
}


.money-value{

    display:block;

    margin-top:3px;

    font-size:24px;

    font-weight:900;
}


.prize-value{

    color:#2868e8;
}


/* =====================================================
   PLAY BUTTON
   ===================================================== */

.play-btn{

    width:100%;

    height:50px;

    margin-top:10px;

    border:0;

    border-radius:25px;

    background:
    linear-gradient(
        100deg,
        #2868e8,
        #4d7ff0
    );

    color:white;

    font-size:17px;

    font-weight:850;

    cursor:pointer;

    box-shadow:
    0 8px 20px
    rgba(40,104,232,.23);
}


.play-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

    box-shadow:none;
}


/* =====================================================
   RUNNING BATTLE
   ===================================================== */

.player-row{

    margin-top:10px;

    display:grid;

    grid-template-columns:
    1fr 50px 1fr;

    align-items:center;

    gap:8px;
}


.player{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;
}


.player.right{

    justify-content:flex-end;

    text-align:right;
}


.avatar{

    width:38px;

    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        145deg,
        #477de9,
        #7c67ed
    );

    color:#fff;

    font-weight:900;

    flex-shrink:0;
}


.player-name{

    font-size:13px;

    font-weight:750;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


.vs{

    width:42px;

    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        145deg,
        #3475eb,
        #536df5
    );

    color:#fff;

    font-size:12px;

    font-weight:900;

    box-shadow:
    0 6px 15px
    rgba(53,111,234,.28);
}


/* =====================================================
   ROOM PANEL
   ===================================================== */

.room-panel{

    display:none;

    margin-top:25px;

    background:#fff;

    border:
    1.5px solid #b9cdf5;

    border-radius:25px;

    padding:20px;

    box-shadow:
    0 12px 30px
    rgba(30,60,120,.09);
}


.room-panel.show{

    display:block;
}


.room-title{

    font-size:21px;

    font-weight:900;
}


.room-status{

    margin-top:6px;

    color:#71809d;

    font-size:14px;
}


.room-code{

    margin:
    18px 0;

    padding:18px;

    border:
    1px dashed #7ca2eb;

    border-radius:18px;

    background:#eef4ff;

    text-align:center;
}


.room-code small{

    display:block;

    color:#71809d;

    font-size:11px;

    font-weight:800;
}


.room-code strong{

    display:block;

    margin-top:5px;

    color:#2868e8;

    font-size:31px;

    letter-spacing:4px;
}


.room-actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}


.room-action{

    height:49px;

    border:0;

    border-radius:15px;

    font-weight:850;

    cursor:pointer;
}


.open-ludo{

    background:#15944d;

    color:white;
}


.cancel-room{

    background:#f4f6fa;

    color:#dc3e48;

    border:
    1px solid #e0e4ec;
}


/* =====================================================
   EMPTY
   ===================================================== */

.empty{

    padding:35px 15px;

    text-align:center;

    color:#78849a;

    background:#fff;

    border:
    1px dashed #cbd5e8;

    border-radius:20px;

    margin-bottom:15px;
}


/* =====================================================
   TOAST
   ===================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:100px;

    transform:
    translate(-50%,20px);

    max-width:90%;

    background:#182440;

    color:white;

    padding:
    13px 18px;

    border-radius:14px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:5000;

    text-align:center;

    font-size:14px;

    font-weight:650;
}


.toast.show{

    opacity:1;

    transform:
    translate(-50%,0);
}


/* =====================================================
   BOTTOM NAV
   ===================================================== */

.bottom{

    position:fixed;

    left:0;

    bottom:0;

    width:100%;

    height:82px;

    background:
    rgba(255,255,255,.97);

    border-top:
    1px solid #d6deee;

    display:flex;

    justify-content:
    space-around;

    align-items:center;

    z-index:2000;

    backdrop-filter:
    blur(18px);
}


.bottom button{

    width:25%;

    height:100%;

    border:0;

    background:transparent;

    color:#68758e;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    cursor:pointer;
}


.bottom-icon{

    width:45px;

    height:45px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;
}


.bottom .active{

    color:#24304c;

    font-weight:750;
}


.bottom .active .bottom-icon{

    background:#536df5;

    color:white;

    box-shadow:
    0 7px 17px
    rgba(83,109,245,.30);
}


@media(max-width:600px){

    .header{

        height:72px;

        padding:0 12px;
    }

    .menu-btn{

        width:48px;

        height:48px;
    }

    .logo{

        width:46px;

        height:46px;
    }

    .header-actions{

        gap:5px;
    }

    .header-icon{

        width:42px;

        height:42px;
    }

    .coin-head{

        min-width:63px;

        height:42px;
    }

    .container{

        padding:
        25px 12px
        115px;
    }

    .balance-card{

        padding:14px;
    }

    .amount-input{

        height:58px;

        padding:0 20px;

        font-size:17px;
    }

    .set-btn{

        height:58px;

        min-width:92px;
    }

    .section-title{

        font-size:22px;
    }

    .money-value{

        font-size:21px;
    }

    .battle{

        border-radius:22px;
    }
}


@media(max-width:370px){

    .header-actions .notification{

        display:none;
    }

    .battle-middle{

        grid-template-columns:1fr;
    }

    .money-box + .money-box{

        border-left:0;

        border-top:

        text-align:left;
    }

    .player-row{

        grid-template-columns:
        1fr 42px 1fr;
    }

    .player-name{

        font-size:11px;
    }
}

</style>

</head>


<body>

<script>

/* =====================================================
   FIREBASE CONFIG
   EXACT SAME CONFIG AS LOGIN HTML
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

    authDomain:
        "rdx-ludo.firebaseapp.com",

    projectId:
        "rdx-ludo",

    storageBucket:
        "rdx-ludo.firebasestorage.app",

    messagingSenderId:
        "928340814840",

    appId:
        "1:928340814840:web:6eca42a8b76138b268440d"

};


let db = null;


try{

    if(!firebase.apps.length){

        firebase.initializeApp(
            firebaseConfig
        );

    }

    db =
        firebase.firestore();

    console.log(
        "RDX FIREBASE CONNECTED"
    );

}catch(error){

    console.error(
        "FIREBASE ERROR:",
        error
    );

}


/* =====================================================
   LOGIN CHECK
   ===================================================== */

const userId =
    localStorage.getItem(
        "rdxFirebaseUserId"
    );


const verifiedMobile =
    localStorage.getItem(
        "rdxVerifiedMobile"
    );


const loggedIn =
    localStorage.getItem(
        "rdxLoggedIn"
    );


if(
    !userId ||
    !verifiedMobile ||
    loggedIn !== "true"
){

    window.location.href =
        "./login.html";

}


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let currentBalance = 0;

let activeRoomId = null;

let activeRoomUnsubscribe = null;

let battleUnsubscribe = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const balanceElement =
    document.getElementById(
        "headerBalance"
    );

const amountInput =
    document.getElementById(
        "amountInput"
    );

const openBattles =
    document.getElementById(
        "openBattles"
    );

const runningBattles =
    document.getElementById(
        "runningBattles"
    );

const roomPanel =
    document.getElementById(
        "roomPanel"
    );

const roomCode =
    document.getElementById(
        "roomCode"
    );

const roomStatus =
    document.getElementById(
        "roomStatus"
    );


/* =====================================================
   TOAST
   ===================================================== */

function showMessage(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   MOBILE DISPLAY NAME
   ===================================================== */

function getDisplayName(mobile){

    const clean =
        String(mobile || "")
        .replace(/\D/g,"");

    if(
        clean.length >= 4
    ){

        return "User " +
            clean.slice(-4);

    }

    return "Player";

}


/* =====================================================
   LOAD CUSTOMER
   ===================================================== */

async function loadCustomer(){

    try{

        if(!db){

            throw new Error(
                "Firebase database connected नहीं है।"
            );

        }


        const ref =
            db.collection(
                "customers"
            ).doc(
                userId
            );


        const snap =
            await ref.get();


        if(!snap.exists){

            showMessage(
                "Customer account नहीं मिला।"
            );

            return;

        }


        const data =
            snap.data() || {};


        currentBalance =
            Number(
                data.balance || 0
            );


        updateBalanceUI();


        console.log(
            "CUSTOMER:",
            data
        );


    }catch(error){

        console.error(
            "CUSTOMER LOAD ERROR:",
            error
        );

        showMessage(
            "Balance load नहीं हो पाया।"
        );

    }

}


/* =====================================================
   BALANCE UI
   ===================================================== */

function updateBalanceUI(){

    const formatted =
        Math.floor(
            currentBalance
        ).toLocaleString(
            "en-IN"
        );


    balanceElement.textContent =
        formatted;

}


/* =====================================================
   GENERATE ROOM CODE
   ===================================================== */

function generateRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(
        let i = 0;
        i < 6;
        i++
    ){

        result +=
            chars.charAt(
                Math.floor(
                    Math.random() *
                    chars.length
                )
            );

    }

    return result;

}


/* =====================================================
   PRIZE
   VIRTUAL COINS ONLY
   ===================================================== */

function calculatePrize(entry){

    return Math.floor(
        Number(entry) * 1.90
    );

}


/* =====================================================
   CREATE BATTLE
   ===================================================== */

async function createBattle(){

    try{

        if(!db){

            showMessage(
                "Firebase connected नहीं है।"
            );

            return;

        }


        const entry =
            Number(
                amountInput.value
            );


        if(
            !Number.isFinite(entry) ||
            entry <= 0
        ){

            showMessage(
                "पहले amount डालें।"
            );

            amountInput.focus();

            return;

        }


        if(
            !Number.isInteger(entry)
        ){

            showMessage(
                "Amount पूरा number होना चाहिए।"
            );

            return;

        }


        if(
            entry > currentBalance
        ){

            showMessage(
                "आपके पास पर्याप्त virtual coins नहीं हैं।"
            );

            return;

        }


        const btn =
            document.getElementById(
                "setBtn"
            );


        btn.disabled =
            true;

        btn.textContent =
            "Creating...";


        let createdRoom = null;


        /*
         * Transaction:
         *
         * 1. Customer balance check
         * 2. Balance deduct
         * 3. Room create
         *
         * इससे एक ही balance से
         * दो room बनाने का race कम होता है।
         */

        await db.runTransaction(
            async function(transaction){

                const customerRef =
                    db.collection(
                        "customers"
                    ).doc(
                        userId
                    );


                const customerSnap =
                    await transaction.get(
                        customerRef
                    );


                if(
                    !customerSnap.exists
                ){

                    throw new Error(
                        "Customer नहीं मिला।"
                    );

                }


                const customer =
                    customerSnap.data() || {};


                const balance =
                    Number(
                        customer.balance || 0
                    );


                if(
                    balance < entry
                ){

                    throw new Error(
                        "Insufficient virtual coins"
                    );

                }


                const roomCodeValue =
                    generateRoomCode();


                const roomRef =
                    db.collection(
                        "rooms"
                    ).doc();


                const now =
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp();


                const prize =
                    calculatePrize(
                        entry
                    );


                transaction.update(
                    customerRef,
                    {

                        balance:
                            balance - entry,

                        lastBattleAt:
                            now

                    }
                );


                transaction.set(
                    roomRef,
                    {

                        roomCode:
                            roomCodeValue,

                        status:
                            "open",

                        maxPlayers:
                            2,

                        playerCount:
                            1,

                        entry:
                            entry,

                        prize:
                            prize,

                        hostId:
                            userId,

                        hostMobile:
                            verifiedMobile,

                        hostName:
                            getDisplayName(
                                verifiedMobile
                            ),

                        player1Id:
                            userId,

                        player1Mobile:
                            verifiedMobile,

                        player2Id:
                            null,

                        player2Mobile:
                            null,

                        createdAt:
                            now,

                        updatedAt:
                            now

                    }
                );


                createdRoom = {

                    id:
                        roomRef.id,

                    code:
                        roomCodeValue,

                    entry:
                        entry

                };

            }
        );


        currentBalance -=
            entry;


        updateBalanceUI();


        amountInput.value =
            "";


        if(createdRoom){

            activeRoomId =
                createdRoom.id;


            showRoomPanel(
                createdRoom.code
            );


            listenActiveRoom(
                createdRoom.id
            );


            showMessage(
                "Battle create हो गई। Room Code: " +
                createdRoom.code
            );

        }


    }catch(error){

        console.error(
            "CREATE BATTLE ERROR:",
            error
        );


        if(
            error.message ===
            "Insufficient virtual coins"
        ){

            showMessage(
                "Virtual coins कम हैं।"
            );

        }

        else{

            showMessage(
                error.message ||
                "Battle create नहीं हुई।"
            );

        }


    }finally{

        const btn =
            document.getElementById(
                "setBtn"
            );


        btn.disabled =
            false;

        btn.textContent =
            "SET";

    }

}


/* =====================================================
   LOAD BATTLES REAL-TIME
   ===================================================== */

function listenBattles(){

    if(
        battleUnsubscribe
    ){

        battleUnsubscribe();

    }


    /*
     * status open/running दोनों पढ़ेंगे।
     */

    battleUnsubscribe =
        db.collection(
            "rooms"
        )
        .where(
            "status",
            "in",
            [
                "open",
                "running"
            ]
        )
        .onSnapshot(

            function(snapshot){

                const rooms = [];


                snapshot.forEach(
                    function(doc){

                        const data =
                            doc.data() || {};


                        rooms.push({

                            id:
                                doc.id,

                            ...data

                        });

                    }
                );


                /*
                 * Newest first
                 */

                rooms.sort(
                    function(a,b){

                        const aTime =
                            a.createdAt &&
                            a.createdAt.toMillis
                            ? a.createdAt.toMillis()
                            : 0;


                        const bTime =
                            b.createdAt &&
                            b.createdAt.toMillis
                            ? b.createdAt.toMillis()
                            : 0;


                        return bTime -
                            aTime;

                    }
                );


                renderBattles(
                    rooms
                );

            },

            function(error){

                console.error(
                    "BATTLE LIST ERROR:",
                    error
                );


                openBattles.innerHTML =
                    `
                    <div class="empty">
                        Battles load नहीं हो पाईं।
                    </div>
                    `;

            }

        );

}

}

/* =====================================================
   JOIN BATTLE
   ===================================================== */

async function joinBattle(roomId){

    try{

        if(
            !db
        ){

            showMessage(
                "Firebase connected नहीं है।"
            );

            return;

        }


        showMessage(
            "Room join हो रहा है..."
        );


        let joinedRoom = null;


        await db.runTransaction(
            async function(transaction){

                const roomRef =
                    db.collection(
                        "rooms"
                    ).doc(
                        roomId
                    );


                const customerRef =
                    db.collection(
                        "customers"
                    ).doc(
                        userId
                    );


                /*
                 * दोनों documents पहले READ
                 */

                const roomSnap =
                    await transaction.get(
                        roomRef
                    );


                const customerSnap =
                    await transaction.get(
                        customerRef
                    );


                if(
                    !roomSnap.exists
                ){

                    throw new Error(
                        "Room नहीं मिला।"
                    );

                }


                if(
                    !customerSnap.exists
                ){

                    throw new Error(
                        "Customer account नहीं मिला।"
                    );

                }


                const room =
                    roomSnap.data() || {};


                const customer =
                    customerSnap.data() || {};


                if(
                    room.status !==
                    "open"
                ){

                    throw new Error(
                        "यह room अभी available नहीं है।"
                    );

                }


                if(
                    Number(
                        room.playerCount || 0
                    ) >= 2
                ){

                    throw new Error(
                        "Room already full है।"
                    );

                }


                if(
                    room.hostId ===
                    userId
                ){

                    throw new Error(
                        "आप अपनी ही battle join नहीं कर सकते।"
                    );

                }


                const entry =
                    Number(
                        room.entry || 0
                    );


                const balance =
                    Number(
                        customer.balance || 0
                    );


                if(
                    balance < entry
                ){

                    throw new Error(
                        "आपके पास पर्याप्त virtual coins नहीं हैं।"
                    );

                }


                const now =
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp();


                /*
                 * SECOND PLAYER KA COIN DEDUCT
                 */

                transaction.update(
                    customerRef,
                    {

                        balance:
                            balance - entry,

                        lastBattleAt:
                            now

                    }
                );


                /*
                 * ROOM UPDATE
                 */

                transaction.update(
                    roomRef,
                    {

                        player2Id:
                            userId,

                        player2Mobile:
                            verifiedMobile,

                        player2Name:
                            getDisplayName(
                                verifiedMobile
                            ),

                        playerCount:
                            2,

                        status:
                            "running",

                        updatedAt:
                            now

                    }
                );


                joinedRoom = {

                    id:
                        roomId,

                    code:
                        room.roomCode

                };

            }
        );


        currentBalance -=
            Number(
                joinedRoom
                ? 0
                : 0
            );


        /*
         * Exact balance फिर Firebase से load
         */

        await loadCustomer();


        if(joinedRoom){

            activeRoomId =
                joinedRoom.id;


            showRoomPanel(
                joinedRoom.code
            );


            listenActiveRoom(
                joinedRoom.id
            );


            showMessage(
                "Room join हो गया। दोनों players ready हैं!"
            );

        }


    }catch(error){

        console.error(
            "JOIN ROOM ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Room join नहीं हुआ।"
        );

    }

}


/* =====================================================
   SHOW ROOM PANEL
   ===================================================== */

function showRoomPanel(code){

    roomPanel.classList.add(
        "show"
    );


    roomCode.textContent =
        code;


    roomPanel.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


/* =====================================================
   LISTEN ACTIVE ROOM
   ===================================================== */

function listenActiveRoom(roomId){

    if(
        activeRoomUnsubscribe
    ){

        activeRoomUnsubscribe();

    }


    activeRoomUnsubscribe =
        db.collection(
            "rooms"
        )
        .doc(
            roomId
        )
        .onSnapshot(
            function(snapshot){

                if(
                    !snapshot.exists
                ){

                    roomPanel.classList.remove(
                        "show"
                    );

                    activeRoomId =
                        null;

                    return;

                }


                const room =
                    snapshot.data() || {};


                if(
                    room.status ===
                    "open"
                ){

                    roomStatus.textContent =
                        "🟢 Waiting for second player...";

                }

                else if(
                    room.status ===
                    "running"
                ){

                    roomStatus.textContent =
                        "🟢 2 players connected — Ludo game ready!";

                }

                else{

                    roomStatus.textContent =
                        "Room status: " +
                        room.status;

                }


                /*
                 * अगर दूसरा player आ गया
                 * तो automatically Ludo button दिखेगा।
                 */

            },

            function(error){

                console.error(
                    "ACTIVE ROOM ERROR:",
                    error
                );

            }
        );

}


/* =====================================================
   OPEN EXISTING ROOM
   ===================================================== */

function openExistingRoom(
    roomId,
    code
){

    activeRoomId =
        roomId;


    showRoomPanel(
        code
    );


    listenActiveRoom(
        roomId
    );


    /*
     * अगर user इसी room का player है,
     * तो सीधे Ludo खोल सकता है।
     */

    setTimeout(
        function(){

            if(
                confirm(
                    "Ludo game खोलें?"
                )
            ){

                openLudo();

            }

        },
        100
    );

}

/* =====================================================
   CANCEL ROOM
   ===================================================== */

async function cancelRoom(){

    try{

        if(
            !activeRoomId
        ){

            showMessage(
                "कोई active room नहीं है।"
            );

            return;

        }


        if(
            !confirm(
                "क्या आप यह room cancel करना चाहते हैं?"
            )
        ){

            return;

        }


        await db.runTransaction(
            async function(transaction){

                const roomRef =
                    db.collection(
                        "rooms"
                    ).doc(
                        activeRoomId
                    );


                const customerRef =
                    db.collection(
                        "customers"
                    ).doc(
                        userId
                    );


                const roomSnap =
                    await transaction.get(
                        roomRef
                    );


                const customerSnap =
                    await transaction.get(
                        customerRef
                    );


                if(
                    !roomSnap.exists
                ){

                    throw new Error(
                        "Room नहीं मिला।"
                    );

                }


                const room =
                    roomSnap.data() || {};


                if(
                    room.hostId !==
                    userId
                ){

                    throw new Error(
                        "केवल room creator cancel कर सकता है।"
                    );

                }


                if(
                    room.status !==
                    "open"
                ){

                    throw new Error(
                        "Running room cancel नहीं किया जा सकता।"
                    );

                }


                const customer =
                    customerSnap.data() || {};


                const balance =
                    Number(
                        customer.balance || 0
                    );


                const entry =
                    Number(
                        room.entry || 0
                    );


                transaction.update(
                    customerRef,
                    {

                        balance:
                            balance + entry,

                        updatedAt:
                            firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                    }
                );


                transaction.delete(
                    roomRef
                );

            }
        );


        activeRoomId =
            null;


        roomPanel.classList.remove(
            "show"
        );


        await loadCustomer();


        showMessage(
            "Room cancel हो गई और coins वापस आ गए।"
        );


    }catch(error){

        console.error(
            "CANCEL ROOM ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Room cancel नहीं हुई।"
        );

    }

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
