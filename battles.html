<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Battles</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    padding-bottom:95px;
}
button,input{font:inherit;}

/* HEADER */
.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;position:sticky;top:0;z-index:1000;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff755e,#ff9270);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#dbeafe);border:2.5px solid #93c5fd;display:flex;align-items:center;justify-content:center;color:#0284c7;font-size:12px;font-weight:900;cursor:pointer;}
.header-actions{display:flex;align-items:center;gap:8px;}
.header-icon{width:38px;height:38px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:linear-gradient(145deg,#6366f1,#818cf8);color:white;}
.coin-head{min-width:68px;height:38px;border-radius:19px;border:0;background:linear-gradient(145deg,#16a34a,#22c55e);color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 10px;}

.container{width:100%;max-width:650px;margin:auto;padding:16px 14px 100px;}
.create-card{border:1.5px solid #7dd3fc;border-radius:20px;padding:14px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);display:flex;align-items:center;gap:10px;margin-bottom:18px;box-shadow:0 6px 18px rgba(2,132,199,0.08);}
.amount-input{flex:1;min-width:0;height:48px;border:1.5px solid #bae6fd;border-radius:14px;background:#ffffff;padding:0 14px;outline:none;font-size:15px;font-weight:800;color:#0f172a;}
.set-btn{height:48px;min-width:90px;border:0;border-radius:14px;background:linear-gradient(145deg,#0284c7,#0369a1);color:white;font-size:16px;font-weight:850;cursor:pointer;}

.section-title{display:flex;align-items:center;gap:6px;margin:18px 0 10px;font-size:16px;font-weight:900;color:#0c4a6e;}
.battle{background:#ffffff;border:1.5px solid #bae6fd;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(2,132,199,0.06);}
.battle-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.status-badge{padding:4px 10px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;}
.status-open{background:#e0f2fe;color:#0284c7;border:1px solid #bae6fd;}
.status-live{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0;}

.battle-middle{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc;overflow:hidden;margin-bottom:10px;}
.money-box{padding:8px 12px;}
.money-box + .money-box{border-left:1px solid #e2e8f0;text-align:right;}
.money-label{display:block;color:#64748b;font-size:10px;font-weight:800;}
.money-value{display:block;margin-top:2px;font-size:17px;font-weight:900;}
.prize-value{color:#0284c7;}
.play-btn{width:100%;height:42px;border:0;border-radius:12px;background:linear-gradient(100deg,#0284c7,#0369a1);color:white;font-size:14px;font-weight:850;cursor:pointer;}

.player-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px;margin-bottom:10px;}
.player{display:flex;align-items:center;gap:6px;}
.player.right{justify-content:flex-end;text-align:right;}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e0f2fe;color:#0284c7;font-weight:800;font-size:12px;}
.player-name{font-size:12px;font-weight:750;}
.vs{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0284c7;color:#fff;font-size:10px;font-weight:900;margin:auto;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);z-index:3000;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.room-modal{background:#ffffff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 24px;max-height:85vh;overflow-y:auto;}
.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:10px;}
.modal-title{font-size:16px;font-weight:900;}
.modal-close{background:#f1f5f9;border:0;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;}
.code-display-box{background:#f0f9ff;border:2px dashed #7dd3fc;border-radius:16px;padding:14px;text-align:center;margin:14px 0;}
.code-display-box strong{display:block;font-size:28px;font-weight:900;color:#0284c7;letter-spacing:3px;margin-top:3px;}
.input-room-code{width:100%;height:46px;border:1.5px solid #cbd5e1;border-radius:12px;padding:0 12px;font-size:15px;text-align:center;outline:none;margin-top:6px;}
.btn-ludo-app{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:15px;font-weight:850;cursor:pointer;margin-top:8px;}
.result-section{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px;}
.result-title{font-size:12px;font-weight:800;color:#475569;margin-bottom:8px;text-align:center;}
.result-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-won{background:#dcfce7;border:1.5px solid #86efac;color:#15803d;height:42px;border-radius:10px;font-weight:850;cursor:pointer;}
.btn-lost{background:#fee2e2;border:1.5px solid #fca5a5;color:#b91c1c;height:42px;border-radius:10px;font-weight:850;cursor:pointer;}
.btn-cancel-match{width:100%;margin-top:10px;height:38px;background:#f8fafc;border:1px solid #cbd5e1;color:#64748b;border-radius:10px;font-size:12px;font-weight:750;cursor:pointer;}
.empty{padding:25px 12px;text-align:center;color:#78849a;background:#fff;border:1px dashed #cbd5e8;border-radius:16px;font-size:13px;}

.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-20px);background:#182440;color:white;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:5000;font-size:13px;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
.nav-item.active{color:#101a38;font-weight:800;}
.nav-item.active::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:#6366f1;}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <button class="menu-btn" onclick="location.href='dashboard.html'">☰</button>
        <div class="logo" onclick="location.href='dashboard.html'">RDX</div>
    </div>
    <div class="header-actions">
        <button class="header-icon" onclick="location.href='notification.html'">🔔</button>
        <div class="coin-head" onclick="location.href='wallet.html'">
            🪙 <span id="headerBalance">0</span>
        </div>
    </div>
</header>

<main class="container">
    <div class="create-card">
        <input id="amountInput" class="amount-input" type="number" min="10" step="10" placeholder="Enter Amount (e.g. 50, 100)" inputmode="numeric">
        <button class="set-btn" id="setBtn" onclick="createBattle()">SET</button>
    </div>

    <div class="section-title"><span>⚔️ Open Battles</span></div>
    <div id="openBattles"><div class="empty">Open battles loading...</div></div>

    <div class="section-title" style="margin-top:20px;"><span>🔥 Running Battles</span></div>
    <div id="runningBattles"><div class="empty">Running battles loading...</div></div>
</main>

<div class="modal-overlay" id="roomModal">
    <div class="room-modal">
        <div class="modal-top">
            <span class="modal-title">🎲 Ludo King Battle Room</span>
            <button class="modal-close" onclick="closeRoomModal()">✕</button>
        </div>
        <div class="code-display-box" id="codeBox">
            <small style="font-size:11px;font-weight:800;color:#64748b;">LUDO KING ROOM CODE</small>
            <strong id="displayRoomCode">WAITING...</strong>
        </div>
        <div id="hostCodeSection" style="display:none; margin-bottom:10px;">
            <label style="font-size:11px; font-weight:800; color:#64748b;">ENTER LUDO KING ROOM CODE:</label>
            <input type="text" id="inputLudoCode" class="input-room-code" placeholder="8-Digit Code">
            <button class="play-btn" style="margin-top:6px;" onclick="updateRoomCode()">Save & Share Code</button>
        </div>
        <button class="btn-ludo-app" id="btnOpenLudo" onclick="launchLudoKing()">
            🚀 Copy Code & Open Ludo King
        </button>
        <div class="result-section">
            <div class="result-title">MATCH KHATAM HONE KE BAAD RESULT SELECT KAREIN:</div>
            <div class="result-buttons">
                <button class="btn-won" onclick="submitMatchResult('won')">🏆 I WON</button>
                <button class="btn-lost" onclick="submitMatchResult('lost')">❌ I LOST</button>
            </div>
            <button class="btn-cancel-match" onclick="cancelOrDisputeMatch()">⚠️ Cancel / Report Issue</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
let db = null;
try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
} catch(e) { console.error(e); }

function getUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || localStorage.getItem("rdxUserId") || "";
    return String(raw).replace(/\D/g, "");
}
const currentUserId = getUserId();
let currentBalance = 0;
let activeRoomData = null;
let activeRoomUnsub = null;

if (!currentUserId) location.href = "login.html";

function showMessage(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

async function loadBalance() {
    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        const snap = await db.collection("customers").doc(docId).get();
        if (snap.exists) {
            currentBalance = Number(snap.data().balance || 0);
            document.getElementById("headerBalance").textContent = currentBalance;
        }
    } catch(err) { console.error(err); }
}

function listenBattles() {
    db.collection("rooms").where("status", "in", ["open", "running"]).onSnapshot(snapshot => {
        let rooms = [];
        snapshot.forEach(doc => rooms.push({ id: doc.id, ...doc.data() }));
        rooms.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

        const open = rooms.filter(r => r.status === "open");
        const running = rooms.filter(r => r.status === "running");
        renderOpen(open);
        renderRunning(running);
    });
}

function renderOpen(rooms) {
    const container = document.getElementById("openBattles");
    if (!rooms.length) {
        container.innerHTML = `<div class="empty">Abhi koi Open Battle nahi hai.<br>Upar amount daalkar challenge banayein.</div>`;
        return;
    }
    container.innerHTML = rooms.map(r => {
        const isMine = String(r.hostId).replace(/\D/g,"") === currentUserId;
        return `
            <div class="battle">
                <div class="battle-top">
                    <span class="status-badge status-open">⚔ OPEN</span>
                    <span style="font-size:12px; color:#64748b;">BY: <b>${r.hostName || 'Player'}</b></span>
                </div>
                <div class="battle-middle">
                    <div class="money-box"><span class="money-label">ENTRY FEE</span><span class="money-value">₹${r.entry}</span></div>
                    <div class="money-box"><span class="money-label">WIN PRIZE</span><span class="money-value prize-value">₹${r.prize}</span></div>
                </div>
                ${isMine ? 
                    `<button class="play-btn" style="background:#64748b;" onclick="openRoomModal('${r.id}')">⏳ Waiting for Player... (View)</button>` : 
                    `<button class="play-btn" onclick="joinBattle('${r.id}', ${r.entry})">Play ₹${r.entry}</button>`
                }
            </div>
        `;
    }).join("");
}

function renderRunning(rooms) {
    const container = document.getElementById("runningBattles");
    if (!rooms.length) {
        container.innerHTML = `<div class="empty">Abhi koi Running Battle nahi hai.</div>`;
        return;
    }
    container.innerHTML = rooms.map(r => {
        const isMyMatch = (String(r.hostId).replace(/\D/g,"") === currentUserId) || (String(r.player2Id).replace(/\D/g,"") === currentUserId);
        return `
            <div class="battle">
                <div class="battle-top">
                    <span class="status-badge status-live">● LIVE MATCH</span>
                    <span style="font-size:12px; color:#64748b;">PRIZE: <b style="color:#16a34a;">₹${r.prize}</b></span>
                </div>
                <div class="player-row">
                    <div class="player"><div class="avatar">👤</div><span class="player-name">${r.hostName || 'Host'}</span></div>
                    <div class="vs">VS</div>
                    <div class="player right"><span class="player-name">${r.player2Name || 'Player 2'}</span><div class="avatar">👤</div></div>
                </div>
                ${isMyMatch ? 
                    `<button class="play-btn" style="background:#16a34a;" onclick="openRoomModal('${r.id}')">🎲 Open Ludo King Room</button>` : 
                    `<button class="play-btn" style="background:#94a3b8;" disabled>🔒 Live Match</button>`
                }
            </div>
        `;
    }).join("");
}

async function createBattle() {
    const amount = Number(document.getElementById("amountInput").value);
    if (!amount || amount < 10) return showMessage("Min battle entry ₹10 hai");
    if (amount > currentBalance) return showMessage("Paryapt balance nahi hai");

    const btn = document.getElementById("setBtn");
    btn.disabled = true;

    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        const prize = Math.floor(amount * 1.90);

        await db.runTransaction(async t => {
            const uRef = db.collection("customers").doc(docId);
            const uSnap = await t.get(uRef);
            const bal = Number(uSnap.data()?.balance || 0);
            if (bal < amount) throw new Error("Insufficient balance");

            t.update(uRef, { balance: bal - amount });
            const rRef = db.collection("rooms").doc();
            t.set(rRef, {
                hostId: currentUserId,
                hostName: (localStorage.getItem("rdxUsername") || ("User " + currentUserId.slice(-4))).split(" ")[0],
                entry: amount,
                prize: prize,
                status: "open",
                roomCode: "",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        document.getElementById("amountInput").value = "";
        await loadBalance();
        showMessage("Battle create ho gayi!");
    } catch(err) {
        showMessage(err.message);
    }
    btn.disabled = false;
}

async function joinBattle(roomId, entry) {
    if (entry > currentBalance) return showMessage("Paryapt balance nahi hai");
    if (!confirm(`Kya aap ₹${entry} ki battle join karna chahte hain?`)) return;

    try {
        let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
        await db.runTransaction(async t => {
            const rRef = db.collection("rooms").doc(roomId);
            const uRef = db.collection("customers").doc(docId);
            const rSnap = await t.get(rRef);
            const uSnap = await t.get(uRef);

            if (rSnap.data().status !== "open") throw new Error("Battle already shuru ho chuki hai");
            const bal = Number(uSnap.data()?.balance || 0);
            if (bal < entry) throw new Error("Insufficient balance");

            t.update(uRef, { balance: bal - entry });
            t.update(rRef, {
                player2Id: currentUserId,
                player2Name: (localStorage.getItem("rdxUsername") || ("User " + currentUserId.slice(-4))).split(" ")[0],
                status: "running",
                joinedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await loadBalance();
        openRoomModal(roomId);
    } catch(err) { showMessage(err.message); }
}

function openRoomModal(roomId) {
    const modal = document.getElementById("roomModal");
    modal.classList.add("show");
    if (activeRoomUnsub) activeRoomUnsub();

    activeRoomUnsub = db.collection("rooms").doc(roomId).onSnapshot(doc => {
        if (!doc.exists) { closeRoomModal(); return; }
        activeRoomData = { id: doc.id, ...doc.data() };
        renderModalData();
    });
}

function renderModalData() {
    if (!activeRoomData) return;
    const isHost = String(activeRoomData.hostId).replace(/\D/g,"") === currentUserId;
    const codeDisplay = document.getElementById("displayRoomCode");
    const hostCodeSection = document.getElementById("hostCodeSection");

    if (activeRoomData.roomCode && activeRoomData.roomCode.trim() !== "") {
        codeDisplay.textContent = activeRoomData.roomCode;
        hostCodeSection.style.display = "none";
    } else {
        if (isHost) {
            codeDisplay.textContent = "ENTER CODE BELOW";
            hostCodeSection.style.display = "block";
        } else {
            codeDisplay.textContent = "WAITING FOR HOST...";
            hostCodeSection.style.display = "none";
        }
    }
}

function closeRoomModal() {
    document.getElementById("roomModal").classList.remove("show");
    if (activeRoomUnsub) activeRoomUnsub();
    activeRoomData = null;
}

async function updateRoomCode() {
    const code = document.getElementById("inputLudoCode").value.trim();
    if (!code || code.length < 6) return showMessage("Valid Ludo King room code daalein");
    try {
        await db.collection("rooms").doc(activeRoomData.id).update({ roomCode: code });
        showMessage("Room code update ho gaya!");
    } catch(err) { showMessage(err.message); }
}

function launchLudoKing() {
    if (activeRoomData?.roomCode) {
        navigator.clipboard.writeText(activeRoomData.roomCode);
        showMessage("Room Code Copied: " + activeRoomData.roomCode);
    }
    setTimeout(() => { window.location.href = "ludoking://"; }, 400);
}

async function submitMatchResult(result) {
    if (!activeRoomData) return;
    if (!confirm(`Kya aap confirm karte hain ki aap match '${result.toUpperCase()}' kar chuke hain?`)) return;

    try {
        await db.collection("rooms").doc(activeRoomData.id).update({
            [`result_${currentUserId}`]: result,
            status: result === 'lost' ? 'completed' : 'under_review'
        });
        showMessage("Result submit ho gaya. Admin verify karega.");
        closeRoomModal();
    } catch(err) { showMessage(err.message); }
}

async function cancelOrDisputeMatch() {
    if (!activeRoomData) return;
    if (activeRoomData.status === "open") {
        if (!confirm("Room cancel karke amount refund lein?")) return;
        try {
            let docId = currentUserId.length === 10 ? "91" + currentUserId : currentUserId;
            await db.runTransaction(async t => {
                const rRef = db.collection("rooms").doc(activeRoomData.id);
                const uRef = db.collection("customers").doc(docId);
                const uSnap = await t.get(uRef);
                t.update(uRef, { balance: Number(uSnap.data()?.balance || 0) + Number(activeRoomData.entry) });
                t.delete(rRef);
            });
            await loadBalance();
            closeRoomModal();
            showMessage("Room cancel ho gaya.");
        } catch(e) { showMessage(e.message); }
    } else {
        showMessage("Match running hai. Kripya Support par screenshot bhejein.");
    }
}

window.addEventListener("load", async () => {
    await loadBalance();
    listenBattles();
});
</script>
</body>
