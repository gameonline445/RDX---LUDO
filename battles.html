<style>

*{

body{

<script>

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

    authDomain:
        "rdx-ludo.firebaseapp.com",

    projectId:
        "rdx-ludo",

    storageBucket:
        "rdx-ludo.firebasestorage.app",

    messagingSenderId:
        "928340814840",

    appId:
        "1:928340814840:web:6eca42a8b76138b268440d"

};


let db = null;


try{

    if(!firebase.apps.length){

        firebase.initializeApp(
            firebaseConfig
        );

    }

    db =
        firebase.firestore();

    console.log(
        "RDX FIREBASE CONNECTED"
    );

}catch(error){

    console.error(
        "FIREBASE ERROR",
        error
    );

}


/* =====================================================
   USER
   ===================================================== */

let currentUserId = "";

let currentRoomId = "";

let roomUnsubscribe = null;


/*
 * Login HTML में यही value save होती है:
 *
 * rdxFirebaseUserId
 */

function getLoggedUser(){

    let mobile =
        localStorage.getItem(
            "rdxFirebaseUserId"
        );


    if(!mobile){

        mobile =
            localStorage.getItem(
                "rdxVerifiedMobile"
            );

    }


    if(!mobile){

        return null;

    }


    mobile =
        String(mobile)
        .replace(
            /\D/g,
            ""
        );


    if(
        mobile.length === 10
    ){

        mobile =
            "91" + mobile;

    }


    if(
        !/^91[6-9]\d{9}$/.test(
            mobile
        )
    ){

        return null;

    }


    return mobile;

}


/* =====================================================
   PAGE START
   ===================================================== */

window.addEventListener(
    "load",
    async function(){

        currentUserId =
            getLoggedUser();


        if(!currentUserId){

            showMessage(
                "पहले Login करें।"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "./index.html";

                },
                1200
            );

            return;

        }


        document.getElementById(
            "userMobile"
        ).textContent =
            "+" + currentUserId;


        await loadCustomer();


        loadOpenRooms();


        checkExistingRoom();

    }
);


/* =====================================================
   LOAD CUSTOMER
   ===================================================== */

async function loadCustomer(){

    try{

        if(!db){

            throw new Error(
                "Firebase database connected नहीं है।"
            );

        }


        const ref =
            db.collection(
                "customers"
            ).doc(
                currentUserId
            );


        const snap =
            await ref.get();


        if(!snap.exists){

            showMessage(
                "Firebase में customer account नहीं मिला।"
            );

            return;

        }


        const data =
            snap.data();


        const balance =
            Number(
                data.balance || 0
            );


        document.getElementById(
            "balance"
        ).textContent =
            balance;


        console.log(
            "CUSTOMER:",
            data
        );


    }catch(error){

        console.error(
            "CUSTOMER LOAD ERROR:",
            error
        );


        showMessage(
            "Balance load नहीं हुआ: " +
            error.message
        );

    }

}


/* =====================================================
   CREATE ROOM
   ===================================================== */

async function createRoom(){

    try{

        if(!currentUserId){

            showMessage(
                "पहले login करें।"
            );

            return;

        }


        if(!db){

            showMessage(
                "Firebase connected नहीं है।"
            );

            return;

        }


        /*
         * पहले check:
         * क्या user पहले से room में है?
         */

        const existing =
            await db.collection(
                "rooms"
            )
            .where(
                "player1.id",
                "==",
                currentUserId
            )
            .where(
                "status",
                "in",
                ["WAITING","READY"]
            )
            .limit(1)
            .get();


        if(!existing.empty){

            const room =
                existing.docs[0];


            openActiveRoom(
                room.id
            );


            showMessage(
                "आपका पहले से एक active room है।"
            );


            return;

        }


        const roomCode =
            generateRoomCode();


        const roomRef =
            db.collection(
                "rooms"
            ).doc(
                roomCode
            );


        await roomRef.set({

            roomCode:
                roomCode,

            maxPlayers:
                2,

            playerCount:
                1,

            status:
                "WAITING",

            createdAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            player1:{

                id:
                    currentUserId,

                mobile:
                    "+" + currentUserId,

                joinedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            },

            player2:
                null

        });


        openActiveRoom(
            roomCode
        );


        showMessage(
            "Room created: " +
            roomCode
        );


    }catch(error){

        console.error(
            "CREATE ROOM ERROR:",
            error
        );


        showMessage(
            "Room create error: " +
            error.message
        );

    }

}


/* =====================================================
   GENERATE ROOM CODE
   ===================================================== */

function generateRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code =
        "RDX";


    for(
        let i=0;
        i<5;
        i++
    ){

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}


/* =====================================================
   JOIN ROOM
   ===================================================== */

async function joinRoom(){

    const input =
        document.getElementById(
            "roomInput"
        );


    const roomCode =
        input.value
        .trim()
        .toUpperCase();


    if(!roomCode){

        showMessage(
            "Room code डालें।"
        );

        return;

    }


    if(roomCode.length < 4){

        showMessage(
            "Invalid room code।"
        );

        return;

    }


    try{

        const roomRef =
            db.collection(
                "rooms"
            ).doc(
                roomCode
            );


        await db.runTransaction(
            async function(transaction){

                const snap =
                    await transaction.get(
                        roomRef
                    );


                if(!snap.exists){

                    throw new Error(
                        "ROOM_NOT_FOUND"
                    );

                }


                const data =
                    snap.data();


                /*
                 * Already player 1?
                 */

                if(
                    data.player1 &&
                    data.player1.id ===
                    currentUserId
                ){

                    return;

                }


                /*
                 * Already player 2?
                 */

                if(
                    data.player2 &&
                    data.player2.id ===
                    currentUserId
                ){

                    return;

                }


                /*
                 * Room full
                 */

                if(
                    Number(
                        data.playerCount || 0
                    ) >= 2 ||
                    data.player2
                ){

                    throw new Error(
                        "ROOM_FULL"
                    );

                }


                /*
                 * Add player 2
                 */

                transaction.update(
                    roomRef,
                    {

                        player2:{

                            id:
                                currentUserId,

                            mobile:
                                "+" +
                                currentUserId,

                            joinedAt:
                                firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                        },

                        playerCount:
                            2,

                        status:
                            "READY",

                        updatedAt:
                            firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                    }
                );

            }
        );


        input.value =
            "";


        openActiveRoom(
            roomCode
        );


        showMessage(
            "Room join हो गया।"
        );


    }catch(error){

        console.error(
            "JOIN ROOM ERROR:",
            error
        );


        if(
            error.message ===
            "ROOM_NOT_FOUND"
        ){

            showMessage(
                "यह Room नहीं मिला।"
            );

        }

        else if(
            error.message ===
            "ROOM_FULL"
        ){

            showMessage(
                "यह Room पहले से full है।"
            );

        }

        else{

            showMessage(
                "Join error: " +
                error.message
            );

        }

    }

}


/* =====================================================
   OPEN ACTIVE ROOM
   ===================================================== */

function openActiveRoom(roomCode){

    currentRoomId =
        roomCode;


    localStorage.setItem(
        "rdxActiveRoom",
        roomCode
    );


    document.getElementById(
        "activeRoom"
    ).textContent =
        roomCode;


    document.getElementById(
        "roomCard"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "roomCard"
    ).scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    listenToRoom(
        roomCode
    );

}


/* =====================================================
   LISTEN ROOM REALTIME
   ===================================================== */

function listenToRoom(roomCode){

    if(roomUnsubscribe){

        roomUnsubscribe();

        roomUnsubscribe =
            null;

    }


    roomUnsubscribe =
        db.collection(
            "rooms"
        )
        .doc(
            roomCode
        )
        .onSnapshot(

            function(snapshot){

                if(
                    !snapshot.exists
                ){

                    showMessage(
                        "Room delete हो गया।"
                    );


                    document.getElementById(
                        "roomCard"
                    ).classList.remove(
                        "show"
                    );


                    return;

                }


                const data =
                    snapshot.data();


                updateRoomUI(
                    data
                );

            },


            function(error){

                console.error(
                    "ROOM LISTENER ERROR:",
                    error
                );


                showMessage(
                    "Room data load error।"
                );

            }

        );

}


/* =====================================================
   ROOM UI
   ===================================================== */

function updateRoomUI(data){

    const player1 =
        data.player1;


    const player2 =
        data.player2;


    const count =
        Number(
            data.playerCount ||
            0
        );


    document.getElementById(
        "playerCount"
    ).textContent =
        count + "/2";


    document.getElementById(
        "roomStatus"
    ).textContent =
        data.status ||
        "WAITING";


    if(player1){

        document.getElementById(
            "player1Name"
        ).textContent =
            formatMobile(
                player1.mobile
            );

    }


    if(player2){

        document.getElementById(
            "player2Name"
        ).textContent =
            formatMobile(
                player2.mobile
            );


        document.getElementById(
            "player2Box"
        ).classList.add(
            "online"
        );

    }

    else{

        document.getElementById(
            "player2Name"
        ).textContent =
            "Waiting...";


        document.getElementById(
            "player2Box"
        ).classList.remove(
            "online"
        );

    }


    const waitingBox =
        document.getElementById(
            "waitingBox"
        );


    const ludoBtn =
        document.getElementById(
            "ludoBtn"
        );


    if(
        count >= 2 &&
        data.status === "READY"
    ){

        waitingBox.className =
            "ready";

        waitingBox.textContent =
            "✅ दोनों खिलाड़ी जुड़ गए। Ludo शुरू कर सकते हैं।";


        ludoBtn.style.display =
            "block";

    }

    else{

        waitingBox.className =
            "waiting";

        waitingBox.textContent =
            "⏳ दूसरे खिलाड़ी का इंतज़ार है...";


        ludoBtn.style.display =
            "none";

    }

}


/* =====================================================
   FORMAT MOBILE
   ===================================================== */

function formatMobile(number){

    if(!number){

        return "Player";

    }


    const text =
        String(number);


    if(text.length >= 10){

        return (
            text.slice(0,3) +
            "******" +
            text.slice(-2)
        );

    }


    return text;

}


/* =====================================================
   LOAD OPEN ROOMS
   ===================================================== */

function loadOpenRooms(){

    db.collection(
        "rooms"
    )
    .where(
        "status",
        "==",
        "WAITING"
    )
    .limit(20)
    .onSnapshot(

        function(snapshot){

            const list =
                document.getElementById(
                    "battleList"
                );


            if(snapshot.empty){

                list.innerHTML = `
                    <div class="empty">
                        अभी कोई Open Room नहीं है।<br>
                        पहला Room आप बना सकते हैं।
                    </div>
                `;

                return;

            }


            list.innerHTML =
                "";


            snapshot.forEach(
                function(doc){

                    const data =
                        doc.data();


                    const room =
                        data.roomCode ||
                        doc.id;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "battle";


                    card.innerHTML = `

                        <div class="battle-top">

                            <span class="status">
                                ● OPEN
                            </span>

                            <span class="battle-id">
                                #${escapeHTML(room)}
                            </span>

                        </div>

                        <div class="battle-middle">

                            <div class="info">

                                <small>
                                    PLAYERS
                                </small>

                                <strong>
                                    1 / 2
                                </strong>

                            </div>

                            <div class="prize">

                                <small>
                                    TYPE
                                </small>

                                <strong>
                                    2 PLAYER
                                </strong>

                            </div>

                        </div>

                        <button
                            class="play-small"
                            onclick="joinBattleFromList('${escapeAttribute(room)}')">

                            JOIN ROOM

                        </button>
                    `;


                    list.appendChild(
                        card
                    );

                }
            );

        },


        function(error){

            console.error(
                "OPEN ROOMS ERROR:",
                error
            );


            document.getElementById(
                "battleList"
            ).innerHTML = `

                <div class="empty">

                    Firebase rooms load नहीं हुए।<br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    );

}


/* =====================================================
   JOIN FROM LIST
   ===================================================== */

function joinBattleFromList(room){

    document.getElementById(
        "roomInput"
    ).value =
        room;


    joinRoom();

}


/* =====================================================
   EXISTING ROOM CHECK
   ===================================================== */

async function checkExistingRoom(){

    const savedRoom =
        localStorage.getItem(
            "rdxActiveRoom"
        );


    if(!savedRoom){

        return;

    }


    try{

        const snap =
            await db.collection(
                "rooms"
            )
            .doc(
                savedRoom
            )
            .get();


        if(
            snap.exists
        ){

            const data =
                snap.data();


            const isPlayer =

                (
                    data.player1 &&
                    data.player1.id ===
                    currentUserId
                )

                ||

                (
                    data.player2 &&
                    data.player2.id ===
                    currentUserId
                );


            if(isPlayer){

                openActiveRoom(
                    savedRoom
                );

            }

        }

        else{

            localStorage.removeItem(
                "rdxActiveRoom"
            );

        }

    }catch(error){

        console.error(
            "EXISTING ROOM ERROR:",
            error
        );

    }

}


/* =====================================================
   LEAVE ROOM
   ===================================================== */

async function leaveRoom(){

    if(!currentRoomId){

        return;

    }


    try{

        const roomRef =
            db.collection(
                "rooms"
            )
            .doc(
                currentRoomId
            );


        await db.runTransaction(
            async function(transaction){

                const snap =
                    await transaction.get(
                        roomRef
                    );


                if(!snap.exists){

                    return;

                }


                const data =
                    snap.data();


                const updates = {

                    updatedAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                };


                /*
                 * Player 1 leaves
                 */

                if(
                    data.player1 &&
                    data.player1.id ===
                    currentUserId
                ){

                    if(data.player2){

                        updates.player1 =
                            data.player2;

                        updates.player2 =
                            null;

                        updates.playerCount =
                            1;

                        updates.status =
                            "WAITING";

                    }

                    else{

                        updates.status =
                            "CANCELLED";

                        updates.playerCount =
                            0;

                    }

                }


                /*
                 * Player 2 leaves
                 */

                else if(
                    data.player2 &&
                    data.player2.id ===
                    currentUserId
                ){

                    updates.player2 =
                        null;

                    updates.playerCount =
                        1;

                    updates.status =
                        "WAITING";

                }


                transaction.update(
                    roomRef,
                    updates
                );

            }
        );


        if(roomUnsubscribe){

            roomUnsubscribe();

            roomUnsubscribe =
                null;

        }


        localStorage.removeItem(
            "rdxActiveRoom"
        );


        currentRoomId =
            "";


        document.getElementById(
            "roomCard"
        ).classList.remove(
            "show"
        );


        showMessage(
            "आप Room से बाहर आ गए।"
        );


    }catch(error){

        console.error(
            "LEAVE ROOM ERROR:",
            error
        );


        showMessage(
            "Room leave error: " +
            error.message
        );

    }

}

/* =====================================================
   TOAST
   ===================================================== */

function showMessage(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   SECURITY DISPLAY HELPERS
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            "&quot;"
        );

}
