<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RDX LUDO - Register</title>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(83,125,255,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(255,116,93,.18),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #edf4ff,
            #ffffff 50%,
            #f4f7ff
        );

    color:#101b3d;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


.container{

    width:100%;

    max-width:430px;

}


.logo{

    width:82px;

    height:82px;

    margin:0 auto 16px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e8f0ff
        );

    border:6px solid #c9dafb;

    box-shadow:
        0 10px 30px
        rgba(47,105,230,.18);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    font-weight:950;

    color:#2867df;

}


.card{

    background:
        rgba(255,255,255,.97);

    border:1px solid #c5d7f6;

    border-radius:28px;

    padding:28px 22px;

    box-shadow:
        0 18px 50px
        rgba(34,79,160,.13);

}


h1{

    text-align:center;

    font-size:29px;

    margin-bottom:7px;

    font-weight:900;

}


.subtitle{

    text-align:center;

    color:#71809d;

    margin-bottom:24px;

    font-size:15px;

}


label{

    display:block;

    font-weight:800;

    margin:15px 3px 7px;

    color:#34415e;

}


input{

    width:100%;

    height:56px;

    border:1px solid #ccd9ee;

    border-radius:16px;

    padding:0 16px;

    font-size:16px;

    outline:none;

    background:#f8faff;

    color:#15203f;

}


input:focus{

    border-color:#3974e8;

    box-shadow:
        0 0 0 3px
        rgba(57,116,232,.10);

}


.ref-box{

    background:
        linear-gradient(
            145deg,
            #eef5ff,
            #e7f0ff
        );

    border:1px solid #bcd2fb;

    border-radius:16px;

    padding:15px;

    margin-top:20px;

}


.ref-title{

    font-size:13px;

    color:#71809d;

    margin-bottom:5px;

    font-weight:700;

}


.ref-code{

    font-size:21px;

    font-weight:950;

    color:#2867df;

    word-break:break-word;

}


.ref-status{

    margin-top:6px;

    font-size:12px;

    color:#71809d;

}


button{

    width:100%;

    height:58px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #3478ed,
            #245bd8,
            #6658e8
        );

    color:white;

    font-size:18px;

    font-weight:900;

    margin-top:23px;

    cursor:pointer;

    box-shadow:
        0 9px 24px
        rgba(44,105,225,.25);

}


button:active{

    transform:scale(.98);

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.login{

    text-align:center;

    margin-top:20px;

    color:#687792;

}


.login a{

    color:#2867df;

    font-weight:850;

    text-decoration:none;

}


.message{

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:13px;

    text-align:center;

    font-weight:700;

    font-size:14px;

    line-height:1.45;

}


.success{

    display:block;

    background:#e8fff1;

    color:#158447;

    border:1px solid #a9e7c2;

}


.error{

    display:block;

    background:#fff0f0;

    color:#c52828;

    border:1px solid #f1b5b5;

}


.small{

    margin-top:17px;

    text-align:center;

    font-size:12px;

    color:#8792a8;

    line-height:1.5;

}


.loading{

    text-align:center;

    color:#71809d;

    font-size:12px;

    margin-top:10px;

}


@media(max-width:420px){

    body{

        padding:12px;

    }

    .card{

        padding:24px 18px;

        border-radius:24px;

    }

    h1{

        font-size:27px;

    }

}


</style>

</head>


<body>


<div class="container">


    <div class="logo">
        RDX
    </div>


    <div class="card">


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Join RDX LUDO
        </p>


        <form id="registerForm">


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="name"
                required
            >


            <!-- MOBILE -->

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                required
            >


            <!-- USERNAME -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose username"
                maxlength="20"
                autocomplete="username"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                maxlength="50"
                autocomplete="new-password"
                required
            >


            <!-- REFERRAL -->

            <div class="ref-box">

                <div class="ref-title">
                    Referral Code
                </div>

                <div
                    class="ref-code"
                    id="referralCode"
                >
                    None
                </div>

                <div
                    class="ref-status"
                    id="refStatus"
                >
                    No referral code detected.
                </div>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="registerBtn"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <div
                id="loadingText"
                class="loading"
                style="display:none;"
            >
                Creating your account...
            </div>


        </form>


        <div class="login">

            Already have an account?

            <a href="./login.html">
                Login
            </a>

        </div>


        <div class="small">

            Your mobile number will be used for secure OTP login.

            <br>

            By creating an account, you agree to the website's
            terms and policies.

        </div>


    </div>


</div>



<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

    authDomain:
        "rdx-ludo.firebaseapp.com",

    projectId:
        "rdx-ludo",

    storageBucket:
        "rdx-ludo.firebasestorage.app",

    messagingSenderId:
        "928340814840",

    appId:
        "1:928340814840:web:6eca42a8b76138b268440d"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

let db = null;

try{

    if(!firebase.apps.length){

        firebase.initializeApp(
            firebaseConfig
        );

    }

    db =
        firebase.firestore();

    console.log(
        "Firebase connected successfully."
    );

}catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =====================================================
   GET REFERRAL FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let incomingReferral =
    params.get("ref");


if(incomingReferral){

    incomingReferral =
        incomingReferral
            .trim()
            .toUpperCase();

}


/* =====================================================
   ELEMENTS
===================================================== */

const referralElement =
    document.getElementById(
        "referralCode"
    );


const refStatus =
    document.getElementById(
        "refStatus"
    );


const form =
    document.getElementById(
        "registerForm"
    );


const registerBtn =
    document.getElementById(
        "registerBtn"
    );


const message =
    document.getElementById(
        "message"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


/* =====================================================
   SHOW REFERRAL
===================================================== */

if(
    incomingReferral &&
    /^[A-Z0-9_-]{3,30}$/.test(
        incomingReferral
    )
){

    referralElement.textContent =
        incomingReferral;

    refStatus.textContent =
        "Referral link detected successfully.";

}else{

    incomingReferral =
        null;

    referralElement.textContent =
        "None";

    refStatus.textContent =
        "No referral code detected.";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   CLEAN USERNAME
===================================================== */

function cleanUsername(
    username
){

    return username
        .trim()
        .toLowerCase()
        .replace(
            /[^a-z0-9_]/g,
            ""
        );

}


/* =====================================================
   MOBILE CLEAN
===================================================== */

function cleanMobile(
    mobile
){

    return mobile
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            10
        );

}


/* =====================================================
   MOBILE INPUT
===================================================== */

document
    .getElementById("mobile")
    .addEventListener(
        "input",
        function(){

            this.value =
                cleanMobile(
                    this.value
                );

        }
    );


/* =====================================================
   USERNAME INPUT
===================================================== */

document
    .getElementById("username")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9_]/g,
                        ""
                    )
                    .slice(
                        0,
                        20
                    );

        }
    );


/* =====================================================
   REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        /* ---------------------------------------------
           GET VALUES
        --------------------------------------------- */

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const mobile =
            cleanMobile(
                document
                    .getElementById("mobile")
                    .value
            );


        const username =
            cleanUsername(
                document
                    .getElementById("username")
                    .value
            );


        const password =
            document
                .getElementById("password")
                .value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if(
            name.length < 2
        ){

            showMessage(
                "Please enter a valid name.",
                "error"
            );

            return;

        }


        if(
            !/^[6-9][0-9]{9}$/.test(
                mobile
            )
        ){

            showMessage(
                "Please enter a valid 10-digit Indian mobile number.",
                "error"
            );

            return;

        }


        if(
            username.length < 4
        ){

            showMessage(
                "Username must contain at least 4 characters.",
                "error"
            );

            return;

        }


        if(
            password.length < 6
        ){

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        if(!db){

            showMessage(
                "Firebase database is not connected.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           DISABLE BUTTON
        --------------------------------------------- */

        registerBtn.disabled =
            true;

        registerBtn.textContent =
            "Creating Account...";

        loadingText.style.display =
            "block";

        message.style.display =
            "none";


        try{


            /* -----------------------------------------
               FIREBASE DOCUMENT ID

               Example:

               9191787885237

               This is the SAME format used by
               login.html.
            ----------------------------------------- */

            const fullMobile =
                "91" +
                mobile;


            const customerRef =
                db
                    .collection(
                        "customers"
                    )
                    .doc(
                        fullMobile
                    );


            /* -----------------------------------------
               CHECK EXISTING USER

               This requires Firestore read permission.
            ----------------------------------------- */

            const existing =
                await customerRef.get();


            if(
                existing.exists
            ){

                registerBtn.disabled =
                    false;

                registerBtn.textContent =
                    "Create Account";

                loadingText.style.display =
                    "none";


                showMessage(
                    "This mobile number is already registered. Please login using OTP.",
                    "error"
                );

                return;

            }


            /* -----------------------------------------
               USER REFERRAL CODE
            ----------------------------------------- */

            const myReferralCode =
                createReferralCode();


            /* -----------------------------------------
               CUSTOMER DATA
            ----------------------------------------- */

            const customerData = {

                mobile:
                    "+" +
                    fullMobile,

                mobileNumber:
                    mobile,

                name:
                    name,

                username:
                    username,

                password:
                    password,

                referralCode:
                    myReferralCode,

                referredBy:
                    incomingReferral || null,

                balance:
                    0,

                referrals:
                    0,

                status:
                    "active",

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                lastLoginAt:
                    null

            };


            /* -----------------------------------------
               SAVE TO FIREBASE
            ----------------------------------------- */

            await customerRef.set(
                customerData
            );


            /* -----------------------------------------
               LOCAL STORAGE
            ----------------------------------------- */

            localStorage.setItem(
                "rdxLoginMobile",
                fullMobile
            );


            localStorage.setItem(
                "rdxFirebaseUserId",
                fullMobile
            );


            localStorage.setItem(
                "rdxVerifiedMobile",
                fullMobile
            );


            localStorage.setItem(
                "rdxRegistered",
                "true"
            );


            localStorage.setItem(
                "rdxReferralCode",
                myReferralCode
            );


            if(incomingReferral){

                localStorage.setItem(
                    "rdxReferredBy",
                    incomingReferral
                );

            }


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            loadingText.style.display =
                "none";

            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Account Created";


            showMessage(
                "Account created successfully! Referral: " +
                (
                    incomingReferral ||
                    "None"
                ),
                "success"
            );


            /* -----------------------------------------
               GO LOGIN
            ----------------------------------------- */

            setTimeout(
                function(){

                    window.location.href =
                        "./login.html";

                },
                1500
            );


        }catch(error){


            console.error(
                "REGISTRATION ERROR:",
                error
            );


            loadingText.style.display =
                "none";


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";


            let errorText =
                error.message ||
                "Registration failed.";


            showMessage(
                "Registration Error: " +
                errorText,
                "error"
            );

        }

    }
);


/* =====================================================
   CREATE REFERRAL CODE
===================================================== */

function createReferralCode(){

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    const first =
        letters.charAt(
            Math.floor(
                Math.random() *
                letters.length
            )
        );


    const second =
        letters.charAt(
            Math.floor(
                Math.random() *
                letters.length
            )
        );


    const number =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    return (
        "NR" +
        first +
        second +
        number
    );

}

</script>


</body>

</html>
