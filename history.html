<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - History & Logs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8faff 0%, #eef4ff 50%, #f1f5f9 100%);
            color: #101a38;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        /* Top Header */
        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ccd8ed;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #cbd7e9;
            color: #2864e6;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .brand-badge {
            background: #ffffff;
            border: 1px solid #dce6fb;
            color: #2362d9;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(35, 98, 217, 0.08);
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .topicon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: #ffffff;
        }

        .icon-bell { background: #7368ef; }
        .icon-cash { background: #35bf71; }
        .icon-gift { background: #ff933c; }

        /* Page Heading */
        .page-heading {
            padding: 16px 18px 8px;
        }

        .page-heading h1 {
            font-size: 22px;
            font-weight: 800;
            color: #101a38;
        }

        .page-heading p {
            font-size: 13px;
            color: #7a879f;
            margin-top: 2px;
        }

        /* Search & Filter Controls */
        .filter-section {
            padding: 10px 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #748097;
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 40px;
            border-radius: 14px;
            border: 1.5px solid #cbd7e9;
            background: #ffffff;
            font-size: 13px;
            font-weight: 600;
            color: #101a38;
            outline: none;
            box-shadow: 0 2px 6px rgba(66, 117, 211, 0.05);
        }

        .search-input:focus {
            border-color: #2864e6;
        }

        .date-filter-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-input {
            flex: 1;
            height: 42px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1.5px solid #cbd7e9;
            background: #ffffff;
            font-size: 12px;
            font-weight: 600;
            color: #101a38;
            outline: none;
        }

        .clear-btn {
            height: 42px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #cbd7e9;
            background: #eef1f6;
            color: #748097;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Content List */
        .content-section {
            padding: 0 18px;
        }

        /* Rounded Cards */
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1.5px solid #bdd0f0;
            box-shadow: 0 6px 18px rgba(66, 117, 211, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: #101a38;
        }

        .card-subtitle {
            font-size: 12px;
            color: #6b7891;
            font-weight: 600;
            word-break: break-all;
        }

        .card-date {
            font-size: 11px;
            color: #9aa6bc;
            margin-top: 2px;
        }

        .card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .amount {
            font-size: 18px;
            font-weight: 900;
        }

        .credit { color: #13834d; }
        .debit { color: #c72e43; }

        /* Badges */
        .badge {
            font-size: 10px;
            padding: 4px 9px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-approved { background: #dcf8e9; color: #13834d; border: 1px solid #b8e9cf; }
        .badge-rejected { background: #ffe3e7; color: #c72e43; border: 1px solid #f4bbc5; }
        .badge-pending { background: #fff4d6; color: #a37200; border: 1px solid #fae19c; }

        /* Admin Comments Notes */
        .admin-note {
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
        }

        .admin-note.approved {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .admin-note.rejected {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .admin-note.pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .admin-note i {
            font-size: 14px;
            margin-top: 2px;
        }

        .status-box {
            text-align: center;
            padding: 40px 20px;
            color: #7a879f;
            font-size: 14px;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom {
            height: 64px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #ffffff;
            border-top: 1px solid #d5deed;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .nav {
            border: 0;
            background: #ffffff;
            color: #6d7890;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav b { font-size: 21px; }
        .nav.active { color: #18213a; font-weight: 900; }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="top-bar">
        <div class="header-left">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="brand-badge">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell">🔔</div>
            <div class="topicon icon-cash">💵</div>
            <div class="topicon icon-gift">🎁</div>
        </div>
    </header>

    <!-- Page Title -->
    <div class="page-heading">
        <h1>Transactions & Logs</h1>
        <p>Search wallet deposits and payment status</p>
    </div>

    <!-- Search & Date Filter -->
    <div class="filter-section">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by UTR Number, Amount, Status...">
        </div>
        <div class="date-filter-box">
            <input type="date" id="dateInput" class="date-input" title="Select Date">
            <button class="clear-btn" id="clearBtn" onclick="clearFilters()">
                <i class="fa-solid fa-rotate-left"></i> Clear
            </button>
        </div>
    </div>

    <!-- Transactions List Container -->
    <section class="content-section">
        <div id="transactions-list" class="status-box">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #2864e6; margin-bottom: 10px;"></i><br>
            Transactions load ho rahe hain...
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom">
        <a class="nav" href="dashboard.html">
            <b>🏠</b>
            Home
        </a>
        <a class="nav" href="wallet.html">
            <b>💰</b>
            Wallet
        </a>
        <a class="nav" href="support.html">
            <b>🎧</b>
            Support
        </a>
        <a class="nav active" href="profile.html">
            <b>👤</b>
            Profile
        </a>
    </nav>

    <!-- Firebase v12 Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // User ID
        function getLoggedInUserId() {
            const raw = localStorage.getItem("rdxFirebaseUserId") || 
                        localStorage.getItem("rdxVerifiedMobile") || 
                        localStorage.getItem("rdxUserId") || 
                        localStorage.getItem("userId") || 
                        localStorage.getItem("rdx_userId") || "";
            return String(raw).replace(/\D/g, "");
        }

        const currentUserId = getLoggedInUserId();
        let allDeposits = [];

        // Load Transactions from Firestore
        async function loadRealTransactions() {
            const listContainer = document.getElementById("transactions-list");

            if (!currentUserId) {
                listContainer.innerHTML = `
                    <div class="status-box">
                        <i class="fa-solid fa-arrow-right-to-bracket fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                        History dekhne ke liye pehle <a href="login.html" style="color:#2864e6; font-weight:800;">Login</a> karein.
                    </div>`;
                return;
            }

            try {
                const snap = await getDocs(collection(db, "deposits"));
                allDeposits = [];

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const docUid = String(data.userId || data.uid || data.customerId || "").replace(/\D/g, "");

                    if (docUid === currentUserId || (data.mobile && data.mobile.includes(currentUserId))) {
                        allDeposits.push({ id: docSnap.id, ...data });
                    }
                });

                // Latest date first
                allDeposits.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
                    return timeB - timeA;
                });

                renderList(allDeposits);

            } catch (error) {
                console.error("History loading error:", error);
                listContainer.innerHTML = `
                    <div class="status-box" style="color: #c72e43;">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>
                        History load karne me dikkat aayi: ${error.message}
                    </div>`;
            }
        }

        // Render List with Filters
        function renderList(list) {
            const listContainer = document.getElementById("transactions-list");

            if (list.length === 0) {
                listContainer.innerHTML = `
                    <div class="status-box">
                        <i class="fa-solid fa-receipt fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                        Koi transaction record nahi mila.
                    </div>`;
                return;
            }

            let html = "";
            list.forEach((data) => {
                const status = String(data.status || "pending").toLowerCase();
                const amount = Number(data.amount || 0);
                const utr = data.utr || "—";
                
                let dateString = "Recently";
                if (data.createdAt && typeof data.createdAt.toDate === "function") {
                    dateString = data.createdAt.toDate().toLocaleString('en-IN', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    });
                }

                let badgeClass = "badge-pending";
                let noteClass = "pending";
                let icon = "fa-clock";
                let noteText = "Admin verification chal raha hai. Thodi der me update hoga.";

                if (status === "approved") {
                    badgeClass = "badge-approved";
                    noteClass = "approved";
                    icon = "fa-circle-check";
                    noteText = data.comment && data.comment.trim() !== "" 
                        ? data.comment 
                        : "Payment approved";
                } else if (status === "rejected") {
                    badgeClass = "badge-rejected";
                    noteClass = "rejected";
                    icon = "fa-triangle-exclamation";
                    noteText = "<strong>Admin Reason:</strong> " + (data.comment && data.comment.trim() !== "" ? data.comment : "Payment receive nahi hui ya UTR galat tha.");
                }

                html += `
                    <div class="card">
                        <div class="card-top">
                            <div class="card-left">
                                <span class="card-title">Deposit (UPI QR)</span>
                                <span class="card-subtitle">UTR: ${utr}</span>
                                <span class="card-date">${dateString}</span>
                            </div>
                            <div class="card-right">
                                <span class="amount ${status === 'approved' ? 'credit' : 'debit'}">₹${amount}</span>
                                <span class="badge ${badgeClass}">${status}</span>
                            </div>
                        </div>
                        <div class="admin-note ${noteClass}">
                            <i class="fa-solid ${icon}"></i>
                            <span>${noteText}</span>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // Search Filter Logic
        function applyFilters() {
            const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
            const selectedDate = document.getElementById("dateInput").value; // Format: YYYY-MM-DD

            const filtered = allDeposits.filter(item => {
                const utr = String(item.utr || "").toLowerCase();
                const amount = String(item.amount || "").toLowerCase();
                const status = String(item.status || "").toLowerCase();

                const matchesSearch = !searchText || utr.includes(searchText) || amount.includes(searchText) || status.includes(searchText);

                let matchesDate = true;
                if (selectedDate && item.createdAt && typeof item.createdAt.toDate === "function") {
                    const itemDate = item.createdAt.toDate().toISOString().split("T")[0]; // YYYY-MM-DD
                    matchesDate = (itemDate === selectedDate);
                }

                return matchesSearch && matchesDate;
            });

            renderList(filtered);
        }

        // Clear Filters
        window.clearFilters = function() {
            document.getElementById("searchInput").value = "";
            document.getElementById("dateInput").value = "";
            renderList(allDeposits);
        };

        // Event Listeners
        document.getElementById("searchInput").addEventListener("input", applyFilters);
        document.getElementById("dateInput").addEventListener("change", applyFilters);

        // Start Loading
        loadRealTransactions();
    </script>
</body>
</html>
