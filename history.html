<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - History & Logs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
        body{background:linear-gradient(180deg,#f8faff 0%,#eef4ff 50%,#f1f5f9 100%);color:#101a38;min-height:100vh;padding-bottom:85px;}
        .top-bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;border-bottom:1px solid #ccd8ed;}
        .header-left{display:flex;align-items:center;gap:10px;}
        .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ffffff;border:1px solid #cbd7e9;color:#2864e6;cursor:pointer;}
        .brand-badge{background:#ffffff;border:1px solid #dce6fb;color:#2362d9;font-weight:900;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;}
        .header-icons{display:flex;gap:8px;}
        .topicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;color:#ffffff;cursor:pointer;}
        .icon-bell{background:#7368ef;} .icon-cash{background:#35bf71;} .icon-gift{background:#ff933c;}
        .page-heading{padding:16px 18px 8px;}
        .page-heading h1{font-size:22px;font-weight:800;}
        .filter-section{padding:10px 18px 14px;display:flex;flex-direction:column;gap:10px;}
        .search-input{width:100%;height:44px;padding:0 14px;border-radius:14px;border:1.5px solid #cbd7e9;outline:none;}
        .content-section{padding:0 18px;}
        .card{background:#ffffff;border-radius:18px;padding:16px;margin-bottom:12px;border:1.5px solid #bdd0f0;display:flex;flex-direction:column;gap:10px;}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
        .amount{font-size:18px;font-weight:900;}
        .credit{color:#13834d;} .debit{color:#c72e43;}
        .badge{font-size:10px;padding:4px 9px;border-radius:8px;font-weight:800;text-transform:uppercase;}
        .badge-approved{background:#dcf8e9;color:#13834d;}
        .badge-rejected{background:#ffe3e7;color:#c72e43;}
        .badge-pending{background:#fff4d6;color:#a37200;}
        .bottom{height:64px;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffff;border-top:1px solid #d5deed;position:fixed;bottom:0;left:0;right:0;z-index:100;}
        .nav{border:0;background:#ffffff;color:#6d7890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;text-decoration:none;cursor:pointer;}
        .nav.active{color:#18213a;font-weight:900;}
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
            <!-- Logo Click to Home -->
            <span class="brand-badge" onclick="location.href='dashboard.html'">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell" onclick="location.href='notification.html'">🔔</div>
            <div class="topicon icon-cash" onclick="location.href='wallet.html'">💵</div>
            <div class="topicon icon-gift" onclick="location.href='referral.html'">🎁</div>
        </div>
    </header>

    <div class="page-heading">
        <h1>Transactions & Logs</h1>
        <p>Deposit & Withdrawal status</p>
    </div>

    <div class="filter-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by UTR, UPI, Bank, Status...">
    </div>

    <section class="content-section">
        <div id="transactions-list" style="text-align:center;padding:40px;color:#7a879f;">Transactions load ho rahe hain...</div>
    </section>

    <nav class="bottom">
        <a class="nav" href="dashboard.html"><b>🏠</b>Home</a>
        <a class="nav" href="wallet.html"><b>💰</b>Wallet</a>
        <a class="nav" href="support.html"><b>🎧</b>Support</a>
        <a class="nav active" href="profile.html"><b>👤</b>Profile</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentUserId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");

        async function loadData() {
            if(!currentUserId) return;
            let items = [];
            const depSnap = await getDocs(collection(db, "deposits"));
            depSnap.forEach(d => {
                const data = d.data();
                if(String(data.uid || data.userId).includes(currentUserId)) items.push({type: 'deposit', ...data});
            });

            const withSnap = await getDocs(collection(db, "withdrawals"));
            withSnap.forEach(d => {
                const data = d.data();
                if(String(data.uid).includes(currentUserId)) items.push({type: 'withdrawal', ...data});
            });

            items.sort((a,b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));

            const list = document.getElementById("transactions-list");
            if(!items.length) { list.innerHTML = "Koi record nahi mila."; return; }

            list.innerHTML = items.map(d => `
                <div class="card">
                    <div class="card-top">
                        <div>
                            <b>${d.type === 'deposit' ? 'Deposit (UPI QR)' : 'Withdrawal (' + (d.mode || 'UPI') + ')'}</b><br>
                            <small>${d.utr ? 'UTR: '+d.utr : (d.upiId || d.accountNumber || '')}</small>
                        </div>
                        <div>
                            <span class="amount ${d.type === 'deposit' ? 'credit' : 'debit'}">₹${d.amount}</span><br>
                            <span class="badge badge-${d.status}">${d.status}</span>
                        </div>
                    </div>
                </div>
            `).join("");
        }
        loadData();
    </script>
</body>
</html>
