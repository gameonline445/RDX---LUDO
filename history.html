<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - History</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button, input{font:inherit;}

/* DEBUG BOX */
#debugBanner {
    background: #ef4444;
    color: white;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: bold;
    word-break: break-all;
    z-index: 1000;
}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f87171;
    color:white;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(248,113,113,0.3);
}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid #bae6fd;
    background:#ffffff;
}
.logo img{width:100%;height:100%;object-fit:cover;}

.header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.header-icon{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:white;
    cursor:pointer;
}
.bell{background:#6366f1;}
.cash{background:#22c55e;}
.gift{background:#f97316;}

/* CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

.page-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:900;
    color:#0369a1;
    margin-bottom:16px;
}
.page-title i{
    font-size:20px;
    color:#0284c7;
    background:#e0f2fe;
    padding:10px;
    border-radius:14px;
    border:1px solid #bae6fd;
}

/* SEARCH */
.search-box{position:relative;margin-bottom:16px;}
.search-box i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#64748b;}
.search-box input{
    width:100%;
    padding:14px 16px 14px 45px;
    border-radius:16px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    font-size:13px;
    font-weight:600;
    outline:none;
}

/* TABS */
.tabs-wrapper{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;}
.tab-btn{
    white-space:nowrap;
    padding:10px 18px;
    border-radius:20px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    color:#0284c7;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}
.tab-btn.active{background:#0284c7;color:#ffffff;border-color:#0284c7;}

/* LIST */
.history-list{display:flex;flex-direction:column;gap:12px;}
.history-item{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.item-left{display:flex;align-items:center;gap:12px;}
.item-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:white;
    flex-shrink:0;
}
.type-deposit{background:#22c55e;}
.type-withdraw{background:#ef4444;}
.type-battle{background:#6366f1;}

.item-details h4{font-size:14px;font-weight:850;color:#0f172a;}
.item-details p{font-size:11px;font-weight:600;color:#64748b;}
.item-details small{font-size:10px;font-weight:700;color:#94a3b8;display:block;}

.item-right{text-align:right;}
.amount{font-size:15px;font-weight:900;}
.amount.plus{color:#16a34a;}
.amount.minus{color:#dc2626;}
.status-badge{
    display:inline-block;
    padding:3px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}
.badge-success{background:#dcfce7;color:#15803d;}
.badge-pending{background:#fef3c7;color:#b45309;}
.badge-failed{background:#fee2e2;color:#b91c1c;}

.empty-state{text-align:center;padding:40px 20px;color:#64748b;font-weight:700;}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#1e293b;
    font-size:12px;
    font-weight:700;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#38bdf8;}
.icon-profile{background:#f97316;}
</style>
</head>

<body>

<div id="debugBanner">Initializing Debugger...</div>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="logo"><img src="logo.png" alt="RDX"></div>
    </div>
    <div class="header-right">
        <button class="header-icon bell"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon cash"><i class="fa-solid fa-wallet"></i></button>
        <button class="header-icon gift"><i class="fa-solid fa-gift"></i></button>
    </div>
</header>

<main class="container">
    <div class="page-title">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History & Activity Logs</span>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search by Date, UTR, Amount..." oninput="filterLogs()">
    </div>

    <div class="tabs-wrapper">
        <button class="tab-btn active" onclick="switchTab('all', this)">All Activity</button>
        <button class="tab-btn" onclick="switchTab('battle', this)">Battles History</button>
        <button class="tab-btn" onclick="switchTab('deposit', this)">Deposits</button>
        <button class="tab-btn" onclick="switchTab('withdraw', this)">Withdrawals</button>
    </div>

    <div class="history-list" id="historyList">
        <div class="empty-state">Loading history logs...</div>
    </div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function debug(msg) {
    document.getElementById("debugBanner").innerText = msg;
    console.log(msg);
}

// Extract mobile number from all possible localstorage keys
function getUserIdentifiers() {
    let keys = ['rdxFirebaseUserId', 'rdxVerifiedMobile', 'userMobile', 'userId', 'mobile'];
    let found = [];
    keys.forEach(k => {
        let val = localStorage.getItem(k);
        if(val) found.push(String(val).replace(/\D/g, ""));
    });
    return [...new Set(found)].filter(x => x.length >= 10);
}

let allLogsData = [];
let currentCategory = 'all';

async function fetchLogsDeep() {
    const ids = getUserIdentifiers();
    debug("Searching User IDs: " + (ids.join(', ') || 'None found in LocalStorage'));

    if(ids.length === 0) {
        document.getElementById("historyList").innerHTML = `<div class="empty-state">Mobile number not found in localStorage. Please login again.</div>`;
        return;
    }

    let combined = [];

    for (let rawId of ids) {
        let tenDigit = rawId.slice(-10);
        let countryDigit = "91" + tenDigit;

        try {
            // Check Document Collections: customers -> history
            let snap1 = await firebaseDB.collection("customers").doc(countryDigit).collection("history").get();
            snap1.forEach(d => combined.push({ id: d.id, ...d.data() }));

            let snap2 = await firebaseDB.collection("customers").doc(tenDigit).collection("history").get();
            snap2.forEach(d => combined.push({ id: d.id, ...d.data() }));

            // Check Direct Collections: transactions
            let snap3 = await firebaseDB.collection("transactions").get();
            snap3.forEach(d => {
                let data = d.data();
                let strData = JSON.stringify(data);
                if(strData.includes(tenDigit) || strData.includes(countryDigit)) {
                    combined.push({ id: d.id, ...data });
                }
            });

            // Check Battles
            let snap4 = await firebaseDB.collection("battles").get();
            snap4.forEach(d => {
                let data = d.data();
                let strData = JSON.stringify(data);
                if(strData.includes(tenDigit) || strData.includes(countryDigit)) {
                    combined.push({
                        id: d.id,
                        type: 'battle',
                        title: 'Ludo Battle',
                        amount: data.amount || data.entryFee || 0,
                        status: data.status || 'Completed',
                        createdAt: data.createdAt || data.timestamp
                    });
                }
            });

        } catch (err) {
            debug("Error: " + err.message);
        }
    }

    // Deduplicate
    const uniqueMap = new Map();
    combined.forEach(item => uniqueMap.set(item.id, item));
    allLogsData = Array.from(uniqueMap.values());

    debug(`Fetch Complete! Found ${allLogsData.length} records for IDs: ${ids.join(', ')}`);
    renderLogs();
}

function renderLogs() {
    const container = document.getElementById("historyList");
    const query = document.getElementById("searchInput").value.toLowerCase().trim();

    let filtered = allLogsData.filter(item => {
        let type = (item.type || '').toLowerCase();
        let matchesCategory = true;
        
        if(currentCategory === 'battle') matchesCategory = type.includes('battle') || type.includes('game');
        else if(currentCategory === 'deposit') matchesCategory = type.includes('deposit') || type.includes('add');
        else if(currentCategory === 'withdraw') matchesCategory = type.includes('withdraw');

        let fullStr = JSON.stringify(item).toLowerCase();
        let matchesSearch = fullStr.includes(query);

        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No records found.</div>`;
        return;
    }

    let html = '';
    filtered.forEach(item => {
        let type = (item.type || 'transaction').toLowerCase();
        let isPlus = item.isCredit || type.includes('deposit') || type.includes('win');
        let dateStr = item.date || 'Recent';

        html += `
        <div class="history-item">
            <div class="item-left">
                <div class="item-icon ${type.includes('deposit') ? 'type-deposit' : type.includes('withdraw') ? 'type-withdraw' : 'type-battle'}">
                    <i class="fa-solid ${type.includes('deposit') ? 'fa-wallet' : type.includes('withdraw') ? 'fa-building-columns' : 'fa-dice'}"></i>
                </div>
                <div class="item-details">
                    <h4>${item.title || item.type || 'Transaction'}</h4>
                    <p>${item.description || item.utr || 'Activity'}</p>
                    <small>${dateStr}</small>
                </div>
            </div>
            <div class="item-right">
                <div class="amount ${isPlus ? 'plus' : 'minus'}">${isPlus ? '+' : '-'}₹${parseFloat(item.amount || 0).toFixed(2)}</div>
                <span class="status-badge badge-success">${item.status || 'Success'}</span>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

function switchTab(cat, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat;
    renderLogs();
}

function filterLogs() {
    renderLogs();
}

window.addEventListener("load", () => {
    fetchLogsDeep();
});
</script>

</body>
</html>
