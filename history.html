<script type="module">


/* =====================================================
FIREBASE APP
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* =====================================================
FIREBASE AUTH
===================================================== */

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
FIRESTORE
===================================================== */

import {
getFirestore,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyAsGWpMcC2WtMpv3_498me8_ydjL8wN1Qc",

authDomain:
"rdx-ludo.firebaseapp.com",

projectId:
"rdx-ludo",

storageBucket:
"rdx-ludo.firebasestorage.app",

messagingSenderId:
"928340814840",

appId:
"1:928340814840:web:6eca42a8b76138b268440d"

};


/* =====================================================
INITIALIZE
===================================================== */

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
COLLECTION
===================================================== */

const DEPOSITS_COLLECTION =
"deposits";


/* =====================================================
DATA
===================================================== */

let allHistory = [];

let currentUser = null;

let customerUIDs = [];


/* =====================================================
ELEMENTS
===================================================== */

const historyContainer =
document.getElementById(
"historyContainer"
);

const dateSearch =
document.getElementById(
"dateSearch"
);

const searchBtn =
document.getElementById(
"searchBtn"
);

const clearBtn =
document.getElementById(
"clearBtn"
);

const message =
document.getElementById(
"message"
);

const debug =
document.getElementById(
"debug"
);


/* =====================================================
SAFE HTML
===================================================== */

function safe(value){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
MESSAGE
===================================================== */

function showMessage(
text,
type
){

message.textContent =
text;

message.className =
"message show " +
type;

}


/* =====================================================
HIDE MESSAGE
===================================================== */

function hideMessage(){

message.className =
"message";

message.textContent =
"";

}


/* =====================================================
DEBUG
===================================================== */

function showDebug(
title,
lines
){

debug.innerHTML = `

<strong>${safe(title)}</strong>

${lines
.map(
line =>
`<div>${safe(line)}</div>`
)
.join("")
}

`;

debug.className =
"debug show";

}


function hideDebug(){

debug.className =
"debug";

debug.innerHTML =
"";

}


/* =====================================================
NORMALIZE UID
===================================================== */

function normalizeUID(
value
){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)
.trim()
.replace(/\s/g,"")
.replace(/^\+/,"");

}


/* =====================================================
GET DEPOSIT UID
===================================================== */

function getDepositUID(
deposit
){

const values = [

deposit.uid,

deposit.userId,

deposit.customerId,

deposit.customerUID,

deposit.userUID,

deposit.customerUid,

deposit.userUid

];


for(
const value of values
){

const uid =
normalizeUID(value);

if(uid){

return uid;

}

}

return "";

}


/* =====================================================
GET UTR
===================================================== */

function getUTR(
deposit
){

const values = [

deposit.utr,

deposit.utrNumber,

deposit.utrNo,

deposit.transactionId,

deposit.transactionNumber

];


for(
const value of values
){

if(
value !== undefined &&
value !== null &&
String(value).trim() !== ""
){

return String(value).trim();

}

}

return "";

}


/* =====================================================
GET ACCOUNT
===================================================== */

function getAccount(
deposit
){

const values = [

deposit.accountHolderName,

deposit.account,

deposit.accountName,

deposit.accountHolder,

deposit.upiId,

deposit.upiID,

deposit.upi

];


for(
const value of values
){

if(
value !== undefined &&
value !== null &&
String(value).trim() !== ""
){

return String(value).trim();

}

}

return "";

}


/* =====================================================
GET STATUS
===================================================== */

function getStatus(
deposit
){

return String(

deposit.status ??
"pending"

)
.trim()
.toLowerCase();

}


/* =====================================================
DATE CONVERTER
===================================================== */

function getDateValue(
value
){

if(!value){

return null;

}


/* Firebase Timestamp */

if(
typeof value.toDate ===
"function"
){

const d =
value.toDate();

if(
d &&
!isNaN(d.getTime())
){

return d;

}

}


/* Date */

if(
value instanceof Date
){

if(
!isNaN(value.getTime())
){

return value;

}

}


/* Firestore timestamp object */

if(
typeof value === "object" &&
typeof value.seconds === "number"
){

const d =
new Date(
value.seconds * 1000
);

if(
!isNaN(d.getTime())
){

return d;

}

}


/* Number */

if(
typeof value === "number"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}


/* String */

if(
typeof value === "string"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}

return null;

}


/* =====================================================
FINAL HISTORY DATE
===================================================== */

function getHistoryDate(
deposit
){

const status =
getStatus(
deposit
);


/*
APPROVED
*/

if(
status === "approved"
){

return (

getDateValue(
deposit.approvedAt
)

||

getDateValue(
deposit.updatedAt
)

||

getDateValue(
deposit.createdAt
)

);

}


/*
REJECTED
*/

if(
status === "rejected" ||
status === "reject"
){

return (

getDateValue(
deposit.rejectedAt
)

||

getDateValue(
deposit.updatedAt
)

||

getDateValue(
deposit.createdAt
)

);

}


/*
PENDING
*/

return (

getDateValue(
deposit.createdAt
)

||

getDateValue(
deposit.updatedAt
)

);

}


/* =====================================================
DATE FORMAT
===================================================== */

function formatDate(
date
){

if(!date){

return "—";

}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* =====================================================
DATE TIME
===================================================== */

function formatDateTime(
date
){

if(!date){

return "—";

}

return (

date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
)

+

" "

+

date.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
)

);

}


/* =====================================================
DATE KEY
===================================================== */

function dateKey(
date
){

if(!date){

return "";

}

const year =
date.getFullYear();

const month =
String(
date.getMonth()+1
)
.padStart(2,"0");

const day =
String(
date.getDate()
)
.padStart(2,"0");

return (

year +
"-" +
month +
"-" +
day

);

}


/* =====================================================
REASON
===================================================== */

function getReason(
deposit
){

const values = [

deposit.rejectReason,

deposit.rejectionReason,

deposit.rejectedReason,

deposit.reason,

deposit.reject_reason,

deposit.comment

];


for(
const value of values
){

if(
value !== undefined &&
value !== null &&
String(value).trim() !== ""
){

return String(value).trim();

}

}

return "";

}


/* =====================================================
AMOUNT
===================================================== */

function getAmount(
deposit
){

const value =

deposit.amount ??
deposit.depositAmount ??
deposit.approvedAmount ??
0;

const number =
Number(value);

if(
isNaN(number)
){

return 0;

}

return number;

}


/* =====================================================
STATUS HTML
===================================================== */

function getStatusHTML(
status
){

if(
status === "approved"
){

return `

<span class="status approved">

🟢 APPROVED

</span>

`;

}


if(
status === "rejected" ||
status === "reject"
){

return `

<span class="status rejected">

🔴 REJECT

</span>

`;

}


return `

<span class="status pending">

🟡 PENDING

</span>

`;

}


/* =====================================================
RENDER HISTORY
===================================================== */

function renderHistory(
list
){

if(
!list ||
!list.length
){

historyContainer.innerHTML = `

<div class="empty">

कोई Deposit History नहीं मिली।

</div>

`;

return;

}


/* SORT */

const sorted = [
...list
]
.sort(
(a,b) => {

const da =
getHistoryDate(a);

const db =
getHistoryDate(b);

return (

(db?.getTime() || 0)

-

(da?.getTime() || 0)

);

}
);


/* GROUP */

const groups = {};


sorted.forEach(
deposit => {

const date =
getHistoryDate(
deposit
);

const key =
dateKey(date) ||
"unknown";


if(
!groups[key]
){

groups[key] = [];

}


groups[key].push(
deposit
);

});


/* DATE ORDER */

const dates =
Object.keys(groups)
.sort(
(a,b) => {

if(a === "unknown"){
return 1;
}

if(b === "unknown"){
return -1;
}

return b.localeCompare(a);

});


let html = "";


/* =====================================================
DATE GROUPS
===================================================== */

dates.forEach(
key => {

const group =
groups[key];

const date =
group.length
?
getHistoryDate(
group[0]
)
:
null;


html += `

<div class="date-section">

<div class="date-heading">

📅 ${safe(
formatDate(date)
)}

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>UTR No.</th>

<th>Amount</th>

<th>Status</th>

<th>Account</th>

<th>Date & Time</th>

<th>Reason</th>

</tr>

</thead>

<tbody>

`;


/* =====================================================
ROWS
===================================================== */

group.forEach(
deposit => {

const status =
getStatus(
deposit
);

const amount =
getAmount(
deposit
);

const utr =
getUTR(
deposit
);

const account =
getAccount(
deposit
);

const finalDate =
getHistoryDate(
deposit
);

const reason =
getReason(
deposit
);


let reasonHTML =
"—";


if(
(
status === "rejected" ||
status === "reject"
)
&&
reason
){

reasonHTML =
safe(reason);

}


html += `

<tr>

<td class="utr">

${safe(
utr || "—"
)}

</td>

<td class="amount">

₹${amount.toLocaleString(
"en-IN"
)}

</td>

<td>

${getStatusHTML(
status
)}

</td>

<td class="account">

${safe(
account || "—"
)}

</td>

<td>

${safe(
formatDateTime(
finalDate
)
)}

</td>

<td class="reason">

${reasonHTML}

</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

</div>

`;

});


historyContainer.innerHTML =
html;

}


/* =====================================================
GET POSSIBLE CUSTOMER UID
===================================================== */

function buildPossibleCustomerUIDs(
user
){

const result = [];


/*
1. Firebase Auth UID
*/

if(
user.uid
){

result.push(
normalizeUID(
user.uid
)
);

}


/*
2. Phone Number

Example:

+917878852370

becomes:

917878852370
*/

if(
user.phoneNumber
){

const phone =
normalizeUID(
user.phoneNumber
);

if(phone){

result.push(
phone
);

}

}


/*
3. Phone number without
country code if needed
*/

if(
user.phoneNumber
){

const phone =
normalizeUID(
user.phoneNumber
);

if(
phone.length > 10
){

result.push(
phone.slice(-10)
);

}

}


/*
Remove duplicates
*/

return [
...new Set(
result.filter(Boolean)
)
];

}


/* =====================================================
LOAD HISTORY
===================================================== */

async function loadHistory(){

if(!currentUser){

historyContainer.innerHTML = `

<div class="empty">

कृपया पहले लॉगिन करें।

</div>

`;

return;

}


historyContainer.innerHTML = `

<div class="loading">

⏳ History Loading...

</div>

`;

hideMessage();
hideDebug();


try{

const depositsRef =
collection(
db,
DEPOSITS_COLLECTION
);


const found = {};


/* =====================================================
UID OPTIONS
===================================================== */

customerUIDs =
buildPossibleCustomerUIDs(
currentUser
);


/*
सबसे पहले Auth UID और
Mobile UID दोनों से खोजेंगे।
*/

for(
const uid of customerUIDs
){

/* uid field */

try{

const q =
query(
depositsRef,
where(
"uid",
"==",
uid
)
);

const snap =
await getDocs(q);

snap.forEach(
docSnap => {

found[
docSnap.id
] = {

id:
docSnap.id,

...docSnap.data()

};

});

}
catch(error){

console.warn(
"uid query error:",
error
);

}


/* userId field */

try{

const q =
query(
depositsRef,
where(
"userId",
"==",
uid
)
);

const snap =
await getDocs(q);

snap.forEach(
docSnap => {

found[
docSnap.id
] = {

id:
docSnap.id,

...docSnap.data()

};

});

}
catch(error){

console.warn(
"userId query error:",
error
);

}


/* customerId */

try{

const q =
query(
depositsRef,
where(
"customerId",
"==",
uid
)
);

const snap =
await getDocs(q);

snap.forEach(
docSnap => {

found[
docSnap.id
] = {

id:
docSnap.id,

...docSnap.data()

};

});

}
catch(error){

console.warn(
"customerId query error:",
error
);

}

}


/* =====================================================
FINAL HISTORY
===================================================== */

allHistory =
Object.values(
found
);


/* =====================================================
SHOW RESULT
===================================================== */

if(
allHistory.length
){

hideDebug();

renderHistory(
allHistory
);

}
else{

/*
अगर रिकॉर्ड नहीं मिला,
तो स्क्रीन पर उपयोगी जानकारी दिखाएँ।
*/

showDebug(
"History नहीं मिली",
[
"Firebase Auth UID: " +
(currentUser.uid || "—"),

"Login Mobile: " +
(currentUser.phoneNumber || "—"),

"खोजे गए UID: " +
(
customerUIDs.length
?
customerUIDs.join(" , ")
:
"कोई UID नहीं मिला"
),

"Deposit में uid/userId इसी ग्राहक UID से match होना चाहिए।"
]
);

renderHistory([]);

}

}
catch(error){

console.error(
"History Error:",
error
);


historyContainer.innerHTML = `

<div class="empty">

History लोड नहीं हो सकी।

<br><br>

${safe(
error.message
)}

</div>

`;

}

}


/* =====================================================
SEARCH BY DATE
===================================================== */

function searchByDate(){

const selectedDate =
dateSearch.value;


if(!selectedDate){

hideMessage();

renderHistory(
allHistory
);

return;

}


const filtered =
allHistory.filter(
deposit => {

const date =
getHistoryDate(
deposit
);

return (
dateKey(date)
===
selectedDate
);

});


const displayDate =
selectedDate
.split("-")
.reverse()
.join("-");


if(
filtered.length
){

showMessage(
displayDate +
" की History मिली।",
"ok"
);

}
else{

showMessage(
displayDate +
" की कोई History नहीं मिली।",
"error"
);

}


renderHistory(
filtered
);

}


/* =====================================================
SEARCH BUTTON
===================================================== */

searchBtn.addEventListener(
"click",
searchByDate
);


/* =====================================================
DATE CHANGE
===================================================== */

dateSearch.addEventListener(
"change",
searchByDate
);


/* =====================================================
RECENT BUTTON
===================================================== */

clearBtn.addEventListener(
"click",
() => {

dateSearch.value = "";

hideMessage();

hideDebug();

renderHistory(
allHistory
);

}
);


/* =====================================================
BACK BUTTON
===================================================== */

document
.getElementById(
"backBtn"
)
.addEventListener(
"click",
() => {

window.history.back();

}
);


/* =====================================================
AUTH STATE
===================================================== */

onAuthStateChanged(
auth,
async user => {

if(user){

currentUser =
user;

console.log(
"Firebase Auth UID:",
user.uid
);

console.log(
"Firebase Phone:",
user.phoneNumber
);

await loadHistory();

}
else{

currentUser =
null;

allHistory = [];

historyContainer.innerHTML = `

<div class="empty">

कृपया अपने खाते में लॉगिन करके
History देखें।

</div>

`;

}

});


</script>
