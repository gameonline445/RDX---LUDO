<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>RDX LUDO HISTORY</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7ff;
color:#17213c;
}

button,
input{
font:inherit;
}

button{
cursor:pointer;
border:0;
}

/* =========================
   HEADER
========================= */

header{
background:#fff;
border-bottom:1px solid #dce2ed;
padding:22px 5%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:30px;
font-weight:900;
}

.logo span{
color:#2869ed;
}

.back{
background:#eaf1ff;
color:#2869ed;
padding:13px 22px;
border-radius:12px;
font-weight:bold;
font-size:16px;
}

/* =========================
   MAIN
========================= */

main{
max-width:1200px;
margin:auto;
padding:35px 20px 60px;
}

.heading{
font-size:38px;
font-weight:900;
margin-bottom:8px;
}

.heading span{
color:#2869ed;
}

.subheading{
font-size:20px;
color:#75819b;
margin-bottom:30px;
}

/* =========================
   SEARCH
========================= */

.search-card{
background:#fff;
border:1px solid #dce3f2;
border-radius:20px;
padding:22px;
box-shadow:0 8px 25px #00000008;
margin-bottom:30px;
}

.search-title{
font-size:18px;
font-weight:800;
margin-bottom:12px;
}

.search-row{
display:flex;
gap:12px;
}

.date-input{
flex:1;
padding:15px 16px;
border:1px solid #ccd6e8;
border-radius:12px;
outline:none;
background:#fff;
color:#17213c;
}

.date-input:focus{
border-color:#2869ed;
}

.search-btn{
padding:15px 24px;
border-radius:12px;
background:#2869ed;
color:#fff;
font-weight:bold;
}

.clear-btn{
padding:15px 20px;
border-radius:12px;
background:#edf1f7;
color:#536079;
font-weight:bold;
}

/* =========================
   STATUS MESSAGE
========================= */

.message{
padding:15px 18px;
border-radius:12px;
margin-bottom:20px;
font-weight:bold;
display:none;
}

.message.show{
display:block;
}

.message.ok{
background:#dcf8e9;
color:#12804b;
}

.message.error{
background:#ffe3e8;
color:#c72e43;
}

/* =========================
   RECENT HISTORY
========================= */

.history-title{
font-size:28px;
font-weight:900;
margin-bottom:20px;
}

.date-section{
margin-bottom:28px;
}

.date-heading{
font-size:20px;
font-weight:900;
background:#176f55;
color:#fff;
padding:14px 18px;
border-radius:12px 12px 0 0;
}

/* =========================
   TABLE
========================= */

.table-wrapper{
background:#fff;
overflow-x:auto;
border-radius:0 0 14px 14px;
border:1px solid #e2e6ee;
}

table{
width:100%;
border-collapse:collapse;
min-width:900px;
}

thead{
background:#176f55;
color:white;
}

th{
padding:15px 14px;
text-align:left;
font-size:14px;
white-space:nowrap;
}

td{
padding:16px 14px;
border-bottom:1px solid #edf0f4;
font-size:15px;
white-space:nowrap;
}

tbody tr:last-child td{
border-bottom:0;
}

tbody tr:hover{
background:#fafcff;
}

/* =========================
   STATUS
========================= */

.status{
display:inline-block;
padding:7px 12px;
border-radius:8px;
font-size:12px;
font-weight:900;
border:2px solid;
}

.status.approved{
color:#27984b;
border-color:#35a857;
background:#f4fff7;
}

.status.rejected{
color:#d73545;
border-color:#dd4050;
background:#fff7f8;
}

.status.pending{
color:#b87800;
border-color:#e5b340;
background:#fffaf0;
}

/* =========================
   AMOUNT
========================= */

.amount{
font-weight:900;
font-size:17px;
}

.utr{
font-weight:bold;
color:#35415b;
}

.account{
font-weight:600;
}

.reason{
color:#c83242;
font-weight:600;
white-space:normal;
max-width:220px;
}

/* =========================
   EMPTY
========================= */

.empty{
background:#fff;
border:1px solid #dce3f2;
border-radius:18px;
padding:40px 20px;
text-align:center;
color:#7b879f;
font-size:17px;
}

/* =========================
   LOADING
========================= */

.loading{
text-align:center;
padding:35px;
color:#66728b;
font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

header{
padding:18px 15px;
}

.logo{
font-size:22px;
}

.back{
padding:10px 14px;
font-size:14px;
}

main{
padding:25px 12px 50px;
}

.heading{
font-size:30px;
}

.subheading{
font-size:17px;
}

.search-row{
display:grid;
grid-template-columns:1fr;
}

.search-btn,
.clear-btn{
width:100%;
}

.search-card{
padding:16px;
}

.history-title{
font-size:24px;
}

.date-heading{
font-size:17px;
}

table{
min-width:850px;
}

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:400px){

.heading{
font-size:27px;
}

.logo{
font-size:20px;
}

.back{
font-size:13px;
}

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="logo">
RDX <span>LUDO</span> HISTORY
</div>

<button
class="back"
id="backBtn"
>
← वापस
</button>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

<div class="heading">
Deposit <span>History</span>
</div>

<div class="subheading">
आपकी Deposit की पूरी History
</div>


<!-- =========================
     SEARCH
========================= -->

<div class="search-card">

<div class="search-title">
📅 तारीख से History खोजें
</div>

<div class="search-row">

<input
type="date"
id="dateSearch"
class="date-input"
>

<button
id="searchBtn"
class="search-btn"
>
🔍 Search
</button>

<button
id="clearBtn"
class="clear-btn"
>
↻ Recent
</button>

</div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
id="message"
class="message"
></div>


<!-- =========================
     HISTORY
========================= -->

<div class="history-title">
Recent History
</div>

<div id="historyContainer">

<div class="loading">
History Loading...
</div>

</div>

</main>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

authDomain:
"rdx-ludo.firebaseapp.com",

projectId:
"rdx-ludo",

storageBucket:
"rdx-ludo.firebasestorage.app",

messagingSenderId:
"928340814840",

appId:
"1:928340814840:web:6eca42a8b76138b268440d"

};


/* =====================================================
   INIT
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   COLLECTION
===================================================== */

const DEPOSITS_COLLECTION =
"deposits";


/* =====================================================
   DATA
===================================================== */

let allHistory = [];

let currentUser = null;


/* =====================================================
   ELEMENTS
===================================================== */

const historyContainer =
document.getElementById(
"historyContainer"
);

const dateSearch =
document.getElementById(
"dateSearch"
);

const searchBtn =
document.getElementById(
"searchBtn"
);

const clearBtn =
document.getElementById(
"clearBtn"
);

const message =
document.getElementById(
"message"
);


/* =====================================================
   SAFE HTML
===================================================== */

function safe(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

message.textContent =
text;

message.className =
"message show " +
type;

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

message.className =
"message";

message.textContent =
"";

}


/* =====================================================
   GET UID
===================================================== */

function getDepositUID(
deposit
){

return String(

deposit.userId ??
deposit.uid ??
deposit.customerId ??
deposit.userUID ??
""

).trim();

}


/* =====================================================
   GET UTR
===================================================== */

function getUTR(
deposit
){

return String(

deposit.utr ??
deposit.utrNumber ??
deposit.utrNo ??
deposit.transactionId ??
deposit.transactionNumber ??
""

).trim();

}


/* =====================================================
   GET ACCOUNT
===================================================== */

function getAccount(
deposit
){

return String(

deposit.account ??
deposit.accountName ??
deposit.accountHolder ??
deposit.accountHolderName ??
deposit.upiName ??
deposit.upiId ??
""

).trim();

}


/* =====================================================
   GET STATUS
===================================================== */

function getStatus(
deposit
){

return String(

deposit.status ??
"pending"

)
.trim()
.toLowerCase();

}


/* =====================================================
   DATE TO JAVASCRIPT DATE
===================================================== */

function getDateValue(
value
){

if(!value){

return null;

}


/* FIREBASE TIMESTAMP */

if(
typeof value.toDate ===
"function"
){

return value.toDate();

}


/* JAVASCRIPT DATE */

if(
value instanceof Date
){

return value;

}


/* NUMBER */

if(
typeof value ===
"number"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}


/* STRING */

if(
typeof value ===
"string"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}

return null;

}


/* =====================================================
   GET FINAL DATE
===================================================== */

function getHistoryDate(
deposit
){

const status =
getStatus(deposit);


/*
   Approved होने पर approvedAt
   Reject होने पर rejectedAt
   Pending होने पर createdAt
*/

if(
status === "approved"
){

return (
getDateValue(
deposit.approvedAt
)
||
getDateValue(
deposit.updatedAt
)
||
getDateValue(
deposit.createdAt
)
);

}


if(
status === "rejected"
){

return (
getDateValue(
deposit.rejectedAt
)
||
getDateValue(
deposit.updatedAt
)
||
getDateValue(
deposit.createdAt
)
);

}


return (
getDateValue(
deposit.createdAt
)
||
getDateValue(
deposit.updatedAt
)
);

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
date
){

if(!date){

return "—";

}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* =====================================================
   FORMAT DATE TIME
===================================================== */

function formatDateTime(
date
){

if(!date){

return "—";

}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
)
+
" "
+
date.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
);

}


/* =====================================================
   DATE KEY
===================================================== */

function dateKey(
date
){

if(!date){

return "";

}

const year =
date.getFullYear();

const month =
String(
date.getMonth()+1
)
.padStart(2,"0");

const day =
String(
date.getDate()
)
.padStart(2,"0");

return (
year +
"-" +
month +
"-" +
day
);

}


/* =====================================================
   GET REASON
===================================================== */

function getReason(
deposit
){

const reason =

deposit.rejectReason ??
deposit.rejectionReason ??
deposit.reason ??
deposit.comment ??
"";


return String(
reason
).trim();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(
list
){

if(!list.length){

historyContainer.innerHTML = `

<div class="empty">

कोई Deposit History नहीं मिली।

</div>

`;

return;

}


/* =====================================================
   SORT NEWEST FIRST
===================================================== */

list.sort(
(a,b) => {

const da =
getHistoryDate(a);

const db =
getHistoryDate(b);

return (
(db?.getTime() || 0)
-
(da?.getTime() || 0)
);

}
);


/* =====================================================
   GROUP BY DATE
===================================================== */

const groups = {};


list.forEach(
deposit => {

const date =
getHistoryDate(
deposit
);

const key =
dateKey(date);

if(!groups[key]){

groups[key] = [];

}

groups[key].push(
deposit
);

}
);


/* =====================================================
   SORT DATE GROUPS
===================================================== */

const dates =
Object.keys(groups)
.sort()
.reverse();


/* =====================================================
   BUILD HTML
===================================================== */

let html = "";


dates.forEach(
key => {

const date =
groups[key][0]
?
getHistoryDate(
groups[key][0]
)
:
null;


html += `

<div class="date-section">

<div class="date-heading">

📅 ${safe(
formatDate(date)
)}

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>UTR No.</th>

<th>Amount</th>

<th>Status</th>

<th>Account</th>

<th>Date & Time</th>

<th>Reason</th>

</tr>

</thead>

<tbody>

`;


/* =====================================================
   ROWS
===================================================== */

groups[key].forEach(
deposit => {

const status =
getStatus(
deposit
);

const amount =
Number(
deposit.amount ??
deposit.depositAmount ??
0
);


const utr =
getUTR(
deposit
);


const account =
getAccount(
deposit
);


const finalDate =
getHistoryDate(
deposit
);


const reason =
getReason(
deposit
);


let statusHTML = "";


if(
status === "approved"
){

statusHTML = `

<span class="status approved">

🟢 APPROVED

</span>

`;

}
else if(
status === "rejected"
){

statusHTML = `

<span class="status rejected">

🔴 REJECT

</span>

`;

}
else{

statusHTML = `

<span class="status pending">

🟡 PENDING

</span>

`;

}


/* =====================================================
   REASON
===================================================== */

let reasonHTML =
"—";


if(
status === "rejected" &&
reason
){

reasonHTML =
safe(reason);

}


html += `

<tr>

<td class="utr">

${safe(
utr || "—"
)}

</td>

<td class="amount">

₹${amount.toLocaleString(
"en-IN"
)}

</td>

<td>

${statusHTML}

</td>

<td class="account">

${safe(
account || "—"
)}

</td>

<td>

${safe(
formatDateTime(
finalDate
)
)}

</td>

<td class="reason">

${reasonHTML}

</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

</div>

`;

});


historyContainer.innerHTML =
html;

}


/* =====================================================
   LOAD USER HISTORY
===================================================== */

async function loadHistory(){

if(!currentUser){

historyContainer.innerHTML = `

<div class="empty">

कृपया पहले लॉगिन करें।

</div>

`;

return;

}


historyContainer.innerHTML = `

<div class="loading">

History Loading...

</div>

`;


try{


/*
   यूज़र के UID के हिसाब से
   केवल उसी की deposits पढ़ी जाएंगी।
*/

const depositsRef =
collection(
db,
DEPOSITS_COLLECTION
);


const q =
query(
depositsRef,
where(
"userId",
"==",
currentUser.uid
)
);


const snap =
await getDocs(q);


allHistory = [];


snap.forEach(
docSnap => {

allHistory.push({

id:
docSnap.id,

...docSnap.data()

});

});


/*
   कुछ पुराने deposits में
   uid field हो सकती है।
*/

if(
allHistory.length === 0
){

const allSnap =
await getDocs(
depositsRef
);


allHistory = [];


allSnap.forEach(
docSnap => {

const data =
docSnap.data();

const uid =
getDepositUID(
data
);

if(
uid === currentUser.uid
){

allHistory.push({

id:
docSnap.id,

...data

});

}

});

}


renderHistory(
allHistory
);


}
catch(error){

console.error(
"History Error:",
error
);


historyContainer.innerHTML = `

<div class="empty">

History लोड नहीं हो सकी।

<br><br>

${safe(
error.message
)}

</div>

`;

}

}


/* =====================================================
   SEARCH BY DATE
===================================================== */

function searchByDate(){

const selectedDate =
dateSearch.value;


if(!selectedDate){

renderHistory(
allHistory
);

hideMessage();

return;

}


const filtered =
allHistory.filter(
deposit => {

const date =
getHistoryDate(
deposit
);

return (
dateKey(date)
===
selectedDate
);

});


if(filtered.length){

showMessage(
selectedDate.split("-").reverse().join("-")
+
" की History मिली।",
"ok"
);

}
else{

showMessage(
selectedDate.split("-").reverse().join("-")
+
" की कोई History नहीं मिली।",
"error"
);

}


renderHistory(
filtered
);

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

searchBtn.addEventListener(
"click",
searchByDate
);


/* =====================================================
   DATE ENTER
===================================================== */

dateSearch.addEventListener(
"change",
searchByDate
);


/* =====================================================
   CLEAR / RECENT
===================================================== */

clearBtn.addEventListener(
"click",
() => {

dateSearch.value = "";

hideMessage();

renderHistory(
allHistory
);

}
);


/* =====================================================
   BACK BUTTON
===================================================== */

document
.getElementById("backBtn")
.addEventListener(
"click",
() => {

window.history.back();

}
);


/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
auth,
async user => {

if(user){

currentUser =
user;

await loadHistory();

}
else{

currentUser =
null;

historyContainer.innerHTML = `

<div class="empty">

कृपया अपने खाते में लॉगिन करके
History देखें।

</div>

`;

}

});

</script>

</body>
</html>
