<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

button, input{font:inherit;}

/* TOP HEADER */
.top-header{

    border-bottom:1.5px solid #bae6fd;

    justify-content:space-between;
    padding:0 14px;

    top:0;
    z-index:100;

}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f87171;
    color:white;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;

}
.menu-btn:active{transform:scale(0.95);}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{width:100%;height:100%;object-fit:cover;}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
}
.header-icon{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:white;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:transform 0.15s ease;
}
.header-icon:active{transform:scale(0.92);}
.bell{background:#6366f1;}
.cash{background:#22c55e;}
.gift{background:#f97316;}

/* MAIN CONTENT CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

.page-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:900;
    color:#0369a1;
    margin-bottom:16px;
}
.page-title i{
    font-size:20px;
    color:#0284c7;
    background:#e0f2fe;
    padding:10px;
    border-radius:14px;
    border:1px solid #bae6fd;
}

/* SEARCH BAR */
.search-box{
    position:relative;
    margin-bottom:16px;
}
.search-box i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);

    font-size:16px;
}
.search-box input{
    width:100%;
    padding:14px 16px 14px 45px;

    font-size:13px;
    font-weight:600;
    color:#0f172a;
    outline:none;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
}
.search-box input::placeholder{color:#94a3b8;}

/* TABS FILTER */
.tabs-wrapper{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:16px;
    scrollbar-width:none;
}
.tabs-wrapper::-webkit-scrollbar{display:none;}

.tab-btn{
    white-space:nowrap;
    padding:10px 18px;
    border-radius:20px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    color:#0284c7;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;

}
.tab-btn.active{

    color:#ffffff;
    border-color:#0284c7;
    box-shadow:0 4px 12px rgba(2,132,199,0.3);
}

/* HISTORY CARDS LIST */
.history-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.history-item{
    background:#ffffff;
    border:1.5px solid #bae6fd;

    display:flex;
    align-items:center;
    justify-style:space-between;

}
.item-left{
    display:flex;
    align-items:center;
    gap:12px;
}
.item-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:white;
    flex-shrink:0;
}
.type-deposit{background:linear-gradient(145deg, #22c55e, #16a34a);}
.type-withdraw{background:linear-gradient(145deg, #ef4444, #dc2626);}
.type-battle{background:linear-gradient(145deg, #6366f1, #4f46e5);}
.type-refer{background:linear-gradient(145deg, #f97316, #ea580c);}

.item-details h4{font-size:14px;font-weight:850;color:#0f172a;}
.item-details p{font-size:11px;font-weight:600;color:#64748b;margin-top:2px;}
.item-details small{font-size:10px;font-weight:700;color:#94a3b8;display:block;margin-top:3px;}

.item-right{text-align:right;}
.amount{font-size:15px;font-weight:900;}
.amount.plus{color:#16a34a;}
.amount.minus{color:#dc2626;}
.status-badge{
    display:inline-block;

    border-radius:8px;
    font-size:10px;
    font-weight:800;
    margin-top:4px;

}
.badge-success{background:#dcfce7;color:#15803d;}
.badge-pending{background:#fef3c7;color:#b45309;}
.badge-failed{background:#fee2e2;color:#b91c1c;}

/* EMPTY / NO DATA */
.empty-state{
    text-align:center;
    padding:40px 20px;
    color:#64748b;
    font-weight:700;
    font-size:14px;
}

/* SIDE DRAWER */
.drawer-overlay{

    inset:0;
    background:rgba(15,23,42,0.45);

    z-index:999;
    opacity:0;
    pointer-events:none;

}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-style:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}

    align-items:center;

}
.drawer-avatar img{width:100%;height:100%;object-fit:cover;}
.drawer-close{

    height:34px;
    border-radius:50%;

    border:1.5px solid #bae6fd;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:16px;
}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-logout{background:linear-gradient(145deg,#ef4444,#dc2626);margin-top:10px;}

/* BOTTOM NAVIGATION */
.bottom-nav{

</style>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
const docIdWithCountry = userId.length === 10 ? "91" + userId : userId;
const docIdWithoutCountry = userId.length === 12 && userId.startsWith("91") ? userId.substring(2) : userId;

let allLogsData = [];
let currentCategory = 'all';

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

/* MULTI-SOURCE HYBRID FETCH FOR GUARANTEED HISTORY LOGS */
async function loadHistoryData() {
    if (!userId) {
        document.getElementById("historyList").innerHTML = `<div class="empty-state">User not logged in.</div>`;
        return;
    }

    // Load User Drawer Header Info
    firebaseDB.collection("customers").doc(docIdWithCountry).get().then(doc => {
        if(doc.exists){
            const d = doc.data();
            document.getElementById("drawerName").textContent = String(d.name || ("User " + userId.slice(-4))).trim();
            document.getElementById("drawerMobile").textContent = "+" + docIdWithCountry;
        }
    });

    let combinedLogs = [];

    try {
        // 1. Fetch from Subcollection: customers/{id}/history
        const subSnap1 = await firebaseDB.collection("customers").doc(docIdWithCountry).collection("history").get();
        subSnap1.forEach(doc => combinedLogs.push({ id: doc.id, ...doc.data() }));

        const subSnap2 = await firebaseDB.collection("customers").doc(docIdWithoutCountry).collection("history").get();
        subSnap2.forEach(doc => {
            if(!combinedLogs.some(item => item.id === doc.id)) combinedLogs.push({ id: doc.id, ...doc.data() });
        });

        // 2. Fetch from Root Collection: transactions
        const transSnap = await firebaseDB.collection("transactions").get();
        transSnap.forEach(doc => {
            const data = doc.data();
            if ((data.userId === docIdWithCountry || data.userId === docIdWithoutCountry || data.mobile === docIdWithoutCountry) && !combinedLogs.some(item => item.id === doc.id)) {
                combinedLogs.push({ id: doc.id, ...data });
            }
        });

        // 3. Fetch from Root Collection: battles
        const battleSnap = await firebaseDB.collection("battles").get();
        battleSnap.forEach(doc => {
            const data = doc.data();
            if ((data.creatorId === docIdWithCountry || data.joinerId === docIdWithCountry || data.creatorId === docIdWithoutCountry || data.joinerId === docIdWithoutCountry) && !combinedLogs.some(item => item.id === doc.id)) {
                combinedLogs.push({
                    id: doc.id,
                    type: 'battle',
                    title: `Battle vs ${data.creatorId === docIdWithCountry || data.creatorId === docIdWithoutCountry ? (data.joinerName || 'Opponent') : (data.creatorName || 'Opponent')}`,
                    amount: data.amount || data.entryFee || 0,
                    status: data.status || 'Completed',
                    createdAt: data.createdAt || data.timestamp
                });
            }
        });

    } catch (err) {
        console.error("Firestore Load Error:", err);
    }

    allLogsData = combinedLogs;
    renderLogs();
}

function renderLogs() {
    const container = document.getElementById("historyList");
    const query = document.getElementById("searchInput").value.toLowerCase().trim();

    let filtered = allLogsData.filter(item => {
        const itemType = (item.type || '').toLowerCase();
        
        let matchesCategory = true;
        if(currentCategory === 'battle') matchesCategory = itemType.includes('battle') || itemType.includes('game') || itemType.includes('ludo');
        else if(currentCategory === 'deposit') matchesCategory = itemType.includes('deposit') || itemType.includes('add');
        else if(currentCategory === 'withdraw') matchesCategory = itemType.includes('withdraw') || itemType.includes('payout');

        const title = (item.title || item.type || '').toLowerCase();
        const desc = (item.description || item.utr || item.opponent || '').toLowerCase();
        const status = (item.status || '').toLowerCase();
        const amount = String(item.amount || '');

        const matchesSearch = title.includes(query) || desc.includes(query) || status.includes(query) || amount.includes(query);

        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No records found.</div>`;
        return;
    }

    // Sort by timestamp descending safely
    filtered.sort((a,b) => {
        const timeA = a.createdAt?.seconds || (a.timestamp ? new Date(a.timestamp).getTime()/1000 : 0);
        const timeB = b.createdAt?.seconds || (b.timestamp ? new Date(b.timestamp).getTime()/1000 : 0);
        return timeB - timeA;
    });

    let html = '';
    filtered.forEach(item => {
        const type = (item.type || 'transaction').toLowerCase();
        let iconClass = 'fa-arrow-right-left';
        let bgClass = 'type-battle';
        let isPlus = item.isCredit || type.includes('deposit') || type.includes('win');

        if(type.includes('deposit') || type.includes('add')){
            iconClass = 'fa-wallet';
            bgClass = 'type-deposit';
        } else if(type.includes('withdraw')){
            iconClass = 'fa-building-columns';
            bgClass = 'type-withdraw';
        } else if(type.includes('refer')){
            iconClass = 'fa-gift';
            bgClass = 'type-refer';
        } else {
            iconClass = 'fa-dice';
            bgClass = 'type-battle';
        }

        const dateStr = item.date || (item.createdAt?.seconds ? new Date(item.createdAt.seconds * 1000).toLocaleString() : 'Recently');
        const statusStr = item.status || 'Success';
        let badgeClass = 'badge-success';
        if(statusStr.toLowerCase().includes('pending')) badgeClass = 'badge-pending';
        if(statusStr.toLowerCase().includes('failed') || statusStr.toLowerCase().includes('reject')) badgeClass = 'badge-failed';

        html += `
        <div class="history-item">
            <div class="item-left">
                <div class="item-icon ${bgClass}">
                    <i class="fa-solid ${iconClass}"></i>
                </div>
                <div class="item-details">
                    <h4>${item.title || item.type || 'Transaction'}</h4>
                    <p>${item.description || item.utr || item.opponent || 'Account Activity'}</p>
                    <small>${dateStr}</small>
                </div>
            </div>
            <div class="item-right">
                <div class="amount ${isPlus ? 'plus' : 'minus'}">${isPlus ? '+' : '-'}₹${parseFloat(item.amount || 0).toFixed(2)}</div>
                <span class="status-badge ${badgeClass}">${statusStr}</span>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

function switchTab(cat, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat;
    renderLogs();
}

function filterLogs() {
    renderLogs();
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    if (userId) {
        firebaseDB.collection("customers").doc(docIdWithCountry).set({ isOnline: false }, { merge: true });
    }
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
}

window.addEventListener("load", () => {
    loadHistoryData();
});
</script>

</body>
</html>
