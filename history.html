<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - History & Activity Logs</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-style:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#f87171;
    color:white;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(248,113,113,0.3);
}
.menu-btn:active{transform:scale(0.95);}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    box-shadow:0 4px 12px rgba(2,132,199,0.15);
}
.logo img{width:100%;height:100%;object-fit:cover;}

/* RIGHT SIDE BUTTONS CONTAINER */
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
}
.header-icon{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    color:white;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:transform 0.15s ease;
}
.header-icon:active{transform:scale(0.95);}

.bell{background:#6366f1;}
.cash{background:#22c55e;}
.gift{background:#f97316;}

/* MAIN CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

.page-title-box{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
}
.page-title-box i{font-size:22px;color:#0284c7;}
.page-title-box h1{font-size:22px;font-weight:900;color:#0c4a6e;}

/* SEARCH BAR */
.search-box{
    position:relative;
    margin-bottom:14px;
}
.search-box i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    font-size:15px;
}
.search-box input{
    width:100%;
    padding:12px 14px 12px 42px;
    border-radius:14px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    font-size:13px;
    font-weight:600;
    color:#0f172a;
    outline:none;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
}
.search-box input::placeholder{color:#94a3b8;}

/* FILTER TABS */
.filter-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:16px;
    scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none;}
.tab-btn{
    white-space:nowrap;
    padding:8px 16px;
    border-radius:20px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    color:#0284c7;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:all 0.2s ease;
}
.tab-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    box-shadow:0 4px 12px rgba(2,132,199,0.25);
}

/* HISTORY LIST & CARDS */
.history-list{display:flex;flex-direction:column;gap:12px;}

.history-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 14px rgba(2,132,199,0.06);
}
.card-left{display:flex;align-items:center;gap:12px;}
.card-icon-box{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:#e0f2fe;
    color:#0284c7;
}
.card-info h4{font-size:14px;font-weight:850;color:#0f172a;}
.card-info p{font-size:11px;font-weight:600;color:#64748b;margin-top:2px;}
.card-info small{font-size:11px;font-weight:700;color:#0284c7;display:block;margin-top:2px;}

.card-right{text-align:right;}
.amount{font-size:16px;font-weight:900;}
.amount.plus{color:#16a34a;}
.amount.minus{color:#dc2626;}

.status-tag{
    display:inline-block;
    padding:3px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:850;
    margin-top:4px;
    text-transform:uppercase;
}
.status-success{background:#dcfce7;color:#15803d;}
.status-pending{background:#fef3c7;color:#b45309;}
.status-failed{background:#fee2e2;color:#b91c1c;}

/* SIDE DRAWER */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}
.drawer-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1.5px solid #bae6fd;
}
.drawer-avatar img{width:100%;height:100%;object-fit:cover;}
.drawer-close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#ffffff;
    border:1.5px solid #bae6fd;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:16px;
}
.menu-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.menu-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
.menu-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.menu-refer{background:linear-gradient(145deg,#f59e0b,#d97706);}
.menu-history{background:linear-gradient(145deg,#8b5cf6,#6d28d9);}
.menu-notification{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.menu-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.menu-logout{background:linear-gradient(145deg,#ef4444,#dc2626);margin-top:10px;}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-style:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#1e293b;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#38bdf8;}
.icon-profile{background:#f97316;}
</style>
</head>

<body>

<script>
window.addEventListener("pageshow", function (event) {
    if (event.persisted || (performance && performance.navigation.type === 2)) {
        window.location.reload();
    }
});

if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
<div class="drawer" id="sideDrawer">
    <div class="drawer-header">
        <div class="drawer-user">
            <div class="drawer-avatar">
                <img src="logo.png" alt="RDX Logo" onerror="this.style.display='none'">
            </div>
            <div>
                <h4 style="font-size:14px; font-weight:900; color:#0c4a6e;" id="drawerName">User</h4>
                <small style="color:#64748b; font-weight:700;" id="drawerMobile">+91**********</small>
            </div>
        </div>
        <button class="drawer-close" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-links">
        <button class="drawer-item" onclick="window.location.replace('dashboard.html')"><div class="drawer-item-icon menu-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="drawer-item" onclick="window.location.replace('profile.html')"><div class="drawer-item-icon menu-profile"><i class="fa-solid fa-user"></i></div><span>My Profile</span></button>
        <button class="drawer-item" onclick="window.location.replace('wallet.html')"><div class="drawer-item-icon menu-wallet"><i class="fa-solid fa-wallet"></i></div><span>My Wallet</span></button>
        <button class="drawer-item" onclick="window.location.replace('referral.html')"><div class="drawer-item-icon menu-refer"><i class="fa-solid fa-gift"></i></div><span>Refer & Earn</span></button>
        <button class="drawer-item" onclick="window.location.replace('history.html')"><div class="drawer-item-icon menu-history"><i class="fa-solid fa-clock-rotate-left"></i></div><span>History</span></button>
        <button class="drawer-item" onclick="window.location.replace('notification.html')"><div class="drawer-item-icon menu-notification"><i class="fa-solid fa-bell"></i></div><span>Notifications</span></button>
        <button class="drawer-item" onclick="window.location.replace('support.html')"><div class="drawer-item-icon menu-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="drawer-item" onclick="logout()"><div class="drawer-item-icon menu-logout"><i class="fa-solid fa-right-from-bracket"></i></div><span>Logout</span></button>
    </div>
</div>

<!-- TOP HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo" onclick="window.location.replace('dashboard.html')">
            <img src="logo.png" alt="RDX Logo">
        </div>
    </div>
    
    <!-- 3 BUTTONS RIGHT ALIGNED -->
    <div class="header-right">
        <button class="header-icon bell" onclick="window.location.replace('notification.html')"><i class="fa-solid fa-bell"></i></button>
        <button class="header-icon cash" onclick="window.location.replace('wallet.html')"><i class="fa-solid fa-wallet"></i></button>
        <button class="header-icon gift" onclick="window.location.replace('referral.html')"><i class="fa-solid fa-gift"></i></button>
    </div>
</header>

<main class="container">
    <div class="page-title-box">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <h1>History & Activity Logs</h1>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" oninput="filterLogs()" placeholder="Search by Date, UTR, Amount, Status, Opponent...">
    </div>

    <div class="filter-tabs">
        <button class="tab-btn active" onclick="switchTab('all', this)">All Activity</button>
        <button class="tab-btn" onclick="switchTab('battles', this)"><i class="fa-solid fa-swords"></i> Battles History</button>
        <button class="tab-btn" onclick="switchTab('deposits', this)"><i class="fa-solid fa-money-bill-wave"></i> Deposits</button>
        <button class="tab-btn" onclick="switchTab('withdrawals', this)"><i class="fa-solid fa-building-columns"></i> Withdrawals</button>
    </div>

    <div class="history-list" id="historyList">
        <!-- Dynamic Firebase History Cards loaded here -->
        <p style="text-align:center; color:#64748b; font-weight:600; padding:20px 0;">Loading history...</p>
    </div>
</main>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.replace('dashboard.html')"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="window.location.replace('wallet.html')"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="window.location.replace('support.html')"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="window.location.replace('profile.html')"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let allHistoryData = [];
let currentFilter = 'all';

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

function loadUserData() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;
    firebaseDB.collection("customers").doc(docId).get().then(doc => {
        if (doc.exists) {
            const d = doc.data();
            const fullName = String(d.name || ("User " + userId.slice(-4))).trim();
            document.getElementById("drawerName").textContent = fullName;
            document.getElementById("drawerMobile").textContent = "+" + userId;
        }
    });
}

function loadHistoryRealtime() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    firebaseDB.collection("customers").doc(docId).collection("history").orderBy("timestamp", "desc").onSnapshot(snap => {
        allHistoryData = [];
        snap.forEach(doc => {
            allHistoryData.push({ id: doc.id, ...doc.data() });
        });
        renderHistory();
    }, err => {
        console.error("Error loading history:", err);
        document.getElementById("historyList").innerHTML = `<p style="text-align:center; color:#ef4444; font-weight:700;">Error loading transactions.</p>`;
    });
}

function renderHistory() {
    const listEl = document.getElementById("historyList");
    const searchVal = document.getElementById("searchInput").value.toLowerCase().trim();

    let filtered = allHistoryData.filter(item => {
        if (currentFilter !== 'all' && item.type !== currentFilter) return false;

        if (searchVal !== '') {
            const str = JSON.stringify(item).toLowerCase();
            return str.includes(searchVal);
        }
        return true;
    });

    if (filtered.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:#64748b; font-weight:700; padding:30px 0;">No records found.</p>`;
        return;
    }

    listEl.innerHTML = filtered.map(item => {
        let isPlus = item.isCredit || item.type === 'deposits' || item.type === 'win';
        let amountText = `${isPlus ? '+' : '-'} ₹${item.amount || 0}`;
        let statusClass = item.status === 'success' || item.status === 'SUCCESS' ? 'status-success' : 
                         (item.status === 'failed' ? 'status-failed' : 'status-pending');

        let icon = 'fa-money-bill-wave';
        if (item.type === 'battles') icon = 'fa-swords';
        if (item.type === 'withdrawals') icon = 'fa-building-columns';

        return `
            <div class="history-card">
                <div class="card-left">
                    <div class="card-icon-box"><i class="fa-solid ${icon}"></i></div>
                    <div class="card-info">
                        <h4>${item.title || 'Deposit Amount'}</h4>
                        <p><i class="fa-regular fa-clock"></i> ${item.date || 'Recent'}</p>
                        ${item.utr ? `<small>UTR: ${item.utr}</small>` : ''}
                    </div>
                </div>
                <div class="card-right">
                    <div class="amount ${isPlus ? 'plus' : 'minus'}">${amountText}</div>
                    <span class="status-tag ${statusClass}">${item.status || 'SUCCESS'}</span>
                </div>
            </div>
        `;
    }).join('');
}

function switchTab(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderHistory();
}

function filterLogs() {
    renderHistory();
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
}

window.addEventListener("load", () => {
    loadUserData();
    loadHistoryRealtime();
});
</script>

</body>
</html>
