<!DOCTYPE html>
<html lang="hi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RDX LUDO - Deposit History</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;
      background: #f4f7ff;
      color: #17213d;
    }

    .header {
      background: #ffffff;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dfe5f2;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
    }

    .logo span {
      color: #2f68e8;
    }

    .back-btn {
      border: 0;
      background: #edf3ff;
      color: #2865e8;
      padding: 15px 22px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 45px 24px 80px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      line-height: 1.1;
    }

    h1 span {
      color: #2f68e8;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 21px;
      color: #7a86a4;
    }

    .search-card {
      background: #ffffff;
      margin-top: 40px;
      padding: 30px;
      border-radius: 28px;
      border: 1px solid #dce4f3;
      box-shadow:
        0 8px 30px rgba(40, 70, 130, 0.06);
    }

    .search-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .date-input {
      width: 100%;
      height: 70px;
      border: 2px solid #d7dfef;
      border-radius: 18px;
      padding: 0 20px;
      font-size: 20px;
      color: #17213d;
      background: #ffffff;
      outline: none;
    }

    .date-input:focus {
      border-color: #2f68e8;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .search-btn,
    .recent-btn {
      width: 100%;
      height: 68px;
      border: 0;
      border-radius: 18px;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
    }

    .search-btn {
      background: #2f68e8;
      color: white;
    }

    .recent-btn {
      background: #edf1f8;
      color: #56637f;
    }

    .search-btn:active,
    .recent-btn:active,
    .back-btn:active {
      transform: scale(0.98);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 17px 20px;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.ok {
      background: #dff7e8;
      color: #188344;
    }

    .message.error {
      background: #ffe3e7;
      color: #c53445;
    }

    .section-title {
      margin-top: 50px;
      font-size: 34px;
      font-weight: 800;
    }

    .loading,
    .empty {
      margin-top: 25px;
      background: #ffffff;
      border: 1px solid #dce4f3;
      border-radius: 22px;
      padding: 50px 25px;
      text-align: center;
      font-size: 21px;
      color: #697590;
    }

    .error-box {
      margin-top: 25px;
      background: #fff0f1;
      border: 1px solid #ffc8cd;
      border-radius: 22px;
      padding: 25px;
      color: #b42335;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }

    .date-section {
      margin-top: 35px;
    }

    .date-heading {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #263252;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: 20px;
      border: 1px solid #dce4f3;
      box-shadow:
        0 8px 25px rgba(40, 70, 130, 0.05);
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
    }

    th {
      background: #f5f7fc;
      color: #66728e;
      font-size: 15px;
      text-align: left;
      padding: 18px;
      white-space: nowrap;
    }

    td {
      padding: 18px;
      border-top: 1px solid #edf0f6;
      font-size: 15px;
      vertical-align: middle;
    }

    .utr {
      font-weight: 700;
      color: #293858;
    }

    .amount {
      font-weight: 800;
      color: #1d2945;
      white-space: nowrap;
    }

    .account {
      max-width: 220px;
      word-break: break-word;
    }

    .reason {
      max-width: 220px;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.approved {
      background: #dcf7e7;
      color: #21854a;
    }

    .status.rejected {
      background: #ffe0e5;
      color: #c72f43;
    }

    .status.pending {
      background: #fff1c9;
      color: #9a6b00;
    }

    @media (max-width: 700px) {

      .header {
        padding: 18px 16px;
      }

      .logo {
        font-size: 24px;
      }

      .back-btn {
        padding: 12px 15px;
        font-size: 15px;
      }

      .container {
        padding: 32px 16px 60px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 18px;
      }

      .search-card {
        padding: 20px;
        border-radius: 22px;
      }

      .search-title {
        font-size: 23px;
      }

      .section-title {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>


  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">

    <div class="logo">

      class="back-btn"

    >
      ← वापस
    </button>

  </header>


  <!-- =================================================
       MAIN
  ================================================== -->

  <main class="container">

    <h1>
      Deposit <span>History</span>
    </h1>

    <div class="subtitle">
      आपकी Deposit की पूरी History
    </div>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="search-card">

      <div class="search-title">
        📅 तारीख से History खोजें
      </div>

      <input
        type="date"
        id="dateSearch"

      >

      <div class="buttons">

        <button
          id="searchBtn"
          class="search-btn"

          🔍 Search
        </button>

        <button

          ↻ Recent History
        </button>

      </div>

      <div

      ></div>

    </div>


    <!-- =================================================
         HISTORY
    ================================================== -->

    <div class="section-title">

    </div>

    <div id="historyContainer">

      <div class="loading">
        History Loading...
      </div>

    </div>

  </main>


  <!-- =================================================
       FIREBASE
  ================================================== -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =================================================
       FIREBASE CONFIG
    ================================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAsGWpMcC2WtMpv3_498me8_ydjL8wN1Qc",

      authDomain:
        "rdx-ludo.firebaseapp.com",

      projectId:
        "rdx-ludo",

      storageBucket:
        "rdx-ludo.firebasestorage.app",

      messagingSenderId:
        "928340814840",

      appId:
        "1:928340814840:web:6eca42a8b76138b268440d"

    };


    /* =================================================
       FIREBASE INIT
    ================================================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* =================================================
       COLLECTION
    ================================================= */

    const DEPOSITS_COLLECTION =
      "deposits";


    /* =================================================
       VARIABLES
    ================================================= */

    let currentUser = null;

    let allHistory = [];


    /* =================================================
       ELEMENTS
    ================================================= */

    const historyContainer =
      document.getElementById(
        "historyContainer"
      );

    const dateSearch =
      document.getElementById(
        "dateSearch"
      );

    const searchBtn =
      document.getElementById(
        "searchBtn"
      );

    const clearBtn =
      document.getElementById(
        "clearBtn"
      );

    const message =
      document.getElementById(
        "message"
      );

    const backBtn =
      document.getElementById(
        "backBtn"
      );


    /* =================================================
       SAFE HTML
    ================================================= */

    function safe(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =================================================
       MESSAGE
    ================================================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " +
        type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    /* =================================================
       NORMALIZE PHONE
    ================================================= */

    function normalizeNumber(
      value
    ) {

      if (!value) {
        return "";
      }

      return String(value)
        .replace(/\D/g, "")
        .replace(
          /^91(?=\d{10}$)/,
          ""
        );

    }


    /* =================================================
       AUTH IDENTIFIERS
    ================================================= */

    function getAuthIdentifiers(
      user
    ) {

      const identifiers =
        new Set();


      if (!user) {
        return identifiers;
      }


      /* Firebase UID */

      if (user.uid) {

        identifiers.add(
          String(
            user.uid
          ).trim()
        );

      }


      /* Phone */

      if (user.phoneNumber) {

        const rawPhone =
          String(
            user.phoneNumber
          ).trim();


        identifiers.add(
          rawPhone
        );


        const normalized =
          normalizeNumber(
            rawPhone
          );


        if (normalized) {

          identifiers.add(
            normalized
          );

          identifiers.add(
            "91" + normalized
          );

          identifiers.add(
            "+91" + normalized
          );

        }

      }


      return identifiers;

    }


    /* =================================================
       DEPOSIT IDENTIFIERS
    ================================================= */

    function getDepositIdentifiers(
      deposit
    ) {

      const identifiers =
        new Set();


      const fields = [

        deposit.userId,

        deposit.uid,

        deposit.customerId,

        deposit.userUID,

        deposit.mobile,

        deposit.phone,

        deposit.phoneNumber

      ];


      fields.forEach(
        value => {

          if (!value) {
            return;
          }


          const raw =
            String(value).trim();


          identifiers.add(
            raw
          );


          const normalized =
            normalizeNumber(
              raw
            );


          if (normalized) {

            identifiers.add(
              normalized
            );

            identifiers.add(
              "91" + normalized
            );

            identifiers.add(
              "+91" + normalized
            );

          }

        }
      );


      return identifiers;

    }


    /* =================================================
       MATCH USER
    ================================================= */

    function belongsToCurrentUser(
      deposit,
      user
    ) {

      const authIds =
        getAuthIdentifiers(
          user
        );


      const depositIds =
        getDepositIdentifiers(
          deposit
        );


      for (
        const id of authIds
      ) {

        if (
          depositIds.has(id)
        ) {

          return true;

        }

      }


      return false;

    }


    /* =================================================
       UTR
    ================================================= */

    function getUTR(
      deposit
    ) {

      return String(

        deposit.utr ??

        deposit.utrNumber ??

        deposit.utrNo ??

        deposit.transactionId ??

        deposit.transactionNumber ??

        ""

      ).trim();

    }


    /* =================================================
       ACCOUNT
    ================================================= */

    function getAccount(
      deposit
    ) {

      return String(

        deposit.accountHolderName ??

        deposit.accountName ??

        deposit.accountHolder ??

        deposit.upiName ??

        deposit.upiId ??

        deposit.account ??

        ""

      ).trim();

    }


    /* =================================================
       STATUS
    ================================================= */

    function getStatus(
      deposit
    ) {

      return String(

        deposit.status ??
        "pending"

      )
      .trim()
      .toLowerCase();

    }


    /* =================================================
       FIREBASE DATE
    ================================================= */

    function getDateValue(
      value
    ) {

      if (!value) {
        return null;
      }


      /* Firebase Timestamp */

      if (
        typeof value.toDate ===
        "function"
      ) {

        return value.toDate();

      }


      /* Firestore object */

      if (
        typeof value ===
          "object" &&

        typeof value.seconds ===
          "number"
      ) {

        return new Date(
          value.seconds * 1000
        );

      }


      /* JS Date */

      if (
        value instanceof Date
      ) {

        return value;

      }


      /* Number */

      if (
        typeof value ===
        "number"
      ) {

        const d =
          new Date(value);


        if (
          !isNaN(
            d.getTime()
          )
        ) {

          return d;

        }

      }


      /* String */

      if (
        typeof value ===
        "string"
      ) {

        const d =
          new Date(value);


        if (
          !isNaN(
            d.getTime()
          )
        ) {

          return d;

        }

      }


      return null;

    }


    /* =================================================
       HISTORY DATE
    ================================================= */

    function getHistoryDate(
      deposit
    ) {

      const status =
        getStatus(
          deposit
        );


      /* APPROVED */

      if (
        status ===
        "approved"
      ) {

        return (

          getDateValue(
            deposit.approvedAt
          )

          ||

          getDateValue(
            deposit.updatedAt
          )

          ||

          getDateValue(
            deposit.createdAt
          )

        );

      }


      /* REJECTED */

      if (
        status ===
        "rejected"
      ) {

        return (

          getDateValue(
            deposit.rejectedAt
          )

          ||

          getDateValue(
            deposit.updatedAt
          )

          ||

          getDateValue(
            deposit.createdAt
          )

        );

      }


      /* PENDING */

      return (

        getDateValue(
          deposit.createdAt
        )

        ||

        getDateValue(
          deposit.updatedAt
        )

      );

    }


    /* =================================================
       FORMAT DATE
    ================================================= */

    function formatDate(
      date
    ) {

      if (!date) {
        return "—";
      }


      return date.toLocaleDateString(
        "en-GB",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }


    /* =================================================
       FORMAT DATE TIME
    ================================================= */

    function formatDateTime(
      date
    ) {

      if (!date) {
        return "—";
      }


      return (

        date.toLocaleDateString(
          "en-GB",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        )

        +

        " "

        +

        date.toLocaleTimeString(
          "en-IN",
          {
            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hour12:
              true
          }
        )

      );

    }


    /* =================================================
       DATE KEY
    ================================================= */

    function dateKey(
      date
    ) {

      if (!date) {
        return "";
      }


      const year =
        date.getFullYear();


      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    /* =================================================
       REASON
    ================================================= */

    function getReason(
      deposit
    ) {

      return String(

        deposit.rejectReason ??

        deposit.rejectionReason ??

        deposit.reason ??

        deposit.comment ??

        ""

      ).trim();

    }


    /* =================================================
       AMOUNT
    ================================================= */

    function getAmount(
      deposit
    ) {

      const value =

        deposit.amount ??

        deposit.depositAmount ??

        0;


      const number =
        Number(value);


      return isNaN(number)
        ? 0
        : number;

    }


    /* =================================================
       STATUS HTML
    ================================================= */

    function getStatusHTML(
      status
    ) {

      if (
        status ===
        "approved"
      ) {

        return `

          <span
            class="status approved"
          >
            🟢 APPROVED
          </span>

        `;

      }


      if (
        status ===
        "rejected"
      ) {

        return `

          <span
            class="status rejected"
          >
            🔴 REJECT
          </span>

        `;

      }


      return `

        <span
          class="status pending"
        >
          🟡 PENDING
        </span>

      `;

    }


    /* =================================================
       RENDER HISTORY
    ================================================= */

    function renderHistory(
      list
    ) {

      if (!list.length) {

        historyContainer.innerHTML = `

          <div class="empty">

            कोई Deposit History नहीं मिली।

          </div>

        `;

        return;

      }


      /* SORT */

      const sorted =
        [...list].sort(
          (a, b) => {

            const da =
              getHistoryDate(a);

            const db =
              getHistoryDate(b);


            return (

              (
                db?.getTime() ||
                0
              )

              -

              (
                da?.getTime() ||
                0
              )

            );

          }
        );


      /* GROUP */

      const groups = {};


      sorted.forEach(
        deposit => {

          const date =
            getHistoryDate(
              deposit
            );


          const key =
            dateKey(
              date
            );


          if (
            !groups[key]
          ) {

            groups[key] = [];

          }


          groups[key].push(
            deposit
          );

        }
      );


      const dates =
        Object.keys(
          groups
        )
        .sort()
        .reverse();


      let html = "";


      dates.forEach(
        key => {

          const group =
            groups[key];


          const firstDate =
            getHistoryDate(
              group[0]
            );


          html += `

            <div
              class="date-section"
            >

              <div
                class="date-heading"
              >
                📅 ${safe(
                  formatDate(
                    firstDate
                  )
                )}
              </div>


              <div
                class="table-wrapper"
              >

                <table>

                  <thead>

                    <tr>

                      <th>
                        UTR No.
                      </th>

                      <th>
                        Amount
                      </th>

                      <th>
                        Status
                      </th>

                      <th>
                        Account
                      </th>

                      <th>
                        Date & Time
                      </th>

                      <th>
                        Reason
                      </th>

                    </tr>

                  </thead>

                  <tbody>

          `;


          group.forEach(
            deposit => {

              const status =
                getStatus(
                  deposit
                );


              const amount =
                getAmount(
                  deposit
                );


              const utr =
                getUTR(
                  deposit
                );


              const account =
                getAccount(
                  deposit
                );


              const finalDate =
                getHistoryDate(
                  deposit
                );


              const reason =
                getReason(
                  deposit
                );


              let reasonHTML =
                "—";


              if (
                status ===
                  "rejected" &&
                reason
              ) {

                reasonHTML =
                  safe(reason);

              }


              html += `

                <tr>

                  <td
                    class="utr"
                  >
                    ${safe(
                      utr || "—"
                    )}
                  </td>


                  <td
                    class="amount"
                  >
                    ₹${amount.toLocaleString(
                      "en-IN"
                    )}
                  </td>


                  <td>
                    ${getStatusHTML(
                      status
                    )}
                  </td>


                  <td
                    class="account"
                  >
                    ${safe(
                      account || "—"
                    )}
                  </td>


                  <td>
                    ${safe(
                      formatDateTime(
                        finalDate
                      )
                    )}
                  </td>


                  <td
                    class="reason"
                  >
                    ${reasonHTML}
                  </td>

                </tr>

              `;

            }
          );


          html += `

                  </tbody>

                </table>

              </div>

            </div>

          `;

        }
      );


      historyContainer.innerHTML =
        html;

    }


    /* =================================================
       LOAD HISTORY
    ================================================= */

    async function loadHistory() {

      if (!currentUser) {

        historyContainer.innerHTML = `

          <div class="empty">

            कृपया पहले लॉगिन करें।

          </div>

        `;

        return;

      }


      historyContainer.innerHTML = `

        <div class="loading">

          History Loading...

        </div>

      `;


      try {

        console.log(
          "=========================="
        );

        console.log(
          "RDX HISTORY START"
        );

        console.log(
          "Firebase UID:",
          currentUser.uid
        );

        console.log(
          "Firebase Phone:",
          currentUser.phoneNumber
        );


        /* GET DEPOSITS */

        const depositsRef =
          collection(
            db,
            DEPOSITS_COLLECTION
          );


        const snapshot =
          await getDocs(
            depositsRef
          );


        console.log(
          "Total deposits:",
          snapshot.size
        );


        allHistory = [];


        snapshot.forEach(
          docSnap => {

            const data =
              docSnap.data();


            console.log(
              "Deposit:",
              docSnap.id,
              data
            );


            if (
              belongsToCurrentUser(
                data,
                currentUser
              )
            ) {

              allHistory.push({

                id:
                  docSnap.id,

                ...data

              });

            }

          }
        );


        console.log(
          "MATCHING HISTORY:",
          allHistory
        );


        console.log(
          "Matching count:",
          allHistory.length
        );


        console.log(
          "=========================="
        );


        renderHistory(
          allHistory
        );

      }

      catch(error) {

        console.error(
          "HISTORY ERROR:",
          error
        );


        historyContainer.innerHTML = `

          <div class="error-box">

            <strong>
              ❌ History लोड नहीं हो सकी
            </strong>

            <br><br>

            <b>Error:</b>

            ${safe(
              error.message
            )}

            <br><br>

            अगर यहाँ
            <b>Missing or insufficient permissions</b>
            लिखा है, तो Firebase Firestore Rules में
            read permission की समस्या है।

          </div>

        `;

      }

    }


    /* =================================================
       SEARCH DATE
    ================================================= */

    function searchByDate() {

      const selectedDate =
        dateSearch.value;


      if (!selectedDate) {

        hideMessage();

        renderHistory(
          allHistory
        );

        return;

      }


      const filtered =
        allHistory.filter(
          deposit => {

            const date =
              getHistoryDate(
                deposit
              );


            return (
              dateKey(date)
              ===
              selectedDate
            );

          }
        );


      const displayDate =
        selectedDate
          .split("-")
          .reverse()
          .join("-");


      if (
        filtered.length
      ) {

        showMessage(
          displayDate +
          " की History मिली।",
          "ok"
        );

      }

      else {

        showMessage(
          displayDate +
          " की कोई History नहीं मिली।",
          "error"
        );

      }


      renderHistory(
        filtered
      );

    }


    /* =================================================
       SEARCH BUTTON
    ================================================= */

    searchBtn.addEventListener(
      "click",
      searchByDate
    );


    /* =================================================
       DATE CHANGE
    ================================================= */

    dateSearch.addEventListener(
      "change",
      searchByDate
    );


    /* =================================================
       RECENT HISTORY
    ================================================= */

    clearBtn.addEventListener(
      "click",
      () => {

        dateSearch.value =
          "";

        hideMessage();

        renderHistory(
          allHistory
        );

      }
    );


    /* =================================================
       BACK
    ================================================= */

    backBtn.addEventListener(
      "click",
      () => {

        window.history.back();

      }
    );


    /* =================================================
       AUTH STATE
    ================================================= */

    onAuthStateChanged(
      auth,
      async user => {

        console.log(
          "Auth state changed:",
          user
        );


        if (user) {

          currentUser =
            user;


          await loadHistory();

        }

        else {

          currentUser =
            null;


          historyContainer.innerHTML = `

            <div class="empty">

              कृपया अपने खाते में लॉगिन करके
              History देखें।

            </div>

          `;

        }

      }
    );

  </script>

</body>
</html>
