<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-bottom:95px;
}
button{font:inherit;}

/* TOP HEADER */
.top-header{
    height:66px;
    background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 18px rgba(2,132,199,0.08);
}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#ff7165,#ff8a70);
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.logo{
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#dbeafe);
    border:2.5px solid #93c5fd;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0284c7;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}
.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{
    height:38px;
    padding:0 10px;
    border:0;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
    font-weight:800;
    color:white;
    cursor:pointer;
}
.icon-only{width:38px;padding:0;border-radius:50%;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);}

.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

.page-title{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
}

/* FILTER TABS */
.filter-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:16px;
}
.filter-scroll::-webkit-scrollbar{display:none;}
.tab-btn{
    padding:8px 16px;
    border-radius:18px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    color:#64748b;
    font-weight:850;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.2s ease;
}
.tab-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    box-shadow:0 4px 12px rgba(2,132,199,0.25);
}

/* HISTORY CARDS */
.history-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.history-left{display:flex;align-items:center;gap:12px;}
.history-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}
.icon-win{background:#dcfce7;color:#15803d;}
.icon-lost{background:#fee2e2;color:#be123c;}
.icon-cancel{background:#f1f5f9;color:#64748b;}
.icon-dep{background:#e0f2fe;color:#0284c7;}
.icon-with{background:#fef3c7;color:#b45309;}

.history-details h4{
    font-size:14px;
    font-weight:850;
    color:#0c4a6e;
}
.history-details p{
    font-size:11px;
    color:#64748b;
    font-weight:600;
    margin-top:2px;
}
.history-details small{
    display:block;
    font-size:10px;
    color:#be123c;
    font-weight:700;
    margin-top:2px;
}

.history-right{text-align:right;}
.amount-win{font-size:16px;font-weight:900;color:#15803d;}
.amount-loss{font-size:16px;font-weight:900;color:#be123c;}
.amount-cancel{font-size:16px;font-weight:900;color:#64748b;}

/* BADGES */
.badge-status{
    display:inline-block;
    padding:3px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:850;
    text-transform:uppercase;
    margin-top:4px;
}
.status-approved, .status-success, .status-won{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.status-rejected, .status-lost{background:#fee2e2;color:#be123c;border:1px solid #fca5a5;}
.status-pending{background:#fef3c7;color:#b45309;border:1px solid #fde68a;}
.status-cancelled{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;}

.empty-state{
    text-align:center;
    padding:40px 14px;
    color:#64748b;
}
.empty-state i{font-size:36px;color:#bae6fd;margin-bottom:10px;}

/* SIDE DRAWER */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100%;
    background:#ffffff;
    z-index:1000;
    box-shadow:4px 0 25px rgba(2,132,199,0.15);
    transform:translateX(-100%);
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display:flex;
    flex-direction:column;
}
.drawer.active{transform:translateX(0);}
.drawer-header{
    padding:20px 16px;
    background:linear-gradient(135deg,#e0f2fe,#f0f9ff);
    border-bottom:1.5px solid #bae6fd;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.drawer-user{display:flex;align-items:center;gap:10px;}
.drawer-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(145deg,#0284c7,#0369a1);
    color:white;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
}
.drawer-close{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid #bae6fd;
    background:#ffffff;
    color:#0c4a6e;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.drawer-links{flex:1;overflow-y:auto;padding:12px;}
.drawer-item{
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:14px;
    background:transparent;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:750;
    color:#334155;
    cursor:pointer;
    margin-bottom:4px;
}
.drawer-item:hover, .drawer-item:active{background:#f0f9ff;color:#0284c7;}
.drawer-item i{font-size:16px;width:22px;text-align:center;color:#0284c7;}
.drawer-footer{padding:14px;border-top:1px solid #e2e8f0;}
.drawer-logout{
    width:100%;
    padding:12px;
    border:1px solid #fecdd3;
    border-radius:14px;
    background:#fff1f2;
    color:#be123c;
    font-weight:800;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    border-top:1.5px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
    box-shadow:0 -5px 25px rgba(2,132,199,0.06);
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);}
</style>
</head>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let allLogs = [];
let activeTab = "all";

let battlesData = [];
let depositsData = [];
let withdrawalsData = [];

function toggleMenu() {
    document.getElementById("sideDrawer").classList.toggle("active");
    document.getElementById("drawerOverlay").classList.toggle("active");
}

function parseItemTime(ts) {
    if (!ts) return { dateObj: new Date(0), formatted: "—" };
    let d;
    if (typeof ts.toDate === "function") { d = ts.toDate(); }
    else if (ts.seconds) { d = new Date(ts.seconds * 1000); }
    else { d = new Date(ts); }

    const formatted = isNaN(d.getTime()) ? "—" : d.toLocaleString("en-IN", {
        day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true
    });
    return { dateObj: d, formatted: formatted };
}

async function loadHeaderUserData() {
    if (!userId) { location.href = "login.html"; return; }
    const docId = userId.length === 10 ? "91" + userId : userId;

    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if (snap.exists) {
            const d = snap.data();
            const displayName = d.name || ("User " + userId.slice(-4));
            document.getElementById("drawerName").textContent = displayName;
            document.getElementById("drawerAvatar").textContent = displayName.charAt(0).toUpperCase();
            document.getElementById("drawerMobile").textContent = "+" + userId;
            document.getElementById("topBalance").textContent = Number(d.balance || 0);
            document.getElementById("topReferral").textContent = Number(d.referralBalance || d.redeemBalance || 0);
        }
    } catch(err) { console.error(err); }
}

// REAL-TIME LISTENER FOR ALL LOGS
function startRealtimeLogsListener() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    // 1. Battles Real-Time Listener
    firebaseDB.collection("battles").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const b = doc.data();
            if (b.creatorUid === docId || b.acceptedUid === docId) {
                const timeInfo = parseItemTime(b.resolvedAt || b.startedAt || b.createdAt);
                const isCreator = b.creatorUid === docId;
                const oppName = isCreator ? (b.acceptedName || "Opponent") : (b.creatorName || "Creator");

                let battleStatus = "Live";
                let isWon = false;
                let isCancelled = false;

                if (b.status === "completed") {
                    if (b.winnerUid === docId) {
                        battleStatus = "Won";
                        isWon = true;
                    } else {
                        battleStatus = "Lost";
                    }
                } else if (b.status === "cancelled") {
                    battleStatus = "Cancelled";
                    isCancelled = true;
                }

                list.push({
                    type: "battle",
                    id: doc.id,
                    title: `Battle vs ${oppName}`,
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: b.amount,
                    prize: b.prize,
                    status: battleStatus,
                    isWon: isWon,
                    isCancelled: isCancelled
                });
            }
        });
        battlesData = list;
        mergeAndRenderLogs();
    });

    // 2. Deposits Real-Time Listener
    firebaseDB.collection("deposits").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const d = doc.data();
            const cleanUid = String(d.uid || d.userId).replace(/\D/g, "");
            if (cleanUid === userId) {
                const timeInfo = parseItemTime(d.createdAt || d.date);
                list.push({
                    type: "deposit",
                    id: doc.id,
                    title: "Deposit Amount",
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: d.amount,
                    status: String(d.status || "pending").toLowerCase(),
                    comment: d.comment || ""
                });
            }
        });
        depositsData = list;
        mergeAndRenderLogs();
    });

    // 3. Withdrawals Real-Time Listener
    firebaseDB.collection("withdrawals").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const w = doc.data();
            const cleanUid = String(w.uid || w.mobile).replace(/\D/g, "");
            if (cleanUid === userId) {
                const timeInfo = parseItemTime(w.createdAt || w.date);
                list.push({
                    type: "withdrawal",
                    id: doc.id,
                    title: "Withdrawal Cash",
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: w.amount,
                    status: String(w.status || "pending").toLowerCase(),
                    comment: w.comment || ""
                });
            }
        });
        withdrawalsData = list;
        mergeAndRenderLogs();
    });
}

function mergeAndRenderLogs() {
    allLogs = [...battlesData, ...depositsData, ...withdrawalsData];
    allLogs.sort((a, b) => b.timeObj - a.timeObj);
    renderLogs();
}

function renderLogs() {
    const container = document.getElementById("logsContainer");
    let filtered = allLogs;

    if (activeTab === "battles") filtered = allLogs.filter(x => x.type === "battle");
    else if (activeTab === "deposits") filtered = allLogs.filter(x => x.type === "deposit");
    else if (activeTab === "withdrawals") filtered = allLogs.filter(x => x.type === "withdrawal");

    if (!filtered.length) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <h4 style="color:#0c4a6e; font-size:15px; font-weight:850;">No History Records</h4>
                <p style="font-size:12px; margin-top:4px;">Is category mein abhi koi logs nahi hain.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(item => {
        if (item.type === "battle") {
            let iconBox = `<div class="history-icon icon-lost"><i class="fa-solid fa-gamepad"></i></div>`;
            let amtClass = "amount-loss";
            let amtSign = `- ₹${item.amount}`;
            let statusBadge = `<span class="badge-status status-lost">Lost</span>`;

            if (item.isWon) {
                iconBox = `<div class="history-icon icon-win"><i class="fa-solid fa-trophy"></i></div>`;
                amtClass = "amount-win";
                amtSign = `+ ₹${item.prize}`;
                statusBadge = `<span class="badge-status status-won">Won</span>`;
            } else if (item.isCancelled) {
                iconBox = `<div class="history-icon icon-cancel"><i class="fa-solid fa-ban"></i></div>`;
                amtClass = "amount-cancel";
                amtSign = `Refund ₹${item.amount}`;
                statusBadge = `<span class="badge-status status-cancelled">Cancelled</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        ${iconBox}
                        <div class="history-details">
                            <h4>${item.title}</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="${amtClass}">${amtSign}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        } else if (item.type === "deposit") {
            const s = item.status;
            let statusBadge = `<span class="badge-status status-pending">Pending</span>`;
            if (s === "approved" || s === "success") {
                statusBadge = `<span class="badge-status status-approved">Success</span>`;
            } else if (s === "rejected" || s === "failed") {
                statusBadge = `<span class="badge-status status-rejected">Rejected</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        <div class="history-icon icon-dep"><i class="fa-solid fa-money-bill-wave"></i></div>
                        <div class="history-details">
                            <h4>${item.title}</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                            ${item.comment && s === 'rejected' ? `<small>Reason: ${item.comment}</small>` : ''}
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="amount-win">+ ₹${item.amount}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        } else if (item.type === "withdrawal") {
            const s = item.status;
            let statusBadge = `<span class="badge-status status-pending">Pending</span>`;
            if (s === "approved" || s === "success") {
                statusBadge = `<span class="badge-status status-approved">Success</span>`;
            } else if (s === "rejected" || s === "failed") {
                statusBadge = `<span class="badge-status status-rejected">Rejected</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        <div class="history-icon icon-with"><i class="fa-solid fa-money-bill-transfer"></i></div>
                        <div class="history-details">
                            <h4>${item.title}</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                            ${item.comment && s === 'rejected' ? `<small>Reason: ${item.comment}</small>` : ''}
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="amount-loss">- ₹${item.amount}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        }
    }).join("");
}

function setFilter(type, btnEl) {
    activeTab = type;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    renderLogs();
}

function logout() {
    if (!confirm("Kya aap Logout karna chahte hain?")) return;
    localStorage.removeItem("rdxLoggedIn");
    localStorage.removeItem("rdxFirebaseUserId");
    localStorage.removeItem("rdxVerifiedMobile");
    localStorage.removeItem("rdxAccessToken");
    location.href = "login.html";
}

window.addEventListener("load", () => {
    loadHeaderUserData();
    startRealtimeLogsListener();
});
</script>
