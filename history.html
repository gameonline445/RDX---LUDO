<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - RDX LUDO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8faff 0%, #eef4ff 50%, #f1f5f9 100%);
            color: #1e293b;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #334155;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .brand-badge {
            background: #ffffff;
            border: 1px solid #dbeafe;
            color: #2563eb;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.08);
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .icon-bell { background: #6366f1; color: #ffffff; }
        .icon-money { background: #22c55e; color: #ffffff; }
        .icon-gift { background: #f97316; color: #ffffff; }

        .page-heading {
            padding: 16px 20px 8px;
        }

        .page-heading h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
        }

        .page-heading p {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }

        .tab-container {
            display: flex;
            padding: 10px 18px 14px;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            background: #ffffff;
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
        }

        .content-section {
            padding: 0 18px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(219, 234, 254, 0.7);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
        }

        .card-subtitle {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .card-date {
            font-size: 11px;
            color: #94a3b8;
        }

        .card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .amount {
            font-size: 17px;
            font-weight: 800;
        }

        .credit { color: #16a34a; }
        .debit { color: #dc2626; }

        .badge {
            font-size: 10px;
            padding: 4px 9px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }
        .badge-pending { background: #fef9c3; color: #a16207; }

        .admin-note {
            font-size: 12px;
            padding: 11px 14px;
            border-radius: 14px;
            display: flex;
            align-items: flex-start;
            gap: 9px;
            line-height: 1.4;
        }

        .admin-note.approved {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .admin-note.rejected {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .admin-note.pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .admin-note i {
            font-size: 14px;
            margin-top: 2px;
        }

        .loading-box, .empty-box {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e2e8f0;
            z-index: 100;
        }

        .nav-item {
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active { color: #2563eb; }

        .nav-icon-box {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 17px;
        }

        .nav-item.active .nav-icon-box {
            background: #eff6ff;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="top-bar">
        <div class="header-left">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="brand-badge">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="icon-circle icon-bell"><i class="fa-solid fa-bell"></i></div>
            <div class="icon-circle icon-money"><i class="fa-solid fa-sack-dollar"></i></div>
            <div class="icon-circle icon-gift"><i class="fa-solid fa-gift"></i></div>
        </div>
    </header>

    <!-- Title -->
    <div class="page-heading">
        <h1>History & Logs</h1>
        <p>Battles, results and wallet transactions</p>
    </div>

    <!-- Tabs -->
    <div class="tab-container">
        <button class="tab-btn" onclick="switchTab('matches')">
            <i class="fa-solid fa-gamepad"></i> Matches
        </button>
        <button class="tab-btn active" onclick="switchTab('transactions')">
            <i class="fa-solid fa-wallet"></i> Transactions
        </button>
    </div>

    <!-- Matches Container -->
    <section id="matches-tab" class="content-section" style="display: none;">
        <div id="matches-list" class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Matches load ho rahe hain...</div>
    </section>

    <!-- Transactions Container -->
    <section id="transactions-tab" class="content-section">
        <div id="transactions-list" class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Transactions load ho rahe hain...</div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <div class="nav-icon-box"><i class="fa-solid fa-house"></i></div>
            <span>Home</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <div class="nav-icon-box"><i class="fa-solid fa-wallet"></i></div>
            <span>Wallet</span>
        </a>
        <a href="support.html" class="nav-item">
            <div class="nav-icon-box"><i class="fa-solid fa-headset"></i></div>
            <span>Support</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <div class="nav-icon-box"><i class="fa-solid fa-user"></i></div>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        // 1. Firebase Config Setup (Aapke dashboard.html / admin.html wala config)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. Logged In User ka Phone/ID check karein
        const currentUserPhone = localStorage.getItem("userPhone") || "917878852370";

        // 3. Real-Time Transactions Load
        function loadRealTransactions() {
            const listContainer = document.getElementById("transactions-list");

            db.collection("deposits")
              .where("userPhone", "==", currentUserPhone)
              .onSnapshot((snapshot) => {
                  if (snapshot.empty) {
                      listContainer.innerHTML = `<div class="empty-box"><i class="fa-solid fa-receipt fa-2x"></i><br><br>Koi transaction history nahi mili.</div>`;
                      return;
                  }

                  let html = "";
                  snapshot.forEach((doc) => {
                      const data = doc.data();
                      const status = (data.status || "pending").toLowerCase();
                      
                      let badgeClass = "badge-pending";
                      let noteClass = "pending";
                      let icon = "fa-clock";
                      let comment = data.adminComment || "Admin verification me hai.";

                      if (status === "approved") {
                          badgeClass = "badge-approved";
                          noteClass = "approved";
                          icon = "fa-circle-check";
                          comment = data.adminComment || "Payment verify ho gaya hai. Balance wallet me add ho gaya hai.";
                      } else if (status === "rejected") {
                          badgeClass = "badge-rejected";
                          noteClass = "rejected";
                          icon = "fa-triangle-exclamation";
                          comment = "<strong>Admin Reason:</strong> " + (data.adminComment || "Payment details match nahi hui.");
                      }

                      const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : "Recently";

                      html += `
                        <div class="card">
                            <div class="card-top">
                                <div class="card-left">
                                    <span class="card-title">${data.type || 'Deposit (UPI)'}</span>
                                    <span class="card-subtitle">UTR: ${data.utr || 'N/A'}</span>
                                    <span class="card-date">${date}</span>
                                </div>
                                <div class="card-right">
                                    <span class="amount ${status === 'approved' ? 'credit' : 'debit'}">₹${data.amount || 0}</span>
                                    <span class="badge ${badgeClass}">${status}</span>
                                </div>
                            </div>
                            <div class="admin-note ${noteClass}">
                                <i class="fa-solid ${icon}"></i>
                                <span>${comment}</span>
                            </div>
                        </div>
                      `;
                  });
                  listContainer.innerHTML = html;
              }, (error) => {
                  listContainer.innerHTML = `<div class="empty-box" style="color:#ef4444;">Error loading history. Database check karein.</div>`;
              });
        }

        // 4. Tab Switcher
        function switchTab(tabName) {
            const matchesTab = document.getElementById('matches-tab');
            const transTab = document.getElementById('transactions-tab');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tabName === 'matches') {
                matchesTab.style.display = 'block';
                transTab.style.display = 'none';
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                matchesTab.style.display = 'none';
                transTab.style.display = 'block';
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        // Init
        window.onload = () => {
            loadRealTransactions();
        };
    </script>
</body>
</html>
