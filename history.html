<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - History & Transactions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
        body{
            background:
                radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
                radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
            color:#101a38;
            min-height:100vh;
            padding-bottom:85px;
        }
        .top-bar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
        .header-left{display:flex;align-items:center;gap:10px;}
        .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ffffff;border:1px solid #bae6fd;color:#0284c7;cursor:pointer;}
        .brand-badge{background:#ffffff;border:1px solid #bae6fd;color:#0284c7;font-weight:900;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;}
        .header-icons{display:flex;gap:6px;}
        .topicon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#ffffff;cursor:pointer;}
        .icon-bell{background:#6366f1;} .icon-cash{background:#16a34a;} .icon-gift{background:#ea580c;}

        .page-heading{padding:14px 14px 6px;}
        .page-heading h1{font-size:18px;font-weight:850;color:#0c4a6e;}
        .page-heading p{font-size:12px;color:#64748b;}
        .filter-section{padding:8px 14px 12px;}
        .search-input{width:100%;height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #bae6fd;background:#ffffff;font-size:12px;font-weight:600;outline:none;}

        .content-section{padding:0 14px;}
        .card{background:#ffffff;border-radius:16px;padding:14px;margin-bottom:10px;border:1.5px solid #bae6fd;box-shadow:0 4px 14px rgba(2,132,199,0.06);display:flex;flex-direction:column;gap:8px;}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
        .card-title{font-size:14px;font-weight:800;}
        .card-subtitle{font-size:11px;color:#64748b;word-break:break-all;}
        .card-date{font-size:10px;color:#94a3b8;margin-top:2px;}
        .amount{font-size:16px;font-weight:900;}
        .credit{color:#16a34a;} .debit{color:#dc2626;}
        .badge{font-size:9px;padding:3px 7px;border-radius:6px;font-weight:800;text-transform:uppercase;}
        .badge-approved{background:#dcfce7;color:#15803d;}
        .badge-rejected{background:#fee2e2;color:#b91c1c;}
        .badge-pending{background:#fef3c7;color:#b45309;}
        .admin-note{font-size:11px;padding:8px 10px;border-radius:10px;}
        .admin-note.approved{background:#f0fdf4;color:#15803d;}
        .admin-note.rejected{background:#fff1f2;color:#be123c;}
        .admin-note.pending{background:#fffbeb;color:#b45309;}

        /* BOTTOM NAV */
        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
        .nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
        .nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
        .nav-item:active .nav-icon-box{transform:scale(0.92);}
        .icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
        .icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
        .icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
        .icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="brand-badge" onclick="location.href='dashboard.html'">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell" onclick="location.href='notification.html'">🔔</div>
            <div class="topicon icon-cash" onclick="location.href='wallet.html'">💵</div>
            <div class="topicon icon-gift" onclick="location.href='referral.html'">🎁</div>
        </div>
    </header>

    <div class="page-heading">
        <h1>Transactions & Logs</h1>
        <p>Deposit, withdrawal status aur updates</p>
    </div>

    <div class="filter-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by Date, Time, UTR, Bank, UPI...">
    </div>

    <section class="content-section">
        <div id="transactions-list" style="text-align:center;padding:30px;color:#64748b;font-size:13px;">Transactions load ho rahe hain...</div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="nav-item" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
        <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentUserId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");
        let allTransactions = [];

        function parseTimestamp(ts) {
            if (!ts) return { dateObj: new Date(0), formatted: "Recently" };
            let d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
            return { dateObj: d, formatted: d.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true }) };
        }

        async function loadTransactions() {
            if(!currentUserId) return;
            let list = [];
            const depSnap = await getDocs(collection(db, "deposits"));
            depSnap.forEach(d => {
                const data = d.data();
                if(String(data.userId || data.uid).includes(currentUserId)){
                    const timeInfo = parseTimestamp(data.createdAt);
                    list.push({ id: d.id, type: "deposit", ...data, timeObj: timeInfo.dateObj, formattedDate: timeInfo.formatted });
                }
            });

            const withSnap = await getDocs(collection(db, "withdrawals"));
            withSnap.forEach(d => {
                const data = d.data();
                if(String(data.uid).includes(currentUserId)){
                    const timeInfo = parseTimestamp(data.createdAt);
                    list.push({ id: d.id, type: "withdrawal", ...data, timeObj: timeInfo.dateObj, formattedDate: timeInfo.formatted });
                }
            });

            list.sort((a,b) => b.timeObj - a.timeObj);
            allTransactions = list;
            renderList(allTransactions);
        }

        function renderList(items) {
            const container = document.getElementById("transactions-list");
            if (!items.length) { container.innerHTML = "Koi record nahi mila."; return; }

            container.innerHTML = items.map(data => {
                const isDeposit = data.type === "deposit";
                const status = String(data.status || "pending").toLowerCase();
                return `
                    <div class="card">
                        <div class="card-top">
                            <div>
                                <div class="card-title">${isDeposit ? 'Deposit (UPI QR)' : 'Withdrawal (' + (data.mode || 'UPI') + ')'}</div>
                                <div class="card-subtitle">${data.utr ? 'UTR: '+data.utr : (data.upiId || data.accountNumber || '')}</div>
                                <div class="card-date"><i class="fa-regular fa-clock"></i> ${data.formattedDate}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="amount ${isDeposit ? 'credit' : 'debit'}">${isDeposit ? '+' : '-'} ₹${data.amount}</div>
                                <span class="badge badge-${status}">${status}</span>
                            </div>
                        </div>
                        <div class="admin-note ${status}">
                            <span>${data.comment || (status === 'approved' ? 'Payment Verified.' : 'Processing request...')}</span>
                        </div>
                    </div>`;
            }).join("");
        }

        document.getElementById("searchInput").addEventListener("input", e => {
            const q = e.target.value.toLowerCase().trim();
            renderList(allTransactions.filter(i => JSON.stringify(i).toLowerCase().includes(q)));
        });

        loadTransactions();
    </script>
</body>
</html>
