<script type="module">


/* =====================================================
FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",

authDomain:
"rdx-ludo.firebaseapp.com",

projectId:
"rdx-ludo",

storageBucket:
"rdx-ludo.firebasestorage.app",

messagingSenderId:
"928340814840",

appId:
"1:928340814840:web:6eca42a8b76138b268440d"

};


/* =====================================================
INIT
===================================================== */

const app =
initializeApp(
firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
COLLECTION
===================================================== */

const DEPOSITS_COLLECTION =
"deposits";


/* =====================================================
DATA
===================================================== */

let allHistory = [];

let currentUser = null;


/* =====================================================
ELEMENTS
===================================================== */

const historyContainer =
document.getElementById(
"historyContainer"
);

const dateSearch =
document.getElementById(
"dateSearch"
);

const searchBtn =
document.getElementById(
"searchBtn"
);

const clearBtn =
document.getElementById(
"clearBtn"
);

const message =
document.getElementById(
"message"
);

const debug =
document.getElementById(
"debug"
);


/* =====================================================
SAFE HTML
===================================================== */

function safe(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
MESSAGE
===================================================== */

function showMessage(
text,
type
){

message.textContent =
text;

message.className =
"message show " +
type;

}


/* =====================================================
HIDE MESSAGE
===================================================== */

function hideMessage(){

message.className =
"message";

message.textContent =
"";

}


/* =====================================================
UID FIELDS
===================================================== */

function getDepositUIDs(
deposit
){

const fields = [

deposit.userId,

deposit.uid,

deposit.customerId,

deposit.customerUID,

deposit.customerUid,

deposit.customerUIDNumber,

deposit.userUID,

deposit.userUid,

deposit.playerId,

deposit.playerUID,

deposit.playerUid,

deposit.memberId,

deposit.memberUID

];

return fields

.filter(
value =>
value !== undefined &&
value !== null &&
String(value).trim() !== ""
)

.map(
value =>
String(value).trim()
);

}


/* =====================================================
GET UTR
===================================================== */

function getUTR(
deposit
){

return String(

deposit.utr ??
deposit.utrNumber ??
deposit.utrNo ??
deposit.transactionId ??
deposit.transactionNumber ??
""

).trim();

}


/* =====================================================
GET ACCOUNT
===================================================== */

function getAccount(
deposit
){

return String(

deposit.account ??
deposit.accountName ??
deposit.accountHolder ??
deposit.accountHolderName ??
deposit.upiName ??
deposit.upiId ??
deposit.upi ??
""

).trim();

}


/* =====================================================
GET STATUS
===================================================== */

function getStatus(
deposit
){

return String(

deposit.status ??
deposit.depositStatus ??
"pending"

)
.trim()
.toLowerCase();

}


/* =====================================================
DATE CONVERTER
===================================================== */

function getDateValue(
value
){

if(!value){

return null;

}


/* FIREBASE TIMESTAMP */

if(
typeof value.toDate === "function"
){

return value.toDate();

}


/* FIREBASE TIMESTAMP SECONDS */

if(
typeof value.seconds === "number"
){

return new Date(
value.seconds * 1000
);

}


/* JAVASCRIPT DATE */

if(
value instanceof Date
){

return value;

}


/* NUMBER */

if(
typeof value === "number"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}


/* STRING */

if(
typeof value === "string"
){

const d =
new Date(value);

if(
!isNaN(d.getTime())
){

return d;

}

}

return null;

}


/* =====================================================
GET HISTORY DATE
===================================================== */

function getHistoryDate(
deposit
){

const status =
getStatus(deposit);


/* APPROVED */

if(
status === "approved"
){

return (

getDateValue(
deposit.approvedAt
)

||

getDateValue(
deposit.approvalTime
)

||

getDateValue(
deposit.approvedDate
)

||

getDateValue(
deposit.updatedAt
)

||

getDateValue(
deposit.createdAt
)

||

getDateValue(
deposit.date
)

);

}


/* REJECTED */

if(
status === "rejected" ||
status === "reject"
){

return (

getDateValue(
deposit.rejectedAt
)

||

getDateValue(
deposit.rejectionAt
)

||

getDateValue(
deposit.rejectAt
)

||

getDateValue(
deposit.updatedAt
)

||

getDateValue(
deposit.createdAt
)

||

getDateValue(
deposit.date
)

);

}


/* PENDING */

return (

getDateValue(
deposit.createdAt
)

||

getDateValue(
deposit.updatedAt
)

||

getDateValue(
deposit.date
)

);


/* =====================================================
FORMAT DATE
===================================================== */

}


function formatDate(
date
){

if(!date){

return "—";

}

return date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* =====================================================
FORMAT DATE TIME
===================================================== */

function formatDateTime(
date
){

if(!date){

return "—";

}

return (

date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
)

+

" "

+

date.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
)

);

}


/* =====================================================
DATE KEY
===================================================== */

function dateKey(
date
){

if(!date){

return "";

}

const year =
date.getFullYear();

const month =
String(
date.getMonth()+1
)
.padStart(2,"0");

const day =
String(
date.getDate()
)
.padStart(2,"0");

return (

year +
"-" +
month +
"-" +
day

);

}


/* =====================================================
REASON
===================================================== */

function getReason(
deposit
){

const reason =

deposit.rejectReason

??

deposit.rejectionReason

??

deposit.reject_reason

??

deposit.rejection_reason

??

deposit.reason

??

deposit.comment

??

deposit.adminReason

??

deposit.adminComment

??

"";


return String(
reason
).trim();

}


/* =====================================================
AMOUNT
===================================================== */

function getAmount(
deposit
){

const amount =

deposit.amount

??

deposit.depositAmount

??

deposit.requestedAmount

??

deposit.value

??

0;


const number =
Number(amount);


if(
isNaN(number)
){

return 0;

}

return number;

}


/* =====================================================
STATUS HTML
===================================================== */

function getStatusHTML(
status
){

if(
status === "approved"
){

return `

<span class="status approved">

🟢 APPROVED

</span>

`;

}


if(
status === "rejected" ||
status === "reject"
){

return `

<span class="status rejected">

🔴 REJECT

</span>

`;

}


return `

<span class="status pending">

🟡 PENDING

</span>

`;

}


/* =====================================================
RENDER HISTORY
===================================================== */

function renderHistory(
list
){

if(!list.length){

historyContainer.innerHTML = `

<div class="empty">

कोई Deposit History नहीं मिली।

</div>

`;

return;

}


/* SORT NEWEST FIRST */

const sorted = [...list].sort(
(a,b) => {

const da =
getHistoryDate(a);

const db =
getHistoryDate(b);

return (

(db?.getTime() || 0)

-

(da?.getTime() || 0)

);

}
);


/* GROUP BY DATE */

const groups = {};


sorted.forEach(
deposit => {

const date =
getHistoryDate(
deposit
);

const key =
dateKey(date);


if(!key){

return;

}


if(!groups[key]){

groups[key] = [];

}


groups[key].push(
deposit
);

});


/* SORT DATE GROUPS */

const dates =
Object.keys(groups)
.sort()
.reverse();


let html = "";


/* =====================================================
DATE GROUP
===================================================== */

dates.forEach(
key => {

const date =
groups[key].length

?

getHistoryDate(
groups[key][0]
)

:

null;


html += `

<div class="date-section">

<div class="date-heading">

📅 ${safe(
formatDate(date)
)}

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>UTR No.</th>

<th>Amount</th>

<th>Status</th>

<th>Account</th>

<th>Date & Time</th>

<th>Reason</th>

</tr>

</thead>

<tbody>

`;


/* ROWS */

groups[key].forEach(
deposit => {

const status =
getStatus(
deposit
);


const amount =
getAmount(
deposit
);


const utr =
getUTR(
deposit
);


const account =
getAccount(
deposit
);


const finalDate =
getHistoryDate(
deposit
);


const reason =
getReason(
deposit
);


let reasonHTML =
"—";


if(
(
status === "rejected" ||
status === "reject"
)
&&
reason
){

reasonHTML =
safe(reason);

}


html += `

<tr>

<td class="utr">

${safe(
utr || "—"
)}

</td>

<td class="amount">

₹${amount.toLocaleString(
"en-IN"
)}

</td>

<td>

${getStatusHTML(
status
)}

</td>

<td class="account">

${safe(
account || "—"
)}

</td>

<td>

${safe(
formatDateTime(
finalDate
)
)}

</td>

<td class="reason">

${reasonHTML}

</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

</div>

`;

});


historyContainer.innerHTML =
html;

}


/* =====================================================
CHECK UID MATCH
===================================================== */

function depositBelongsToUser(
deposit,
userIds
){

const depositUIDs =
getDepositUIDs(
deposit
);


/*
   सभी UID को string में
   compare किया जा रहा है।
*/

return depositUIDs.some(
depositUID =>
userIds.includes(
depositUID
)
);

}


/* =====================================================
GET POSSIBLE USER IDS
===================================================== */

async function getPossibleUserIds(
user
){

const ids = new Set();


/* Firebase Auth UID */

if(user?.uid){

ids.add(
String(user.uid).trim()
);

}


/* PHONE */

if(user?.phoneNumber){

ids.add(
String(user.phoneNumber).trim()
);

}


/* DISPLAY NAME */

if(user?.displayName){

ids.add(
String(user.displayName).trim()
);

}


/* LOCAL STORAGE */

const possibleKeys = [

"uid",
"userId",
"userUID",
"userUid",
"customerId",
"customerUID",
"customerUid",
"playerId",
"playerUID",
"playerUid",
"gameUid",
"gameUID",
"rdx_uid",
"rdxUid",
"userData",
"user",
"profile"

];


possibleKeys.forEach(
key => {

try{

const value =
localStorage.getItem(
key
);

if(!value){

return;

}


/*
   अगर JSON है
*/

try{

const parsed =
JSON.parse(value);


if(
parsed &&
typeof parsed === "object"
){

const possibleValues = [

parsed.uid,
parsed.userId,
parsed.userUID,
parsed.userUid,
parsed.customerId,
parsed.customerUID,
parsed.customerUid,
parsed.playerId,
parsed.playerUID,
parsed.playerUid,
parsed.gameUid,
parsed.gameUID

];


possibleValues.forEach(
v => {

if(
v !== undefined &&
v !== null &&
String(v).trim()
){

ids.add(
String(v).trim()
);

}

});

}

}
catch{

/*
   साधारण string
*/

if(
value.trim()
){

ids.add(
value.trim()
);

}

}

}
catch{

}

});

return [
...ids
];

}


/* =====================================================
LOAD HISTORY
===================================================== */

async function loadHistory(){

if(!currentUser){

historyContainer.innerHTML = `

<div class="empty">

कृपया पहले लॉगिन करें।

</div>

`;

return;

}


historyContainer.innerHTML = `

<div class="loading">

History Loading...

</div>

`;

hideMessage();


try{


/* =====================================================
USER IDS
===================================================== */

const userIds =
await getPossibleUserIds(
currentUser
);


/*
   अगर Auth UID मौजूद है
   तो उससे query करने की कोशिश।
*/

let result = [];


/* =====================================================
QUERY BY userId
===================================================== */

try{

const depositsRef =
collection(
db,
DEPOSITS_COLLECTION
);


const q =
query(
depositsRef,
where(
"userId",
"==",
currentUser.uid
)
);


const snap =
await getDocs(q);


snap.forEach(
docSnap => {

result.push({

id:
docSnap.id,

...docSnap.data()

});

});

}
catch(error){

console.warn(
"userId query failed:",
error
);

}


/* =====================================================
अगर userId query से नहीं मिला
तो पूरी deposits collection पढ़कर
सभी सम्भावित UID fields match करेंगे।
===================================================== */

if(
result.length === 0
){

const depositsRef =
collection(
db,
DEPOSITS_COLLECTION
);


const snap =
await getDocs(
depositsRef
);


snap.forEach(
docSnap => {

const data =
docSnap.data();


if(
depositBelongsToUser(
data,
userIds
)
){

result.push({

id:
docSnap.id,

...data

});

}

});

}


/* =====================================================
REMOVE DUPLICATES
===================================================== */

const unique = new Map();


result.forEach(
deposit => {

unique.set(
deposit.id,
deposit
);

});


allHistory =
[
...unique.values()
];


/* =====================================================
DEBUG
===================================================== */

if(
allHistory.length === 0
){

debug.style.display =
"block";

debug.innerHTML = `

<strong>History नहीं मिली।</strong><br><br>

Firebase Auth UID:
${safe(currentUser.uid)}

<br><br>

जिन UID को खोजा गया:
${safe(
userIds.join(", ")
)}

<br><br>

इसका मतलब आपके Admin Deposit document में Customer UID
किसी और field में save हो सकता है।

`;

}
else{

debug.style.display =
"none";

}


/* =====================================================
RENDER
===================================================== */

renderHistory(
allHistory
);


}
catch(error){

console.error(
"History Error:",
error
);


historyContainer.innerHTML = `

<div class="empty">

History लोड नहीं हो सकी।

<br><br>

${safe(
error.message
)}

</div>

`;

}

}


/* =====================================================
SEARCH BY DATE
===================================================== */

function searchByDate(){

const selectedDate =
dateSearch.value;


if(!selectedDate){

renderHistory(
allHistory
);

hideMessage();

return;

}


const filtered =
allHistory.filter(
deposit => {

const date =
getHistoryDate(
deposit
);

return (
dateKey(date)
===
selectedDate
);

});


if(
filtered.length > 0
){

const displayDate =
selectedDate
.split("-")
.reverse()
.join("-");


showMessage(
displayDate +
" की History मिल गई।",
"ok"
);

}
else{

const displayDate =
selectedDate
.split("-")
.reverse()
.join("-");


showMessage(
displayDate +
" की कोई History नहीं मिली।",
"error"
);

}


renderHistory(
filtered
);

}


/* =====================================================
SEARCH BUTTON
===================================================== */

searchBtn.addEventListener(
"click",
searchByDate
);


/* =====================================================
DATE CHANGE
===================================================== */

dateSearch.addEventListener(
"change",
searchByDate
);


/* =====================================================
RECENT BUTTON
===================================================== */

clearBtn.addEventListener(
"click",
() => {

dateSearch.value = "";

hideMessage();

debug.style.display =
"none";

renderHistory(
allHistory
);

}
);


/* =====================================================
BACK BUTTON
===================================================== */

document
.getElementById("backBtn")
.addEventListener(
"click",
() => {

window.history.back();

}
);


/* =====================================================
AUTH
===================================================== */

onAuthStateChanged(
auth,
async user => {

if(user){

currentUser =
user;

await loadHistory();

}
else{

currentUser =
null;

historyContainer.innerHTML = `

<div class="empty">

कृपया अपने खाते में लॉगिन करके
History देखें।

</div>

`;

}

});


</script>
