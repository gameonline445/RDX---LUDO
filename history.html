<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - History & Logs</title>

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<!-- External Components File -->
<script src="components.js"></script>

<script>
// Authentication Security Check
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    padding-top: 70px;  /* Top Header ke liye space */
    padding-bottom: 85px; /* Bottom Nav ke liye space */
}
button,input{font:inherit;}

.container{width:100%;max-width:650px;margin:auto;padding:16px 14px;}

.page-title{
    font-size:20px;
    font-weight:900;
    color:#0c4a6e;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
}

/* SEARCH BAR */
.search-box-wrap{
    position:relative;
    margin-bottom:12px;
}
.search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#0284c7;
    font-size:14px;
}
.search-input{
    width:100%;
    height:46px;
    border-radius:14px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    padding:0 14px 0 38px;
    font-size:13px;
    font-weight:700;
    color:#0f172a;
    outline:none;
    box-shadow:0 4px 14px rgba(2,132,199,0.04);
}
.search-input:focus{
    border-color:#0284c7;
}

/* FILTER TABS */
.filter-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:16px;
}
.filter-scroll::-webkit-scrollbar{display:none;}
.tab-btn{
    padding:8px 16px;
    border-radius:18px;
    border:1.5px solid #bae6fd;
    background:#ffffff;
    color:#64748b;
    font-weight:850;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.2s ease;
}
.tab-btn.active{
    background:#0284c7;
    color:#ffffff;
    border-color:#0284c7;
    box-shadow:0 4px 12px rgba(2,132,199,0.25);
}

/* HISTORY CARDS */
.history-card{
    background:#ffffff;
    border:1.5px solid #bae6fd;
    border-radius:18px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 4px 12px rgba(2,132,199,0.04);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.history-left{display:flex;align-items:center;gap:12px;}
.history-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}
.icon-win{background:#dcfce7;color:#15803d;}
.icon-lost{background:#fee2e2;color:#be123c;}
.icon-cancel{background:#f1f5f9;color:#64748b;}
.icon-dep{background:#e0f2fe;color:#0284c7;}
.icon-with{background:#fef3c7;color:#b45309;}

.history-details h4{
    font-size:14px;
    font-weight:850;
    color:#0c4a6e;
}
.history-details p{
    font-size:11px;
    color:#64748b;
    font-weight:600;
    margin-top:2px;
}
.history-details .utr-tag{
    display:inline-block;
    font-size:11px;
    color:#0369a1;
    font-weight:750;
    margin-top:2px;
}
.history-details .reason-tag{
    display:block;
    font-size:10px;
    color:#be123c;
    font-weight:750;
    margin-top:2px;
}

.history-right{text-align:right;}
.amount-win{font-size:16px;font-weight:900;color:#15803d;}
.amount-loss{font-size:16px;font-weight:900;color:#be123c;}
.amount-cancel{font-size:16px;font-weight:900;color:#64748b;}

/* BADGES */
.badge-status{
    display:inline-block;
    padding:3px 8px;
    border-radius:8px;
    font-size:10px;
    font-weight:850;
    text-transform:uppercase;
    margin-top:4px;
}
.status-approved, .status-success, .status-won{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.status-rejected, .status-lost{background:#fee2e2;color:#be123c;border:1px solid #fca5a5;}
.status-pending{background:#fef3c7;color:#b45309;border:1px solid #fde68a;}
.status-cancelled{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;}

.empty-state{
    text-align:center;
    padding:40px 14px;
    color:#64748b;
}
.empty-state i{font-size:36px;color:#bae6fd;margin-bottom:10px;}
</style>
</head>

<body>

<!-- 1. TOP HEADER CONTAINER (Zaroori hai!) -->
<div id="header-container"></div>

<!-- SIDE DRAWER CONTAINER (Zaroori hai!) -->
<div id="drawer-container"></div>

<main class="container">

    <div class="page-title">
        <i class="fa-solid fa-clock-rotate-left" style="color:#0284c7;"></i> History & Activity Logs
    </div>

    <!-- SEARCH BAR -->
    <div class="search-box-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="historySearchInput" class="search-input" placeholder="Search by Date, UTR, Amount, Status, Opponent...">
    </div>

    <!-- TABS -->
    <div class="filter-scroll">
        <button class="tab-btn active" onclick="setFilter('all', this)">All Activity</button>
        <button class="tab-btn" onclick="setFilter('battles', this)">⚔️ Battles History</button>
        <button class="tab-btn" onclick="setFilter('deposits', this)">💰 Deposits</button>
        <button class="tab-btn" onclick="setFilter('withdrawals', this)">💳 Withdrawals</button>
    </div>

    <!-- LOGS LIST -->
    <div id="logsContainer">
        <p style="text-align:center; color:#64748b; font-size:13px; padding:30px;">Loading history records...</p>
    </div>

</main>

<!-- 2. BOTTOM NAVIGATION CONTAINER (Zaroori hai!) -->
<div id="nav-container"></div>

<script>
history.pushState({ page: 1 }, "", "");
window.addEventListener("popstate", function (event) {
    window.location.href = "dashboard.html";
});

const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}
const userId = getCleanUserId();
let allLogs = [];
let activeTab = "all";

let battlesData = [];
let depositsData = [];
let withdrawalsData = [];

function parseItemTime(ts) {
    if (!ts) return { dateObj: new Date(0), formatted: "—" };
    let d;
    if (typeof ts.toDate === "function") { d = ts.toDate(); }
    else if (ts.seconds) { d = new Date(ts.seconds * 1000); }
    else { d = new Date(ts); }

    const formatted = isNaN(d.getTime()) ? "—" : d.toLocaleString("en-IN", {
        day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true
    });
    return { dateObj: d, formatted: formatted };
}

// REAL-TIME LISTENER FOR ALL LOGS
function startRealtimeLogsListener() {
    if (!userId) return;
    const docId = userId.length === 10 ? "91" + userId : userId;

    // 1. Battles Real-Time Listener
    firebaseDB.collection("battles").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const b = doc.data();
            if (b.creatorUid === docId || b.acceptedUid === docId) {
                const timeInfo = parseItemTime(b.resolvedAt || b.startedAt || b.createdAt);
                const isCreator = b.creatorUid === docId;
                const oppName = isCreator ? (b.acceptedName || "Opponent") : (b.creatorName || "Creator");

                let battleStatus = "Live";
                let isWon = false;
                let isCancelled = false;

                if (b.status === "completed") {
                    if (b.winnerUid === docId) {
                        battleStatus = "Won";
                        isWon = true;
                    } else {
                        battleStatus = "Lost";
                    }
                } else if (b.status === "cancelled") {
                    battleStatus = "Cancelled";
                    isCancelled = true;
                }

                list.push({
                    type: "battle",
                    id: doc.id,
                    title: `Battle vs ${oppName}`,
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: b.amount,
                    prize: b.prize,
                    status: battleStatus,
                    isWon: isWon,
                    isCancelled: isCancelled,
                    searchKey: `battle vs ${oppName} ${timeInfo.formatted} ${b.amount} ${b.prize} ${battleStatus} ${doc.id}`
                });
            }
        });
        battlesData = list;
        mergeAndRenderLogs();
    });

    // 2. Deposits Real-Time Listener
    firebaseDB.collection("deposits").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const d = doc.data();
            const cleanUid = String(d.uid || d.userId).replace(/\D/g, "");
            if (cleanUid === userId) {
                const timeInfo = parseItemTime(d.createdAt || d.date);
                const rawStatus = String(d.status || "pending").toLowerCase();
                const utrVal = d.utr ? String(d.utr).trim() : "";

                list.push({
                    type: "deposit",
                    id: doc.id,
                    title: "Deposit Amount",
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: d.amount,
                    status: rawStatus,
                    utr: utrVal,
                    comment: d.comment || "",
                    searchKey: `deposit amount ${timeInfo.formatted} ${d.amount} ${utrVal} ${rawStatus} ${d.comment || ''} ${doc.id}`
                });
            }
        });
        depositsData = list;
        mergeAndRenderLogs();
    });

    // 3. Withdrawals Real-Time Listener
    firebaseDB.collection("withdrawals").onSnapshot(snap => {
        let list = [];
        snap.forEach(doc => {
            const w = doc.data();
            const cleanUid = String(w.uid || w.mobile).replace(/\D/g, "");
            if (cleanUid === userId) {
                const timeInfo = parseItemTime(w.createdAt || w.date);
                const rawStatus = String(w.status || "pending").toLowerCase();
                const modeVal = w.mode === "BANK" ? `Bank: ${w.accountNumber || ''}` : `UPI: ${w.upiId || ''}`;

                list.push({
                    type: "withdrawal",
                    id: doc.id,
                    title: "Withdrawal Cash",
                    dateStr: timeInfo.formatted,
                    timeObj: timeInfo.dateObj,
                    amount: w.amount,
                    status: rawStatus,
                    modeInfo: modeVal,
                    comment: w.comment || "",
                    searchKey: `withdrawal cash ${timeInfo.formatted} ${w.amount} ${modeVal} ${rawStatus} ${w.comment || ''} ${doc.id}`
                });
            }
        });
        withdrawalsData = list;
        mergeAndRenderLogs();
    });
}

function mergeAndRenderLogs() {
    allLogs = [...battlesData, ...depositsData, ...withdrawalsData];
    allLogs.sort((a, b) => b.timeObj - a.timeObj);
    renderLogs();
}

function renderLogs() {
    const container = document.getElementById("logsContainer");
    const searchVal = document.getElementById("historySearchInput").value.toLowerCase().trim();

    let filtered = allLogs;

    if (activeTab === "battles") filtered = allLogs.filter(x => x.type === "battle");
    else if (activeTab === "deposits") filtered = allLogs.filter(x => x.type === "deposit");
    else if (activeTab === "withdrawals") filtered = allLogs.filter(x => x.type === "withdrawal");

    if (searchVal !== "") {
        filtered = filtered.filter(item => (item.searchKey || "").toLowerCase().includes(searchVal));
    }

    if (!filtered.length) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <h4 style="color:#0c4a6e; font-size:15px; font-weight:850;">No Records Found</h4>
                <p style="font-size:12px; margin-top:4px;">Aapki search ya selected tab ke hisab se koi data nahi mila.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(item => {
        if (item.type === "battle") {
            let iconBox = `<div class="history-icon icon-lost"><i class="fa-solid fa-gamepad"></i></div>`;
            let amtClass = "amount-loss";
            let amtSign = `- ₹${item.amount}`;
            let statusBadge = `<span class="badge-status status-lost">Lost</span>`;

            if (item.isWon) {
                iconBox = `<div class="history-icon icon-win"><i class="fa-solid fa-trophy"></i></div>`;
                amtClass = "amount-win";
                amtSign = `+ ₹${item.prize}`;
                statusBadge = `<span class="badge-status status-won">Won</span>`;
            } else if (item.isCancelled) {
                iconBox = `<div class="history-icon icon-cancel"><i class="fa-solid fa-ban"></i></div>`;
                amtClass = "amount-cancel";
                amtSign = `Refund ₹${item.amount}`;
                statusBadge = `<span class="badge-status status-cancelled">Cancelled</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        ${iconBox}
                        <div class="history-details">
                            <h4>${item.title}</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="${amtClass}">${amtSign}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        } else if (item.type === "deposit") {
            const s = item.status;
            let statusBadge = `<span class="badge-status status-pending">Pending</span>`;
            if (s === "approved" || s === "success") {
                statusBadge = `<span class="badge-status status-approved">Success</span>`;
            } else if (s === "rejected" || s === "failed") {
                statusBadge = `<span class="badge-status status-rejected">Rejected</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        <div class="history-icon icon-dep"><i class="fa-solid fa-money-bill-wave"></i></div>
                        <div class="history-details">
                            <h4>Deposit Amount</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                            ${item.utr ? `<span class="utr-tag"><i class="fa-solid fa-receipt"></i> UTR: ${item.utr}</span>` : ''}
                            ${item.comment && s === 'rejected' ? `<small class="reason-tag">Reason: ${item.comment}</small>` : ''}
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="amount-win">+ ₹${item.amount}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        } else if (item.type === "withdrawal") {
            const s = item.status;
            let statusBadge = `<span class="badge-status status-pending">Pending</span>`;
            if (s === "approved" || s === "success") {
                statusBadge = `<span class="badge-status status-approved">Success</span>`;
            } else if (s === "rejected" || s === "failed") {
                statusBadge = `<span class="badge-status status-rejected">Rejected</span>`;
            }

            return `
                <div class="history-card">
                    <div class="history-left">
                        <div class="history-icon icon-with"><i class="fa-solid fa-money-bill-transfer"></i></div>
                        <div class="history-details">
                            <h4>Withdrawal Cash</h4>
                            <p><i class="fa-regular fa-clock"></i> ${item.dateStr}</p>
                            ${item.modeInfo ? `<span class="utr-tag" style="color:#64748b;">${item.modeInfo}</span>` : ''}
                            ${item.comment && s === 'rejected' ? `<small class="reason-tag">Reason: ${item.comment}</small>` : ''}
                        </div>
                    </div>
                    <div class="history-right">
                        <div class="amount-loss">- ₹${item.amount}</div>
                        ${statusBadge}
                    </div>
                </div>
            `;
        }
    }).join("");
}

document.getElementById("historySearchInput").addEventListener("input", renderLogs);

function setFilter(type, btnEl) {
    activeTab = type;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    renderLogs();
}

window.addEventListener("load", () => {
    startRealtimeLogsListener();
});
</script>

</body>
</html>
