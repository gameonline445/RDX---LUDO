<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - History & Logs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8faff 0%, #eef4ff 50%, #f1f5f9 100%);
            color: #101a38;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ccd8ed;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #cbd7e9;
            color: #2864e6;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .brand-badge {
            background: #ffffff;
            border: 1px solid #dce6fb;
            color: #2362d9;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(35, 98, 217, 0.08);
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .topicon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: #ffffff;
        }

        .icon-bell { background: #7368ef; }
        .icon-cash { background: #35bf71; }
        .icon-gift { background: #ff933c; }

        .page-heading {
            padding: 16px 18px 8px;
        }

        .page-heading h1 {
            font-size: 22px;
            font-weight: 800;
            color: #101a38;
        }

        .page-heading p {
            font-size: 13px;
            color: #7a879f;
            margin-top: 2px;
        }

        .tab-container {
            display: flex;
            padding: 10px 18px 14px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #cbd7e9;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            background: #eef1f6;
            color: #748097;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(100deg, #2864e6, #3e7bf0);
            color: #ffffff;
            border-color: #2864e6;
            box-shadow: 0 4px 14px rgba(40, 100, 230, 0.3);
        }

        .content-section {
            padding: 0 18px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1.5px solid #bdd0f0;
            box-shadow: 0 6px 18px rgba(66, 117, 211, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: #101a38;
        }

        .card-subtitle {
            font-size: 12px;
            color: #6b7891;
            font-weight: 600;
            word-break: break-all;
        }

        .card-date {
            font-size: 11px;
            color: #9aa6bc;
            margin-top: 2px;
        }

        .card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .amount {
            font-size: 18px;
            font-weight: 900;
        }

        .credit { color: #13834d; }
        .debit { color: #c72e43; }

        .badge {
            font-size: 10px;
            padding: 4px 9px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-approved { background: #dcf8e9; color: #13834d; border: 1px solid #b8e9cf; }
        .badge-rejected { background: #ffe3e7; color: #c72e43; border: 1px solid #f4bbc5; }
        .badge-pending { background: #fff4d6; color: #a37200; border: 1px solid #fae19c; }

        .admin-note {
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
        }

        .admin-note.approved {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .admin-note.rejected {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .admin-note.pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .admin-note i {
            font-size: 14px;
            margin-top: 2px;
        }

        .status-box {
            text-align: center;
            padding: 40px 20px;
            color: #7a879f;
            font-size: 14px;
            font-weight: 600;
        }

        .bottom {
            height: 64px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #ffffff;
            border-top: 1px solid #d5deed;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .nav {
            border: 0;
            background: #ffffff;
            color: #6d7890;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav b { font-size: 21px; }
        .nav.active { color: #18213a; font-weight: 900; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="brand-badge">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell">🔔</div>
            <div class="topicon icon-cash">💵</div>
            <div class="topicon icon-gift">🎁</div>
        </div>
    </header>

    <div class="page-heading">
        <h1>History & Logs</h1>
        <p>Battles, results and wallet transactions</p>
    </div>

    <div class="tab-container">
        <button class="tab-btn" id="btnMatches" onclick="switchTab('matches')">
            <i class="fa-solid fa-gamepad" style="margin-right: 4px;"></i> Matches
        </button>
        <button class="tab-btn active" id="btnTransactions" onclick="switchTab('transactions')">
            <i class="fa-solid fa-wallet" style="margin-right: 4px;"></i> Transactions
        </button>
    </div>

    <section id="matches-tab" class="content-section" style="display: none;">
        <div class="status-box">
            <i class="fa-solid fa-gamepad fa-2x" style="margin-bottom: 10px; color: #cbd7e9;"></i><br>
            Abhi koi match history nahi hai.
        </div>
    </section>

    <section id="transactions-tab" class="content-section">
        <div id="transactions-list" class="status-box">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #2864e6; margin-bottom: 10px;"></i><br>
            Transactions load ho rahe hain...
        </div>
    </section>

    <nav class="bottom">
        <a class="nav" href="dashboard.html">
            <b>🏠</b>
            Home
        </a>
        <a class="nav" href="wallet.html">
            <b>💰</b>
            Wallet
        </a>
        <a class="nav" href="support.html">
            <b>🎧</b>
            Support
        </a>
        <a class="nav active" href="profile.html">
            <b>👤</b>
            Profile
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getLoggedInUserId() {
            const raw = localStorage.getItem("rdxFirebaseUserId") || 
                        localStorage.getItem("rdxVerifiedMobile") || 
                        localStorage.getItem("rdxUserId") || 
                        localStorage.getItem("userId") || 
                        localStorage.getItem("rdx_userId") || "";
            return String(raw).replace(/\D/g, "");
        }

        const currentUserId = getLoggedInUserId();

        async function loadRealTransactions() {
            const listContainer = document.getElementById("transactions-list");

            if (!currentUserId) {
                listContainer.innerHTML = `
                    <div class="status-box">
                        <i class="fa-solid fa-arrow-right-to-bracket fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                        History dekhne ke liye pehle <a href="login.html" style="color:#2864e6; font-weight:800;">Login</a> karein.
                    </div>`;
                return;
            }

            try {
                const snap = await getDocs(collection(db, "deposits"));
                let userDeposits = [];

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const docUid = String(data.userId || data.uid || data.customerId || "").replace(/\D/g, "");

                    if (docUid === currentUserId || (data.mobile && data.mobile.includes(currentUserId))) {
                        userDeposits.push({ id: docSnap.id, ...data });
                    }
                });

                if (userDeposits.length === 0) {
                    listContainer.innerHTML = `
                        <div class="status-box">
                            <i class="fa-solid fa-receipt fa-2x" style="color: #cbd7e9; margin-bottom: 8px;"></i><br>
                            Aapne abhi tak koi deposit request submit nahi ki hai.
                        </div>`;
                    return;
                }

                // Date sort (Latest sabse upar)
                userDeposits.sort((a, b) => {
                    const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
                    const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
                    return timeB - timeA;
                });

                let html = "";
                userDeposits.forEach((data) => {
                    const status = String(data.status || "pending").toLowerCase();
                    const amount = Number(data.amount || 0);
                    const utr = data.utr || "—";
                    
                    let dateString = "Recently";
                    if (data.createdAt && typeof data.createdAt.toDate === "function") {
                        dateString = data.createdAt.toDate().toLocaleString('en-IN', {
                            dateStyle: 'medium',
                            timeStyle: 'short'
                        });
                    }

                    let badgeClass = "badge-pending";
                    let noteClass = "pending";
                    let icon = "fa-clock";
                    let noteText = "Admin verification chal raha hai. Thodi der me update hoga.";

                    if (status === "approved") {
                        badgeClass = "badge-approved";
                        noteClass = "approved";
                        icon = "fa-circle-check";
                        noteText = data.comment && data.comment.trim() !== "" 
                            ? data.comment 
                            : "Payment verify ho gaya hai. Balance wallet me add kar diya gaya hai.";
                    } else if (status === "rejected") {
                        badgeClass = "badge-rejected";
                        noteClass = "rejected";
                        icon = "fa-triangle-exclamation";
                        noteText = "<strong>Admin Reason:</strong> " + (data.comment && data.comment.trim() !== "" ? data.comment : "Payment receive nahi hui ya UTR galat tha.");
                    }

                    html += `
                        <div class="card">
                            <div class="card-top">
                                <div class="card-left">
                                    <span class="card-title">Deposit (UPI QR)</span>
                                    <span class="card-subtitle">UTR: ${utr}</span>
                                    <span class="card-date">${dateString}</span>
                                </div>
                                <div class="card-right">
                                    <span class="amount ${status === 'approved' ? 'credit' : 'debit'}">₹${amount}</span>
                                    <span class="badge ${badgeClass}">${status}</span>
                                </div>
                            </div>
                            <div class="admin-note ${noteClass}">
                                <i class="fa-solid ${icon}"></i>
                                <span>${noteText}</span>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

            } catch (error) {
                console.error("History loading error:", error);
                listContainer.innerHTML = `
                    <div class="status-box" style="color: #c72e43;">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>
                        History load karne me dikkat aayi: ${error.message}
                    </div>`;
            }
        }

        window.switchTab = function(tab) {
            const matchesTab = document.getElementById("matches-tab");
            const transTab = document.getElementById("transactions-tab");
            const btnMatches = document.getElementById("btnMatches");
            const btnTransactions = document.getElementById("btnTransactions");

            if (tab === "matches") {
                matchesTab.style.display = "block";
                transTab.style.display = "none";
                btnMatches.classList.add("active");
                btnTransactions.classList.remove("active");
            } else {
                matchesTab.style.display = "none";
                transTab.style.display = "block";
                btnTransactions.classList.add("active");
                btnMatches.classList.remove("active");
            }
        };

        loadRealTransactions();
    </script>
</body>
</html>
