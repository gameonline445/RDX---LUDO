<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Withdraw Winnings</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8faff 0%, #eef4ff 50%, #f1f5f9 100%);
            color: #101a38;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ccd8ed;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #cbd7e9;
            color: #2864e6;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            cursor: pointer;
        }

        .brand-badge {
            background: #ffffff;
            border: 1px solid #dce6fb;
            color: #2362d9;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(35, 98, 217, 0.08);
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .topicon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: #ffffff;
        }

        .icon-bell { background: #7368ef; }
        .icon-cash { background: #35bf71; }
        .icon-gift { background: #ff933c; }

        .container {
            width: 100%;
            max-width: 560px;
            margin: auto;
            padding: 16px 18px;
        }

        .balance-card {
            border: 1.5px solid #bdd0f0;
            border-radius: 22px;
            padding: 18px;
            background: radial-gradient(circle at 100% 0%, #dce8ff, transparent 40%), linear-gradient(135deg, #eef4ff, #fff);
            box-shadow: 0 10px 25px rgba(66, 117, 211, 0.1);
            margin-bottom: 16px;
        }

        .balance-label {
            font-size: 12px;
            font-weight: 800;
            color: #6b7891;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 900;
            color: #101a38;
            margin-top: 4px;
        }

        .balance-note {
            font-size: 12px;
            color: #2563eb;
            margin-top: 6px;
            font-weight: 600;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            height: 46px;
            border: 1px solid #cbd7e9;
            border-radius: 15px;
            background: #eef1f6;
            color: #748097;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: linear-gradient(100deg, #2864e6, #3e7bf0);
            color: #fff;
            border-color: #2864e6;
            box-shadow: 0 4px 14px rgba(40, 100, 230, 0.28);
        }

        .form-card {
            border: 1.5px solid #c3d2ec;
            border-radius: 20px;
            padding: 18px;
            background: linear-gradient(135deg, #f4f7ff, #fff);
            box-shadow: 0 8px 22px rgba(30, 60, 120, 0.05);
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #6b7891;
            margin-bottom: 6px;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        label:first-child {
            margin-top: 0;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d2dceb;
            border-radius: 14px;
            background: #f8f9fc;
            padding: 0 14px;
            font-size: 15px;
            font-weight: 600;
            color: #101a38;
            outline: none;
        }

        input:focus {
            border-color: #2864e6;
            background: #fff;
        }

        .withdraw-btn {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 25px;
            background: linear-gradient(100deg, #2864e6, #3e7bf0);
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            margin-top: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(39, 112, 238, 0.25);
        }

        .withdraw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info-box {
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 14px;
            font-size: 12px;
            color: #475569;
            line-height: 1.5;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .info-box i {
            color: #2563eb;
            font-size: 16px;
            margin-top: 2px;
        }

        .toast {
            position: fixed;
            left: 50%;
            top: 85px;
            transform: translateX(-50%) translateY(-15px);
            background: #182440;
            color: #fff;
            padding: 12px 17px;
            border-radius: 14px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 700;
            font-size: 14px;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .bottom {
            height: 64px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #ffffff;
            border-top: 1px solid #d5deed;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .nav {
            border: 0;
            background: #ffffff;
            color: #6d7890;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav b { font-size: 21px; }
        .nav.active { color: #18213a; font-weight: 900; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="top-bar">
        <div class="header-left">
            <button class="back-btn" onclick="location.href='wallet.html'"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="brand-badge">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell" onclick="location.href='notification.html'" style="cursor: pointer;">🔔</div>
            <div class="topicon icon-cash" onclick="location.href='wallet.html'" style="cursor: pointer;">💵</div>
            <div class="topicon icon-gift" onclick="location.href='referral.html'" style="cursor: pointer;">🎁</div>
        </div>
    </header>

    <main class="container">
        <!-- Balance Info -->
        <div class="balance-card">
            <div class="balance-label">Withdrawable Winnings</div>
            <div class="balance-amount">₹<span id="winningBalance">0</span></div>
            <div class="balance-note">Min: ₹300 | Max: ₹1,00,000</div>
        </div>

        <!-- Mode Selector -->
        <div class="tabs">
            <button class="tab active" id="tabUpi" onclick="switchMode('upi')">
                <i class="fa-solid fa-mobile-screen-button"></i> UPI Transfer
            </button>
            <button class="tab" id="tabBank" onclick="switchMode('bank')">
                <i class="fa-solid fa-building-columns"></i> Bank Transfer
            </button>
        </div>

        <!-- Form Section -->
        <div class="form-card">
            <label for="withdrawAmount">ENTER WITHDRAWAL AMOUNT (₹)</label>
            <input type="number" id="withdrawAmount" placeholder="Min ₹300" min="300" max="100000">

            <!-- UPI Fields -->
            <div id="upiSection">
                <label for="upiHolderName">VERIFIED ACCOUNT HOLDER NAME</label>
                <input type="text" id="upiHolderName" placeholder="Account Holder Name">

                <label for="upiId">UPI ID (VPA)</label>
                <input type="text" id="upiId" placeholder="e.g. mobile@okhdfcbank">
            </div>

            <!-- Bank Fields -->
            <div id="bankSection" style="display: none;">
                <label for="bankHolderName">ACCOUNT HOLDER NAME</label>
                <input type="text" id="bankHolderName" placeholder="As per bank passbook">

                <label for="bankName">BANK NAME</label>
                <input type="text" id="bankName" placeholder="e.g. State Bank of India">

                <label for="accountNumber">ACCOUNT NUMBER</label>
                <input type="text" id="accountNumber" placeholder="Enter bank account number">

                <label for="ifscCode">IFSC CODE</label>
                <input type="text" id="ifscCode" placeholder="e.g. SBIN0001234" style="text-transform: uppercase;">
            </div>

            <button class="withdraw-btn" id="btnWithdraw" onclick="submitWithdrawal()">
                Withdraw Money
            </button>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Withdrawal request verify hone ke baad payment transfer kar di jayegi. Status check karne ke liye History page dekhein.</span>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom">
        <a class="nav" href="dashboard.html"><b>🏠</b>Home</a>
        <a class="nav active" href="wallet.html"><b>💰</b>Wallet</a>
        <a class="nav" href="support.html"><b>🎧</b>Support</a>
        <a class="nav" href="profile.html"><b>👤</b>Profile</a>
    </nav>

    <div class="toast" id="toast"></div>

    <!-- Firebase v12 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = "upi";
        let userWinnings = 0;

        function getLoggedInUserId() {
            const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || localStorage.getItem("rdxUserId") || "";
            return String(raw).replace(/\D/g, "");
        }

        const userId = getLoggedInUserId();

        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2500);
        }

        async function loadUserData() {
            if (!userId) {
                toast("Pehle login karein");
                setTimeout(() => location.href = "login.html", 1000);
                return;
            }

            // Load saved inputs
            document.getElementById("upiHolderName").value = localStorage.getItem("rdxSavedUpiName") || "";
            document.getElementById("upiId").value = localStorage.getItem("rdxSavedUpiId") || "";
            document.getElementById("bankHolderName").value = localStorage.getItem("rdxSavedBankHolder") || "";
            document.getElementById("bankName").value = localStorage.getItem("rdxSavedBankName") || "";
            document.getElementById("accountNumber").value = localStorage.getItem("rdxSavedAccNum") || "";
            document.getElementById("ifscCode").value = localStorage.getItem("rdxSavedIfsc") || "";

            try {
                let docId = userId.length === 10 ? "91" + userId : userId;
                const snap = await getDoc(doc(db, "customers", docId));
                if (snap.exists()) {
                    const d = snap.data();
                    userWinnings = Number(d.winnings || d.winningBalance || d.balance || 0);
                    document.getElementById("winningBalance").textContent = userWinnings;
                }
            } catch (err) {
                console.error("Error loading user balance:", err);
            }
        }

        window.switchMode = function(mode) {
            currentMode = mode;
            document.getElementById("tabUpi").classList.toggle("active", mode === "upi");
            document.getElementById("tabBank").classList.toggle("active", mode === "bank");
            document.getElementById("upiSection").style.display = mode === "upi" ? "block" : "none";
            document.getElementById("bankSection").style.display = mode === "bank" ? "block" : "none";
        };

        window.submitWithdrawal = async function() {
            const amount = Number(document.getElementById("withdrawAmount").value);
            const btn = document.getElementById("btnWithdraw");

            if (!amount || amount < 300) {
                toast("Kam se kam ₹300 withdraw karein");
                return;
            }

            if (amount > 100000) {
                toast("Maximum limit ₹1,00,000 hai");
                return;
            }

            if (amount > userWinnings) {
                toast("Aapke paas paryapt balance nahi hai");
                return;
            }

            let withdrawData = {
                uid: userId,
                amount: amount,
                mode: currentMode.toUpperCase(),
                status: "pending",
                comment: "Admin verification chal raha hai.",
                createdAt: serverTimestamp()
            };

            if (currentMode === "upi") {
                const holderName = document.getElementById("upiHolderName").value.trim();
                const upiId = document.getElementById("upiId").value.trim();

                if (!holderName || !upiId || !upiId.includes("@")) {
                    toast("Valid UPI ID aur Holder Name bharein");
                    return;
                }

                withdrawData.holderName = holderName;
                withdrawData.upiId = upiId;

                localStorage.setItem("rdxSavedUpiName", holderName);
                localStorage.setItem("rdxSavedUpiId", upiId);
            } else {
                const holderName = document.getElementById("bankHolderName").value.trim();
                const bankName = document.getElementById("bankName").value.trim();
                const accNum = document.getElementById("accountNumber").value.trim();
                const ifsc = document.getElementById("ifscCode").value.trim().toUpperCase();

                if (!holderName || !bankName || accNum.length < 8 || ifsc.length < 8) {
                    toast("Sabhi Bank details sahi se bharein");
                    return;
                }

                withdrawData.holderName = holderName;
                withdrawData.bankName = bankName;
                withdrawData.accountNumber = accNum;
                withdrawData.ifsc = ifsc;

                localStorage.setItem("rdxSavedBankHolder", holderName);
                localStorage.setItem("rdxSavedBankName", bankName);
                localStorage.setItem("rdxSavedAccNum", accNum);
                localStorage.setItem("rdxSavedIfsc", ifsc);
            }

            btn.disabled = true;
            btn.textContent = "Submitting...";

            try {
                await addDoc(collection(db, "withdrawals"), withdrawData);
                toast("Withdrawal request submit ho gayi!");
                setTimeout(() => location.href = "history.html", 1200);
            } catch (error) {
                console.error("Withdraw error:", error);
                toast("Error: " + error.message);
                btn.disabled = false;
                btn.textContent = "Withdraw Money";
            }
        };

        loadUserData();
    </script>
</body>
</html>
