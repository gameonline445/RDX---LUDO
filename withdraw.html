<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Withdraw Winnings</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
        body{background:linear-gradient(180deg,#f8faff 0%,#eef4ff 50%,#f1f5f9 100%);color:#101a38;min-height:100vh;padding-bottom:85px;}
        .top-bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;border-bottom:1px solid #ccd8ed;}
        .header-left{display:flex;align-items:center;gap:10px;}
        .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ffffff;border:1px solid #cbd7e9;color:#2864e6;font-size:16px;cursor:pointer;}
        .brand-badge{background:#ffffff;border:1px solid #dce6fb;color:#2362d9;font-weight:900;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;}
        .header-icons{display:flex;gap:8px;}
        .topicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;color:#ffffff;cursor:pointer;}
        .icon-bell{background:#7368ef;} .icon-cash{background:#35bf71;} .icon-gift{background:#ff933c;}
        .container{width:100%;max-width:560px;margin:auto;padding:16px 18px;}
        .balance-card{border:1.5px solid #bdd0f0;border-radius:22px;padding:18px;background:radial-gradient(circle at 100% 0%,#dce8ff,transparent 40%),linear-gradient(135deg,#eef4ff,#fff);box-shadow:0 10px 25px rgba(66,117,211,0.1);margin-bottom:16px;}
        .balance-label{font-size:12px;font-weight:800;color:#6b7891;text-transform:uppercase;}
        .balance-amount{font-size:32px;font-weight:900;color:#101a38;margin-top:4px;}
        .balance-note{font-size:12px;color:#2563eb;margin-top:6px;font-weight:600;}
        .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
        .tab{height:46px;border:1px solid #cbd7e9;border-radius:15px;background:#eef1f6;color:#748097;font-weight:800;font-size:13px;cursor:pointer;}
        .tab.active{background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;border-color:#2864e6;}
        .form-card{border:1.5px solid #c3d2ec;border-radius:20px;padding:18px;background:linear-gradient(135deg,#f4f7ff,#fff);margin-bottom:16px;}
        label{display:block;font-size:12px;font-weight:800;color:#6b7891;margin-bottom:6px;margin-top:10px;}
        input{width:100%;height:48px;border:1px solid #d2dceb;border-radius:14px;background:#f8f9fc;padding:0 14px;font-size:15px;font-weight:600;outline:none;}
        .saved-card{background:#ffffff;border:1.5px solid #bdd0f0;border-radius:16px;padding:14px 16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
        .edit-link-btn{background:#eef4ff;color:#2864e6;border:1px solid #cbd7e9;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;}
        .save-details-btn{width:100%;height:44px;border:1px solid #2864e6;border-radius:12px;background:#eef4ff;color:#2864e6;font-weight:800;font-size:13px;margin-top:10px;cursor:pointer;}
        .withdraw-btn{width:100%;height:50px;border:0;border-radius:25px;background:linear-gradient(100deg,#2864e6,#3e7bf0);color:#fff;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer;}
        .bottom{height:64px;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffff;border-top:1px solid #d5deed;position:fixed;bottom:0;left:0;right:0;z-index:100;}
        .nav{border:0;background:#ffffff;color:#6d7890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;text-decoration:none;cursor:pointer;}
        .nav.active{color:#18213a;font-weight:900;}
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <button class="back-btn" onclick="location.href='wallet.html'"><i class="fa-solid fa-chevron-left"></i></button>
            <!-- Logo Click to Home -->
            <span class="brand-badge" onclick="location.href='dashboard.html'">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell" onclick="location.href='notification.html'">🔔</div>
            <div class="topicon icon-cash" onclick="location.href='wallet.html'">💵</div>
            <div class="topicon icon-gift" onclick="location.href='referral.html'">🎁</div>
        </div>
    </header>

    <main class="container">
        <div class="balance-card">
            <div class="balance-label">Withdrawable Winnings</div>
            <div class="balance-amount">₹<span id="winningBalance">0</span></div>
            <div class="balance-note">Min: ₹300 | Max: ₹1,00,000</div>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabUpi" onclick="switchMode('upi')"><i class="fa-solid fa-mobile-screen-button"></i> UPI Transfer</button>
            <button class="tab" id="tabBank" onclick="switchMode('bank')"><i class="fa-solid fa-building-columns"></i> Bank Transfer</button>
        </div>

        <div class="form-card">
            <label for="withdrawAmount">ENTER WITHDRAWAL AMOUNT (₹)</label>
            <input type="number" id="withdrawAmount" placeholder="Min ₹300" min="300" max="100000">

            <div id="upiContainer">
                <div id="upiSavedCard" class="saved-card" style="display: none;">
                    <div><span id="displayUpiName" style="font-weight:800;">—</span><br><span id="displayUpiId" style="font-size:12px;color:#64748b;">—</span></div>
                    <button class="edit-link-btn" onclick="editUpiDetails()">✎ Edit</button>
                </div>
                <div id="upiInputFields">
                    <label>VERIFIED ACCOUNT HOLDER NAME</label><input type="text" id="upiHolderName" placeholder="Account Holder Name">
                    <label>UPI ID (VPA)</label><input type="text" id="upiId" placeholder="e.g. mobile@okhdfcbank">
                    <button class="save-details-btn" onclick="saveUpiDetails()"><i class="fa-solid fa-floppy-disk"></i> Lock & Save UPI</button>
                </div>
            </div>

            <div id="bankContainer" style="display: none;">
                <div id="bankSavedCard" class="saved-card" style="display: none;">
                    <div><span id="displayBankHolder" style="font-weight:800;">—</span><br><span id="displayBankDetails" style="font-size:12px;color:#64748b;">—</span></div>
                    <button class="edit-link-btn" onclick="editBankDetails()">✎ Edit</button>
                </div>
                <div id="bankInputFields">
                    <label>ACCOUNT HOLDER NAME</label><input type="text" id="bankHolderName">
                    <label>BANK NAME</label><input type="text" id="bankName">
                    <label>ACCOUNT NUMBER</label><input type="text" id="accountNumber">
                    <label>IFSC CODE</label><input type="text" id="ifscCode" style="text-transform: uppercase;">
                    <button class="save-details-btn" onclick="saveBankDetails()"><i class="fa-solid fa-floppy-disk"></i> Lock & Save Bank</button>
                </div>
            </div>

            <button class="withdraw-btn" id="btnWithdraw" onclick="submitWithdrawal()">Withdraw Money</button>
        </div>
    </main>

    <nav class="bottom">
        <a class="nav" href="dashboard.html"><b>🏠</b>Home</a>
        <a class="nav active" href="wallet.html"><b>💰</b>Wallet</a>
        <a class="nav" href="support.html"><b>🎧</b>Support</a>
        <a class="nav" href="profile.html"><b>👤</b>Profile</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = "upi";
        let userWinnings = 0;
        const userId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");

        window.saveUpiDetails = function() {
            const name = document.getElementById("upiHolderName").value.trim();
            const upi = document.getElementById("upiId").value.trim();
            if (!name || !upi.includes("@")) return alert("Valid UPI ID bharein");
            localStorage.setItem("rdxSavedUpiName", name);
            localStorage.setItem("rdxSavedUpiId", upi);
            renderSavedUpi();
        };

        window.editUpiDetails = function() {
            document.getElementById("upiSavedCard").style.display = "none";
            document.getElementById("upiInputFields").style.display = "block";
        };

        function renderSavedUpi() {
            const name = localStorage.getItem("rdxSavedUpiName");
            const upi = localStorage.getItem("rdxSavedUpiId");
            if (name && upi) {
                document.getElementById("displayUpiName").textContent = name;
                document.getElementById("displayUpiId").textContent = upi;
                document.getElementById("upiSavedCard").style.display = "flex";
                document.getElementById("upiInputFields").style.display = "none";
            }
        }

        window.saveBankDetails = function() {
            const holder = document.getElementById("bankHolderName").value.trim();
            const bank = document.getElementById("bankName").value.trim();
            const acc = document.getElementById("accountNumber").value.trim();
            const ifsc = document.getElementById("ifscCode").value.trim().toUpperCase();
            if (!holder || !bank || acc.length < 8) return alert("Sahi Bank details bharein");
            localStorage.setItem("rdxSavedBankHolder", holder);
            localStorage.setItem("rdxSavedBankName", bank);
            localStorage.setItem("rdxSavedAccNum", acc);
            localStorage.setItem("rdxSavedIfsc", ifsc);
            renderSavedBank();
        };

        window.editBankDetails = function() {
            document.getElementById("bankSavedCard").style.display = "none";
            document.getElementById("bankInputFields").style.display = "block";
        };

        function renderSavedBank() {
            const holder = localStorage.getItem("rdxSavedBankHolder");
            const bank = localStorage.getItem("rdxSavedBankName");
            const acc = localStorage.getItem("rdxSavedAccNum");
            const ifsc = localStorage.getItem("rdxSavedIfsc");
            if (holder && bank && acc) {
                document.getElementById("displayBankHolder").textContent = holder;
                document.getElementById("displayBankDetails").textContent = `${bank} • A/C: ${acc} • IFSC: ${ifsc}`;
                document.getElementById("bankSavedCard").style.display = "flex";
                document.getElementById("bankInputFields").style.display = "none";
            }
        }

        window.switchMode = function(mode) {
            currentMode = mode;
            document.getElementById("tabUpi").classList.toggle("active", mode === "upi");
            document.getElementById("tabBank").classList.toggle("active", mode === "bank");
            document.getElementById("upiContainer").style.display = mode === "upi" ? "block" : "none";
            document.getElementById("bankContainer").style.display = mode === "bank" ? "block" : "none";
        };

        window.submitWithdrawal = async function() {
            const amount = Number(document.getElementById("withdrawAmount").value);
            if (amount < 300 || amount > userWinnings) return alert("Valid Amount daalein (Min ₹300)");

            let data = { uid: userId, amount, mode: currentMode.toUpperCase(), status: "pending", createdAt: serverTimestamp() };
            if (currentMode === "upi") {
                data.holderName = localStorage.getItem("rdxSavedUpiName");
                data.upiId = localStorage.getItem("rdxSavedUpiId");
            } else {
                data.holderName = localStorage.getItem("rdxSavedBankHolder");
                data.bankName = localStorage.getItem("rdxSavedBankName");
                data.accountNumber = localStorage.getItem("rdxSavedAccNum");
                data.ifsc = localStorage.getItem("rdxSavedIfsc");
            }

            await addDoc(collection(db, "withdrawals"), data);
            alert("Withdrawal submit ho gaya!");
            location.href = "history.html";
        };

        async function init() {
            renderSavedUpi();
            renderSavedBank();
            if (userId) {
                const snap = await getDoc(doc(db, "customers", userId.length === 10 ? "91" + userId : userId));
                if (snap.exists()) {
                    userWinnings = Number(snap.data().winnings || snap.data().balance || 0);
                    document.getElementById("winningBalance").textContent = userWinnings;
                }
            }
        }
        init();
    </script>
</body>
</html>
