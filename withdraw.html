<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RDX LUDO - Withdraw</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
        body{
            background:
                radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
                radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
            color:#101a38;
            min-height:100vh;
            padding-bottom:85px;
        }
        .top-bar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
        .header-left{display:flex;align-items:center;gap:10px;}
        .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ffffff;border:1px solid #bae6fd;color:#0284c7;cursor:pointer;}
        .brand-badge{background:#ffffff;border:1px solid #bae6fd;color:#0284c7;font-weight:900;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;}
        .header-icons{display:flex;gap:6px;}
        .topicon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#ffffff;cursor:pointer;}
        .icon-bell{background:#6366f1;} .icon-cash{background:#16a34a;} .icon-gift{background:#ea580c;}

        .container{width:100%;max-width:560px;margin:auto;padding:16px 14px;}
        .balance-card{border:1.5px solid #7dd3fc;border-radius:20px;padding:16px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);margin-bottom:14px;}
        .balance-label{font-size:11px;font-weight:800;color:#0284c7;text-transform:uppercase;}
        .balance-amount{font-size:28px;font-weight:900;color:#0c4a6e;margin-top:2px;}
        .balance-note{font-size:11px;color:#0284c7;margin-top:4px;font-weight:600;}

        .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
        .tab{height:42px;border:1px solid #bae6fd;border-radius:12px;background:#ffffff;color:#64748b;font-weight:800;font-size:12px;cursor:pointer;}
        .tab.active{background:linear-gradient(100deg,#0284c7,#0369a1);color:#fff;border-color:#0284c7;}
        .form-card{border:1.5px solid #bae6fd;border-radius:18px;padding:16px;background:#ffffff;margin-bottom:14px;}
        label{display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:4px;margin-top:8px;}
        input{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;padding:0 12px;font-size:14px;outline:none;}
        .withdraw-btn{width:100%;height:46px;border:0;border-radius:23px;background:linear-gradient(100deg,#0284c7,#0369a1);color:#fff;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer;}

        /* BOTTOM NAV */
        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
        .nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
        .nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
        .nav-item:active .nav-icon-box{transform:scale(0.92);}
        .icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
        .icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
        .icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
        .icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <button class="back-btn" onclick="location.href='wallet.html'"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="brand-badge" onclick="location.href='dashboard.html'">RDX LUDO</span>
        </div>
        <div class="header-icons">
            <div class="topicon icon-bell" onclick="location.href='notification.html'">🔔</div>
            <div class="topicon icon-cash" onclick="location.href='wallet.html'">💵</div>
            <div class="topicon icon-gift" onclick="location.href='referral.html'">🎁</div>
        </div>
    </header>

    <main class="container">
        <div class="balance-card">
            <div class="balance-label">Withdrawable Winnings</div>
            <div class="balance-amount">₹<span id="winningBalance">0</span></div>
            <div class="balance-note">Min: ₹300 | Max: ₹1,00,000</div>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabUpi" onclick="switchMode('upi')"><i class="fa-solid fa-mobile-screen-button"></i> UPI</button>
            <button class="tab" id="tabBank" onclick="switchMode('bank')"><i class="fa-solid fa-building-columns"></i> Bank</button>
        </div>

        <div class="form-card">
            <label>ENTER AMOUNT (₹)</label>
            <input type="number" id="withdrawAmount" placeholder="Min ₹300">

            <div id="upiContainer">
                <label>HOLDER NAME</label><input type="text" id="upiHolderName">
                <label>UPI ID (VPA)</label><input type="text" id="upiId" placeholder="mobile@upi">
            </div>

            <div id="bankContainer" style="display: none;">
                <label>ACCOUNT HOLDER</label><input type="text" id="bankHolderName">
                <label>BANK NAME</label><input type="text" id="bankName">
                <label>ACCOUNT NUMBER</label><input type="text" id="accountNumber">
                <label>IFSC CODE</label><input type="text" id="ifscCode">
            </div>

            <button class="withdraw-btn" onclick="submitWithdrawal()">Withdraw Money</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
        <button class="nav-item" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
        <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
        <button class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = "upi";
        const userId = String(localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "").replace(/\D/g, "");

        window.switchMode = function(m) {
            currentMode = m;
            document.getElementById("tabUpi").classList.toggle("active", m === "upi");
            document.getElementById("tabBank").classList.toggle("active", m === "bank");
            document.getElementById("upiContainer").style.display = m === "upi" ? "block" : "none";
            document.getElementById("bankContainer").style.display = m === "bank" ? "block" : "none";
        };

        window.submitWithdrawal = async function() {
            const amount = Number(document.getElementById("withdrawAmount").value);
            if (!amount || amount < 300) return alert("Min amount ₹300 hai");

            let data = { uid: userId, amount, mode: currentMode.toUpperCase(), status: "pending", createdAt: serverTimestamp() };
            if (currentMode === "upi") {
                data.holderName = document.getElementById("upiHolderName").value.trim();
                data.upiId = document.getElementById("upiId").value.trim();
            } else {
                data.holderName = document.getElementById("bankHolderName").value.trim();
                data.bankName = document.getElementById("bankName").value.trim();
                data.accountNumber = document.getElementById("accountNumber").value.trim();
                data.ifsc = document.getElementById("ifscCode").value.trim().toUpperCase();
            }

            await addDoc(collection(db, "withdrawals"), data);
            alert("Withdrawal request submit ho gayi!");
            location.href = "history.html";
        };

        async function init() {
            if (userId) {
                const snap = await getDoc(doc(db, "customers", userId.length === 10 ? "91" + userId : userId));
                if (snap.exists()) {
                    document.getElementById("winningBalance").textContent = Number(snap.data().winnings || snap.data().balance || 0);
                }
            }
        }
        init();
    </script>
</body>
</html>
