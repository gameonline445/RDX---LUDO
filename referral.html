<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
  authDomain: "rdx-ludo.firebaseapp.com",
  projectId: "rdx-ludo",
  storageBucket: "rdx-ludo.firebasestorage.app",
  messagingSenderId: "928340814840",
  appId: "1:928340814840:web:6eca42a8b76138b268440d"

    console.error("Firebase error:", error);

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f9ff;color:#101a38;min-height:100vh;}
button{font:inherit;}

/* HEADER */
.top-header{height:70px;background:linear-gradient(110deg,#eef4ff,#ffffff);border-bottom:1px solid #cbd8f0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:100;box-shadow:0 5px 18px rgba(36,75,150,.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:46px;height:46px;border:0;border-radius:16px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:white;font-size:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 15px rgba(255,93,80,.25);cursor:pointer;}
.logo{width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#e7efff);border:3px solid #d3e1ff;display:flex;align-items:center;justify-content:center;color:#1762df;font-size:12px;font-weight:900;box-shadow:0 5px 12px rgba(36,93,190,.15);cursor:pointer;}
.header-right{display:flex;align-items:center;gap:6px;}
.header-icon{width:44px;height:44px;border:0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;color:white;box-shadow:0 6px 15px rgba(0,0,0,.12);cursor:pointer;}
.notification{background:linear-gradient(145deg,#746df4,#817eff);}
.wallet-top{background:linear-gradient(145deg,#20c36b,#43d77e);min-width:48px;}
.redeem-top{background:linear-gradient(145deg,#ff8a35,#ffad45);min-width:48px;}

/* SIDE MENU */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:250;display:none;}
.menu-overlay.show{display:block;}
.menu-panel{position:fixed;top:0;left:-310px;width:300px;height:100vh;background:white;z-index:300;padding:25px 18px;box-shadow:10px 0 35px rgba(0,0,0,.15);transition:.3s ease;overflow-y:auto;}
.menu-panel.open{left:0;}
.menu-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;margin-bottom:18px;border-bottom:1px solid #e3e8f2;}
.menu-brand{display:flex;align-items:center;gap:12px;}
.menu-logo{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#e7efff);border:3px solid #d3e1ff;display:flex;align-items:center;justify-content:center;color:#1762df;font-size:13px;font-weight:900;cursor:pointer;}
.menu-brand h2{font-size:20px;}
.menu-brand p{color:#71809d;font-size:12px;margin-top:3px;}
.close-menu{border:0;background:#eef2fa;width:42px;height:42px;border-radius:50%;font-size:25px;color:#66738d;cursor:pointer;}
.menu-item{width:100%;border:1px solid #e0e5ef;background:#fafbfe;padding:15px 16px;border-radius:17px;margin-bottom:12px;text-align:left;font-size:17px;color:#182440;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:58px;}
.menu-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#e8efff;font-size:20px;}
.menu-item span:nth-child(2){flex:1;}

/* MAIN CONTAINER */
.container{width:100%;max-width:650px;margin:auto;padding:24px 16px 110px;}
.refer-card{border:1.5px solid #abc2f4;border-radius:27px;padding:24px 20px;background:radial-gradient(circle at 100% 0%,#dce8ff,transparent 40%),linear-gradient(135deg,#eef4ff,#ffffff);box-shadow:0 15px 35px rgba(40,88,175,.10);text-align:center;margin-bottom:20px;}
.refer-card h1{font-size:28px;margin-bottom:8px;}
.refer-card p{color:#64748b;font-size:15px;line-height:1.4;}
.code-box{margin:20px auto;background:#ffffff;border:2px dashed #3b82f6;border-radius:18px;padding:14px;max-width:320px;}
.code-box small{font-size:11px;font-weight:800;color:#64748b;letter-spacing:1px;}
.code-box strong{display:block;font-size:26px;color:#1d4ed8;letter-spacing:3px;margin-top:4px;}
.btn-share{width:100%;height:50px;border:0;border-radius:16px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:16px;font-weight:850;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}

.balance-box{background:#ffffff;border:1.5px solid #cbd5e1;border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn-claim{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:78px;background:rgba(255,255,255,.97);border-top:1px solid #d6deee;display:flex;justify-content:space-around;align-items:center;z-index:200;}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#66738d;font-size:13px;cursor:pointer;}
.nav-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.nav-item.active{color:#202d49;font-weight:700;}
.nav-item.active .nav-icon{background:#536df5;color:white;}
</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <!-- Logo click to Home -->
        <div class="logo" onclick="goHome()">RDX</div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="goNotifications()">🔔</button>
        <button class="header-icon wallet-top" onclick="goWallet()">💰</button>
        <button class="header-icon redeem-top" onclick="goRedeem()">🎁</button>
    </div>
</header>

<!-- SIDE MENU -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<div class="menu-panel" id="menuPanel">
    <div class="menu-title">
        <div class="menu-brand">
            <!-- Side Menu Logo Click to Home -->
            <div class="menu-logo" onclick="goHome()">RDX</div>
            <div>
                <h2>RDX LUDO</h2>
                <p>Play · Win · Earn</p>
            </div>
        </div>
        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>

    <button class="menu-item" onclick="goHome()"><div class="menu-icon">🏠</div><span>Home</span><span>›</span></button>
    <button class="menu-item" onclick="goProfile()"><div class="menu-icon">👤</div><span>My Profile</span><span>›</span></button>
    <button class="menu-item" onclick="goWallet()"><div class="menu-icon">💰</div><span>My Wallet</span><span>›</span></button>
    <button class="menu-item" onclick="goRedeem()"><div class="menu-icon">🎁</div><span>Refer & Earn</span><span>›</span></button>
    <button class="menu-item" onclick="goHistory()"><div class="menu-icon">🕘</div><span>History</span><span>›</span></button>
    <button class="menu-item" onclick="goNotifications()"><div class="menu-icon">🔔</div><span>Notifications</span><span>›</span></button>
    <button class="menu-item" onclick="goSupport()"><div class="menu-icon">🎧</div><span>Support</span><span>›</span></button>
    <button class="menu-item" onclick="logout()"><div class="menu-icon">🚪</div><span>Logout</span><span>›</span></button>
</div>

<!-- MAIN -->
<main class="container">
    <div class="refer-card">
        <h1>🎁 Refer & Earn 2%</h1>
        <p>Apne dosto ko invite karein aur unke har match par 2% commission payein!</p>
        
        <div class="code-box">
            <small>YOUR REFERRAL CODE</small>
            <strong id="referralCode">LOADING...</strong>
        </div>

        <button class="btn-share" onclick="shareWhatsApp()">
            📲 Share on WhatsApp
        </button>
    </div>

    <div class="balance-box">
        <div>
            <span style="font-size:12px;color:#64748b;font-weight:700;">REFERRAL EARNINGS</span>
            <div style="font-size:24px;font-weight:900;color:#15803d;margin-top:2px;">₹<span id="referralBalance">0</span></div>
        </div>
        <button class="btn-claim" onclick="claimEarning()">Transfer to Wallet</button>
    </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-item" onclick="goHome()"><div class="nav-icon">🏠</div><span>Home</span></button>
    <button class="nav-item" onclick="goWallet()"><div class="nav-icon">💰</div><span>Wallet</span></button>
    <button class="nav-item" onclick="goSupport()"><div class="nav-icon">🎧</div><span>Support</span></button>
    <button class="nav-item" onclick="goProfile()"><div class="nav-icon">👤</div><span>Profile</span></button>
</nav>

<script>
let myReferralCode = "";
let currentEarnings = 0;

function openMenu(){ document.getElementById("menuPanel").classList.add("open"); document.getElementById("menuOverlay").classList.add("show"); }
function closeMenu(){ document.getElementById("menuPanel").classList.remove("open"); document.getElementById("menuOverlay").classList.remove("show"); }
function goHome(){ closeMenu(); window.location.href = "./dashboard.html"; }
function goProfile(){ closeMenu(); window.location.href = "./profile.html"; }
function goWallet(){ closeMenu(); window.location.href = "./wallet.html"; }
function goSupport(){ closeMenu(); window.location.href = "./support.html"; }
function goRedeem(){ closeMenu(); window.location.href = "./referral.html"; }
function goHistory(){ closeMenu(); window.location.href = "./history.html"; }
function goNotifications(){ closeMenu(); window.location.href = "./notification.html"; }
function logout(){ localStorage.clear(); window.location.href = "./login.html"; }

async function loadReferral() {
    let mobile = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    const cleanMobile = String(mobile).replace(/\D/g,"");
    if(!cleanMobile) return;
    let docId = cleanMobile.length === 10 ? "91" + cleanMobile : cleanMobile;

    myReferralCode = localStorage.getItem("rdxReferral") || ("RDX" + cleanMobile.slice(-4));
    document.getElementById("referralCode").textContent = myReferralCode;

    if(!firebaseDB) return;
    try {
        const snap = await firebaseDB.collection("customers").doc(docId).get();
        if(snap.exists) {
            const data = snap.data();
            currentEarnings = Number(data.redeemBalance || data.referralBalance || 0);
            document.getElementById("referralBalance").textContent = currentEarnings;
            if(data.referralCode) {
                myReferralCode = data.referralCode;
                document.getElementById("referralCode").textContent = myReferralCode;
            }
        }
    } catch(e) { console.error(e); }
}

function shareWhatsApp() {
    const text = `Play Ludo with me on RDX Ludo and win real cash! Use my Referral Code: *${myReferralCode}* to join: ${window.location.origin}`;
    window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
}

async function claimEarning() {
    if(currentEarnings <= 0) return alert("Transfer karne ke liye koi commission balance nahi hai.");
    alert("Referral balance transfer ho gaya!");
}

window.addEventListener("load", loadReferral);
</script>
</body>
</html>
