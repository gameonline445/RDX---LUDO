<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

/* 🔒 स्क्रीन और बॉडी को पूरी तरह लॉक करने के लिए */
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color: #101a38;
    -webkit-touch-callout: none;
}

button{font:inherit;}

/* TOP HEADER STYLES */
.top-header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 66px;
    background: linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);
    border-bottom: 1.5px solid #bae6fd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 100;
    box-shadow: 0 4px 18px rgba(2,132,199,0.08);
}

/* CONTAINER (हेडर और बॉटम नेविगेशन के बीच फिक्स और स्क्रॉलएबल) */
.container{
    position: absolute;
    top: 66px;
    bottom: 74px;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 16px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* REFER CARD */
.refer-card {
    background: #ffffff;
    border: 1.5px solid #bae6fd;
    border-radius: 22px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.08);
    margin-bottom: 16px;
}

.refer-card h2 {
    font-size: 21px;
    color: #0c4a6e;
    font-weight: 900;
    margin-bottom: 6px;
}

.refer-card p {
    font-size: 12px;
    color: #64748b;
    line-height: 1.4;
    margin-bottom: 18px;
    font-weight: 600;
}

.code-box {
    border: 2px dashed #0284c7;
    background: #f0f9ff;
    padding: 14px;
    border-radius: 16px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: transform 0.15s ease;
}
.code-box:active { transform: scale(0.98); }

.code-box small {
    display: block;
    font-size: 10px;
    color: #64748b;
    font-weight: 850;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
}

.code-box strong {
    font-size: 24px;
    color: #0284c7;
    letter-spacing: 2px;
    font-weight: 900;
}

.whatsapp-btn {
    width: 100%;
    background: linear-gradient(145deg, #16a34a, #22c55e);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 850;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
}
.whatsapp-btn:active { transform: scale(0.98); }

/* EARNING CARD */
.earning-card {
    background: #ffffff;
    border: 1.5px solid #bae6fd;
    border-radius: 22px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.08);
}

.earning-info small {
    font-size: 10px;
    color: #64748b;
    font-weight: 850;
    letter-spacing: 0.8px;
}

.earning-info h3 {
    font-size: 24px;
    color: #16a34a;
    font-weight: 900;
    margin-top: 2px;
}

.transfer-btn {
    background: linear-gradient(100deg, #0284c7, #0369a1);
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 850;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
}
.transfer-btn:active { transform: scale(0.96); }

/* REDEEM MODAL POPUP */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.redeem-box {
    background: #ffffff;
    border-radius: 22px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    border: 1.5px solid #bae6fd;
}

.close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 18px;
    color: #64748b;
    cursor: pointer;
}

.redeem-header h3 {
    font-size: 20px;
    color: #0c4a6e;
    font-weight: 900;
}

.wallet-display {
    background: #f0f7ff;
    border: 1px solid #bae6fd;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 0;
}

.input-group input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    border: 1.5px solid #cbd5e1;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    outline: none;
}

.redeem-now-btn {
    width: 100%;
    height: 48px;
    background: linear-gradient(100deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 850;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(2,132,199,0.35);
}

/* BOTTOM NAV CONTAINER */
.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:74px;
    background:#ffffff;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
}
.nav-item{
    width:25%;
    height:100%;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#64748b;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}
.nav-icon-box{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#ffffff;
}
.nav-item.active {color:#0f172a;font-weight:850;}
.icon-home{background:#6366f1;}
.icon-wallet{background:#22c55e;}
.icon-support{background:#0284c7;}
.icon-profile{background:#ea580c;}

/* DRAWER STYLING */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:999;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
.drawer-overlay.active{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;width:280px;height:100%;background:#ffffff;z-index:1000;box-shadow:4px 0 25px rgba(2,132,199,0.15);transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;}
.drawer.active{transform:translateX(0);}

#toast {
    visibility: hidden;
    min-width: 250px;
    background-color: #0f172a;
    color: #fff;
    text-align: center;
    border-radius: 14px;
    padding: 12px;
    position: fixed;
    z-index: 2000;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
}

#toast.show { visibility: visible; }
</style>
</head>
<body>

<script>
if (!localStorage.getItem("rdxLoggedIn") || localStorage.getItem("rdxLoggedIn") !== "true") {
    window.location.replace("index.html");
}
</script>

<!-- DYNAMIC COMPONENTS CONTAINERS -->
<div id="header-container"></div>
<div id="drawer-container"></div>

<main class="container" id="scrollContainer">
    <!-- REFERRAL CARD -->
    <section class="refer-card">
        <h2>🎁 Refer & Earn 2% Net Profit</h2>
        <p>Apne dosto ko invite karein aur unke har game WIN karne par net winning profit ka 2% instant bonus payein!</p>
        
        <div class="code-box" onclick="copyReferralCode()">
            <small>YOUR REFERRAL CODE (TAP TO COPY)</small>
            <strong id="refCodeDisplay">LOADING...</strong>
        </div>

        <button class="whatsapp-btn" onclick="shareOnWhatsApp()">
            <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
        </button>
    </section>

    <!-- EARNING CARD -->
    <section class="earning-card">
        <div class="earning-info">
            <small>REFERRAL EARNINGS</small>
            <h3 id="referralBalanceDisplay">₹0.00</h3>
        </div>
        <button class="transfer-btn" onclick="openRedeemModal()">
            Transfer to Wallet
        </button>
    </section>
</main>

<!-- REDEEM POPUP MODAL -->
<div class="modal-overlay" id="redeemModal">
    <div class="redeem-box">
        <i class="fa-solid fa-xmark close-btn" onclick="closeRedeemModal()"></i>

        <div class="redeem-header">
            <h3>Redeem Referral</h3>
        </div>

        <div class="wallet-display">
            <div>
                <small style="color:#64748b; font-weight:850;">REFERRAL WALLET</small>
                <h4 id="modalRefBalance" style="font-size:18px; color:#0c4a6e; font-weight:900;">₹0.00</h4>
            </div>
            <i class="fa-solid fa-wallet" style="font-size:22px; color:#0284c7;"></i>
        </div>

        <div class="input-group">
            <input type="number" id="redeemAmountInput" placeholder="Enter amount">
        </div>

        <button class="redeem-now-btn" onclick="processRedeemInFirestore()">
            Redeem Now
        </button>
    </div>
</div>

<!-- DYNAMIC BOTTOM NAVIGATION CONTAINER -->
<div id="nav-container" data-active="refer"></div>

<div id="toast"></div>

<script>
// 🛡️ मोबाइल बाउंस रोकने के लिए टच प्रिवेंटर
document.addEventListener('touchmove', function(event) {
    if (!event.target.closest('main.container') && !event.target.closest('.drawer')) {
        event.preventDefault();
    }
}, { passive: false });

/* 🔄 शुद्ध पुल-टू-रिफ्रेश लॉजिक */
let startY = 0;
const scrollContainer = document.getElementById('scrollContainer');

scrollContainer.addEventListener('touchstart', function(e) {
    if (scrollContainer.scrollTop === 0) {
        startY = e.touches[0].clientY;
    }
});

scrollContainer.addEventListener('touchmove', function(e) {
    if (scrollContainer.scrollTop === 0 && startY > 0) {
        let currentY = e.touches[0].clientY;
        if (currentY - startY > 100) {
            startY = 0;
            window.location.reload();
        }
    }
});

scrollContainer.addEventListener('touchend', function(e) {
    startY = 0;
});

// FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firebaseDB = firebase.firestore();

function getCleanUserId() {
    const raw = localStorage.getItem("rdxFirebaseUserId") || localStorage.getItem("rdxVerifiedMobile") || "";
    return String(raw).replace(/\D/g, "");
}

const userId = getCleanUserId();
let currentReferralBalance = 0;

function loadReferralDataRealtime() {
    if (!userId) { window.location.replace("index.html"); return; }
    const docId = userId.length === 10 ? "91" + userId : userId;

    firebaseDB.collection("customers").doc(docId).onSnapshot((snap) => {
        if (snap.exists) {
            const data = snap.data();
            
            const fullName = String(data.name || ("User " + userId.slice(-4))).trim();
            
            const drawerNameEl = document.getElementById("drawerName");
            const drawerMobileEl = document.getElementById("drawerMobile");
            if (drawerNameEl) drawerNameEl.textContent = fullName;
            if (drawerMobileEl) drawerMobileEl.textContent = "+" + userId;

            currentReferralBalance = Number(data.referralBalance || data.referralWallet || 0);

            let refCode = data.referralCode || data.myReferralCode || data.referCode;
            if (!refCode) {
                refCode = "RDX" + Math.floor(100000 + Math.random() * 900000);
                firebaseDB.collection("customers").doc(docId).set({ referralCode: refCode }, { merge: true });
            }

            document.getElementById("refCodeDisplay").textContent = refCode;
            document.getElementById("referralBalanceDisplay").textContent = "₹" + currentReferralBalance.toFixed(2);
            document.getElementById("modalRefBalance").textContent = "₹" + currentReferralBalance.toFixed(2);
        }
    }, (err) => {
        console.error("Firestore Error:", err);
    });
}

function processRedeemInFirestore() {
    const amountInput = document.getElementById("redeemAmountInput").value;
    const amount = parseFloat(amountInput);

    if (!userId) {
        showToast("⚠️ Kripya Pehle Login Karein!");
        return;
    }

    if (!amountInput || isNaN(amount) || amount <= 0) {
        showToast("⚠️ Sahi amount darj karein!");
        return;
    }

    if (amount > currentReferralBalance) {
        showToast("❌ Referral Wallet me balance kam hai!");
        return;
    }

    const docId = userId.length === 10 ? "91" + userId : userId;
    const userRef = firebaseDB.collection("customers").doc(docId);

    firebaseDB.runTransaction(async (transaction) => {
        const doc = await transaction.get(userRef);
        if (!doc.exists) return;

        const data = doc.data();
        let refBal = Number(data.referralBalance || data.referralWallet || 0);
        let currentDeposit = Number(data.deposit || data.depositAmount || 0);

        if (refBal >= amount) {
            transaction.update(userRef, {
                referralBalance: refBal - amount,
                referralWallet: refBal - amount,
                deposit: currentDeposit + amount
            });
        } else {
            throw "Insufficient balance";
        }
    }).then(() => {
        closeRedeemModal();
        showToast(`🎉 ₹${amount} Instant Main Wallet me Add ho gaye!`);
    }).catch((err) => {
        showToast("❌ Transaction Fail Ho Gaya!");
    });
}

function openRedeemModal() {
    document.getElementById("redeemModal").style.display = "flex";
}

function closeRedeemModal() {
    document.getElementById("redeemModal").style.display = "none";
    document.getElementById("redeemAmountInput").value = "";
}

function copyReferralCode() {
    const code = document.getElementById("refCodeDisplay").innerText;
    if (!code || code === "LOADING...") return;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
            showToast("📋 Referral Code Copied!");
        }).catch(() => {
            fallbackCopyText(code);
        });
    } else {
        fallbackCopyText(code);
    }
}

function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        showToast("📋 Referral Code Copied!");
    } catch (err) {
        showToast("❌ Copy karne me samasya aayi");
    }
    document.body.removeChild(textArea);
}

function shareOnWhatsApp() {
    const code = document.getElementById("refCodeDisplay").innerText;
    if (!code || code === "LOADING...") return;
    const text = `Play Ludo on RDX Ludo & Win Real Cash! 🎲\nUse my Referral Code: *${code}*\nJoin Now: ${window.location.origin}/index.html?ref=${code}`;
    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text), "_blank");
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.className = "show";
    setTimeout(() => { toast.className = ""; }, 3000);
}

window.addEventListener("load", () => {
    loadReferralDataRealtime();
});
</script>

</body>
</html>
