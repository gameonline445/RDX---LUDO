<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Refer & Earn</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
}
button{font:inherit;}

/* HEADER */
.top-header{height:66px;background:linear-gradient(110deg,#e0f2fe 0%,#f0f9ff 45%,#ffffff 100%);border-bottom:1.5px solid #bae6fd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(2,132,199,0.08);}
.header-left{display:flex;align-items:center;gap:10px;}
.menu-btn{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff7165,#ff8a70);color:white;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ffffff,#dbeafe);border:2.5px solid #93c5fd;display:flex;align-items:center;justify-content:center;color:#0284c7;font-size:12px;font-weight:900;cursor:pointer;}
.header-right{display:flex;align-items:center;gap:8px;}
.header-icon{width:38px;height:38px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:white;cursor:pointer;}
.notification{background:linear-gradient(145deg,#6366f1,#818cf8);}
.wallet-top{background:linear-gradient(145deg,#16a34a,#22c55e);min-width:38px;}
.redeem-top{background:linear-gradient(145deg,#ea580c,#f97316);min-width:38px;}

/* MAIN */
.container{width:100%;max-width:650px;margin:auto;padding:16px 14px 100px;}
.refer-card{border:1.5px solid #7dd3fc;border-radius:22px;padding:20px 18px;background:radial-gradient(circle at 100% 0%,#bae6fd 0%,transparent 50%),linear-gradient(135deg,#e0f2fe 0%,#ffffff 100%);box-shadow:0 8px 22px rgba(2,132,199,0.10);text-align:center;margin-bottom:16px;}
.refer-card h1{font-size:22px;color:#0c4a6e;margin-bottom:4px;}
.refer-card p{color:#64748b;font-size:13px;}
.code-box{margin:16px auto;background:#ffffff;border:2px dashed #0284c7;border-radius:16px;padding:12px;max-width:280px;}
.code-box small{font-size:10px;font-weight:800;color:#64748b;letter-spacing:1px;}
.code-box strong{display:block;font-size:22px;color:#0284c7;letter-spacing:2px;margin-top:2px;}
.btn-share{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:14px;font-weight:850;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}

.balance-box{background:#ffffff;border:1.5px solid #bae6fd;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.btn-claim{background:#0284c7;color:#fff;border:0;padding:8px 14px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1.5px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -5px 25px rgba(2,132,199,0.06);}
.nav-item{width:25%;height:100%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;position:relative;}
.nav-icon-box{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffffff;box-shadow:0 4px 10px rgba(0,0,0,0.08);transition:transform 0.2s ease;}
.nav-item:active .nav-icon-box{transform:scale(0.92);}
.icon-home{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,0.35);}
.icon-wallet{background:linear-gradient(145deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,0.35);}
.icon-support{background:linear-gradient(145deg,#06b6d4,#0284c7);box-shadow:0 4px 14px rgba(6,182,212,0.35);}
.icon-profile{background:linear-gradient(145deg,#f97316,#ea580c);box-shadow:0 4px 14px rgba(249,115,22,0.35);}
</style>
</head>

<body>

<header class="top-header">
    <div class="header-left">
        <button class="menu-btn" onclick="location.href='dashboard.html'">☰</button>
        <div class="logo" onclick="location.href='dashboard.html'">RDX</div>
    </div>
    <div class="header-right">
        <button class="header-icon notification" onclick="location.href='notification.html'">🔔</button>
        <button class="header-icon wallet-top" onclick="location.href='wallet.html'">💰</button>
        <button class="header-icon redeem-top" onclick="location.href='referral.html'">🎁</button>
    </div>
</header>

<main class="container">
    <div class="refer-card">
        <h1>🎁 Refer & Earn 2%</h1>
        <p>Apne dosto ko invite karein aur unke matches par 2% reward payein!</p>
        <div class="code-box">
            <small>YOUR CODE</small>
            <strong id="referralCode">LOADING...</strong>
        </div>
        <button class="btn-share" onclick="shareWhatsApp()">📲 Share on WhatsApp</button>
    </div>

    <div class="balance-box">
        <div>
            <span style="font-size:11px;color:#64748b;font-weight:700;">REFERRAL EARNINGS</span>
            <div style="font-size:20px;font-weight:900;color:#15803d;margin-top:2px;">₹<span id="referralBalance">0</span></div>
        </div>
        <button class="btn-claim" onclick="alert('Transfer successful')">Transfer to Wallet</button>
    </div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'"><div class="nav-icon-box icon-home"><i class="fa-solid fa-house"></i></div><span>Home</span></button>
    <button class="nav-item" onclick="location.href='wallet.html'"><div class="nav-icon-box icon-wallet"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></button>
    <button class="nav-item" onclick="location.href='support.html'"><div class="nav-icon-box icon-support"><i class="fa-solid fa-headset"></i></div><span>Support</span></button>
    <button class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon-box icon-profile"><i class="fa-solid fa-user"></i></div><span>Profile</span></button>
</nav>

<script>
let myReferralCode = localStorage.getItem("rdxReferral") || "RDX100";
document.getElementById("referralCode").textContent = myReferralCode;

function shareWhatsApp() {
    const text = `Play Ludo on RDX Ludo and win cash! Use Code: *${myReferralCode}* to join: ${window.location.origin}`;
    window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
}
</script>
</body>
</html>
