<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Login</title>

<!-- MSG91 OTP Widget Script -->
<script type="text/javascript" src="https://control.msg91.com/app/assets/otp-provider/otp-provider.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 10% 10%,rgba(82,126,255,.16),transparent 30%),radial-gradient(circle at 90% 15%,rgba(255,136,88,.12),transparent 28%),linear-gradient(135deg,#f4f7ff,#ffffff 50%,#f5f8ff);
    color:#101a38;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 14px;
}
.login-card{
    width:100%;
    max-width:380px;
    background:#ffffff;
    border:1.5px solid #c7d9ff;
    border-radius:26px;
    padding:28px 22px;
    box-shadow:0 12px 30px rgba(40,88,175,.10);
    text-align:center;
}
.logo-box{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#fff;
    border:3px solid #c7d9ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2467df;
    font-size:18px;
    font-weight:900;
    margin:0 auto 14px;
    box-shadow:0 6px 16px rgba(49,92,180,.13);
}
h1{font-size:24px;color:#101a38;font-weight:900;}
p{font-size:13px;color:#64748b;margin-top:4px;margin-bottom:22px;}
.input-group{margin-bottom:16px;text-align:left;}
label{display:block;font-size:11px;font-weight:800;color:#6b7891;margin-bottom:6px;letter-spacing:0.5px;}
input{
    width:100%;
    height:50px;
    border:1px solid #cbd7e9;
    border-radius:16px;
    padding:0 16px;
    font-size:16px;
    font-weight:700;
    outline:none;
    background:#f8fafc;
    color:#101a38;
}
input:focus{border-color:#2864e6;background:#fff;}
.btn-action{
    width:100%;
    height:50px;
    border:0;
    border-radius:25px;
    background:linear-gradient(100deg,#2864e6,#3e7bf0);
    color:#ffffff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(40,100,230,.25);
    margin-top:8px;
}
</style>
</head>

<body>

<div class="login-card">
    <div class="logo-box">RDX</div>
    <h1>RDX LUDO</h1>
    <p>Enter your 10-digit mobile number</p>

    <div class="input-group">
        <label>PHONE NUMBER</label>
        <input type="tel" id="mobileInput" placeholder="9876543210" maxlength="10" inputmode="numeric">
    </div>
    <button class="btn-action" id="btnContinue" onclick="startMsg91Otp()">Continue</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function startMsg91Otp(){
    const mobile = document.getElementById("mobileInput").value.trim().replace(/\D/g,"");
    if(mobile.length !== 10){
        alert("Kripya 10-digit mobile number daalein");
        return;
    }

    const configuration = {
        widgetId: "346473667468303831343733",
        tokenAuth: "415053Tw7tFq1FjM65be3797P1",
        identifier: "91" + mobile,
        success: (data) => {
            handleLoginSuccess(mobile);
        },
        failure: (error) => {
            console.error("MSG91 Error:", error);
        }
    };

    if (window.initSendOTP) {
        window.initSendOTP(configuration);
    } else {
        alert("MSG91 Widget load nahi ho paya. Page refresh karein.");
    }
}

async function handleLoginSuccess(mobile){
    const docId = "91" + mobile;
    const defaultName = "User " + mobile.slice(-4);
    const myReferralCode = "RDX" + mobile.slice(-4);

    try {
        const uRef = db.collection("customers").doc(docId);
        const snap = await uRef.get();

        if(!snap.exists){
            await uRef.set({
                mobile: mobile,
                name: defaultName,
                balance: 0,
                depositBalance: 0,
                winnings: 0,
                referralBalance: 0,
                referralCode: myReferralCode,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        localStorage.setItem("rdxFirebaseUserId", docId);
        localStorage.setItem("rdxVerifiedMobile", mobile);
        localStorage.setItem("rdxLoggedIn", "true");
        localStorage.setItem("rdxUsername", snap.exists ? (snap.data().name || defaultName) : defaultName);
        localStorage.setItem("rdxReferral", snap.exists ? (snap.data().referralCode || myReferralCode) : myReferralCode);

        window.location.href = "dashboard.html";
    } catch(err){
        alert("Database Sync Error: " + err.message);
    }
}
</script>
</body>
</html>
