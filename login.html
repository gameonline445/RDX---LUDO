<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Login</title>

<!-- MSG91 OTP Widget Script -->
<script type="text/javascript" src="https://control.msg91.com/app/assets/otp-provider/otp-provider.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 14px;
}

.login-card{
    width:100%;
    max-width:380px;
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:26px 20px;
    box-shadow:0 12px 30px rgba(2,132,199,0.12);
    text-align:center;
}

.logo-box{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#dbeafe);
    border:3px solid #93c5fd;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0284c7;
    font-size:18px;
    font-weight:900;
    margin:0 auto 14px;
    box-shadow:0 6px 16px rgba(2,132,199,0.2);
}

h1{font-size:22px;color:#0c4a6e;font-weight:900;}
p{font-size:13px;color:#64748b;margin-top:4px;margin-bottom:20px;}

.input-group{margin-bottom:14px;text-align:left;}
label{display:block;font-size:11px;font-weight:800;color:#0284c7;margin-bottom:6px;letter-spacing:0.5px;}

input{
    width:100%;
    height:48px;
    border:1.5px solid #bae6fd;
    border-radius:14px;
    padding:0 14px;
    font-size:16px;
    font-weight:700;
    outline:none;
    background:#f8fafc;
    color:#0f172a;
}

input:focus{border-color:#0284c7;background:#ffffff;}

.btn-action{
    width:100%;
    height:48px;
    border:0;
    border-radius:24px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:15px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    margin-top:6px;
}

.btn-action:disabled{opacity:0.6;cursor:not-allowed;}

.resend-box{
    margin-top:14px;
    font-size:12px;
    color:#64748b;
}

.resend-btn{
    color:#0284c7;
    font-weight:800;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="login-card">
    <div class="logo-box">RDX</div>
    <h1>RDX LUDO</h1>
    <p id="pageSubtitle">Enter your 10-digit mobile number</p>

    <!-- STEP 1: MOBILE NUMBER -->
    <div id="mobileSection">
        <div class="input-group">
            <label>PHONE NUMBER</label>
            <input type="tel" id="mobileInput" placeholder="9876543210" maxlength="10" inputmode="numeric">
        </div>
        <button class="btn-action" id="btnSendOtp" onclick="sendOtp()">Send OTP</button>
    </div>

    <!-- STEP 2: OTP VERIFICATION -->
    <div id="otpSection" style="display:none;">
        <div class="input-group">
            <label>ENTER OTP</label>
            <input type="number" id="otpInput" placeholder="••••" maxlength="6" inputmode="numeric">
        </div>
        <button class="btn-action" id="btnVerifyOtp" onclick="verifyOtp()">Verify & Login</button>
        
        <div class="resend-box">
            OTP nahi mila? <span class="resend-btn" onclick="sendOtp()">Resend OTP</span> | <span class="resend-btn" onclick="changeNumber()">Change Number</span>
        </div>
    </div>
</div>

<script>
// ================= FIREBASE CONFIG =================
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. Capture Referral Code from Link (?ref=CODE)
const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get('ref');
if(refFromUrl){
    localStorage.setItem("rdxReferredBy", refFromUrl.trim().toUpperCase());
}

let enteredMobile = "";
let otpObj = null;

// 2. SEND OTP VIA MSG91 PROVIDER
function sendOtp(){
    const mob = document.getElementById("mobileInput").value.trim().replace(/\D/g,"");
    if(mob.length !== 10){
        alert("Kripya 10-digit mobile number daalein");
        return;
    }

    enteredMobile = mob;
    const btn = document.getElementById("btnSendOtp");
    btn.disabled = true;
    btn.textContent = "Sending OTP...";

    const configuration = {
        widgetId: "346473667468303831343733",
        tokenAuth: "415053Tw7tFq1FjM65be3797P1",
        identifier: "91" + enteredMobile,
        exposeMethods: true,
        success: (data) => {
            btn.disabled = false;
            btn.textContent = "Send OTP";
            document.getElementById("mobileSection").style.display = "none";
            document.getElementById("otpSection").style.display = "block";
            document.getElementById("pageSubtitle").textContent = `OTP sent to +91 ${enteredMobile}`;
        },
        failure: (error) => {
            btn.disabled = false;
            btn.textContent = "Send OTP";
            alert("OTP Bhejne me samasya: " + (error?.message || "Kripya number check karein"));
        }
    };

    if (window.initSendOTP) {
        otpObj = window.initSendOTP(configuration);
    } else {
        btn.disabled = false;
        btn.textContent = "Send OTP";
        alert("MSG91 widget load nahi hua. Page refresh karein.");
    }
}

// 3. VERIFY OTP
function verifyOtp(){
    const otp = document.getElementById("otpInput").value.trim();
    if(!otp || otp.length < 4){
        alert("Kripya sahi OTP daalein");
        return;
    }

    const btn = document.getElementById("btnVerifyOtp");
    btn.disabled = true;
    btn.textContent = "Verifying...";

    if (otpObj && typeof otpObj.verifyOTP === "function") {
        otpObj.verifyOTP({
            otp: otp,
            success: (data) => {
                onVerificationSuccess();
            },
            failure: (error) => {
                btn.disabled = false;
                btn.textContent = "Verify & Login";
                alert("Galat OTP! Kripya sahi OTP daalein.");
            }
        });
    } else if (window.verifyOTP) {
        window.verifyOTP({
            widgetId: "346473667468303831343733",
            tokenAuth: "415053Tw7tFq1FjM65be3797P1",
            identifier: "91" + enteredMobile,
            otp: otp,
            success: (data) => {
                onVerificationSuccess();
            },
            failure: (error) => {
                btn.disabled = false;
                btn.textContent = "Verify & Login";
                alert("Galat OTP! Kripya sahi OTP daalein.");
            }
        });
    } else {
        btn.disabled = false;
        btn.textContent = "Verify & Login";
        alert("Verification service ready nahi hai. Dobara OTP mangwayein.");
    }
}

// 4. FIREBASE SYNC & REDIRECT
async function onVerificationSuccess(){
    const docId = "91" + enteredMobile;
    const referredByCode = localStorage.getItem("rdxReferredBy") || "DIRECT";
    const myReferralCode = "RDX" + enteredMobile.slice(-4);
    const defaultName = "User " + enteredMobile.slice(-4);

    try {
        const uRef = db.collection("customers").doc(docId);
        const snap = await uRef.get();

        if(!snap.exists){
            // Naye user ke liye Firebase entry:
            await uRef.set({
                mobile: enteredMobile,
                name: defaultName,
                balance: 0,
                depositBalance: 0,
                winnings: 0,
                referralBalance: 0,
                referredBy: referredByCode,
                referralCode: myReferralCode,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Session Save
        localStorage.setItem("rdxFirebaseUserId", docId);
        localStorage.setItem("rdxVerifiedMobile", enteredMobile);
        localStorage.setItem("rdxLoggedIn", "true");
        localStorage.setItem("rdxUsername", snap.exists ? (snap.data().name || defaultName) : defaultName);
        localStorage.setItem("rdxReferral", snap.exists ? (snap.data().referralCode || myReferralCode) : myReferralCode);
        localStorage.setItem("rdxReferredBy", snap.exists ? (snap.data().referredBy || "DIRECT") : referredByCode);

        location.href = "dashboard.html";
    } catch(err){
        alert("Database error: " + err.message);
        document.getElementById("btnVerifyOtp").disabled = false;
        document.getElementById("btnVerifyOtp").textContent = "Verify & Login";
    }
}

function changeNumber(){
    document.getElementById("otpSection").style.display = "none";
    document.getElementById("mobileSection").style.display = "block";
    document.getElementById("pageSubtitle").textContent = "Enter your 10-digit mobile number";
}
</script>
</body>
</html>
