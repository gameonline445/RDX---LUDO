<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RDX LUDO - Login / Register</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
    color:#101a38;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 14px;
}
.login-card{
    width:100%;
    max-width:400px;
    background:#ffffff;
    border:1.5px solid #7dd3fc;
    border-radius:24px;
    padding:24px 20px;
    box-shadow:0 12px 30px rgba(2,132,199,0.12);
    text-align:center;
}
.logo-box{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#dbeafe);
    border:3px solid #93c5fd;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0284c7;
    font-size:18px;
    font-weight:900;
    margin:0 auto 12px;
    box-shadow:0 6px 16px rgba(2,132,199,0.2);
}
h1{font-size:22px;color:#0c4a6e;font-weight:900;}
p{font-size:13px;color:#64748b;margin-top:4px;margin-bottom:20px;}
.input-group{margin-bottom:14px;text-align:left;}
label{display:block;font-size:11px;font-weight:800;color:#0284c7;margin-bottom:6px;}
input{
    width:100%;
    height:46px;
    border:1.5px solid #bae6fd;
    border-radius:12px;
    padding:0 14px;
    font-size:15px;
    font-weight:700;
    outline:none;
    background:#f8fafc;
}
input:focus{border-color:#0284c7;background:#ffffff;}
.btn-submit{
    width:100%;
    height:48px;
    border:0;
    border-radius:24px;
    background:linear-gradient(100deg,#0284c7,#0369a1);
    color:#ffffff;
    font-size:15px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(2,132,199,0.3);
    margin-top:10px;
}
.ref-notice{
    font-size:11px;
    color:#15803d;
    background:#dcfce7;
    border:1px solid #86efac;
    padding:6px;
    border-radius:8px;
    margin-bottom:12px;
    display:none;
}
</style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">RDX</div>
    <h1>Welcome to RDX LUDO</h1>
    <p>Enter your 10-digit mobile number</p>

    <div id="refNotice" class="ref-notice">
        <i class="fa-solid fa-gift"></i> Referral Code Applied: <b id="displayRefCode"></b>
    </div>

    <div class="input-group">
        <label>MOBILE NUMBER</label>
        <input type="tel" id="mobileInput" placeholder="9876543210" maxlength="10">
    </div>

    <div class="input-group">
        <label>YOUR FULL NAME</label>
        <input type="text" id="nameInput" placeholder="Enter Full Name">
    </div>

    <button class="btn-submit" id="btnLogin" onclick="handleLogin()">Login / Register</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
    authDomain: "rdx-ludo.firebaseapp.com",
    projectId: "rdx-ludo",
    storageBucket: "rdx-ludo.firebasestorage.app",
    messagingSenderId: "928340814840",
    appId: "1:928340814840:web:6eca42a8b76138b268440d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. URL Se Referral Code Capture Karna
const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get('ref');
if(refFromUrl){
    localStorage.setItem("rdxReferredBy", refFromUrl.trim().toUpperCase());
    document.getElementById("refNotice").style.display = "block";
    document.getElementById("displayRefCode").textContent = refFromUrl.trim().toUpperCase();
}

async function handleLogin(){
    const mobile = document.getElementById("mobileInput").value.trim().replace(/\D/g,"");
    const name = document.getElementById("nameInput").value.trim() || ("User " + mobile.slice(-4));
    
    if(mobile.length !== 10) return alert("Kripya 10-digit mobile number daalein");

    const docId = "91" + mobile;
    const btn = document.getElementById("btnLogin");
    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
        const uRef = db.collection("customers").doc(docId);
        const snap = await uRef.get();
        const referredByCode = localStorage.getItem("rdxReferredBy") || "DIRECT";
        const myReferralCode = "RDX" + mobile.slice(-4);

        if(!snap.exists){
            // Naya User Register ho raha hai:
            await uRef.set({
                mobile: mobile,
                name: name,
                balance: 0,
                depositBalance: 0,
                winnings: 0,
                referralBalance: 0,
                referredBy: referredByCode,
                referralCode: myReferralCode,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        localStorage.setItem("rdxFirebaseUserId", docId);
        localStorage.setItem("rdxVerifiedMobile", mobile);
        localStorage.setItem("rdxLoggedIn", "true");
        localStorage.setItem("rdxUsername", name);
        localStorage.setItem("rdxReferral", myReferralCode);
        localStorage.setItem("rdxReferredBy", snap.exists ? (snap.data().referredBy || "DIRECT") : referredByCode);

        location.href = "dashboard.html";
    } catch(err){
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.textContent = "Login / Register";
    }
}
</script>
</body>
</html>
