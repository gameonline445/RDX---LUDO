<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDX LUDO - Sign In</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5ff,#fff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#101b3d;display:flex;justify-content:center;align-items:center;padding:24px}
.card{width:min(100%,520px);background:#fff;border:1px solid #c9d9ff;border-radius:28px;padding:32px;box-shadow:0 20px 60px #1d5eff18}
.logo{width:74px;height:74px;object-fit:contain;display:block;margin:0 auto 14px}
h1{text-align:center;margin:0 0 8px;font-size:30px}.sub{text-align:center;color:#68748d;margin-bottom:28px}
label{display:block;font-weight:700;margin:12px 0 8px}.row{display:flex;gap:10px}.cc{width:82px;padding:16px;border:1px solid #d5def0;border-radius:14px;background:#f7faff;font-weight:700}
input{flex:1;padding:16px;border:1px solid #d5def0;border-radius:14px;font-size:16px;outline:none}
button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:17px;background:#1760ed;color:#fff;font-size:17px;font-weight:800}
.back{display:block;text-align:center;margin-top:20px;color:#1760ed;text-decoration:none}
.note{margin-top:20px;padding:12px;border-radius:12px;background:#f5f8ff;color:#66738d;font-size:13px;text-align:center}
</style>
</head>
<body>
<section class="card">
  <div style="text-align:center;font-size:42px">🎲</div>
  <h1>RDX LUDO</h1>
  <div class="sub">Play · Win · Earn</div>
  <label for="phone">Enter Mobile Number</label>
  <div class="row"><div class="cc">+91</div><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div>
  <button onclick="sendOtp()">Send OTP</button>
  <div id="msg" class="note">Demo login screen. Connect your approved OTP provider for real SMS verification.</div>
  <a class="back" href="index.html">← Back to Home</a>
</section>
<script>
function sendOtp(){
  const p=document.getElementById('phone').value.replace(/\D/g,'');
  const m=document.getElementById('msg');
  if(p.length!==10){m.textContent='Please enter a valid 10-digit mobile number.';return;}
  m.textContent='OTP request ready. Connect your SMS/OTP backend to send the real OTP.';
}
</script>
</body>
</html>
