<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDX LUDO Login</title><style>body{font-family:Arial;background:#f1f6ff;margin:0;padding:25px;color:#101a38}.box{max-width:520px;margin:50px auto;background:white;padding:28px;border-radius:25px;border:2px solid #bdd0f5}input,button{width:100%;padding:16px;margin-top:12px;border-radius:16px;font-size:17px}input{border:1px solid #ccd5e5}button{border:0;background:#2869e8;color:white;font-weight:800}.logo{text-align:center;font-size:32px;font-weight:900;color:#1760e8}</style><div class=box><div class=logo>RDX LUDO</div><h2>Enter Mobile Number</h2><p>We'll send a secure OTP to verify your account.</p><input id=p maxlength=10 inputmode=numeric placeholder="10-digit mobile number"><button onclick=go()>Send OTP</button><p style="font-size:12px;color:#777">Frontend demo. Connect an approved OTP/backend service for real authentication.</p></div><script>function go(){let p=document.getElementById('p').value.replace(/\D/g,'');if(p.length!=10)return alert('Enter valid 10-digit number');localStorage.rdxLoggedIn=1;location='dashboard.html'}</script>
