<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDX LUDO ADMIN - Login</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Core & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background: radial-gradient(circle at 5% 5%, rgba(14, 165, 233, 0.22) 0%, transparent 35%),
                  radial-gradient(circle at 95% 15%, rgba(2, 132, 199, 0.18) 0%, transparent 32%),
                  linear-gradient(180deg, #f0f7ff 0%, #ffffff 40%, #eaf4ff 100%);
      color: #101a38;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px;
    }
    
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.12);
      border: 1.5px solid #bae6fd;
      text-align: center;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 1.5px solid #bae6fd;
      background: #ffffff;
      padding: 2px;
      box-shadow: 0 4px 12px rgba(2,132,199,0.15);
      margin-bottom: 12px;
      object-fit: cover;
    }

    .brand-title { 
      font-size: 20px; 
      font-weight: 850; 
      color: #0c4a6e; 
      margin-bottom: 22px; 
      letter-spacing: 0.5px;
    }
    
    .form-group { 
      margin-bottom: 18px; 
      text-align: left; 
    }
    
    .form-group label { 
      display: block; 
      font-size: 13px; 
      font-weight: 700; 
      color: #0284c7; 
      margin-bottom: 6px; 
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1.5px solid #bae6fd;
      color: #101a38;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    
    .form-group input:focus { 
      border-color: #0284c7; 
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); 
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(145deg, #06b6d4, #0284c7);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(6,182,212,0.35);
      transition: transform 0.2s;
      margin-top: 10px;
    }
    
    .login-btn:active { 
      transform: scale(0.98);
    }

    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      text-align: left;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="logo.png" alt="RDX Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/65/bae6fd/0284c7?text=RDX'">
    <h2 class="brand-title">RDX LUDO ADMIN</h2>

    <div class="error-msg" id="errorBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="admin@rdxludo.com" required>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Login to Panel</button>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
      authDomain: "rdx-ludo.firebaseapp.com",
      projectId: "rdx-ludo",
      storageBucket: "rdx-ludo.firebasestorage.app",
      messagingSenderId: "928340814840",
      appId: "1:928340814840:web:6eca42a8b76138b268440d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("admin.html");
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorBox = document.getElementById('errorBox');
      const loginBtn = document.getElementById('loginBtn');

      errorBox.style.display = "none";
      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.replace("admin.html");
        })
        .catch((error) => {
          loginBtn.innerText = "Login to Panel";
          loginBtn.disabled = false;
          errorBox.innerText = error.message;
          errorBox.style.display = "block";
        });
    }
  </script>
</body>
</html>
