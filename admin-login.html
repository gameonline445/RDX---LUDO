<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX LUDO - Admin Login</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* LOGIN CONTAINER */
        .login-card {
            background-color: #ffffff;
            color: #333333;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* BRAND LOGO HEADER */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 16px;
        }

        .brand-title {
            color: #1a365d;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* FORM ELEMENTS */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #3182ce;
        }

        .login-btn {
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            background-color: #2b6cb0;
        }

        .login-btn:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        /* ERROR / ALERT MESSAGE */
        .error-msg {
            background-color: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo-img">RDX</div>
            <span class="brand-title">RDX LUDO</span>
        </div>
        
        <p class="login-subtitle">Admin Panel Access</p>

        <!-- ERROR NOTIFICATION -->
        <div id="errorAlert" class="error-msg">Incorrect Email or Password!</div>

        <!-- LOGIN FORM -->
        <form id="adminLoginForm">
            <div class="input-group">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" class="input-field" placeholder="admin@rdxludo.com" required>
            </div>

            <div class="input-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span id="btnText">Login to Dashboard</span>
            </button>
        </form>
    </div>

    <!-- LOGIN SYSTEM SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
            authDomain: "rdx-ludo.firebaseapp.com",
            projectId: "rdx-ludo",
            storageBucket: "rdx-ludo.firebasestorage.app",
            messagingSenderId: "928340814840",
            appId: "1:928340814840:web:6eca42a8b76138b268440d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Already Logged-in Guard
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "admin.html";
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            errorAlert.style.display = "none";
            loginBtn.disabled = true;
            btnText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    localStorage.setItem('admin_session', 'true');
                    localStorage.setItem('admin_email', email);
                    window.location.href = "admin.html";
                })
                .catch((error) => {
                    loginBtn.disabled = false;
                    btnText.innerText = "Login to Dashboard";
                    errorAlert.innerText = error.message || "Incorrect Email or Password!";
                    errorAlert.style.display = "block";
                });
        });
    </script>
</body>
</html>
