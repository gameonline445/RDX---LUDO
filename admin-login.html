<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDX LUDO ADMIN - Login</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Core & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background: #0f172a; /* Main Website Dark Theme */
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px;
    }
    
    .login-card {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }

    .brand-logo {
      width: 75px;
      height: 75px;
      margin-bottom: 10px;
      object-fit: contain;
    }

    .brand-title { 
      font-size: 22px; 
      font-weight: 800; 
      color: #fbbf24; /* Main Gold Color */
      margin-bottom: 25px; 
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .form-group { 
      margin-bottom: 18px; 
      text-align: left; 
    }
    
    .form-group label { 
      display: block; 
      font-size: 13px; 
      font-weight: 700; 
      color: #94a3b8; 
      margin-bottom: 6px; 
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    
    .form-group input:focus { 
      border-color: #f59e0b; 
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2); 
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); /* Gold/Yellow Theme Gradient */
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    
    .login-btn:hover { 
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .error-msg {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      text-align: left;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Main Logo -->
    <img src="logo.png" alt="RDX LUDO" class="brand-logo" onerror="this.src='https://via.placeholder.com/75/f59e0b/0f172a?text=RDX'">
    <h2 class="brand-title">RDX LUDO ADMIN</h2>

    <div class="error-msg" id="errorBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="admin@rdxludo.com" required>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Login to Panel</button>
    </form>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAsGWpMcC2WtMpv3_498me_8ydjL8wN1Qc",
      authDomain: "rdx-ludo.firebaseapp.com",
      projectId: "rdx-ludo",
      storageBucket: "rdx-ludo.firebasestorage.app",
      messagingSenderId: "928340814840",
      appId: "1:928340814840:web:6eca42a8b76138b268440d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // Auto Redirect agar pehle se login ho
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("admin.html");
      }
    });

    // Login Function
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorBox = document.getElementById('errorBox');
      const loginBtn = document.getElementById('loginBtn');

      errorBox.style.display = "none";
      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.replace("admin.html");
        })
        .catch((error) => {
          loginBtn.innerText = "Login to Panel";
          loginBtn.disabled = false;
          errorBox.innerText = error.message;
          errorBox.style.display = "block";
        });
    }
  </script>
</body>
</html>
